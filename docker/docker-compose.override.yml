# =============================================================================
# Docker Compose Override for Development
# Usage: docker compose -f docker/docker-compose.yml -f docker/docker-compose.override.yml up -d
# =============================================================================

services:
  # Migration service - runs alembic migrations before app starts (same as production)
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    command: ["alembic", "upgrade", "head"]
    environment:
      ENV: development
      DATABASE__HOST: db
      DATABASE__PORT: 5432
      DATABASE__DBNAME: bidb
      DATABASE__PASSWORD: ${DATABASE__PASSWORD:?DATABASE__PASSWORD must be set}
      JWT__ALGORITHM: HS256
      JWT__SECRET_KEY: ${JWT__SECRET_KEY:?JWT__SECRET_KEY must be set}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Frontend development server with Vite hot reload
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
    # No depends_on - frontend can start independently

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ENV: development
      APP__COOKIE_SECURE: "false"
      DATABASE__HOST: db
      DATABASE__PORT: 5432
      DATABASE__USER: mkobi_app
      DATABASE__PASSWORD: ${MKOBI_APP_PASSWORD:?MKOBI_APP_PASSWORD must be set}
      DATABASE__ADMIN_USER: postgres
      DATABASE__ADMIN_PASSWORD: ${DATABASE__ADMIN_PASSWORD:?DATABASE__ADMIN_PASSWORD must be set}
      DATABASE__DBNAME: bidb
      DATABASE__TEST_DBNAME: bidb_test
      REDIS__HOST: redis
      JWT__ALGORITHM: HS256
      JWT__SECRET_KEY: ${JWT__SECRET_KEY:?JWT__SECRET_KEY must be set}
      # Admin credentials (valid email format required)
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      LOGGING__LEVEL: DEBUG
      AUTO_MIGRATE: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
    volumes:
      # Mount source code for hot reload (writable for egg-info generation)
      - ../src:/app/src
      - ../alembic:/app/alembic
      - ../tests:/app/tests
      - ../pyproject.toml:/app/pyproject.toml
      - ../uv.lock:/app/uv.lock
    command: ["uvicorn", "src.mkobi.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-exclude", "/app/tests/"]
    # Remove healthcheck in dev for faster startup
    healthcheck:
      disable: true

# Override rq-worker for development (remove production profile requirement)
  rq-worker:
    profiles: []
    environment:
      DATABASE__ADMIN_PASSWORD: ${DATABASE__ADMIN_PASSWORD:?DATABASE__ADMIN_PASSWORD must be set}
      JWT__SECRET_KEY: ${JWT__SECRET_KEY:?JWT__SECRET_KEY must be set}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}

  db:
    # Expose port for local development tools
    ports:
      - "5432:5432"
    environment:
      # Override production postgres password with development default
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:?DATABASE__PASSWORD must be set}

volumes:
  frontend_node_modules: