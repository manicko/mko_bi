events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;
        server_name localhost;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # NOTE: HSTS header should only be set on HTTPS connections.
        # See the commented HTTPS server block below for proper HSTS configuration.
        add_header Content-Security-Policy "default-src 'self'" always;

        # /api prefix is intentional — matches FastAPI router prefix /api/v1/*
        # Requests to /api/v1/* are forwarded to the app container as-is
        location /api {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint (no auth required)
        location /health {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
        }

        # Static files → React build
        location / {
            root /usr/share/nginx/html;
            rewrite ^/(.*)/$ /$1 permanent;
            try_files $uri $uri/ /index.html;
        }
    }

    # HTTPS server block template (uncomment and configure for production TLS):
