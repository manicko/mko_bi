  - src/mkobi/api/routes/__init__.py

autonomous: true

priority: high

role: implementor

status: pending

description: >
  Create a new API route file with a GET endpoint that returns distinct filter values for a
  dashboard from the dashboard_filter_values table. Follows existing patterns from
  dashboards_filters.py (router, authentication, error handling). Uses dashboard access control
  (require_dashboard_read_access) not admin-only — any user with dashboard read access can fetch
  filter values.

  IMPORTANT: The endpoint MUST go through a Service layer (Clean Architecture compliance).
  Create a minimal FilterValuesService that delegates to the repository.

targets:
  - type: class
    name: FilterValuesService
    file: src/mkobi/services/filter_values_service.py
  - type: function
    name: get_filter_values_endpoint
    file: src/mkobi/api/routes/filter_values.py

changes:
  - action: create_file
    path: src/mkobi/services/filter_values_service.py
    description: |
      Create FilterValuesService following existing service patterns (see dashboard_service.py, filter_service.py).

      import logging
      from uuid import UUID

      from sqlalchemy.ext.asyncio import AsyncSession

      from mkobi.interfaces.repository_interfaces import IDashboardFilterValuesRepository

      logger = logging.getLogger(__name__)


      class FilterValuesService:
          """Service for filter values operations."""

          def __init__(self, repo: IDashboardFilterValuesRepository) -> None:
              self._repo = repo

          async def get_filter_values(
              self, dashboard_id: UUID, filter_name: str, db: AsyncSession
          ) -> list[str]:
              """Return distinct filter values for a dashboard filter."""
              return await self._repo.get_filter_values(dashboard_id, filter_name, db)

  - action: create_file
    path: src/mkobi/api/routes/filter_values.py
    description: |
      Create new route file following dashboards_filters.py patterns.

      Router: APIRouter(tags=["dashboards"]) — no prefix (mounted under /dashboards in main app)

      Endpoint: GET /{dashboard_id}/filter-values
      Query params: filter_name: str = Query(..., description="Filter/dimension name")
      Auth: current_user: UserRead = Depends(require_dashboard_read_access)
      DB: db: AsyncSession = Depends(get_db_dependency)
      Service: filter_values_service = Depends(get_filter_values_service)

      Returns: {"filter_name": str, "values": [str, ...]}

      Error handling:
      - Try/except with proper logging
      - On exception: raise HTTPException(status_code=500, detail="Error getting filter values")

      The endpoint calls filter_values_service.get_filter_values(dashboard_id, filter_name, db)
      and returns {"filter_name": filter_name, "values": values}.

  - action: edit_file
    path: src/mkobi/api/routes/dashboards.py
    description: |
      Register the filter_values router in the combined dashboards router.

      Add import:
        from mkobi.api.routes.filter_values import router as filter_values_router

      Add to router includes:
        router.include_router(filter_values_router)

  - action: edit_file
    path: src/mkobi/api/routes/__init__.py
    description: |
      Add filter_values to the routes package exports.

      Add to imports:
        filter_values,

      Add to __all__:
        "filter_values",

  - action: edit_file
    path: src/mkobi/api/deps.py
    description: |
      Add FilterValuesService dependency injection.

      Add imports:
        from mkobi.services.filter_values_service import FilterValuesService
        from mkobi.db.repositories.dashboard_filter_values_repo import DashboardFilterValuesRepository

      Add function:
        def get_filter_values_service() -> FilterValuesService:
            return FilterValuesService(repo=DashboardFilterValuesRepository())

      Add to __all__:
        "get_filter_values_service",

acceptance_criteria:
  - FilterValuesService exists with get_filter_values method that delegates to repository
  - Endpoint GET /dashboards/{id}/filter-values?filter_name={name} returns {"filter_name", "values"}
  - Uses require_dashboard_read_access for auth (not admin-only)
  - Uses FilterValuesService (not direct repository access from endpoint)
  - Router registered in dashboards.py combined router
  - Router exported from routes/__init__.py
  - Follows existing error handling patterns
  - ruff + mypy pass

tests_to_run:
