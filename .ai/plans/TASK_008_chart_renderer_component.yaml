description: >
  Create a new ChartRenderer component that serves as a thin adapter between the aggregated data
  API response and the specific chart components (BarChart, etc.). It reads graph.type
  from the API response and renders the appropriate chart component. For Phase 02, only
  'bar' chart type is implemented — line and pie are explicitly DEFERRED.

targets:
  - type: component
    name: ChartRenderer
    file: frontend/src/features/dashboards/ui/charts/ChartRenderer.tsx

changes:
  - action: create_file
    path: frontend/src/features/dashboards/ui/charts/ChartRenderer.tsx
    description: |
      Create ChartRenderer component.

      interface ChartRendererProps {
        graph: GraphDataWithConfig  // { graph_id, type, name, data: [...data points...], layout? }
      }

      export function ChartRenderer({ graph }: ChartRendererProps) {
        const data = graph.data || []

        // TODO: The data mapping logic (Object.keys(d)[0] for x, [1] for y) is a simple adapter.
        // In production, the graph.config JSONB would define x/color/metrics fields explicitly.
        // For Phase 02 with 2 bar charts, this simple mapping suffices.

        switch (graph.type) {
          case 'bar':
          default:
            return (
              <BarChart
                data={{
                  x: data.map(d => d[Object.keys(d)[0]]),
                  y: data.map(d => d[Object.keys(d)[1]] || 0),
                }}
                title={graph.name}
              />
            )
        }
      }

      Note: Only 'bar' type is implemented for Phase 02. Line and pie chart types are
      DEFERRED to a future phase. The default case falls through to BarChart for safety.

