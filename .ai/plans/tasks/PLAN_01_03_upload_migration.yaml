description: |
  Migrate all 16 HTTPException raise sites in upload.py to use AppException with ErrorCode.

  Mapping rules for upload.py:
  - File validation errors (size, type, extension) → ErrorCode.INVALID_FILE_TYPE or FILE_TOO_LARGE
  - File processing errors (parse failures, empty files) → ErrorCode.FILE_PROCESSING_ERROR
  - Dashboard not found → ErrorCode.DASHBOARD_NOT_FOUND
  - Permission denied → ErrorCode.PERMISSION_DENIED
  - Processing in progress → ErrorCode.PROCESSING_IN_PROGRESS
  - Generic server errors → ErrorCode.INTERNAL_ERROR or PROCESSING_FAILED

  Steps:
  1. Replace `from fastapi import HTTPException` with `from mkobi.utils.exceptions import AppException`
     (or add AppException import if HTTPException is still needed for other reasons — it should NOT be)
  2. For each of the 16 raise sites:
     - Identify the HTTP status code and detail message
     - Map to the appropriate ErrorCode
     - Replace `raise HTTPException(status_code=XXX, detail="...")` with
       `raise AppException(code=ErrorCode.XXX, detail="...")`
     - Add `details={}` dict where useful context exists (e.g., {"filename": filename}, {"dashboard_id": dashboard_id})
  3. Ensure ValueError exceptions from Polars/file processing are caught and re-raised as
     AppException with ErrorCode.FILE_PROCESSING_ERROR
  4. Verify temp file cleanup in finally blocks is preserved unchanged
  5. Verify no HTTPException imports remain in the file
