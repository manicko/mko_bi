description: |
  Create frontend types and utilities for handling RFC 7807 error responses.

  Steps:
  1. Add ApiError interface to frontend/src/shared/types/api.types.ts:
     ```
     export interface ApiError {
       type: string
       title: string
       status: number
       detail: string
       code: string
       details?: Record<string, unknown>
     }
     ```

  2. Create frontend/src/shared/api/errorHandler.ts with extractApiError():
     - Function signature: `export function extractApiError(error: unknown): { code: string; message: string; details?: Record<string, unknown> }`
     - Extraction chain:
       1. Check if error is AxiosError with error.response.data
       2. If data has `code` field (new RFC 7807 format): extract code, detail, details
       3. If data has `detail` field (legacy FastAPI validation format): extract message
       4. Generic fallback: "Произошла ошибка"
     - For validation errors (422), parse the validation array and extract field-level messages

  3. Ensure the file exports are properly re-exported from frontend/src/shared/api/index.ts
