  - src/mkobi/api/routes/auth.py
autonomous: true
description: |
  Migrate all 16 HTTPException raise sites in auth.py to use AppException with ErrorCode.

  Mapping rules for auth.py:
  - Invalid credentials → ErrorCode.AUTHENTICATION_FAILED
  - Token expired → ErrorCode.TOKEN_EXPIRED
  - Token revoked → ErrorCode.TOKEN_REVOKED
  - Invalid token → ErrorCode.INVALID_TOKEN
  - Rate limit exceeded → ErrorCode.RATE_LIMIT_EXCEEDED
  - Email already exists → ErrorCode.EMAIL_ALREADY_EXISTS
  - Validation errors (email format, password) → ErrorCode.VALIDATION_ERROR
  - Invalid email → ErrorCode.INVALID_EMAIL
  - Invalid password → ErrorCode.INVALID_PASSWORD

  Steps:
  1. Replace HTTPException import with AppException import
  2. For each of the 16 raise sites:
     - Map to appropriate ErrorCode
     - Replace raise statement
     - Preserve exact detail messages (English)
     - Add details dict where useful (e.g., {"email": email} for duplicate email)
  3. Ensure token refresh flow is NOT broken — auth errors must still propagate correctly
     to the axios interceptor on the frontend
  4. Ensure rate limiting error responses include appropriate headers if needed
  5. Verify cookie handling (set-cookie for tokens) is preserved unchanged
  6. Verify no HTTPException imports remain
acceptance_criteria:
  - [ ] All 16 HTTPException raise sites replaced with AppException
  - [ ] Each raise uses an ErrorCode enum value
  - [ ] Token refresh flow preserved (no behavioral changes)
  - [ ] Rate limiting responses still functional
  - [ ] Cookie handling unchanged
  - [ ] No HTTPException import remains
  - [ ] All messages in English
must_haves:
