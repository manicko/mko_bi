description: |
  Migrate all 20 HTTPException raise sites in admin.py to use AppException with ErrorCode.

  Mapping rules for admin.py:
  - User not found → ErrorCode.USER_NOT_FOUND
  - Dashboard not found → ErrorCode.DASHBOARD_NOT_FOUND
  - Permission denied / insufficient permissions → ErrorCode.PERMISSION_DENIED
  - Email already exists → ErrorCode.EMAIL_ALREADY_EXISTS
  - Validation errors → ErrorCode.VALIDATION_ERROR
  - Registration request not found → ErrorCode.NOT_FOUND
  - Access denied → ErrorCode.ACCESS_DENIED

  Steps:
  1. Replace HTTPException import with AppException import
  2. For each of the 20 raise sites, map to appropriate ErrorCode
  3. Add details dict where useful context exists (e.g., {"user_id": user_id})
  4. Verify admin role checks still function correctly
  5. Verify no HTTPException imports remain
