description: >
  Create a new repository `DashboardFilterValuesRepository` for CRUD operations on the
  `dashboard_filter_values` table. Follow existing repository patterns (GraphRepository, etc.).
  Repository gets filter values by (dashboard_id, filter_name), saves a set of values
  (clear-then-insert for idempotency), and clears all values for a dashboard.
  Add dependency injection in `api/deps.py`.

targets:
  - type: class
    name: DashboardFilterValuesRepository
    file: src/mkobi/db/repositories/dashboard_filter_values_repo.py

changes:
  - action: create_file
    path: src/mkobi/db/repositories/dashboard_filter_values_repo.py
    description: |
      Create DashboardFilterValuesRepository following existing repo patterns (see graph_repo.py).
      Methods:
      - async def get_filter_values(self, dashboard_id: UUID, filter_name: str, db: AsyncSession) -> list[str]
        Returns list of filter_value strings for given dashboard_id + filter_name.
        Uses select().where() with ORDER BY filter_value.
      - async def save_filter_values(self, dashboard_id: UUID, filter_name: str, values: list[str], db: AsyncSession) -> int
        Clears existing values for (dashboard_id, filter_name), then bulk-inserts new values.
        Returns count of inserted values. Uses delete + bulk insert pattern.
      - async def clear_dashboard_values(self, dashboard_id: UUID, db: AsyncSession) -> int
        Deletes all filter_values for a dashboard. Returns count deleted.
      All methods: use logger = logging.getLogger(__name__), proper error handling with SQLAlchemyError.

  - action: edit_file
    path: src/mkobi/interfaces/repository_interfaces.py
    description: |
      Add new interface class:
      class IDashboardFilterValuesRepository(abc.ABC):
        @abc.abstractmethod
        async def get_filter_values(self, dashboard_id: UUID, filter_name: str, db: AsyncSession) -> list[str]: ...
        @abc.abstractmethod
        async def save_filter_values(self, dashboard_id: UUID, filter_name: str, values: list[str], db: AsyncSession) -> int: ...
        @abc.abstractmethod
        async def clear_dashboard_values(self, dashboard_id: UUID, db: AsyncSession) -> int: ...
      Have DashboardFilterValuesRepository implement IDashboardFilterValuesRepository.

  - action: edit_file
    path: src/mkobi/api/deps.py
    description: |
      Add dependency injection:
      - Import DashboardFilterValuesRepository from db.repositories
      - Import IDashboardFilterValuesRepository from interfaces
      - Add function: def get_dashboard_filter_values_repository() -> IDashboardFilterValuesRepository:
          return DashboardFilterValuesRepository()
      - Add to __all__: "get_dashboard_filter_values_repository"

