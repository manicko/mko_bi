id: task_template

title: Add audit logging for user creation

status: pending

priority: high

depends_on:
  - task_003
  - task_007

description: >
  Add audit logging after successful user creation.

goals:
  - create audit log record
  - avoid affecting transaction flow
  - preserve backward compatibility

files:
  - path: app/services/user_service.py

    targets:
      - type: class
        name: UserService

      - type: method
        name: create_user

    semantic_anchors:

      insert_after:
        type: function_call
        value: validate_email

      insert_before:
        type: return_statement

changes:

  - action: add_code

    description: >
      Call audit_service.log_user_created()

    code_hint: |
      audit_service.log_user_created(
          user_id=user.id,
          created_by=admin.id
      )

acceptance_criteria:
  - audit log created
  - no transaction rollback issues
  - tests pass

# For simple tasks (single function, trivial/small effort, low risk):
# verification is INLINE — implementor runs tests_to_run and checks
# acceptance_criteria before marking the task complete.
# Do NOT create a separate verification task.

# For multi-stage tasks (cross-module, medium+ risk):
# create a separate verification task at the end of the stage.
# Use the verification task template below.

---
# Verification task template (only for multi-stage work)

id: verify_task_template

title: Verify — <implementation task title>

type: verification

status: pending

depends_on:
  - task_XXX_implementation_task

verifies:
  - task_XXX_implementation_task
  - task_YYY_implementation_task

verification_steps:
  - build: <command to build, e.g. "docker compose build">
  - test: <test command, e.g. "pytest tests/test_user_creation.py -v">
  - smoke_check: <minimal check, e.g. "curl /health or lint">

pass_criteria:
  - build succeeds
  - all tests pass
  - smoke_check returns expected result

failure_action: return task_XXX_implementation_task to rework

rollback_task: task_YYY_rollback_if_applicable  # optional
