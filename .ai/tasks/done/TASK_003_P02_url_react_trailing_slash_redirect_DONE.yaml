id: TASK_003_P02_url_react_trailing_slash_redirect

title: Add client-side TrailingSlashRedirect component

status: pending

priority: high

depends_on: []

phase: PLAN_02
wave: 2

description: >
  Create a lightweight TrailingSlashRedirect component that runs inside
  AppRoutes and redirects any path ending with / (except /) to its
  slashless equivalent. This is a safety net for cases where nginx is
  bypassed (dev server, CDN misconfig, direct Vite dev access).

finding_ref: PLAN_02_WAVE_2
severity: low

goals:
  - Create TrailingSlashRedirect component
  - Client-side redirect uses react-router-dom Navigate with replace
  - Root path (/) is NOT redirected
  - No history pollution (uses replace)

files:
  - path: frontend/src/app/routes.tsx
    targets:
      - type: component
        name: AppRoutes
    semantic_anchors:
      insert_after:
        type: jsx_element
        value: "<Routes>"
    changes:
      - action: add_component
        description: Add TrailingSlashRedirect component definition and usage
        code_hint: |
          import { Navigate, useLocation } from 'react-router-dom'

          function TrailingSlashRedirect() {
            const { pathname } = useLocation()
            if (pathname !== '/' && pathname.endsWith('/')) {
              return <Navigate to={pathname.slice(0, -1)} replace />
            }
            return null
          }

          // Inside AppRoutes, add as first child of <Routes>:
          // <TrailingSlashRedirect />

acceptance_criteria:
  - User navigates to /dashboards/ → client-side redirect to /dashboards
  - User navigates to /admin/ → client-side redirect to /admin
  - User navigates to /dashboard/123/ → redirect to /dashboard/123
  - User navigates to / → no redirect
  - Uses replace (no history pollution)
  - Component renders null when no redirect needed

tests_to_run:
  - "npm test"
  - Manual: open /dashboards/ in browser → URL becomes /dashboards

risk_level: low

rollout_notes: >
  Independent of Wave 1 (nginx changes). Can run in parallel.
  Simple component with no side effects. Rollback: remove the component
  and its usage from routes.tsx.
