id: TASK_001_FE_zod_v4_migration

title: Migrate Zod schemas from v3 to v4 syntax

status: done

priority: high

depends_on: []

description: >
  Migrate all Zod schemas in formSchemas.ts from deprecated v3 syntax to Zod v4 syntax.
  Replace z.string().email() with z.email(), z.string().uuid() with z.uuid(),
  and { message: "..." } with { error: "..." } in validation methods.

goals:
  - Replace all z.string().email() with z.email()
  - Replace all z.string().uuid() with z.uuid()
  - Replace all { message: "..." } with { error: "..." }
  - Preserve all existing type exports
  - No behavioral changes to validation logic

files:
  - path: frontend/src/shared/types/formSchemas.ts
    targets:
      - type: file
        name: formSchemas.ts
    semantic_anchors:
      update_zone:
        type: schema_definition
        value: loginSchema, registerSchema, dashboardCreateSchema, dashboardUpdateSchema, changePasswordSchema

changes:
  - action: update_code
    description: Replace z.string().email() with z.email({ error: '...' }) in login and register schemas
  - action: update_code
    description: Replace z.string().min/max() message param with { error: '...' } object
  - action: update_code
    description: Replace z.string().uuid() with z.uuid({ error: '...' })
  - action: update_code
    description: Replace .refine() { message: '...' } with { error: '...', path: [...] }

acceptance_criteria:
  - All schemas use Zod v4 syntax
  - TypeScript compilation passes (npx tsc --noEmit)
  - No deprecated Zod v3 patterns remain
  - All z.infer<typeof schema> types resolve correctly

tests_to_run:
  - cd frontend && npx tsc --noEmit

risk_level: low

wave: 1

plan_source: PLAN_01_zod_v4_migration.md
