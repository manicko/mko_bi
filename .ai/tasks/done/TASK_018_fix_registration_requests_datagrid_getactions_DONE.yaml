  - type: variable
    name: columns
    file: frontend/src/features/admin/ui/RegistrationRequests.tsx
    anchor: GridColDef array definition

  - type: function
    name: rows mapping (inline in component)
    file: frontend/src/features/admin/ui/RegistrationRequests.tsx
    anchor: requests.map call that builds rows with actions property

changes:
  - action: replace_column_definition
    description: >
      Replace the actions column definition that uses `type: 'actions'` (without `getActions`)
      with a `renderCell` pattern matching the working approach in DashboardManagement.tsx.
    target:
      type: variable
      name: columns
    current_pattern: |
      {
        field: 'actions',
        headerName: 'Actions',
        type: 'actions',
        width: 150,
      }
    new_pattern: |
      {
        field: 'actions',
        headerName: 'Actions',
        width: 150,
        sortable: false,
        filterable: false,
        renderCell: ({ row }) => (
          <>
            {row.status === 'pending' && (
              <>
                <GridActionsCellItem icon={<ApproveIcon />} label="Approve" onClick={() => handleApprove(row.id)} />
                <GridActionsCellItem icon={<RejectIcon />} label="Reject" onClick={() => handleReject(row.id)} />
              </>
            )}
          </>
        ),
      }

  - action: remove_row_actions
    description: >
      Remove the `actions` JSX property that was being injected into each row object
      inside the `requests.map(...)` call. Action buttons are now handled by `renderCell`.
    target:
      type: function
      name: requests.map (rows mapping)
    remove_pattern: |
      actions: (
        <>
          {req.status === 'pending' && (
            <>
              <GridActionsCellItem icon={<ApproveIcon />} label="Approve" onClick={...} />
              <GridActionsCellItem icon={<RejectIcon />} label="Reject" onClick={...} />
            </>
          )}
        </>
      ),

