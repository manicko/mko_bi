description: >
  The Registration Requests tab crashes with "MUI X: Missing the `getActions` property in the `GridColDef`"
  because the DataGrid column uses `type: 'actions'` without a `getActions` callback, and action buttons
  are incorrectly injected into row data instead of the column definition. Fix by replacing the
  `type: 'actions'` pattern with a `renderCell` approach matching the working pattern in DashboardManagement.tsx.

objective: >
  Make the Registration Requests tab render the Approve/Reject action buttons correctly
  without crashing, using the same `renderCell` pattern already established in DashboardManagement.

affected_files:
  - path: frontend/src/features/admin/ui/RegistrationRequests.tsx
    action: modify
    description: "Fix DataGrid actions column and remove actions from row mapping"

semantic_targets:
  - type: component
    name: RegistrationRoutes
