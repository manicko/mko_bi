id: TASK_013_A07_frontend_code_splitting

title: Implement frontend code splitting for 6.1 MB bundle

status: pending

priority: low

type: implementation

finding_id: FINDING-A07
source: audit_validated_findings_001.md

depends_on:
  - TASK_006_verify_mandatory_fixes

description: >
  The frontend build produces a single 6.1 MB JS chunk. No dynamic imports
  or code splitting is configured, resulting in slower initial page load.

goals:
  - Add route-based code splitting using React.lazy() and Suspense
  - Configure Vite chunk splitting for vendor bundles
  - Reduce initial bundle size
  - Maintain existing user experience

files:
  - path: frontend/src/app/routes.tsx
    targets:
      - type: component
        name: AppRoutes
    semantic_anchors:
      insert_after:
        type: import_statement
        context: component imports
    changes:
      - action: add_code
        description: >
          Wrap route components with React.lazy() for dynamic imports.
          Wrap Routes with Suspense boundary with loading fallback.

  - path: frontend/vite.config.ts
    targets:
      - type: config
        context: build output configuration
    semantic_anchors: []
    changes:
      - action: add_config
        description: >
          Configure build.rollupOptions.output.manualChunks to split
          vendor bundles (react, mui, plotly, etc.) separately.

acceptance_criteria:
  - Initial bundle size is reduced (target: < 2 MB initial chunk)
  - Lazy-loaded chunks load correctly when navigating to routes
  - Loading fallback displays during chunk load
  - Build succeeds without errors

tests_to_run:
  - cd frontend && npm run build
  - Inspect build output for chunk sizes

risk: medium
effort: medium
rollback: Remove lazy() wrappers and Vite chunk config

notes: >
  Nice-to-have optimization. Acceptable for internal tool on local network.
  For an internal BI dashboard, 6.1 MB is acceptable but improves with splitting.
