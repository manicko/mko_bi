description: >
  Add a shared pytest fixture `valid_csv_content` to `tests/conftest.py` that produces
  CSV content large enough (10+ rows) for libmagic to correctly detect it as `text/csv`.
  This fixture is the prerequisite for fixing 9 failing tests (MF-001) and prevents
  future libmagic-related test failures.

goals:
  - Create a reusable fixture that generates libmagic-compatible CSV content
  - Ensure the fixture produces content that libmagic classifies as text/csv
  - Place the fixture in conftest.py for project-wide availability

files:
  - path: tests/conftest.py
    targets:
      - type: module
        name: conftest
    semantic_anchors:
      insert_after:
        type: file_end
        value: end of conftest.py
    changes:
      - action: add_code
        description: >
          Add a `valid_csv_content` pytest fixture that returns bytes of a CSV
          with 10+ rows and consistent column structure.
        code_hint: |
          @pytest.fixture
          def valid_csv_content() -> bytes:
              """CSV content large enough for libmagic to detect as text/csv."""
              header = "category,region,sales,profit,date,qty\n"
              rows = "\n".join(
                  f"{chr(65+i)},Region{i},{100+i*10},{25+i*5},2023-01-{i+1:02d},{10+i}"
                  for i in range(10)
              )
              return (header + rows).encode("utf-8")

acceptance_criteria:
  - Fixture is defined in conftest.py
  - Fixture returns bytes
  - CSV content has at least 10 data rows plus header
  - Libmagic detects the fixture content as text/csv (verified via `python -c "import magic; print(magic.from_buffer(content, mime=True))"`)
  - No existing tests are modified in this task

tests_to_run:
  - python -c "import magic; from tests.conftest import valid_csv_content; print(magic.from_buffer(valid_csv_content(), mime=True))"
