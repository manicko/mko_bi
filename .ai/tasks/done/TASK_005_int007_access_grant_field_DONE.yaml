---
id: TASK_005_int007_access_grant_field
title: INT-007 — Fix AccessGrant field naming mismatch (permission vs permission_level)
status: pending
priority: high
type: implementation
depends_on:
  - TASK_003_fe001_circular_import

source_reference: .ai/audit/99-validation/90-integration-validated.md
source_section: INT-007 — AccessGrant vs GrantAccessRequest field mismatch

description: >
  The frontend AccessGrant type uses `permission` field name while the backend
  GrantAccessRequest model uses `permission_level`. This causes a 422 validation
  error or silent default to "view" when the frontend sends access grant requests.
  Align the field names between frontend and backend.

goals:
  - Align the permission field naming between frontend and backend
  - Either rename the backend field to `permission` or rename the frontend field to `permission_level`
  - Ensure the access grant API works correctly end-to-end

files:
  - path: src/mkobi/models/access.py
    targets:
      - type: class
        name: GrantAccessRequest
    semantic_anchors:
      insert_after:
        type: class_definition
        value: GrantAccessRequest
    changes:
      - action: modify_field
        description: >
          Rename the `permission_level` field to `permission` in
          GrantAccessRequest to match the frontend's AccessGrant type.
          This is the minimal-change approach since the frontend already
          uses `permission` consistently. Alternatively, add an alias
          to accept both field names.

risks:
  - Low risk: field rename in a Pydantic model
  - Must update any backend code that references the old field name
  - Must ensure the OpenAPI spec is regenerated

acceptance_criteria:
  - Frontend can send access grant requests without 422 errors
  - Permission level is correctly stored in the database
  - Existing access control tests pass

tests_to_run:
  - pytest tests/ -k "access" -v
  - pytest tests/ -k "grant" -v
  - pytest tests/ -k "permission" -v
