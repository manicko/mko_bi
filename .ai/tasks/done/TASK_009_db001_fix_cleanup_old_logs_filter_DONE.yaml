id: TASK_009_db001_fix_cleanup_old_logs_filter

title: Fix DB-001 — Fix started_at filter in cleanup_old_logs, use finished_at

status: completed

priority: high

depends_on: []

description: >
  Fix the HIGH issue where cleanup_old_logs in starter.py filters on `started_at < :cutoff`
  instead of `finished_at < :cutoff`. The started_at filter can delete logs of long-running
  processes that started before the cutoff but completed recently. Also fixes DB-005 by
  replacing hardcoded 'failed' with ProcessingStatus.FAILED.value.

source_file: .ai/audit/99-validation/03-database-validated.md
source_section: DB-001: Fix started_at filter in cleanup_old_logs — use finished_at

files:
  - path: src/mkobi/db/starter.py
    targets:
      - type: method
        name: cleanup_old_logs
    semantic_anchors:
      find:
        type: sql_expression
        value: "WHERE started_at < :cutoff AND status IN (:completed_status, 'failed')"
      replace_zone:
        type: sql_expression
        description: Replace the WHERE clause and parameter dict

changes:
  - action: replace_code
    description: >
      Replace `started_at` with `finished_at` in the WHERE clause. Replace hardcoded
      `'failed'` with `ProcessingStatus.FAILED.value` as a bound parameter `:failed_status`.
      Update the parameters dict to include `failed_status`.
    code_hint: |
      # BEFORE:
      "WHERE started_at < :cutoff AND status IN (:completed_status, 'failed')"
      {"cutoff": cutoff_date, "completed_status": ProcessingStatus.COMPLETED.value}

      # AFTER:
      "WHERE finished_at < :cutoff AND status IN (:completed_status, :failed_status)"
      {
          "cutoff": cutoff_date,
          "completed_status": ProcessingStatus.COMPLETED.value,
          "failed_status": ProcessingStatus.FAILED.value,
      }

acceptance_criteria:
  - WHERE clause uses `finished_at` instead of `started_at`
  - No hardcoded 'failed' string — uses ProcessingStatus.FAILED.value
  - Aligns with processing_log_repo.py:356 and file_cleanup.py:143 patterns
  - Existing index idx_processing_logs_status_finished_at covers the query

risk_notes: >
  Low risk — changes a single SQL query. No schema change needed. The finished_at column
  is nullable (set to None until terminal state), so the query naturally excludes
  in-progress logs.

tests_to_run:
  - command: pytest tests/test_starter.py -v -k "cleanup_old_logs" --no-cov
    reason: Verify cleanup_old_logs tests pass with new filter
