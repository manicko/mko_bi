id: TASK_028_clarify_production_env_workflow_in_docs

title: Clarify production .env workflow in deployment documentation

status: pending

priority: low

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\05-docker-validated.md
source_section: INF-005

description: >
  The `.env` file at project root has `ENV=development` which is correct for
  local development, but the production compose workflow uses `docker/.env.production`.
  The current documentation could be clearer about which file to use in which
  environment. Add explicit documentation to prevent confusion between development
  and production environment files.

goals:
  - Clarify the distinction between .env (development) and .env.production (production)
  - Document the correct docker compose command for production deployment
  - Prevent accidental use of development .env in production

files:
  - path: docs/10-deployment/deployment.md

    targets:
      - type: section
        name: Environment Configuration

    semantic_anchors:
      insert_after:
        type: heading
        value: Production Deployment

changes:
  - action: add_code

    description: >
      Add a clear note in the deployment documentation explaining:
      - `.env` at project root is for development only
      - `docker/.env.production` is the production template
      - Production deployments must use `docker compose --env-file docker/.env.production`
      - Never copy `.env` to production servers

    code_hint: |
      > **Important:** The `.env` file at the project root is configured for
      > local development (`ENV=development`). For production deployments, always
      > use `docker/.env.production` as your environment file:
      > ```bash
      > docker compose --env-file docker/.env.production up -d
      > ```

acceptance_criteria:
  - Documentation clearly distinguishes between development and production .env files
  - Production docker compose command is documented
  - Warning about not using development .env in production is present

tests_to_run:
  - No code tests needed (documentation only)

risk: minimal
risk_reason: >
  Documentation-only change. No code or configuration is modified.

rollback: Remove the added documentation section.
