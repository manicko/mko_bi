id: TASK_005_FE_confirm_dialog

title: Create reusable ConfirmDialog component

status: pending

priority: high

depends_on: []

description: >
  Create a reusable ConfirmDialog component for destructive actions with backdrop dimmer,
  short text, Cancel + Delete buttons, and Delete button disabled during request.
  Supports configurable confirmLabel prop.

goals:
  - MUI Dialog with backdrop dimmer
  - Props: open, title, message, onConfirm, onCancel, loading?, confirmLabel? (default: "Delete")
  - Cancel button always enabled
  - Confirm button with color="error" and disabled={loading}
  - Esc and backdrop click close dialog (MUI default)

files:
  - path: frontend/src/shared/components/ConfirmDialog.tsx
    targets:
      - type: component
        name: ConfirmDialog
    semantic_anchors:
      insert_after:
        type: component_creation
        value: ConfirmDialog shared component

changes:
  - action: create_file
    description: Create ConfirmDialog.tsx with all required props

acceptance_criteria:
  - ConfirmDialog component created with all required props
  - Confirm button label defaults to "Delete" and is configurable via confirmLabel
  - Confirm button disabled during loading state
  - Backdrop dimmer present (MUI default)

tests_to_run:
  - cd frontend && npx tsc --noEmit

risk_level: low

wave: 1

plan_source: PLAN_01_confirm_dialog.md
