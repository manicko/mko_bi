---
id: TASK_009_bug004_log_viewer_dashboard_name
title: BUG-004c — Add dashboard_name to ProcessingLog response
status: done
priority: medium
type: implementation
depends_on:
  - TASK_008_bug004_log_viewer_date_format

source_reference: .ai/audit/validated/BUG-004-log-viewer-empty-table.md
source_section: Factor 3 — Backend ProcessingLogRead model does not include dashboard_name field

description: >
  The backend ProcessingLogRead model returns dashboard_id but never resolves
  it to a dashboard_name. The frontend expects dashboard_name as an optional
  field, so it always falls back to 'N/A'. Add dashboard_name to the backend
  response by joining with the dashboards table in the repository query.

goals:
  - Add dashboard_name field to ProcessingLogRead model (optional)
  - Join with dashboards table in the processing log repository to populate the field
  - Update the repository query to eagerly load or join the dashboard relationship

files:
  - path: src/mkobi/models/processing_logs.py
    targets:
      - type: class
        name: ProcessingLogRead
    semantic_anchors:
      insert_after:
        type: class_definition
        value: ProcessingLogRead
    changes:
      - action: add_field
        description: >
          Add `dashboard_name: str | None = None` field to ProcessingLogRead model.

  - path: src/mkobi/db/repositories/processing_log_repo.py
    targets:
      - type: class
        name: ProcessingLogRepository
    semantic_anchors:
      insert_after:
        type: class_definition
        value: ProcessingLogRepository
    changes:
      - action: modify_code
        description: >
          Update the get_logs query to join with the dashboards table
          (on dashboard_id) and populate the dashboard_name field in
          the ProcessingLogRead response.

risks:
  - Low risk: additive change, optional field
  - Must handle the case where dashboard_id is no longer valid (orphaned log entries)

acceptance_criteria:
  - ProcessingLogRead includes dashboard_name field
  - Logs with associated dashboards show the dashboard name
  - Logs without dashboards (or orphaned IDs) show null/undefined
  - Existing log viewer tests pass

tests_to_run:
  - pytest tests/ -k "log" -v
