id: TASK_038_P01_frontend_logout_complete

title: Complete frontend logout with API call

status: pending

priority: medium

depends_on:
  - TASK_035_P01_frontend_refresh_api

phase: PLAN_01
wave: 4

description: >
  Update the frontend logout flow to call POST /auth/logout with credentials
  included, then clear local token storage and redirect. Ensures the backend
  refresh cookie is properly cleared.

finding_ref: PLAN_01_WAVE_4
severity: medium

goals:
  - Call POST /auth/logout API endpoint on logout
  - Use credentials: 'include' for cookie clearing
  - Clear local access token storage
  - Redirect to login page

files:
  - path: frontend/src/features/auth/model/useAuth.ts
    targets:
      - type: hook
        name: useAuth
    semantic_anchors:
      modify:
        type: function_definition
        pattern: "logout"
    changes:
      - action: modify_function
        description: Update logout to call API endpoint
        code_hint: |
          const logout = useCallback(async () => {
            try {
              await axiosInstance.post("/auth/refresh", {}, { withCredentials: true });
            } catch {
              // Ignore errors - cookie may already be cleared
            }
            clearAccessToken();
            navigate("/search?tab=login");
          }, [navigate]);

acceptance_criteria:
  - Logout calls POST /auth/logout endpoint
  - Frontend clears local token storage
  - Redirects to login page
  - Handles API errors gracefully

tests_to_run:
  - "npm test -- --testPathPattern=auth --verbose"
  - Manual test: logout and verify redirect to login page

risk_level: low

rollout_notes: >
  Depends on TASK_035 for API function pattern.
  Must handle case where logout API call fails (network error).
