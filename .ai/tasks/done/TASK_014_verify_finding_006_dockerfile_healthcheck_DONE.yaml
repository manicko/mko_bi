id: TASK_014_verify_finding_006_dockerfile_healthcheck

title: Verify — HEALTHCHECK in Dockerfile prod stage

type: verification

status: pending

depends_on:
  - TASK_013_finding_006_dockerfile_healthcheck

verifies: TASK_013_finding_006_dockerfile_healthcheck

verification_steps:
  - build: docker compose -f docker/docker-compose.yml --env-file .env build app
  - test: echo "Verify HEALTHCHECK in image: docker inspect --format='{{.Config.Healthcheck}}' <image>"
  - smoke_check: docker compose -f docker/docker-compose.yml --env-file .env up -d && sleep 15 && docker compose ps | findstr "healthy"

pass_criteria:
  - Image builds successfully
  - docker inspect shows HEALTHCHECK configuration
  - Container reaches "healthy" status

failure_action: return TASK_013_finding_006_dockerfile_healthcheck to rework
