id: TASK_036_fix_rq_worker_health_check

title: Fix rq-worker health check to actually verify worker process (INF-004)

status: pending

priority: medium

depends_on: []

description: >
  The rq-worker health check uses `pgrep -f rq` which matches the command string
  `uv run rq worker --url redis://redis:6379/0` but does not verify that the worker
  is actually processing jobs. A worker that is stuck or disconnected from Redis
  would still pass this health check. Use rq's built-in health check mechanism or
  verify the worker can connect to Redis.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: INF-004

goals:
  - Replace pgrep-based health check with a meaningful worker health check
  - Verify the worker can connect to Redis and is operational
  - Keep the health check lightweight

files:
  - path: docker/docker-compose.yml
    targets:
      - type: healthcheck
        name: rq-worker-healthcheck
    semantic_anchors:
      - replace_test:
          value: "pgrep -f rq"
          description: Replace with Redis connectivity check

changes:
  - action: modify
    description: >
      Replace the pgrep-based health check with a Redis connectivity check
      that verifies the worker can connect to Redis.

    code_hint: |
      # BEFORE (lines 164-169):
      healthcheck:
        test: ["CMD", "pgrep", "-f", "rq"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 40s

      # AFTER:
      healthcheck:
        test: ["CMD", "uv", "run", "python", "-c",
               "from redis import Redis; r = Redis(host='redis', port=6379, db=0); r.ping()"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 40s

acceptance_criteria:
  - Health check verifies Redis connectivity
  - Failed Redis connection causes health check to fail
  - Docker compose validates successfully
  - rq-worker starts and becomes healthy

risk: low

tests_to_run:
  - "cd docker && docker compose config"
