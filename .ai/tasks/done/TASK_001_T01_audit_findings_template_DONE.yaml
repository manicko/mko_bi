template_purpose: >
  This template defines the structured format for audit findings produced by each phase executor.
  Every phase writes findings to `.ai/audit/{phase-name}/findings.md` using this format.

mandatory_fields_per_finding:
  - field: id
    type: string
    description: "Unique identifier within phase (e.g., BE-001, FE-003)"
  - field: title
    type: string
    description: "Human-readable one-line summary"
  - field: type
    type: enum
    values: [SPEC-DEVIATION, BEST-PRACTICE, DOC-UPDATE, RUNTIME-ERROR]
  - field: severity
    type: enum
    values: [CRITICAL, HIGH, MEDIUM, LOW]
  - field: description
    type: string
    description: "Detailed problem description with context"
  - field: evidence
    type: string
    description: "File paths, line references, log excerpts, code snippets"
  - field: affected_modules
    type: list
    description: "Affected module paths (e.g., src/mkobi/api/routes/, frontend/src/features/auth/)"
  - field: recommendation
    type: string
    description: "Concrete fix direction: what to change and why"
  - field: classification
    type: enum
    values: [mandatory, advisory]
    description: "mandatory = security, data loss, correctness; advisory = improvement, refactoring"

template_structure: |
  # Phase N Audit Findings — {Phase Name}

  **Executor:** audit-executor
  **Template:** {phase-template-file}
  **Status:** {pending|in-progress|complete}
  **Validated:** {yes|no}

  ---

  ## Findings

  ### {ID}: {Title}

  | Field | Value |
  |-------|-------|
  | **ID** | {id} |
  | **Severity** | {severity} |
  | **Type** | {type} |
  | **Affected Modules** | {modules} |
  | **Classification** | {mandatory|advisory} |

  **Description:** {description}

  **Evidence:** {evidence}

  **Recommendation:** {recommendation}

  ---

  ## Summary

  | Severity | Count |
  |----------|-------|
  | CRITICAL | 0 |
  | HIGH | 0 |
  | MEDIUM | 0 |
  | LOW | 0 |

  ## Mandatory Fixes
  ## Advisory Recommendations
  ## Doc Updates Needed

