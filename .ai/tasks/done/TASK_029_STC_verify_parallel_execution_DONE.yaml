id: TASK_029_STC_verify_parallel_execution

title: GATE — Verify Dev and Test Environments Run in Parallel Without Conflicts

status: pending

priority: critical

depends_on:
  - TASK_025_STC_rewrite_compose_test
  - TASK_026_STC_cleanup_compose_yml
  - TASK_028_STC_fix_override_yml
  - TASK_027_STC_fix_conftest_env

phase: STC
wave: 3
type: gate

description: >
  Verification gate after completing all STC implementation tasks. Confirms both
  dev and test environments can run simultaneously on the same host with zero
  shared state — separate containers, ports, volumes, and networks. Covers the
  full lifecycle: clean start, health checks, test execution, and isolated teardown.

  This is a READ-ONLY verification task — no source code changes.

  If any check fails, invoke TASK_030_STC_audit_docker_issues to diagnose and
  document the problem in C:\py_dev\mkobi\.ai\problems\

goals:
  - Dev environment starts normally (production + override)
  - Test environment starts normally (standalone)
  - Both environments run simultaneously with no conflicts
  - All test services healthy: test-db, test-migrate, test-app
  - Tests execute successfully inside test-app container
  - Clean teardown of test environment does not affect dev environment
  - conftest.py setdefault allows Docker Compose env vars to take precedence

files: []

acceptance_criteria:
  - Dev environment starts and all containers healthy
  - Test environment starts and all containers healthy
  - Both environments run simultaneously (docker ps shows all containers)
  - No port conflicts (dev: 8000/5432/6379, test: 8001/5433/6380)
  - Separate Docker networks for dev and test
  - Separate Docker volumes (postgres_data vs test_postgres_data)
  - test-db healthcheck passes (service_healthy)
  - test-migrate completes successfully (service_completed_successfully)
  - test-app stays running (healthcheck disabled, no restart loop)
  - Tests execute successfully inside test-app container
  - Docker Compose env vars override conftest.py defaults inside container
  - Test environment teardown does not affect dev environment
  - No ERROR/CRITICAL logs in any container

docker_health_checks:
  # === Phase 1: Clean Slate ===
  - name: Dev clean slate
    command: "docker compose -f docker-compose.yml -f docker-compose.override.yml down -v"
    expected: "All dev containers and volumes removed"
  - name: Test clean slate
    command: "docker compose -f docker-compose.test.yml down -v"
    expected: "All test containers and volumes removed"
  - name: No stale containers
    command: "docker ps -a --format '{{.Names}}' | grep -E '^(db|app|redis|test-)' | wc -l"
    expected: "Count is 0"

  # === Phase 2: Dev Environment Start ===
  - name: Dev environment starts
    command: "docker compose -f docker-compose.yml -f docker-compose.override.yml up -d --build"
    expected: "All dev containers start without errors"
  - name: Dev DB healthy
    command: "docker compose exec db pg_isready -U postgres"
    expected: "Returns 'accepting connections'"
  - name: Dev migrate completed
    command: "docker compose ps migrate --format '{{.Status}}'"
    expected: "Contains 'Exit 0'"
  - name: Dev app healthy
    command: "curl -sf http://localhost:8000/health"
    expected: "HTTP 200 with JSON body"
  - name: Dev app logs clean
    command: "docker compose logs app --tail 100"
    expected: "No ERROR or CRITICAL lines"
  - name: Dev redis healthy
    command: "docker compose exec redis redis-cli ping"
    expected: "Returns 'PONG'"

  # === Phase 3: Test Environment Start (Parallel) ===
  - name: Test environment starts (standalone)
    command: "docker compose -f docker-compose.test.yml up -d --build"
    expected: "All test containers start without errors"
  - name: Test DB healthy
    command: "docker compose -f docker-compose.test.yml exec test-db pg_isready -U postgres"
    expected: "Returns 'accepting connections'"
  - name: Test migrate completed
    command: "docker compose -f docker-compose.test.yml ps test-migrate --format '{{.Status}}'"
    expected: "Contains 'Exit 0'"
  - name: Test app running
    command: "docker compose -f docker-compose.test.yml ps test-app --format '{{.Status}}'"
    expected: "Contains 'running' or 'Up', NOT 'exited'"
  - name: Test redis healthy
    command: "docker compose -f docker-compose.test.yml exec test-redis redis-cli ping"
    expected: "Returns 'PONG'"

  # === Phase 4: Parallel Execution Verification ===
  - name: All containers running simultaneously
    command: "docker ps --format '{{.Names}}' | sort"
    expected: "Shows both dev (db, app, redis) and test (test-db, test-app, test-redis) containers"
  - name: Test DB on port 5433
    command: "docker port test-db 5432"
    expected: "Shows '0.0.0.0:5433'"
  - name: Test app on port 8001
    command: "docker port test-app 8000"
    expected: "Shows '0.0.0.0:8001'"
  - name: Test redis on port 6380
    command: "docker port test-redis 6379"
    expected: "Shows '0.0.0.0:6380'"

  # === Phase 5: Network and Volume Isolation ===
  - name: Separate networks
    command: "docker network ls --format '{{.Name}}' | grep -E 'network'"
    expected: "Shows at least 2 distinct networks (dev default + test_network)"
  - name: Separate volumes
    command: "docker volume ls --format '{{.Name}}' | grep -E 'postgres_data|test_postgres'"
    expected: "Shows both 'postgres_data' and 'test_postgres_data'"
  - name: No cross-environment volume sharing
    command: "docker volume ls --format '{{.Name}}' | grep -E 'test_' | grep -v 'test_postgres_data|test_redis_data' | wc -l"
    expected: "Count is 0 (only expected test volumes exist)"

  # === Phase 6: Test Database Verification ===
  - name: Test DB has schema
    command: "docker compose -f docker-compose.test.yml exec test-db psql -U postgres -d bidb_test -c \"SELECT version_num FROM alembic_version LIMIT 1;\""
    expected: "Returns an alembic revision hash"
  - name: Test DB permissions
    command: "docker compose -f docker-compose.test.yml exec test-db psql -U postgres -c \"SELECT datname FROM pg_database WHERE datname = 'bidb_test';\""
    expected: "Returns 'bidb_test' row"

  # === Phase 7: Test Execution ===
  - name: Tests collect inside container
    command: "docker compose -f docker-compose.test.yml exec test-app uv run pytest tests/ -v --co 2>&1 | tail -5"
    expected: "Shows collected test count, no import errors"
  - name: Docker Compose env vars active in container
    command: "docker compose -f docker-compose.test.yml exec test-app python -c \"import os; print('HOST:', os.environ.get('DATABASE__HOST')); print('PORT:', os.environ.get('DATABASE__PORT'))\""
    expected: "HOST: test-db, PORT: 5432 (not localhost)"
  - name: conftest.setdefault allows override
    command: "docker compose -f docker-compose.test.yml exec test-app python -c \"import os; print(os.environ.get('DATABASE__HOST'))\""
    expected: "Returns 'test-db' (Docker Compose override, not 'localhost')"

  # === Phase 8: Isolated Teardown ===
  - name: Test environment teardown
    command: "docker compose -f docker-compose.test.yml down -v"
    expected: "All test containers and volumes removed"
  - name: Dev environment survives test teardown
    command: "docker compose ps --format '{{.Names}} {{.Status}}'"
    expected: "Dev containers (db, app, redis) still running and healthy"
  - name: Dev app still healthy after test teardown
    command: "curl -sf http://localhost:8000/health"
    expected: "HTTP 200"

findings:
  phase_1_clean_slate: "All containers and volumes removed successfully"
  phase_2_dev_environment: "Dev environment started, DB healthy, app healthy, redis healthy"
  phase_3_test_environment: "Test environment started, DB healthy, migrate completed, test-app running"
  phase_4_parallel_verification: "Both environments running simultaneously"
  phase_5_network_volume_isolation: "Separate networks (mkobi_default, mkobi_test_network), separate volumes (mkobi_postgres_data, mkobi_test_postgres_data)"
  phase_6_test_database: "Test DB has alembic schema (bc892fa3b2ae), bidb_test database exists"
  phase_7_test_execution: "386 tests collected successfully inside container"
  phase_8_isolated_teardown: "Test environment teardown completed, dev environment still running"

