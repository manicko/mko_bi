rollout_notes: >
  READ-ONLY gate task. No code changes. Documents findings, issues_found,
  root_cause, recommendation, and gate_result at completion time.

  If any check fails:
  1. Document the failure in `findings` and `issues_found`
  2. Identify `root_cause` from logs and docker state
  3. Set `gate_result: FAILED` and `gate_passed: false`
  4. invoke TASK_030_STC_audit_docker_issues for detailed diagnosis
  5. Write audit report to C:\py_dev\mkobi\.ai\problems\

  If all checks pass:
  1. Set `gate_result: PASSED` and `gate_passed: true`
  2. No audit task needed

  Key checks specific to this phase:
  - conftest.py setdefault: Inside test-app container, DATABASE__HOST must be
    'test-db' (from Docker Compose), NOT 'localhost' (from conftest.py default)
  - test-migrate must complete before test-app starts (depends_on condition)
  - test-app must NOT have active healthcheck (healthcheck: disable: true)
  - test_postgres_data volume must be separate from postgres_data
