---
id: TASK_002_sec003_mime_validation
title: SEC-003 — Fix MIME type validation bypass on missing Content-Type
status: pending
priority: high
type: implementation
depends_on: []

source_reference: .ai/audit/99-validation/04-security-validated.md
source_section: SEC-003 — MIME Type Validation Can Be Bypassed by Missing Content-Type Header

description: >
  The validate_mime_type() function in file_processing.py silently returns
  (skips validation) when content_type is None, logging only a warning. An
  attacker can craft a request with no Content-Type header to bypass MIME
  type validation entirely. Change the function to raise ValueError when
  content_type is None, consistent with the existing pattern of raising on
  invalid types.

goals:
  - Make validate_mime_type() raise ValueError when content_type is None
  - Ensure the ValueError propagates as a 415 Unsupported Media Type response
  - Preserve existing valid MIME type validation behavior

files:
  - path: src/mkobi/services/file_processing.py
    targets:
      - type: function
        name: validate_mime_type
    semantic_anchors:
      insert_after:
        type: function_definition
        value: validate_mime_type
    changes:
      - action: modify_code
        description: >
          Change the `if content_type is None: logger.warning(...); return`
          block to raise ValueError("Content-Type header is required") instead
          of silently returning. This ensures that requests without Content-Type
          are rejected at the validation layer rather than being processed
          without MIME checks.

risks:
  - Low risk: changes validation behavior for a security-critical check
  - Requests previously accepted with a warning will now be rejected
  - Must verify no legitimate clients send uploads without Content-Type
    (most HTTP clients include it automatically)

acceptance_criteria:
  - Upload without Content-Type header returns 415 Unsupported Media Type
  - Upload with valid Content-Type (text/csv) is accepted
  - Upload with invalid Content-Type (application/exe) returns 415
  - Existing upload tests pass or are updated

tests_to_run:
  - pytest tests/ -k "upload" -v
  - pytest tests/ -k "mime" -v
