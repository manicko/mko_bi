id: TASK_023_finding_014_nginx_security_headers

title: Add security headers to nginx server block in nginx.conf

type: implementation

status: pending

priority: medium

depends_on:
  - TASK_022_verify_finding_013_nginx_ssl_fix

description: >
  docker/nginx/nginx.conf lacks security headers: X-Content-Type-Options, X-Frame-Options,
  X-XSS-Protection, Referrer-Policy. These provide defense-in-depth against XSS,
  clickjacking, and MIME-type sniffing. Add standard security headers to the server block.

goals:
  - Add X-Content-Type-Options: nosniff
  - Add X-Frame-Options: SAMEORIGIN
  - Add X-XSS-Protection: 1; mode=block
  - Add Referrer-Policy: strict-origin-when-cross-origin

files:
  - path: docker/nginx/nginx.conf
    targets:
      - type: nginx_block
        name: server
    semantic_anchors:
      insert_after:
        type: nginx_directive
        value: listen 80
    changes:
      - action: add_code
        description: Add security headers inside the server block
        code_hint: |
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-Frame-Options "SAMEORIGIN" always;
          add_header X-XSS-Protection "1; mode=block" always;
          add_header Referrer-Policy "strict-origin-when-cross-origin" always;

acceptance_criteria:
  - All four security headers present in server block
  - nginx -t validates configuration
  - Headers don't conflict with frontend requirements

tests_to_run:
  - docker run --rm -v ${PWD}/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro nginx:alpine nginx -t

risk_level: low

rollout_notes: >
  Low risk: additive change, no breaking effects. Should verify headers don't conflict
  with any frontend requirements.
