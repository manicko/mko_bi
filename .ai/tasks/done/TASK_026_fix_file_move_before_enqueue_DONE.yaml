id: TASK_026_fix_file_move_before_enqueue

title: Move file to final location after successful enqueue (DP-009)

status: done

outcome: |
  Task already completed in TASK_010 (commit b459ef4). The implementation in
  process_upload_with_session() correctly handles the file move with proper
  transaction coordination:
  
  1. File is moved to final location BEFORE commit (within transaction)
  2. Enqueue job uses the final file path
  3. If enqueue fails, the moved file is cleaned up and transaction is rolled back
  4. Commit happens AFTER successful enqueue
  
  All upload tests pass, confirming the implementation is correct.

priority: medium

depends_on:
  - TASK_001_fix_enqueue_job_failure_silent_none
  - TASK_010_fix_data_pipeline_transaction_coordination

description: >
  In process_upload_with_session(), the file is moved to its final location
  (file_path.replace) BEFORE the job is enqueued. If enqueue fails, the file
  has already been moved and the original temp file is gone. The file move
  should happen after successful enqueue, or the file should remain at the
  temp path until enqueue succeeds.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: DP-009

goals:
  - Move file to final location only after successful enqueue
  - If enqueue fails, the original temp file is still available for cleanup
  - Maintain the log ID as the final filename convention

files:
  - path: src/mkobi/services/file_processing.py
    targets:
      - type: function
        name: process_upload_with_session
    semantic_anchors:
      - reorder_operations:
          before: "file_path.replace(final_file_path)"
          after: "enqueue_processing_job"
          description: Move file after enqueue instead of before

changes:
  - action: modify
    description: >
      Reorder operations in process_upload_with_session so that the file is
      moved to its final location AFTER successful enqueue. Pass the temp
      path to enqueue_processing_job, and only move the file once enqueue
      succeeds.

    code_hint: |
      # BEFORE (lines 233-257):
      # Move file to final location with log ID as filename AFTER successful commit
      final_file_path = upload_dir / f"{log.id}{file_ext}"
      try:
          file_path.replace(final_file_path)
      except Exception:
          ...
          raise

      # Enqueue job with processing config
      await enqueue_processing_job(
          file_path=str(final_file_path),
          ...
      )

      # AFTER:
      # Enqueue job BEFORE moving file (use temp path for processing)
      await enqueue_processing_job(
          file_path=str(file_path),
          dashboard_id=dashboard_id,
          task_id=log.id,
          mode=str(mode),
          processing_config=processing_config,
      )

      # Move file to final location AFTER successful enqueue
      final_file_path = upload_dir / f"{log.id}{file_ext}"
      try:
          file_path.replace(final_file_path)
      except Exception:
          logger.error(
              "Failed to move file to final path after enqueue, log_id=%s",
              log.id,
              exc_info=True,
          )
          raise

acceptance_criteria:
  - File move happens after successful enqueue
  - If enqueue fails, temp file is still available
  - Processing uses the temp file path (worker reads from temp location)
  - Tests pass for file processing

risk: medium

tests_to_run:
  - "pytest tests/ -v -k 'file_processing or upload'"
