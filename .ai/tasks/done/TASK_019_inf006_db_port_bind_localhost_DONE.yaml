id: TASK_019_inf006_db_port_bind_localhost

title: Fix INF-006 — Bind development database port to 127.0.0.1 and add warning

status: pending

priority: medium

depends_on: []

description: >
  Fix the MEDIUM issue where the development override exposes PostgreSQL port 5432 on
  0.0.0.0, which could expose the database to the network if accidentally used with
  production compose. Bind to 127.0.0.1 and add a warning comment.

source_file: .ai/audit/99-validation/05-docker-validated.md
source_section: INF-006: Database Port Exposure — Add Warning Comment and Document Risk

files:
  - path: docker/docker-compose.override.yml
    targets:
      - type: file_header
      - type: service
        name: db
    semantic_anchors:
      find:
        type: ports
        value: "5432:5432"

changes:
  - action: replace_code
    description: >
      Add a warning comment at the top of the override file about not using it in production.
      Change the db port binding from `"5432:5432"` to `"127.0.0.1:5432:5432"`.
    code_hint: |
      # Port binding: 127.0.0.1 instead of 0.0.0.0
      ports:
        - "127.0.0.1:5432:5432"

acceptance_criteria:
  - Port binding uses 127.0.0.1 instead of 0.0.0.0
  - Warning comment at top of override file
  - Database accessible from host machine via localhost only

risk_notes: >
  Low risk — limits exposure to local machine. GUI tools and pslocal still work via localhost.

tests_to_run:
  - command: docker compose -f docker/docker-compose.yml -f docker/docker-compose.override.yml config
    reason: Verify compose override is valid after port binding change
