id: TASK_018_fix_filter_values_bulk_insert

title: Replace row-by-row insert with bulk insert in save_filter_values (DB-003)

status: pending

priority: medium

depends_on: []

description: >
  The save_filter_values method in DashboardFilterValuesRepository inserts filter values
  one-by-row using a loop with individual db.add() calls. For dashboards with many filter
  values, this creates unnecessary overhead. Replace with a single bulk insert using
  SQLAlchemy's insert().values() or equivalent.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: DB-003

goals:
  - Replace row-by-row db.add() loop with bulk insert
  - Maintain clear-then-insert idempotency semantics
  - Reduce database round-trips for filter value saving

files:
  - path: src/mkobi/db/repositories/dashboard_filter_values_repo.py
    targets:
      - type: function
        name: save_filter_values
    semantic_anchors:
      - replace_loop:
          value: "for value in values: db.add(...)"
          description: Replace with bulk insert

changes:
  - action: modify
    description: >
      Replace the row-by-row insert loop with a bulk insert using SQLAlchemy Core
      insert().values() for better performance.

    code_hint: |
      # BEFORE (lines 89-97):
      # Bulk insert new values
      for value in values:
          db.add(
              DashboardFilterValue(
                  dashboard_id=dashboard_id,
                  filter_name=filter_name,
                  filter_value=value,
              )
          )

      # AFTER:
      # Bulk insert new values using SQLAlchemy Core
      if values:
          await db.execute(
              insert(DashboardFilterValue).values([
                  {
                      "dashboard_id": dashboard_id,
                      "filter_name": filter_name,
                      "filter_value": value,
                  }
                  for value in values
              ])
          )

acceptance_criteria:
  - No row-by-row db.add() loop in save_filter_values
  - Filter values are saved correctly for all dashboards
  - Clear-then-insert idempotency preserved
  - Tests pass for filter value operations

risk: low

tests_to_run:
  - "pytest tests/ -v -k 'filter_values or dashboard_filter'"
