id: TASK_030_V021
title: Remove weak default database password from docker-compose production config
status: pending
priority: medium
depends_on: []

description: >
  Default DATABASE__PASSWORD in docker-compose.yml is "1234". This weak default could be
  used in production if not overridden.

goals:
  - Remove default database password from production docker-compose
  - Require explicit env var or Docker secret
  - Add a comment documenting the requirement

files:
  - path: docker-compose.yml
    targets:
      - type: environment_variable
        name: DATABASE__PASSWORD
    semantic_anchors:
      - type: env_value
        description: "DATABASE__PASSWORD: ${DATABASE__PASSWORD:-1234}"
    changes:
      - action: remove_default
        description: "Remove the default value, require explicit env var"
        code_hint: "DATABASE__PASSWORD: ${DATABASE__PASSWORD:?DATABASE__PASSWORD must be set}"

acceptance_criteria:
  - Production compose files require explicit database password
  - Development compose still works (or has a documented dev-only default)
  - Application fails to start without database password in production

tests_to_run:
  - uv run pytest tests/ -x -v

risk_level: medium
notes: >
  Ensure all deployment configurations have DATABASE__PASSWORD set before making
  this change. Could cause production outages if not coordinated.
