id: TASK_001_fix_date_format_processing_logs

title: Fix date format mismatch — backend date_from/date_to should accept date strings

status: pending

priority: high

depends_on: []

type: implementation

source_reference: C:\py_dev\mkobi\.ai\audit\validated\BUG-004-log-viewer-empty-table.md
source_section: Factor 1 — Frontend sends date_from/date_to as date-only strings, backend expects full datetime

description: >
  The backend route `GET /admin/logs` declares `date_from` and `date_to` as `datetime` type parameters.
  The frontend sends them as date-only strings like "2026-05-27" (YYYY-MM-DD).
  FastAPI cannot parse a date-only string as `datetime`, so it returns 422 Unprocessable Entity.
  Fix: change the parameter type from `datetime` to `date` in the backend route so FastAPI accepts "YYYY-MM-DD" strings.

goals:
  - Change `date_from` and `date_to` parameter types from `datetime` to `date` in the route
  - Ensure the `ProcessingLogFilter` model also uses `date` instead of `datetime` for these fields
  - Ensure the repository query still works correctly (comparison with `date` objects against `DateTime` columns)
  - Preserve backward compatibility with full ISO datetime strings

files:
  - path: src/mkobi/api/routes/processing_logs.py
    targets:
      - type: function
        name: get_logs_endpoint
    semantic_anchors:
      insert_after:
        type: parameter_definition
        value: "status_filter: ProcessingStatus | None = Query("
    changes:
      - action: modify_parameter
        description: >
          Change `date_from: datetime | None` to `date_from: date | None` and
          `date_to: datetime | None` to `date_to: date | None`.
          Import `date` from `datetime` module (add to existing import).

  - path: src/mkobi/models/processing_logs.py
    targets:
      - type: class
        name: ProcessingLogFilter
    semantic_anchors:
      insert_after:
        type: field_definition
        value: "status: ProcessingStatus | None = None"
    changes:
      - action: modify_field
        description: >
          Change `date_from: datetime | None = None` to `date_from: date | None = None` and
          `date_to: datetime | None = None` to `date_to: date | None = None`.
          Import `date` from `datetime` module.

acceptance_criteria:
  - Backend accepts date-only strings like "2026-05-27" for date_from/date_to without 422 error
  - Backend still accepts full ISO datetime strings like "2026-05-27T00:00:00" (FastAPI date type handles this)
  - Repository filter queries work correctly with date objects
  - No ruff or mypy errors

tests_to_run:
  - ruff check src/mkobi/api/routes/processing_logs.py src/mkobi/models/processing_logs.py
  - mypy src/mkobi/api/routes/processing_logs.py src/mkobi/models/processing_logs.py

risk: low
effort: trivial
affected_modules:
  - src/mkobi/api/routes/processing_logs.py
  - src/mkobi/models/processing_logs.py
