id: TASK_019_finding_009_cors_origins_templating

title: Template CORS_ORIGINS in docker-compose.yml with configurable variable

type: implementation

status: pending

priority: medium

depends_on:
  - TASK_018_verify_finding_008_uv_version_pin

description: >
  docker-compose.yml line for the app service hardcodes CORS_ORIGINS to
  '["http://localhost:3000", "http://localhost:5173"]'. This is not templated.
  If deployed to production without overriding, the API rejects all cross-origin
  requests from real frontends. Use a template variable.

goals:
  - Replace hardcoded CORS_ORIGINS with template variable
  - Allow production deployment to configure CORS origins

files:
  - path: docker/docker-compose.yml
    targets:
      - type: env_var_reference
        name: CORS_ORIGINS
    semantic_anchors:
      env_var_pattern: CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173"]'
    changes:
      - action: replace_value
        description: Replace hardcoded CORS_ORIGINS with template variable
        old_value: CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173"]'
        new_value: CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}

acceptance_criteria:
  - CORS_ORIGINS uses template variable in docker-compose.yml
  - Default allows localhost:3000 for development
  - Production can override via environment variable

tests_to_run:
  - docker compose -f docker/docker-compose.yml --env-file .env config

risk_level: low

rollout_notes: >
  The app already validates CORS in app.py (raises ValueError if not set in production),
  which provides a safety net. Must ensure production deployment provides CORS_ORIGINS.
