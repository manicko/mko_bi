id: TASK_011_finding_010_app_password_enforcement

title: Enforce MKOBI_APP_PASSWORD via ${VAR:?error} pattern in docker-compose.yml

type: implementation

status: complete

priority: high

depends_on:
  - TASK_010_verify_finding_005_swagger_redoc_conditional

description: >
  docker-compose.yml uses ${MKOBI_APP_PASSWORD:-secure_password_placeholder} for the
  application database role password. The placeholder name suggests it should be changed,
  but nothing enforces this. Change to ${MKOBI_APP_PASSWORD:?MKOBI_APP_PASSWORD is required}.

goals:
  - Replace default MKOBI_APP_PASSWORD with enforcement pattern
  - Application fails to start without explicit app database password

files:
  - path: docker/docker-compose.yml
    targets:
      - type: env_var_reference
        name: MKOBI_APP_PASSWORD
    semantic_anchors:
      env_var_pattern: ${MKOBI_APP_PASSWORD:-secure_password_placeholder}
    changes:
      - action: replace_value
        description: Replace placeholder default with enforcement
        old_value: ${MKOBI_APP_PASSWORD:-secure_password_placeholder}
        new_value: ${MKOBI_APP_PASSWORD:?MKOBI_APP_PASSWORD is required}

acceptance_criteria:
  - MKOBI_APP_PASSWORD uses :? enforcement in docker-compose.yml
  - Compose config fails without MKOBI_APP_PASSWORD

tests_to_run:
  - MKOBI_APP_PASSWORD=test JWT__SECRET_KEY=test DATABASE__PASSWORD=test docker compose -f docker/docker-compose.yml --env-file .env config

risk_level: low

rollout_notes: >
  Must ensure production deployment provides this value. No application changes needed.
