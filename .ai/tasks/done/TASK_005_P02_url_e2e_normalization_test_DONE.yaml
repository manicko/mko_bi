  - TASK_001_P02_url_nginx_trailing_slash_rewrite
  - TASK_003_P02_url_react_trailing_slash_redirect

phase: PLAN_02
wave: 3

description: >
  Validate the complete URL normalization flow end-to-end through nginx.
  Test all URL variants to ensure consistent behavior: trailing-slash
  variants get 301 redirected, slashless variants serve normally, API paths
  are never redirected, and static assets are unaffected.

finding_ref: PLAN_02_WAVE_3
severity: low

goals:
  - Validate all trailing-slash URLs get 301 redirected
  - Validate slashless URLs serve normally
  - Validate API paths are never redirected
  - Validate static assets are unaffected
  - No 404s on valid routes

files: []

acceptance_criteria:
  - /dashboards → 200, serves SPA
  - /dashboards/ → 301 to /dashboards
  - /dashboard/123 → 200, serves SPA
  - /dashboard/123/ → 301 to /dashboard/123
  - /admin → 200, serves SPA
  - /admin/ → 301 to /admin
  - /profile/change-password → 200, serves SPA
  - /profile/change-password/ → 301 to /profile/change-password
  - / → 200, serves SPA
  - /api/v1/auth/login → 200, proxied to FastAPI
  - /api/v1/auth/login/ → 200, proxied to FastAPI (no redirect)
  - /health → 200, proxied to FastAPI
  - /assets/index-abc123.js → 200, static file

tests_to_run:
  - "curl -I http://localhost/dashboards/"   # 301
  - "curl -I http://localhost/dashboards"     # 200
  - "curl -I http://localhost/dashboard/123/" # 301
  - "curl -I http://localhost/admin/"         # 301
  - "curl -I http://localhost/admin"           # 200
  - "curl -I http://localhost/"               # 200
  - "curl -I http://localhost/api/v1/auth/login" # 200
  - "curl -I http://localhost/health"          # 200

risk_level: low

