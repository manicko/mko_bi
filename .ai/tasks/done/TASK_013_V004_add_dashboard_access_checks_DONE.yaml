id: TASK_013_V004
title: Add dashboard access checks to read endpoints in dashboards.py
status: pending
priority: high
depends_on: []

description: >
  Multiple endpoints allow any authenticated user to access data for any dashboard without
  checking dashboard-level access: GET /dashboards/{id}/filters, GET /dashboards/{id}/graphs,
  GET /dashboards/{id}/access.

goals:
  - Add check_dashboard_access to get_dashboard_filters_endpoint
  - Add check_dashboard_access to get_dashboard_graphs_endpoint
  - Add require_admin_role to get_dashboard_access_endpoint
  - Ensure consistent access control across all dashboard read endpoints

files:
  - path: src/mkobi/api/routes/dashboards.py
    targets:
      - type: function
        name: get_dashboard_filters_endpoint
      - type: function
        name: get_dashboard_graphs_endpoint
      - type: function
        name: get_dashboard_access_endpoint
    semantic_anchors:
      - type: route_decorator
        description: "GET endpoints for filters, graphs, and access list"
    changes:
      - action: add_dependency
        description: "Add check_dashboard_access dependency to filters and graphs endpoints"
        code_hint: "Add dashboard_id parameter check via check_dashboard_access(db, dashboard_id, user_id)"
      - action: add_dependency
        description: "Add require_admin_role dependency to access list endpoint"
        code_hint: "Add dependencies=[Depends(require_admin_role)] to the access endpoint"

acceptance_criteria:
  - Filters endpoint returns 403 for unauthorized users
  - Graphs endpoint returns 403 for unauthorized users
  - Access list endpoint returns 403 for non-admin users
  - Authorized users can still access their dashboards
  - Existing tests pass

tests_to_run:
  - uv run pytest tests/test_dashboards_api.py -x -v
  - uv run pytest tests/ -x -v

risk_level: medium
notes: >
  The data.py endpoint already has correct access control. Apply the same pattern
  to the dashboards.py read endpoints. Need to check if check_dashboard_access
  is available as a dependency or needs to be adapted.
