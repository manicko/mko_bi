id: TASK_001_fix_trailing_slash_redirect

title: Fix TrailingSlashRedirect crash in routes.tsx

status: done

priority: high

depends_on: []

type: implementation

description: >
  Fix the critical frontend crash caused by <TrailingSlashRedirect /> placed
  as a direct child of <Routes> in react-router-dom v7. The component must be
  moved inside a layout route's element prop or wrapped within a <Route>.

goals:
  - Move TrailingSlashRedirect inside AppLayout or a wrapper component
  - Preserve trailing slash redirect functionality
  - Ensure React app renders without ErrorBoundary crash
  - Verify both Vite dev (5173) and built frontend (8000) work

files:
  - path: frontend/src/app/routes.tsx
    targets:
      - type: component
        name: AppRoutes
    semantic_anchors:
      insert_after:
        - type: component
          value: AppLayout
      remove:
        - type: jsx_tag
          value: <TrailingSlashRedirect />
        - context: direct child of <Routes>

  - path: frontend/src/shared/components/Layout/AppLayout.tsx
    targets:
      - type: component
        name: AppLayout
    semantic_anchors:
      insert_before:
        - type: jsx_tag
          value: <AppLayout>
        - context: inside the layout wrapper

changes:
  - action: remove_code
    description: Remove <TrailingSlashRedirect /> from direct children of <Routes> in AppRoutes
    target: frontend/src/app/routes.tsx

  - action: add_code
    description: Add TrailingSlashRedirect inside AppLayout or create AppLayoutWrapper that includes it
    target: frontend/src/shared/components/Layout/AppLayout.tsx
    code_hint: |
      // Option A: Inside AppLayout component, before main layout JSX
      <TrailingSlashRedirect />
      <Box sx={{ ... }}>...</Box>

      // Option B: Create wrapper in routes.tsx
      function AppLayoutWrapper() {
        return (
          <>
            <TrailingSlashRedirect />
            <AppLayout />
          </>
        )
      }

acceptance_criteria:
  - React app renders without "Something went wrong" error
  - No console error about TrailingSlashRedirect not being a <Route> component
  - TrailingSlashRedirect still functions (trailing slashes redirect correctly)
  - Both Vite dev server (5173) and built frontend (8000) render successfully
  - ErrorBoundary does not catch any routing-related crash

risks:
  - Low: TrailingSlashRedirect logic may depend on being at route level; test redirect behavior after move
  - Low: AppLayout may not have access to router context needed by TrailingSlashRedirect

tests_to_run:
  - command: npm run build
    workdir: frontend
    purpose: Verify TypeScript compilation passes
  - command: npm run test
    workdir: frontend
    purpose: Verify existing frontend tests still pass

estimated_effort: small

risk_level: low
