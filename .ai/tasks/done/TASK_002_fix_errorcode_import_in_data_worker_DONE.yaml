id: TASK_002_fix_errorcode_import_in_data_worker

title: Fix ErrorCode import to use explicit source in data_worker.py

status: done

priority: low

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\findings.md
source_section: BE-006

description: >
  Line 33 in `data_worker.py` imports `ErrorCode` from `mkobi.utils.exceptions`,
  but `ErrorCode` is defined in `mkobi.models.enums`. The import works only because
  `exceptions.py` imports `ErrorCode` for its own use, making it available as a
  side-effect. This creates a confusing import structure and mypy reports it as
  "does not explicitly export". Fix by importing directly from the canonical source.

goals:
  - Import ErrorCode from its canonical source (mkobi.models.enums)
  - Remove implicit dependency on re-export through exceptions module
  - Pass ruff and mypy checks

files:
  - path: src/mkobi/workers/data_worker.py
    targets:
      - type: import
        name: ErrorCode
    semantic_anchors:
      insert_after:
        type: import_statement
        value: from mkobi.utils.exceptions import AppException
    changes:
      - action: modify_import
        description: >
          Change `from mkobi.utils.exceptions import AppException, ErrorCode`
          to two separate imports:
          `from mkobi.utils.exceptions import AppException`
          `from mkobi.models.enums import ErrorCode`

acceptance_criteria:
  - ErrorCode imported from mkobi.models.enums (canonical source)
  - AppException still imported from mkobi.utils.exceptions
  - No behavioral change
  - ruff and mypy pass without errors

tests_to_run:
  - pytest tests/ -x -q --tb=short

risk: minimal
effort: trivial
rollback: trivial
