id: TASK_001_M01_mount_client_errors_router

title: Mount client_errors router in create_app()

status: completed

priority: high

type: implementation

finding_id: FINDING-M01
source: audit_validated_findings_001.md

depends_on: []

description: >
  The client_errors router is defined in src/mkobi/api/routes/client_errors.py
  and exported via __init__.py, but is never included in application.include_router()
  calls in create_app(). All POST /api/v1/client-errors requests return HTTP 404,
  completely breaking client-side error observability.

goals:
  - Mount the client_errors router in create_app()
  - Restore client-side error reporting pathway
  - No behavioral change for existing routes

files:
  - path: src/mkobi/app.py
    targets:
      - type: function
        name: create_app
    semantic_anchors:
      insert_after:
        type: function_call
        value: application.include_router
        context: last include_router call in create_app()
    changes:
      - action: add_code
        description: >
          Add application.include_router(routes.client_errors.router, prefix="/api/v1/client-errors", tags=["client-errors"])
          after the last existing include_router call in create_app().

acceptance_criteria:
  - client_errors router is mounted and accessible at /api/v1/client-errors
  - POST /api/v1/client-errors returns HTTP 200 (not 404)
  - All existing routes continue to work
  - No import errors

tests_to_run:
  - docker compose build
  - curl -X POST http://localhost:8000/api/v1/client-errors -H "Content-Type: application/json" -d '{"test": true}'

risk: low
effort: trivial
rollback: Remove the include_router line added

notes: >
  Standalone fix. No dependencies. Trivial 1-line change.
  The client_errors module already exists and exports a router object.
