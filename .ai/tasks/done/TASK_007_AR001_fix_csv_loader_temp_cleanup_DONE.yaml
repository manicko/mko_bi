id: TASK_007_AR001_fix_csv_loader_temp_cleanup

title: Fix TestCSVLoader temp file leaks in 8 test functions

status: pending

priority: low

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\06-tests-validated.md
source_section: AR-001 — TestCSVLoader Temp File Cleanup

description: >
  Eight test functions in `TestCSVLoader` create `tempfile.NamedTemporaryFile(delete=False)`
  but never call `unlink()`. Files accumulate in the OS temp directory on every test run.
  Replace with pytest's `tmp_path` fixture or wrap in try/finally with cleanup.

goals:
  - Eliminate temp file leaks in all 8 affected test functions
  - Use tmp_path fixture or try/finally cleanup pattern
  - No functional test behavior changes

files:
  - path: tests/test_data_csv_loader.py
    targets:
      - type: function
        name: test_load_csv_basic
      - type: function
        name: test_load_csv_with_required_columns
      - type: function
        name: test_load_csv_missing_required_columns
      - type: function
        name: test_load_csv_with_separator
      - type: function
        name: test_load_csv_lazy_threshold_respected
      - type: function
        name: test_validate_file_size_within_limit
      - type: function
        name: test_validate_file_size_exceeds_limit
      - type: function
        name: test_get_file_size_mb
    semantic_anchors:
      insert_after:
        type: function_definition
        value: test_load_csv_basic
    changes:
      - action: modify_code
        description: >
          Replace `tempfile.NamedTemporaryFile(delete=False)` patterns with
          `tmp_path` fixture usage or wrap in try/finally with
          `tmp_path.unlink(missing_ok=True)`.

acceptance_criteria:
  - All 8 test functions use tmp_path or try/finally cleanup
  - No temp files remain after test execution
  - All 8 tests pass
  - No production code is modified

tests_to_run:
  - pytest tests/test_data_csv_loader.py -v -k "test_load_csv_basic or test_load_csv_with_required_columns or test_load_csv_missing_required_columns or test_load_csv_with_separator or test_load_csv_lazy_threshold_respected or test_validate_file_size_within_limit or test_validate_file_size_exceeds_limit or test_get_file_size_mb"
