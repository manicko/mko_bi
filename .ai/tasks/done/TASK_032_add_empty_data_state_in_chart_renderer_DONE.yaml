id: TASK_032_add_empty_data_state_in_chart_renderer

title: Add empty data loading state in ChartRenderer for empty graph data

status: pending

priority: medium

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\02-frontend-validated.md
source_section: FE-003

description: >
  The `ChartRenderer` component at `frontend/src/features/dashboards/ui/charts/ChartRenderer.tsx`
  does not guard against empty `graph.data` arrays. When a chart receives empty data,
  `convertToPlotlyData` processes the empty array without validation, producing charts
  with empty traces. The `TableChart` component (lines 26-28) already handles this case
  with a user-friendly message. Add similar empty state handling to `ChartRenderer`.

goals:
  - Add empty data check in ChartRenderer before rendering Plotly charts
  - Display a user-friendly message when chart data is empty
  - Follow the same pattern as TableChart's empty state handling

files:
  - path: frontend/src/features/dashboards/ui/charts/ChartRenderer.tsx

    targets:
      - type: function
        name: ChartRenderer

    semantic_anchors:
      insert_after:
        type: function_call
        value: convertToPlotlyData

      insert_before:
        type: return_statement

changes:
  - action: add_code

    description: >
      Add an early return in ChartRenderer that checks if `graph.data` is empty
      and renders a user-friendly empty state message instead of passing empty
      data to PlotlyChart. Apply this check after the table chart early return
      but before the line chart and bar/pie chart rendering.

    code_hint: |
      # Add after line 81 (table chart check), before line 84 (line chart check):
      if (graph.data.length === 0) {
          return (
              <div className="flex items-center justify-center h-64 text-gray-500">
                  No data available for this chart
              </div>
          )
      }

acceptance_criteria:
  - ChartRenderer shows "No data available for this chart" for empty data arrays
  - Charts with data render normally
  - Table chart empty state is unaffected
  - Line chart empty state is handled
  - Bar and pie chart empty states are handled
  - TypeScript compilation passes

tests_to_run:
  - cd frontend && npx tsc --noEmit (verify TypeScript compilation)
  - cd frontend && npm test (verify no test regressions)

risk: low
risk_reason: >
  This is a purely additive UI change. Empty data arrays now show a message
  instead of an empty chart. Existing charts with data are unaffected.

rollback: Remove the empty data check and early return.
