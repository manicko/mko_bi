id: TASK_002_03_02_simplify_dev_env

title: Remove Duplicated Hardcoded Passwords from Dev Override

status: pending

priority: critical

depends_on: []

phase: PLAN_03
wave: 1

description: >
  The dev override repeats DATABASE__PASSWORD, MKOBI_APP_PASSWORD, JWT__SECRET_KEY
  with hardcoded fallback values (1234, dev_password, dev-secret-key-for-local-development).
  These defaults should come from .env file only. The override should only set values
  that differ from production defaults (like ENV: development, LOGGING__LEVEL: DEBUG).

finding_ref: DOCKER-002, DOCKER-009
severity: critical

goals:
  - Remove DATABASE__PASSWORD, MKOBI_APP_PASSWORD, JWT__SECRET_KEY from migrate service env
  - Remove DATABASE__USER, DATABASE__PASSWORD, JWT__SECRET_KEY from app service env
  - Remove POSTGRES_PASSWORD, MKOBI_APP_PASSWORD from db service env
  - Keep only dev-specific overrides: ENV, LOGGING__LEVEL, RECREATE_TEST_DB, ADMIN_*
  - All secrets sourced from .env file

files:
  - path: docker-compose.override.yml
    targets:
      - type: service
        name: migrate
      - type: service
        name: app
      - type: service
        name: db
    semantic_anchors:
      insert_after:
        type: block
        value: "services:"
    changes:
      - action: remove_directive
        description: Remove DATABASE__PASSWORD, MKOBI_APP_PASSWORD, JWT__SECRET_KEY from migrate service
      - action: remove_directive
        description: Remove DATABASE__USER, DATABASE__PASSWORD, JWT__SECRET_KEY from app service
      - action: remove_directive
        description: Remove POSTGRES_PASSWORD, MKOBI_APP_PASSWORD from db service
      - action: keep_directive
        description: Keep dev-specific overrides: ENV, LOGGING__LEVEL, RECREATE_TEST_DB, ADMIN_USERNAME, ADMIN_PASSWORD

acceptance_criteria:
  - Dev override only contains values that are truly dev-specific
  - All secrets sourced from .env file
  - docker compose up -d works with the existing .env file
  - No hardcoded passwords in override file

docker_health_checks:
  - name: All containers running
    command: "docker compose ps --format json"
    expected: "All services (db, migrate, app) show 'running' status"
  - name: DB container healthy
    command: "docker compose ps db --format json"
    expected: "db container shows 'healthy' status"
  - name: Migrate service completed successfully
    command: "docker compose ps migrate --format json"
    expected: "migrate service exited with code 0"
  - name: App container running
    command: "docker compose ps app --format json"
    expected: "app container shows 'running' status"
  - name: App health endpoint responds
    command: "curl -sf http://localhost:8000/health"
    expected: "Returns HTTP 200"
  - name: App can connect to database
    command: "docker compose exec app python -c \"from mkobi.config import get_config; c = get_config(); print('DB host:', c.database.host)\""
    expected: "Config loads successfully, DB host is reachable"
  - name: No container restarts
    command: "docker compose ps --format '{{.Name}} {{.Status}}'"
    expected: "No container shows 'restarting' or 'unhealthy' status"
  - name: App logs show clean startup
    command: "docker compose logs app --tail 50"
    expected: "No ERROR or CRITICAL lines; 'Database initialization completed' or similar success message present"

tests_to_run:
  - "docker compose down -v && docker compose up -d"
  - "docker compose logs migrate  # verify migrations ran"
  - "curl -sf http://localhost:8000/health  # verify app is up"
  - "docker compose exec app python -c \"from mkobi.config import get_config; print(get_config().environment)\""

risk_level: medium

rollout_notes: >
  Ensure .env file is present in all dev environments before rollout.
  PLAN_03 Wave 1 Task 2. Related to DOCKER-002 (CRITICAL) and DOCKER-009 (MEDIUM).
