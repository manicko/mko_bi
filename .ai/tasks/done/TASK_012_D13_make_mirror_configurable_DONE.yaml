id: TASK_012_D13_make_mirror_configurable

title: Make Debian Mirror Configurable via ARG in Dockerfile

status: done

priority: low

depends_on: []

phase: DOCKER_HARDENING
wave: 2

description: >
  Dockerfile hardcodes mirror.yandex.ru as the Debian mirror, causing build failures
  or slowdowns for developers outside CIS regions. Make the mirror configurable via
  a Dockerfile ARG with official Debian mirrors as the default.

finding_ref: DOCKER-013
severity: low

goals:
  - Add ARG DEBIAN_MIRROR to Dockerfile with official Debian mirror as default
  - Replace hardcoded mirror.yandex.ru with ${DEBIAN_MIRROR}
  - Build works in all regions without customization

files:
  - path: Dockerfile
    targets:
      - type: directive
        value: "mirror.yandex.ru"
    semantic_anchors:
      insert_before:
        type: stage
        value: "FROM python:3.12-slim AS base"
    changes:
      - action: add_arg
        description: Add ARG for Debian mirror with official default
        code_hint: |
          ARG DEBIAN_MIRROR=deb.debian.org
      - action: replace_value
        description: Replace hardcoded Yandex mirror with ARG variable
        old_value: "mirror.yandex.ru"
        new_value: "${DEBIAN_MIRROR}"

acceptance_criteria:
  - Dockerfile has ARG DEBIAN_MIRROR with official Debian mirror as default
  - All references to mirror.yandex.ru replaced with ${DEBIAN_MIRROR}
  - Build works without specifying --build-arg (uses default)
  - Build works with custom mirror via --build-arg DEBIAN_MIRROR=mirror.yandex.ru

tests_to_run:
  - "docker build . -t mkobi:test  # uses default mirror"
  - "docker build . -t mkobi:test --build-arg DEBIAN_MIRROR=mirror.yandex.ru  # uses custom mirror"

risk_level: low

rollout_notes: >
  Standalone fix. Build portability improvement. No runtime impact.
