    description: >
      Update LayoutRead interface to match the backend LayoutRead model.

    code_hint: |
      # BEFORE (lines 15-21):
      export interface LayoutRead {
        id: string
        name: string
        definition: Record<string, unknown>
        created_at: string
        updated_at: string
