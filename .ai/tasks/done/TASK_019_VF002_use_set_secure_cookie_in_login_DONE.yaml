id: TASK_019_VF002_use_set_secure_cookie_in_login

title: Use set_secure_cookie utility in login endpoint

status: done

priority: medium

depends_on: []

phase: VALIDATED_FINDINGS_001
wave: 1
group: auth_bug_fixes

description: >
  The login endpoint sets the refresh token cookie directly via response.set_cookie()
  with inline security constants, while the logout endpoint correctly uses the
  delete_secure_cookie() utility. The set_secure_cookie() function exists in
  security.py but is not imported in auth.py. This violates DRY and creates
  maintenance risk if cookie security defaults change.

goals:
  - Import set_secure_cookie in auth.py
  - Replace inline response.set_cookie() call with set_secure_cookie() utility
  - Maintain identical functional behavior

files:
  - path: src/mkobi/api/routes/auth.py
    targets:
      - type: function
        name: _handle_login
    semantic_anchors:
      insert_after:
        type: import_block
      replace:
        type: function_call
        value: response.set_cookie
    changes:
      - action: add_import
        description: Add set_secure_cookie to the import from mkobi.core.security
        code_hint: |
          from mkobi.core.security import (
              COOKIE_HTTPONLY,
              COOKIE_NAME,
              COOKIE_SECURE,
              COOKIE_SAMESITE,
              create_access_token,
              create_refresh_token,
              delete_secure_cookie,
              get_config,
              set_secure_cookie,
          )

      - action: replace_code
        description: >
          Replace the inline response.set_cookie() block with a call to set_secure_cookie().
        code_hint: |
          set_secure_cookie(
              response=response,
              key=COOKIE_NAME,
              value=refresh_token,
              max_age=get_config().jwt.refresh_token_expire_minutes * 60,
          )

acceptance_criteria:
  - set_secure_cookie is imported in auth.py
  - Login endpoint uses set_secure_cookie instead of inline response.set_cookie()
  - Cookie attributes (httponly, secure, samesite, max_age) remain identical
  - No change to logout endpoint behavior
  - Existing tests still pass

tests_to_run:
  - tests/test_auth_api.py::TestCookieAuthFlow::test_login_sets_refresh_cookie
  - tests/test_auth.py::TestLogin::test_login_sets_refresh_token_cookie

risk_level: low

notes: >
  Purely a code quality refactoring. The functional behavior is identical since
  the same constants are used. The set_secure_cookie utility was created in
  TASK_030 but the login endpoint was never updated to use it.
