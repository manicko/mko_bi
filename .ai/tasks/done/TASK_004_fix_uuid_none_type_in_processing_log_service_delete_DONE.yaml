id: TASK_004_fix_uuid_none_type_in_processing_log_service_delete

title: Fix UUID|None type mismatch in processing_log_service.py delete()

status: done

priority: high

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\findings.md
source_section: BE-001

description: >
  The `ProcessingLogRead.dashboard_id` field is typed as `UUID | None` (line 76 in
  processing_logs.py), but `IProcessingLogRepository.delete()` expects a non-nullable
  `UUID`. At line 135 in `processing_log_service.py`, `log.dashboard_id` (which could
  be None) is passed to `delete()`. When `dashboard_id` is None, the delete operation
  would fail or behave unexpectedly. Add a null check before calling delete.

goals:
  - Add null check for dashboard_id before calling log_repo.delete()
  - Raise AppException with appropriate ErrorCode when dashboard_id is None
  - Preserve existing behavior for non-null dashboard_id values
  - Pass ruff and mypy checks

files:
  - path: src/mkobi/services/processing_log_service.py
    targets:
      - type: method
        name: delete_processing_log
    semantic_anchors:
      insert_after:
        type: function_call
        value: get_by_id
      insert_before:
        type: function_call
        value: log_repo.delete
    changes:
      - action: add_code
        description: >
          After retrieving the log at line 130-132, add a null check for dashboard_id
          before calling `self.log_repo.delete(log.dashboard_id, db)` at line 135.
          If `log.dashboard_id is None`, raise AppException with ErrorCode.VALIDATION_ERROR
          and detail "Processing log has no associated dashboard — cannot delete by dashboard_id".
          This ensures the UUID|None value never reaches the repository's delete() which
          requires non-nullable UUID.

acceptance_criteria:
  - When dashboard_id is None, AppException is raised instead of passing None to delete()
  - When dashboard_id is not None, existing behavior is preserved
  - Type checker (mypy) passes — no UUID|None passed to non-nullable UUID parameter
  - ruff and mypy pass without errors

tests_to_run:
  - pytest tests/ -x -q --tb=short

risk: low
effort: small
rollback: trivial
