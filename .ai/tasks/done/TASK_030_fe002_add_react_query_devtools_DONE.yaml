id: TASK_030_fe002_add_react_query_devtools

title: Fix FE-002 — Add React Query devtools for development environment

status: completed

priority: low

depends_on: []

description: >
  Fix the LOW issue where React Query devtools are not configured. Add
  @tanstack/react-query-devtools to the development build for debugging query state.

source_file: .ai/audit/99-validation/02-frontend-validated.md
source_section: FE-002: Add React Query Devtools

files:
  - path: frontend/package.json
    targets:
      - type: dependency
        description: devDependencies section
  - path: frontend/src/app/providers.tsx
    targets:
      - type: component
        name: App
    semantic_anchors:
      insert_after:
        type: import
        value: QueryClientProvider

changes:
  - action: add_code
    description: >
      Add `@tanstack/react-query-devtools` to devDependencies in package.json.
      Import and conditionally render ReactQueryDevtools in providers.tsx,
