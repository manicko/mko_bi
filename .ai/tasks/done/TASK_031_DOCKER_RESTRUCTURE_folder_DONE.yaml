id: TASK_031_DOCKER_RESTRUCTURE_folder

title: Restructure — Consolidate Docker Configuration Into Dedicated docker/ Folder

status: pending

priority: medium

depends_on:
  - TASK_029_STC_verify_parallel_execution

phase: DOCKER_RESTRUCTURE
wave: 4

description: >
  Consolidate all Docker-related configuration files into a dedicated docker/
  folder at the project root. Currently, docker-compose files, Dockerfile, and
  .dockerignore are scattered at the root level alongside application code.
  This task moves them into a structured docker/ subdirectory and updates all
  references (docs, scripts, CI configs).

  This task does NOT modify the STC tasks (025-029) — those are already in
  progress and reference the current file locations. This is a separate
  structural improvement that runs after the STC phase is verified.

  Proposed structure:
    docker/
    ├── docker-compose.yml          # (moved from root)
    ├── docker-compose.override.yml # (moved from root)
    ├── docker-compose.test.yml     # (moved from root)
    ├── Dockerfile                  # (moved from root)
    ├── .dockerignore               # (moved from root)
    ├── init-scripts/               # (already exists)
    │   └── 01-create-app-role.sh
    └── nginx/                      # (moved from nginx/)
        └── nginx.conf

goals:
  - All Docker configuration lives under docker/ folder
  - Root directory contains only application code and project metadata
  - All docker compose commands use -f docker/docker-compose.yml
  - All documentation references updated to new paths
  - All script references updated to new paths
  - .ai/mcp/docker-compose.yaml is NOT moved (separate MCP tool concern)
  - Existing functionality unchanged (same compose behavior, same builds)

files:
  - path: docker-compose.yml
    targets:
      - type: file
        name: docker-compose.yml
    semantic_anchors:
      move_to: docker/docker-compose.yml
    changes:
      - action: move_file
        description: Move root docker-compose.yml to docker/docker-compose.yml

  - path: docker-compose.override.yml
    targets:
      - type: file
        name: docker-compose.override.yml
    semantic_anchors:
      move_to: docker/docker-compose.override.yml
    changes:
      - action: move_file
        description: Move root docker-compose.override.yml to docker/docker-compose.override.yml

  - path: docker-compose.test.yml
    targets:
      - type: file
        name: docker-compose.test.yml
    semantic_anchors:
      move_to: docker/docker-compose.test.yml
    changes:
      - action: move_file
        description: Move root docker-compose.test.yml to docker/docker-compose.test.yml

  - path: Dockerfile
    targets:
      - type: file
        name: Dockerfile
    semantic_anchors:
      move_to: docker/Dockerfile
    changes:
      - action: move_file
        description: Move root Dockerfile to docker/Dockerfile
        note: >
          Dockerfile uses relative COPY paths (e.g., COPY frontend/, COPY src/).
          These paths are relative to the build context (root), not the Dockerfile
          location. Docker build -f docker/Dockerfile . still works because the
          build context is the root. No COPY path changes needed.

  - path: .dockerignore
    targets:
      - type: file
        name: .dockerignore
    semantic_anchors:
      move_to: docker/.dockerignore
    changes:
      - action: move_file
        description: Move root .dockerignore to docker/.dockerignore
        note: >
          .dockerignore is used with -f flag. Docker looks for .dockerignore
          in the build context root by default. When using -f docker/Dockerfile,
          the build context is still the root, so .dockerignore must remain in the
          root OR be explicitly referenced. Recommendation: keep .dockerignore at
          root (it's a build context file, not a Docker config file) OR use
          --file docker/.dockerignore if Docker supports it.

  - path: nginx/nginx.conf
    targets:
      - type: file
        name: nginx.conf
    semantic_anchors:
      move_to: docker/nginx/nginx.conf
    changes:
      - action: move_file
        description: Move nginx/nginx.conf to docker/nginx/nginx.conf
        note: >
          Update the volume mount in docker-compose.yml:
          ./nginx/nginx.conf → ./docker/nginx/nginx.conf

  - path: docker-compose.yml
    targets:
      - type: volume_mount
        name: nginx.conf
    semantic_anchors:
      insert_after:
        type: volume
        value: ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    changes:
      - action: update_path
        description: Update nginx volume mount path after nginx/ is moved into docker/
        old_value: "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
        new_value: "./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"

  - path: docs/11-guides/docker.md
    targets:
      - type: documentation
        name: docker.md
    semantic_anchors:
      update_all:
        - type: file_reference
          old: "docker-compose.yml"
          new: "docker/docker-compose.yml"
        - type: file_reference
          old: "docker-compose.override.yml"
          new: "docker/docker-compose.override.yml"
        - type: file_reference
          old: "docker-compose.test.yml"
          new: "docker/docker-compose.test.yml"
        - type: file_reference
          old: "Dockerfile"
          new: "docker/Dockerfile"
        - type: command_reference
          old: "docker compose -f docker-compose.test.yml"
          new: "docker compose -f docker/docker-compose.test.yml"
    changes:
      - action: update_references
        description: Update all file paths and docker compose commands in docker.md

  - path: docs/10-deployment/deployment.md
    targets:
      - type: documentation
        name: deployment.md
    semantic_anchors:
      update_all:
        - type: file_reference
          pattern: "docker-compose"
          prefix: "docker/"
        - type: file_reference
          pattern: "Dockerfile"
          prefix: "docker/"
    changes:
      - action: update_references
        description: Update all Docker file references in deployment.md

  - path: docs/11-guides/run-guide.md
    targets:
      - type: documentation
        name: run-guide.md
    semantic_anchors:
      update_all:
        - type: command_reference
          pattern: "docker compose"
          note: "Add docker/ prefix to -f file references"
    changes:
      - action: update_references
        description: Update all docker compose commands in run-guide.md

  - path: .env.example
    targets:
      - type: file_reference
        name: .env.example
    changes: []  # no changes — .env is build-context-relative, not compose-path-relative

  - path: .gitignore
    targets:
      - type: gitignore
        name: .gitignore
    changes: []  # no changes — .dockerignore at root is still valid for git

acceptance_criteria:
  - docker/docker-compose.yml exists and is valid YAML
  - docker/docker-compose.override.yml exists and is valid YAML
  - docker/docker-compose.test.yml exists and is valid YAML
  - docker/Dockerfile exists and all build targets (dev, test, prod, frontend-builder) build successfully
  - docker/.dockerignore exists
  - docker/nginx/nginx.conf exists
  - docker/init-scripts/01-create-app-role.sh still exists (not moved)
  - No docker-compose files remain at root level
  - No Dockerfile remains at root level
  - .dockerignore handled (either moved or kept at root with justification)
  - nginx/ folder removed from root (now docker/nginx/)
  - docker compose -f docker/docker-compose.yml config validates
  - docker compose -f docker/docker-compose.yml -f docker/docker-compose.override.yml config validates
  - docker compose -f docker/docker-compose.test.yml config validates
  - docker build -f docker/Dockerfile --target test -t mkobi-test . succeeds
  - docker build -f docker/Dockerfile --target prod -t mkobi-prod . succeeds
  - All doc references updated (docker.md, deployment.md, run-guide.md)
  - .ai/mcp/docker-compose.yaml NOT moved (separate concern)
  - .env NOT modified (build context unchanged)

tests_to_run:
  # Validate moved compose files
  - "docker compose -f docker/docker-compose.yml config  # validate production compose"
  - "docker compose -f docker/docker-compose.yml -f docker/docker-compose.override.yml config  # validate dev compose"
  - "docker compose -f docker/docker-compose.test.yml config  # validate test compose"
  # Validate Dockerfile with new path
  - "docker build -f docker/Dockerfile --target test -t mkobi-test .  # test target"
  - "docker build -f docker/Dockerfile --target prod -t mkobi-prod .  # prod target"
  # Verify old paths gone
  - "Test-Path docker-compose.yml  # should be False"
  - "Test-Path Dockerfile  # should be False"
  - "Test-Path nginx/  # should be False"
  # Verify new paths exist
  - "Test-Path docker/docker-compose.yml  # should be True"
  - "Test-Path docker/Dockerfile  # should be True"
  - "Test-Path docker/nginx/nginx.conf  # should be True"
  # Verify MCP compose untouched
  - "Test-Path .ai/mcp/docker-compose.yaml  # should be True"

risk_level: medium

rollout_notes: >
  Medium risk — moves core infrastructure files. Must update all references
  atomically. The Dockerfile COPY paths do NOT need changes because Docker's
  -f flag only changes the Dockerfile location, not the build context. The
  build context remains the project root (.), so COPY src/ ./src/ still works.

  Critical consideration for .dockerignore: Docker automatically looks for
  .dockerignore in the build context root. If moved to docker/.dockerignore,
  it may not be picked up automatically. Two options:
    (a) Keep .dockerignore at root (it's technically a build context file, not config)
    (b) Move it and verify docker build still respects it
  Recommendation: keep .dockerignore at root with a comment explaining why.

  The nginx volume mount in docker-compose.yml must be updated:
  ./nginx/nginx.conf → ./docker/nginx/nginx.conf

  This task should only run after TASK_029 (STC gate) passes, because the STC
  tasks reference the current file locations. Running this during STC development
  would break the in-progress work.

  Backward compatibility: any CI/CD pipelines, Makefiles, or shell scripts
  referencing docker-compose.yml at root will break. These must be identified
  and updated as part of this task.
