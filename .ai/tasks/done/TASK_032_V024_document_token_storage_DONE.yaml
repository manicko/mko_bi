id: TASK_032_V024
title: Document frontend token storage behavior for dev vs production modes
status: pending
priority: low
depends_on: []

description: >
  Development mode uses sessionStorage for tokens. This is dev-only behavior but should
  be documented to avoid confusion.

goals:
  - Add comments in authToken.ts explaining the dev vs prod token storage behavior
  - Document the security implications

files:
  - path: frontend/src/features/auth/model/authToken.ts
    targets:
      - type: constant
        name: USE_MEMORY_STORAGE
    semantic_anchors:
      - type: conditional
        description: "USE_MEMORY_STORAGE = import.meta.env.PROD"
    changes:
      - action: add_comments
        description: "Add comments explaining dev vs prod token storage behavior"
        code_hint: "Add comment: 'In production, tokens are stored in memory only. In development, sessionStorage is used for convenience.'"

acceptance_criteria:
  - Token storage behavior is clearly documented in code
  - No functional changes

tests_to_run:
  - cd frontend && npm run typecheck

risk_level: low
notes: >
  Documentation-only change. No functional impact.
