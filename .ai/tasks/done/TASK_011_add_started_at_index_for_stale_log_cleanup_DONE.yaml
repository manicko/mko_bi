id: TASK_011_add_started_at_index_for_stale_log_cleanup

title: Add index on processing_logs.started_at for stale log cleanup queries

status: pending

priority: medium

depends_on:
  - TASK_010_add_processing_logs_composite_index

source_reference: C:\py_dev\mkobi\.ai\audit\validated\db_findings.md
source_section: DB-002

description: >
  The `cleanup_stale_processing_logs()` function in data_worker.py queries for
  stale logs using `started_at < cutoff`, but the existing composite index is on
  `(status, finished_at)`. This forces an Index Scan with a Filter operation
  instead of a direct Index Scan. Add a composite index on `(status, started_at)`
  for efficient stale log detection.

goals:
  - Add composite index on (status, started_at) to ProcessingLog model
  - Create alembic migration for the new index
  - Improve query performance for stale log cleanup

files:
  - path: src/mkobi/db/models/processing_logs.py

    targets:
      - type: class
        name: ProcessingLog

    semantic_anchors:
      insert_after:
        type: class_attribute
        value: idx_processing_logs_status_finished_at

  - path: alembic/versions/

    targets:
      - type: new_migration
        name: add_processing_logs_started_at_index

    semantic_anchors:
      insert_after:
        type: file
        value: b749bc53b1ee_add_processing_logs_status_index.py

changes:
  - action: add_code

    description: >
      Add a new composite index `idx_processing_logs_status_started_at` on
      `(status, started_at)` to `__table_args__` in the ProcessingLog model.

    code_hint: |
      Index("idx_processing_logs_status_started_at", "status", "started_at"),

  - action: add_migration

    description: >
      Generate an alembic migration to add the new index. Use
      `alembic revision --autogenerate -m "add processing_logs started_at index"`
      after updating the model.

acceptance_criteria:
  - ProcessingLog.__table_args__ contains the new index declaration
  - Alembic migration is generated and applies cleanly
  - Query plan for stale log cleanup shows Index Scan without Filter on started_at
  - ruff and mypy pass without errors

tests_to_run:
  - pytest tests/ -k "processing_log" -v --no-header
  - ruff check src/mkobi/db/models/processing_logs.py
  - mypy src/mkobi/db/models/processing_logs.py

risk: high
risk_reason: >
  Adding a new index requires a database migration. Must be done after DB-001
  to avoid conflicting migration generation. Index addition locks the table
  briefly in PostgreSQL; acceptable for this table size.

rollback: Remove the index from model and generate a downgrade migration.
