description: >
  Complete the logout endpoint implementation by integrating the cookie
  deletion utility function. Ensures the refresh token cookie is properly
  cleared on logout.

finding_ref: PLAN_01_WAVE_3
severity: medium

goals:
  - Logout clears refresh token cookie using delete_cookie utility
  - Returns standardized success response
  - Validates current user authentication

files:
  - path: src/mkobi/api/routes/auth.py
    targets:
      - type: function
        name: logout_endpoint
    semantic_anchors:
      modify:
        type: function_definition
        value: logout
    changes:
      - action: modify_function
        description: Use delete_cookie utility in logout endpoint
        code_hint: |
          @router.post("/logout", response_model=SuccessResponse)
          async def logout(
              current_user: Annotated[UserInDB, Depends(get_current_user)],
              response: Response,
          ) -> SuccessResponse:
              """Logout current user by clearing refresh token cookie."""
              logger.info("User %s logging out", current_user.email)
              delete_cookie(response, COOKIE_NAME)
              return SuccessResponse(message="Logged out successfully")

