id: TASK_031_finding_015_nginx_service_organization

title: Add documentation comment for nginx service requiring frontend build

type: implementation

status: done

priority: low

depends_on:
  - TASK_030_verify_finding_012_dev_override_templating

description: >
  docker/docker-compose.yml defines the nginx service in the base file behind a profiles
  gate. The nginx.conf mounts ../frontend/dist which is only available after a frontend build.
  While the current approach works, it needs a documentation comment.

goals:
  - Add comment documenting nginx requires prior frontend build
  - Clarify nginx is production-only (profiles: [production])

files:
  - path: docker/docker-compose.yml
    targets:
      - type: compose_service
        name: nginx
    semantic_anchors:
      insert_before:
        type: compose_key
        value: nginx
    changes:
      - action: add_comment
        description: Add documentation comment above nginx service
        code_hint: |
          # NOTE: nginx requires a prior frontend build (npm run build in /frontend)
          # Frontend dist files are mounted from ../frontend/dist
          # This service is production-only (profiles: [production])

acceptance_criteria:
  - Comment added above nginx service definition
  - Comment documents frontend build requirement
  - Comment documents production-only profile

tests_to_run:
  - docker compose -f docker/docker-compose.yml --env-file .env config

risk_level: low

rollout_notes: >
  Documentation-only change. For future consideration: move nginx to a separate
  docker-compose.prod.yml for cleaner separation (would require updating deployment scripts).
