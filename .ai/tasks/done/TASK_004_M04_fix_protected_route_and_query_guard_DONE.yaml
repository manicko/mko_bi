id: TASK_004_M04_fix_protected_route_and_query_guard

title: Fix ProtectedRoute loading state and add query enabled guard

status: pending

priority: high

type: implementation

finding_id: FINDING-M04
source: audit_validated_findings_001.md

depends_on: []

description: >
  ProtectedRoute renders children during isLoading=true, allowing DashboardList to
  mount and fire useMyDashboards() before auth initialization completes. The
  unauthenticated API call returns 401, the axios interceptor attempts refresh
  (fails), and window.location.href='/login' conflicts with React Router, creating
  an infinite loading spinner. Additionally, useMyDashboards and related queries
  have no enabled: !!accessToken guard.

goals:
  - Add enabled: !!accessToken guard to useMyDashboards and related data queries
  - Fix ProtectedRoute to show loading state instead of rendering children during auth check
  - Prevent unauthenticated TanStack Query calls

files:
  - path: frontend/src/features/dashboards/api/dashboardApi.ts
    targets:
      - type: hook
        name: useMyDashboards
      - type: hook
        name: useDashboard
      - type: hook
        name: useAggregatedData
    semantic_anchors:
      insert_after:
        type: function_call
        value: useQuery
    changes:
      - action: modify_code
        description: >
          Add enabled: !!accessToken option to useQuery calls in useMyDashboards,
          useDashboard, and useAggregatedData hooks.

  - path: frontend/src/shared/components/ProtectedRoute.tsx
    targets:
      - type: component
        name: ProtectedRoute
    semantic_anchors:
      insert_after:
        type: jsx_tag
        value: {children}
    changes:
      - action: modify_code
        description: >
          When isLoading is true, render a loading spinner/null instead of {children}.
          Only render children when isLoading is false and user is authenticated.

acceptance_criteria:
  - ProtectedRoute shows loading state during auth check (no children rendered)
  - useMyDashboards does not fire when accessToken is null
  - No infinite loading spinner on /dashboards
  - Authenticated users can access dashboards normally
  - No TypeScript compilation errors

tests_to_run:
  - cd frontend && npm run build
  - cd frontend && npm run lint

risk: low
effort: small
rollback: Remove enabled guards and revert ProtectedRoute to render children during loading

notes: >
  Standalone frontend change. Should be deployed with M02 and M03 for complete fix.
  The enabled: !!accessToken fix is the most critical part.
