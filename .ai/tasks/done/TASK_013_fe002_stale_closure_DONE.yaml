---
id: TASK_013_fe002_stale_closure
title: FE-002 — Fix stale closure in UploadModal polling effect
status: pending
priority: low
type: implementation
depends_on:
  - TASK_003_fe001_circular_import

source_reference: .ai/audit/99-validation/02-frontend-validated.md
source_section: FE-002 — Stale Closure Risk in UploadModal Status Polling

description: >
  The useEffect in UploadModal uses queueMicrotask() to defer state updates
  and references onUploadComplete inside the microtask without including it
  in the dependency array. This creates a stale closure risk where the parent
  component could pass a new onUploadComplete reference that the effect
  won't see. Remove queueMicrotask and fix the dependency array.

goals:
  - Remove queueMicrotask wrapper from the polling useEffect
  - Include onUploadComplete in the dependency array or use useRef for stable reference
  - Ensure polling still works correctly after the fix

files:
  - path: frontend/src/features/upload/ui/UploadModal.tsx
    targets:
      - type: component
        name: UploadModal
    semantic_anchors:
      insert_after:
        type: useEffect_definition
        value: polling useEffect (lines 50-76)
    changes:
      - action: modify_code
        description: >
          Remove the queueMicrotask wrapper from the useEffect at lines 50-76.
          Move the setFileStates and setProcessingFinished calls to execute
          directly in the effect callback. Either add onUploadComplete to
          the dependency array (with useCallback in the parent) or use
          a useRef to hold a stable reference to the callback.

risks:
  - Very low risk: isolated to UploadModal component
  - Must ensure polling still works correctly
  - Must ensure onUploadComplete is called when processing finishes

acceptance_criteria:
  - UploadModal polling works correctly after file upload
  - onUploadComplete callback is invoked after processing finishes
  - No stale closure warnings from ESLint react-hooks/exhaustive-deps

tests_to_run:
  - cd frontend && npm run build
  - cd frontend && npm run lint
