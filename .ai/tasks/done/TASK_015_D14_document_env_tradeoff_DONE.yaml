id: TASK_015_D14_document_env_tradeoff

title: Document .env Weak Credentials as Known Trade-off

status: done

priority: low

depends_on: []

phase: DOCKER_HARDENING
wave: 2

description: >
  .env file contains weak credentials (1234, dev-secret-key-for-local-development).
  While .env is in .gitignore and .dockerignore, it's still visible in the working tree.
  Add a .env.example with placeholder values and document this as a known trade-off
  for local development.

finding_ref: DOCKER-014
severity: low

goals:
  - Add .env.example with placeholder values (no real credentials)
  - Document the trade-off: weak credentials are acceptable for local dev
  - Ensure .gitignore and .dockerignore entries for .env are present

files:
  - path: .env.example
    targets:
      - type: file
        name: .env.example (new)
    semantic_anchors:
      insert_after:
        type: file
        value: .env
    changes:
      - action: create_file
        description: Create .env.example with placeholder values
        code_hint: |
          # Copy this file to .env and fill in your values
          DATABASE__PASSWORD=change_me_in_production
          JWT__SECRET_KEY=change_me_use_openssl_rand_hex_32
          MKOBI_APP_PASSWORD=change_me
          ADMIN_USERNAME=admin@example.com
          ADMIN_PASSWORD=change_me

acceptance_criteria:
  - .env.example exists with placeholder values (no real credentials)
  - .env is in .gitignore
  - .env is in .dockerignore
  - New developers can copy .env.example to .env and get started

tests_to_run:
  - "Verify .env is NOT in git: git check-ignore .env"
  - "Verify .env.example IS in git: git ls-files .env.example"

risk_level: low

rollout_notes: >
  Documentation/setup improvement. Known trade-off for local development.
  The .gitignore and .dockerignore entries provide protection against accidental commits.
