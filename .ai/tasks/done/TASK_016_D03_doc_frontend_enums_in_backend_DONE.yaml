id: TASK_016_D03_doc_frontend_enums_in_backend

title: Document rationale for frontend enums in backend models

status: pending

priority: low

type: doc-update

finding_id: FINDING-D03
source: audit_validated_findings_001.md

depends_on:
  - TASK_006_verify_mandatory_fixes

description: >
  src/mkobi/models/enums.py contains ButtonVariant and ComponentSize which are
  frontend-only UI concepts. Their presence in backend models is partially justified
  (used for layout config validation) but should be documented.

goals:
  - Document why ButtonVariant and ComponentSize exist in backend models
  - Clarify their role in layout config validation
  - Note the architectural consideration (frontend concepts leaking to backend)

files:
  - path: docs/SPEC.md
    targets:
      - type: section
        context: Data models / enums section
    semantic_anchors:
      insert_after:
        type: heading
        context: Enums or Data Models section
    changes:
      - action: add_note
        description: >
          Add a note explaining that ButtonVariant and ComponentSize enums exist
          in the backend to support server-side validation of dashboard layout
          configurations stored in JSONB. These are UI concepts that leak into
          the backend for validation purposes only.

acceptance_criteria:
  - SPEC.md documents the rationale for frontend enums in backend models
  - Developers understand why these enums are in the backend package

tests_to_run:
  - Review the documentation for clarity

risk: none
effort: trivial
rollback: Remove the added documentation note

notes: >
  Doc-only change. Minor architectural concern.
  The enums are used by the backend for validation of layout configs.
