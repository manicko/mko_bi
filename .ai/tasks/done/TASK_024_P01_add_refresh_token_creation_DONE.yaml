id: TASK_024_P01_add_refresh_token_creation

title: Add refresh token creation function

status: pending

priority: high

depends_on:
  - TASK_022_P01_update_jwt_config

phase: PLAN_01
wave: 1

description: >
  Create a new function in security.py to generate refresh tokens with longer
  expiration (7 days). This function will be used by the login endpoint to
  set the httpOnly refresh token cookie.

finding_ref: PLAN_01_WAVE_1
severity: medium

goals:
  - Add create_refresh_token function to core/security.py
  - Function uses refresh_token_expire_minutes from config
  - Include proper logging

files:
  - path: src/mkobi/core/security.py
    targets:
      - type: function
        name: create_access_token
    semantic_anchors:
      insert_after:
        type: function_definition
        value: create_access_token
    changes:
      - action: add_function
        description: Add create_refresh_token function after create_access_token
        code_hint: |
          def create_refresh_token(data: dict[str, Any]) -> str:
              """Create a refresh token with extended expiration."""
              config = get_config()
              to_encode = data.copy()
              expire = datetime.utcnow() + timedelta(
                  minutes=config.jwt.refresh_token_expire_minutes
              )
              to_encode.update({"exp": expire})
              return jwt.encode(
                  to_encode,
                  config.jwt.secret_key.get_secret_value(),
                  algorithm=config.jwt.algorithm,
              )

acceptance_criteria:
  - Function creates valid JWT tokens with refresh token expiration
  - Uses config.jwt.refresh_token_expire_minutes
  - Function is properly documented with docstring
  - Function is exported and importable

tests_to_run:
  - "pytest tests/ -k test_security -v"
  - "python -c \"from mkobi.core.security import create_refresh_token; print('import OK')\""

risk_level: low

rollout_notes: >
  Depends on TASK_022 for refresh_token_expire_minutes config field.
  Follows the same pattern as create_access_token.
