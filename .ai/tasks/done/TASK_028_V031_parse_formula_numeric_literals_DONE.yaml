id: TASK_028_V031_parse_formula_numeric_literals

title: Document or enhance _parse_formula to handle numeric literals

status: pending

priority: low

depends_on: []

description: >
  _parse_formula treats all tokens as column references via pl.col(). Numeric
  literals like "revenue * 100" will look for a column named "100". This task
  either documents this limitation clearly or enhances the parser to distinguish
  numeric literals from column names.

finding_ref: V-031
severity: LOW

goals:
  - Document the numeric literal limitation in API docs, OR
  - Enhance _parse_formula to distinguish numeric literals from column names
  - Prevent user confusion with formula syntax

files:
  - path: src/mkobi/data/processing/transformations.py
    targets:
      - type: function
        name: _parse_formula
    semantic_anchors:
      add: numeric literal detection before pl.col() call

changes:
  - action: enhance_or_document
    description: >
      Either enhance the parser to handle numeric literals or add clear
      documentation about the limitation.
    code_hint: |
      def _parse_formula(formula: str) -> pl.Expr:
          tokens = formula.split()
          expr = None
          for token in tokens:
              if token.replace(".", "").replace("-", "").isdigit():
                  expr = pl.lit(float(token))
              else:
                  expr = pl.col(token)
              # ... combine with operators

acceptance_criteria:
  - Numeric literals either handled correctly or clearly documented
  - Users understand formula syntax limitations
  - No regression in existing formula parsing

tests_to_run:
  - pytest tests/ -k "formula or transformation" -v

risk_level: low

rollout_notes: >
  Documentation is safe. Parser enhancement is moderate complexity. No dependencies.
