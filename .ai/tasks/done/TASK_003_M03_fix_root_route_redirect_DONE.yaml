id: TASK_003_M03_fix_root_route_redirect

title: Change root route redirect from /dashboards to /login

status: pending

priority: high

type: implementation

finding_id: FINDING-M03
source: audit_validated_findings_001.md

depends_on: []

description: >
  The root route (/) redirects unauthenticated users to /dashboards instead of /login.
  This triggers ProtectedRoute → auth check → race condition between useAuth hook,
  TanStack Query auto-fetching, and the 401 axios interceptor, causing an infinite
  loading spinner or ErrorBoundary page.

goals:
  - Change root route to redirect to /login instead of /dashboards
  - Unauthenticated users see the login page when accessing /
  - No change for authenticated users (they get redirected after login)

files:
  - path: frontend/src/app/routes.tsx
    targets:
      - type: component
        name: AppRoutes
    semantic_anchors:
      insert_after:
        type: jsx_tag
        value: <Route path="/"
    changes:
      - action: modify_code
        description: >
          Change <Route path="/" element={<Navigate to="/dashboards" replace />} />
          to <Route path="/" element={<Navigate to="/login" replace />} />.

acceptance_criteria:
  - Root path / redirects to /login for unauthenticated users
  - Login page renders correctly at /
  - Existing authenticated flow is unchanged
  - No TypeScript compilation errors

tests_to_run:
  - cd frontend && npm run build
  - cd frontend && npm run lint

risk: low
effort: trivial
rollback: Change to="/login" back to to="/dashboards"

notes: >
  Standalone frontend change. No backend dependency.
  Should be deployed with M02 and M04 for complete auth flow fix.
