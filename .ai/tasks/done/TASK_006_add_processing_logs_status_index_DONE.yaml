id: TASK_006_add_processing_logs_status_index

title: MEDIUM — Add missing index on processing_logs.status

status: complete

priority: medium

depends_on:
  - TASK_002_fix_test_seeder_race_condition

source_file: .ai/audit/validated/final-report.md
source_finding: DB-002

description: >
  The processing_logs.status column is used in WHERE clauses for cleanup queries
  (finding stale/old processing logs) but has no index. As the table grows, these
  queries perform sequential scans, degrading cleanup performance. Add a B-tree index
  on processing_logs.status to support efficient filtering by status.

goals:
  - Create a migration adding an index on processing_logs.status
  - Index should be named following project conventions (idx_<table>_<column>)
  - Verify the index is used by EXPLAIN on cleanup queries

files:
  - path: src/mkobi/db/migrations/
    targets:
      - type: migration
        name: new migration
    semantic_anchors:
      insert_after:
        type: latest_migration
    changes:
      - action: create_file
        description: >
          Create a new Alembic migration that adds an index on processing_logs.status.
        code_hint: |
          op.create_index(
              "idx_processing_logs_status",
              "processing_logs",
              ["status"],
          )

acceptance_criteria:
  - Migration applies cleanly with `alembic upgrade head`
  - Index exists in database after migration
  - EXPLAIN shows index usage for status-filtered queries on processing_logs
  - Downgrade removes the index cleanly

tests_to_run:
  - cd src/mkobi && python -m alembic upgrade head
  - cd src/mkobi && python -m alembic downgrade -1
  - cd src/mkobi && python -m alembic upgrade head

risk: low
risk_notes: >
  Low risk — adding an index is non-destructive. Does not affect existing data
  or queries. The index only improves performance for status-based filtering.

type: migration
category: database
severity: medium
