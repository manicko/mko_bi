id: TASK_030_P01_add_cookie_utilities

title: Create cookie response utility functions

status: pending

priority: medium

depends_on:
  - TASK_025_P01_configure_cookie_security

phase: PLAN_01
wave: 2

description: >
  Add helper functions for creating secure cookie responses in core/security.py.
  These utilities ensure consistent cookie creation and deletion across all
  auth endpoints.

finding_ref: PLAN_01_WAVE_2
severity: medium

goals:
  - Add set_secure_cookie helper function
  - Add delete_secure_cookie helper function
  - Functions use security constants
  - Consistent cookie creation throughout codebase

files:
  - path: src/mkobi/core/security.py
    targets:
      - type: module_level
        name: cookie_utilities
    semantic_anchors:
      insert_after:
        type: function_definition
        value: validate_refresh_token
    changes:
      - action: add_functions
        description: Add cookie utility functions
        code_hint: |
          def set_cookie(
              response: Response,
              key: str,
              value: str,
              max_age: int | None = None,
          ) -> None:
              """Set a secure cookie on the response."""
              response.set_cookie(
                  key=key,
                  value=value,
                  httponly=COOKIE_HTTPONLY,
                  secure=COOKIE_SECURE,
                  samesite=COOKIE_SAMESITE,
                  max_age=max_age,
              )

          def delete_cookie(response: Response, key: str) -> None:
              """Delete a cookie from the response."""
              response.delete_cookie(
                  key=key,
                  httponly=COOKIE_HTTPONLY,
                  secure=COOKIE_SECURE,
                  samesite=COOKIE_SAMESITE,
              )

acceptance_criteria:
  - Functions use httponly, secure, samesite attributes
  - Functions are properly documented
  - Functions are importable and usable in routes

tests_to_run:
  - "python -c \"from mkobi.core.security import set_cookie, delete_cookie; print('import OK')\""

risk_level: low

rollout_notes: >
  Pure additive utility functions. Will be used by Wave 3 tasks
  to complete logout implementation.
