id: TASK_004_verify_finding_001_jwt_secret_enforcement

title: Verify — JWT__SECRET_KEY enforcement in docker-compose.yml

type: verification

status: verified

depends_on:
  - TASK_003_finding_001_jwt_secret_enforcement

verifies: TASK_003_finding_001_jwt_secret_enforcement

verification_steps:
  - build: JWT__SECRET_KEY=test-secret-key docker compose -f docker/docker-compose.yml --env-file .env config
  - test: echo "Verify enforcement: unset JWT__SECRET_KEY and run config — should fail"
  - smoke_check: JWT__SECRET_KEY=test docker compose -f docker/docker-compose.yml --env-file .env config >nul 2>&1 && echo "PASS: config valid with secret" || echo "FAIL"

pass_criteria:
  - docker compose config succeeds when JWT__SECRET_KEY is provided
  - docker compose config fails with error when JWT__SECRET_KEY is not set
  - All three services (app, migrate, rq-worker) use the enforced variable

failure_action: return TASK_003_finding_001_jwt_secret_enforcement to rework
