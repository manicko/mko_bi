id: TASK_001_01_admin_user_creation

title: Admin User Auto-Creation on Application Startup

status: pending

priority: high

depends_on: []

wave: 1

description: >
  Add admin user auto-creation on application startup via ensure_admin_user()
  in DatabaseStarter.startup(). Admin credentials are configurable via
  ADMIN_USERNAME and ADMIN_PASSWORD env vars with safe defaults. Creation
  is idempotent — safe to run multiple times.

goals:
  - Add admin_username and admin_password fields to Settings
  - Add ensure_admin_user() method to DatabaseStarter
  - Call ensure_admin_user() during startup after migrations
  - Ensure idempotency and IntegrityError handling

files:
  - path: src/mkobi/config.py
    targets:
      - type: class
        name: Settings
    semantic_anchors:
      insert_after:
        type: field_definition
        value: cors_origins
    changes:
      - action: add_field
        description: Add admin_username and admin_password fields to Settings class
        fields:
          - name: admin_username
            type: str
            default: '"admin"'
            env_var: ADMIN_USERNAME
          - name: admin_password
            type: str
            default: '"admin"'
            env_var: ADMIN_PASSWORD

  - path: src/mkobi/db/starter.py
    targets:
      - type: class
        name: DatabaseStarter
    semantic_anchors:
      insert_after:
        type: method
        value: startup
        sub_anchor: _apply_migrations call
      insert_before:
        type: conditional
        value: "if self._config.env == EnvironmentEnum.TEST"
    changes:
      - action: add_method
        description: Add ensure_admin_user() method to DatabaseStarter class
        method:
          name: ensure_admin_user
          signature: "async def ensure_admin_user(self) -> None"
          logic: |
            Get admin_username and admin_password from get_config().
            Create UserRepository instance.
            Open a new session from self._main_engine.
            Check if user exists by email — if yes, log and return (idempotent).
            If not exists: create user with UserRole.ADMIN.
            Commit session.
            Handle IntegrityError with try/except — log warning, return.
            Use session.begin_nested() (SAVEPOINT) for safety.
      - action: add_call
        description: Call ensure_admin_user() in startup() after migrations
        insert_after:
          type: function_call
          value: _apply_migrations

acceptance_criteria:
  - ensure_admin_user() is idempotent — calling twice creates only one admin
  - Admin user has role "admin"
  - Admin password is properly bcrypt-hashed
  - IntegrityError is caught and logged without crashing
  - Works with env vars ADMIN_USERNAME and ADMIN_PASSWORD
  - Existing tests pass

tests_to_run:
  - "pytest tests/ -x -v"

risk_level: low

autonomous: true
