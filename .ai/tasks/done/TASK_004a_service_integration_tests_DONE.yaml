id: TASK_004a_service_integration_tests

title: Write integration tests for all 8 service classes with real db session

status: pending

priority: high

depends_on: []

description: >
  The existing service tests (test_auth_service.py, test_data_service.py, test_graph_service.py)
  are overmocked — they use AsyncMock for repositories and call service methods without passing
  a `db` parameter. This means the `db=None` fallback path is tested but the real `db` path is not.
  Additionally, 4 services (FilterService, LayoutService, ProcessingConfigService, ProcessingLogService)
  have zero service-level tests.

  This task creates a new test file `tests/test_services_integration.py` that tests all 8 service
  classes using the real `async_db_session` fixture (already defined in conftest.py) and real
  repositories (not mocked). These tests will:
    - Pass `db=async_db_session` explicitly to every service method call
    - Verify service methods work correctly with a real database session
    - Cover the happy path and key error paths for each service
    - Remain valid after TASK_005 removes the `db=None` fallback (since they always pass `db`)

  This task must complete before TASK_005 (remove db=None fallback) can be safely executed.

goals:
  - Create tests/test_services_integration.py with integration tests for all 8 services
  - Every service method call passes db=async_db_session explicitly
  - Tests cover AuthService (register_user, login_user, get_user_by_id, get_user_by_email)
  - Tests cover DashboardService (create_dashboard, get_dashboard, list_dashboards, update_dashboard, delete_dashboard)
  - Tests cover GraphService (create, get, update, delete, list_by_dashboard)
  - Tests cover DataService (process_upload, get_aggregated_data, get_processing_status)
  - Tests cover FilterService (create, get, update, delete, list)
  - Tests cover LayoutService (create, get, update, delete, list)
  - Tests cover ProcessingConfigService (create, get, update, delete, get_by_dashboard)
  - Tests cover ProcessingLogService (create, get, update_status, get_by_dashboard)
  - All tests pass with pytest tests/test_services_integration.py -x -v

files:
  - path: tests/test_services_integration.py
    targets:
      - type: module
        name: test_services_integration
    semantic_anchors:
      insert_after:
        type: existing_file
        value: tests/conftest.py

changes:
  - action: create_file
    description: Create integration test file for all 8 services with real db session
    file: tests/test_services_integration.py
    notes: |
      Use the existing conftest.py fixtures:
        - async_db_session: provides a real AsyncSession with SAVEPOINT rollback
        - test_user: creates a test user with admin role
        - auth_headers: provides JWT authorization headers
      
      Pattern for each test:
        1. Create real repository instances (e.g., UserRepository())
        2. Create service instance with real repositories
        3. Call service method with db=async_db_session
        4. Assert results
        5. Session rollback happens automatically via fixture
      
      For AuthService tests:
        - test_register_user_with_db: create user, verify in DB
        - test_login_user_with_db: register then login
        - test_get_user_by_id_with_db: create then retrieve by ID
        - test_get_user_by_email_with_db: create then retrieve by email
        - test_register_user_invalid_email_raises: verify ValueError
        - test_register_user_duplicate_email_raises: verify ValueError
      
      For DashboardService tests:
        - test_create_dashboard_with_db: create, verify returned data
        - test_get_dashboard_with_db: create then retrieve
        - test_list_dashboards_with_db: create multiple, verify list
        - test_update_dashboard_with_db: create then update name
        - test_delete_dashboard_with_db: create then delete, verify gone
      
      For GraphService tests:
        - test_create_graph_with_db: create with dashboard_id
        - test_get_graph_with_db: create then retrieve
        - test_update_graph_with_db: create then update
        - test_delete_graph_with_db: create then delete
        - test_list_by_dashboard_with_db: create multiple, list
      
      For DataService tests:
        - test_process_upload_with_db: upload CSV, verify log created
        - test_get_aggregated_data_with_db: verify empty and populated
        - test_get_processing_status_with_db: create log, check status
      
      For FilterService tests:
        - test_create_filter_with_db: create, verify
        - test_get_filter_with_db: create then retrieve
        - test_update_filter_with_db: create then update
        - test_delete_filter_with_db: create then delete
      
      For LayoutService tests:
        - test_create_layout_with_db: create, verify
        - test_get_layout_with_db: create then retrieve
        - test_update_layout_with_db: create then update
        - test_delete_layout_with_db: create then delete
      
      For ProcessingConfigService tests:
        - test_create_config_with_db: create, verify
        - test_get_config_with_db: create then retrieve
        - test_update_config_with_db: create then update
        - test_delete_config_with_db: create then delete
      
      For ProcessingLogService tests:
        - test_create_log_with_db: create, verify
        - test_get_log_with_db: create then retrieve
        - test_update_log_status_with_db: create then update status

acceptance_criteria:
  - tests/test_services_integration.py exists and is syntactically valid
  - All tests pass: pytest tests/test_services_integration.py -x -v
  - Every service method call passes db=async_db_session explicitly (no db=None calls)
  - Tests cover all 8 service classes
  - Tests use real repositories, not AsyncMock
  - No test depends on the db=None fallback pattern

tests_to_run:
  - pytest tests/test_services_integration.py -x -v

risk_level: medium

rollout_notes: |
  This task is independent and can run in parallel with other Wave 1 tasks.
  The conftest.py already provides all needed fixtures (async_db_session, test_user, auth_headers).
  The async_db_session fixture uses SAVEPOINT rollback, so tests are isolated.
  If the test database is not available, tests will fail gracefully — this is expected
  and acceptable for CI environments without PostgreSQL.

validated_finding_refs:
  - VF-001
