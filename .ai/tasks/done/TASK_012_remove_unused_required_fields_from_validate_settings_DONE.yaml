id: TASK_012_remove_unused_required_fields_from_validate_settings

title: Remove unused required fields from _validate_settings in ProcessingConfigService

status: pending

priority: high

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\07-data-processing-validated.md
source_section: DP-001

description: >
  The `_validate_settings` method in ProcessingConfigService validates `loader`,
  `date_column`, and `timezone` as required fields, but these fields are never
  used in the actual data processing pipeline (data_worker.py). The fields are
  documented in SPEC.md but the implementation never consumes them. Remove them
  from required fields to prevent validation errors for valid configs.

goals:
  - Remove `loader`, `date_column`, `timezone` from required fields in _validate_settings
  - Keep validation for fields actually used in processing
  - Update seed data if needed to match new validation rules

files:
  - path: src/mkobi/services/processing_config_service.py

    targets:
      - type: class
        name: ProcessingConfigService

      - type: method
        name: _validate_settings

    semantic_anchors:
      insert_after:
        type: function_call
        value: required_fields

changes:
  - action: modify_code

    description: >
      Remove `loader`, `date_column`, and `timezone` from the required fields
      list in `_validate_settings`. These fields are documented but never read
      by the data processing pipeline.

    code_hint: |
      # Before:
      required_fields = ["loader", "date_column", "timezone", "separator", ...]
      # After:
      required_fields = ["separator", "encoding", "column_types", "decimal_separator",
                          "date_format", "renames", "computed_fields"]

acceptance_criteria:
  - _validate_settings does not require `loader`, `date_column`, or `timezone`
  - Existing valid configs without these fields pass validation
  - Seed data in test_media_dash.py does not break
  - ruff and mypy pass without errors

tests_to_run:
  - pytest tests/ -k "processing_config" -v --no-header
  - ruff check src/mkobi/services/processing_config_service.py
  - mypy src/mkobi/services/processing_config_service.py

risk: low
risk_reason: >
  Removing validation constraints is a relaxing change. The fields were never
  used, so no functional behavior changes. Risk is limited to ensuring no
  downstream code expects these fields to be present.

rollback: Restore the three fields to the required_fields list.
