id: TASK_031_fe003_add_error_boundary

title: Fix FE-003 — Add ErrorBoundary component to catch render errors

status: pending

priority: medium

depends_on: []

description: >
  Fix the MEDIUM issue where no ErrorBoundary exists in the React tree. Uncaught render
  errors crash the entire UI. Add a class-based ErrorBoundary component and wrap the
  main App component.

source_file: .ai/audit/99-validation/02-frontend-validated.md
source_section: FE-003: Add ErrorBoundary

files:
  - path: frontend/src/shared/components/ErrorBoundary.tsx
    targets:
      - type: component
        name: ErrorBoundary
  - path: frontend/src/app/providers.tsx
    targets:
      - type: component
        name: App

changes:
  - action: add_code
    description: >
      Create ErrorBoundary.tsx as a class component with componentDidCatch and
      getDerivedStateFromProps. Display a user-friendly error message with a
      "Reload page" button. Log the error to console.error.
    - action: add_code
    description: Wrap the App component's children in providers.tsx with ErrorBoundary.

acceptance_criteria:
  - ErrorBoundary.tsx exists as a class component
  - Wraps App component in providers.tsx
  - Displays user-friendly error message on render errors
  - Includes "Reload page" button
  - Logs error details to console.error

risk_notes: >
  Low risk — standard React ErrorBoundary pattern. No impact on normal rendering.

tests_to_run:
  - command: cd frontend && npm run build
    reason: Verify build succeeds with ErrorBoundary
