id: TASK_023_FIX_test_db_dev

title: Fix Test Database Creation in Docker Dev Mode

status: pending

priority: critical

depends_on: []  # independent fix, no deps on other pending tasks

phase: DOCKER_HARDENING
wave: 3

description: >
  GATE_01 and GATE_02 both FAILED because test database creation does not work
  in Docker dev mode. The docker-compose.override.yml sets RECREATE_TEST_DB=true,
  but the mkobi_app PostgreSQL role lacks CREATEDB privilege, and after test DB
  creation, mkobi_app has no schema privileges on bidb_test. This task fixes the
  Docker initialization and/or code so that test database creation works correctly
  in the Docker development environment.

  Root causes identified by gate verification:
  1. Init script (01-create-app-role.sh) only grants privileges on `bidb`,
     not on `bidb_test`.
  2. mkobi_app role lacks CREATEDB privilege needed for CREATE DATABASE.
  3. After bidb_test is created, _apply_migrations(test_url) runs with mkobi_app
     credentials which have no USAGE/CREATE on bidb_test schema.
  4. The admin credentials (DATABASE__ADMIN_USER/PASSWORD) may not be properly
     available in the dev override app service environment.

finding_ref: GATE-01-HIGH-001, GATE-02-HIGH-001
severity: critical

goals:
  - mkobi_app role can create and use bidb_test in Docker dev mode
  - Test database is created and migrated successfully on dev startup
  - RECREATE_TEST_DB=true in docker-compose.override.yml works as intended
  - No permission errors in app startup logs related to test DB
  - GATE_01 and GATE_02 test DB checks pass after this fix

files:
  - path: docker/init-scripts/01-create-app-role.sh
    targets:
      - type: script
        name: 01-create-app-role.sh
    semantic_anchors:
      insert_after:
        type: command
        value: "GRANT USAGE ON SCHEMA public TO mkobi_app;"
    changes:
      - action: add_grants
        description: >
          Grant CREATEDB privilege to mkobi_app so it can create bidb_test.
          Also add default privileges for future databases.
        code_hint: |
          -- Grant CREATEDB for test database recreation
          ALTER ROLE mkobi_app CREATEDB;

  - path: src/mkobi/db/starter.py
    targets:
      - type: method
        name: DatabaseStarter.recreate_test_database
    semantic_anchors:
      insert_after:
        type: sql_statement
        value: "CREATE DATABASE {db_name}"
    changes:
      - action: add_grant_statements
        description: >
          After CREATE DATABASE, grant mkobi_app CONNECT, USAGE, and table
          privileges on the newly created test database. This ensures
          _apply_migrations(test_url) can run with mkobi_app credentials.
        code_hint: |
          # Grant mkobi_app privileges on the new test database
          async with admin_engine.connect() as conn:
              await conn.execute(text(f"GRANT CONNECT ON DATABASE {db_name} TO mkobi_app"))
          # Connect to the new DB to grant schema privileges
          test_admin_url = base_url.replace("/postgres", f"/{db_name}")
          test_admin_engine = create_async_engine(test_admin_url, isolation_level="AUTOCOMMIT")
          try:
              async with test_admin_engine.connect() as conn:
                  await conn.execute(text(f"GRANT USAGE, CREATE ON SCHEMA public TO mkobi_app"))
                  await conn.execute(text(f"GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO mkobi_app"))
                  await conn.execute(text(f"GRANT USAGE ON ALL SEQUENCES IN SCHEMA public TO mkobi_app"))
                  await conn.execute(text(f"ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO mkobi_app"))
                  await conn.execute(text(f"ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE ON SEQUENCES TO mkobi_app"))
          finally:
              await test_admin_engine.dispose()

  - path: docker-compose.override.yml
    targets:
      - type: service
        name: app
    semantic_anchors:
      insert_after:
        type: environment_variable
        value: "RECREATE_TEST_DB"
    changes:
      - action: add_environment_variables
        description: >
          Ensure DATABASE__ADMIN_USER and DATABASE__ADMIN_PASSWORD are explicitly
          set in the dev override app service so test_admin_database_url resolves
          correctly for test DB creation via the postgres superuser.
        code_hint: |
          DATABASE__ADMIN_USER: postgres
          DATABASE__ADMIN_PASSWORD: ${DATABASE__PASSWORD}

acceptance_criteria:
  - mkobi_app role has CREATEDB privilege in Docker dev environment
  - bidb_test is created successfully when RECREATE_TEST_DB=true
  - Migrations run successfully on bidb_test with mkobi_app credentials
  - App startup completes without test DB permission errors
  - GATE_01 test DB checks pass (main DB at revision, test DB created)
  - GATE_02 test DB checks pass

tests_to_run:
  - "docker compose -f docker-compose.yml -f docker-compose.override.yml down -v"
  - "docker compose -f docker-compose.yml -f docker-compose.override.yml up -d"
  - "docker compose logs app --tail 50  # verify no test DB errors"
  - "docker compose exec db psql -U postgres -c \"SELECT datname FROM pg_database WHERE datname = 'bidb_test';\""
  - "docker compose exec db psql -U postgres -d bidb_test -c \"SELECT version_num FROM alembic_version LIMIT 1;\""
  - "docker compose exec db psql -U postgres -c \"SELECT usecreatedb FROM pg_user WHERE usename = 'mkobi_app';\""

risk_level: medium

rollout_notes: >
  Critical fix required by user constraint: test DB creation must work in Docker dev mode.
  This was identified as HIGH severity in both GATE_01 and GATE_02 verification.
  The fix involves three coordinated changes: init script (CREATEDB grant),
  starter.py (post-creation grants on bidb_test), and override (admin creds).
  All three files must be changed atomically for the fix to work.
