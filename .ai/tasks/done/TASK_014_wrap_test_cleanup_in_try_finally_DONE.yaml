id: TASK_014_wrap_test_cleanup_in_try_finally_DONE

title: Wrap temp file cleanup in try/finally in test_e2e_upload.py

status: done

priority: low

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\test_validated_004.md
source_section: TST-004

description: >
  In `tests/test_e2e_upload.py`, the `multi_file` temp file is created inside
  the test method but cleanup (`multi_file.unlink()`) is placed after all
  assertions. If any assertion fails, the temp file remains on disk. Wrap the
  temp file lifecycle in try/finally to ensure cleanup on assertion failure.

goals:
  - Ensure multi_file cleanup runs even when assertions fail
  - Follow the same try/finally pattern used elsewhere in the file (line 45)

files:
  - path: tests/test_e2e_upload.py

targets:
       - type: function
         name: test_e2e_multiple_graphs_same_dashboard

    semantic_anchors:
      insert_after:
        type: variable_assignment
        value: multi_file

      insert_before:
        type: function_call
        value: multi_file.unlink

changes:
  - action: modify_code

    description: >
      Wrap the multi_file usage and assertions in a try/finally block so that
      `multi_file.unlink(missing_ok=True)` always executes, even if an
      assertion fails.

    code_hint: |
      try:
          multi_file = create_multi_file(...)
          # ... existing assertions ...
      finally:
          multi_file.unlink(missing_ok=True)

acceptance_criteria:
  - multi_file.unlink() is in a finally block
  - Test still passes when assertions succeed
  - Temp file is cleaned up when assertions fail
  - ruff check passes

tests_to_run:
  - pytest tests/test_e2e_upload.py -k "multi_file" -v --no-header
  - ruff check tests/test_e2e_upload.py

risk: minimal
risk_reason: >
  Test-only change. Wrapping in try/finally is a standard cleanup pattern
  already used elsewhere in the same file.

rollback: Remove the try/finally wrapper, restore original structure.
