id: TASK_025_P01_configure_cookie_security

title: Add cookie security configuration constants

status: done

priority: medium

depends_on: []

phase: PLAN_01
wave: 1

description: >
  Add security constants for cookie attributes (httponly, secure, samesite)
  to core/security.py. These constants ensure consistent cookie security
  settings across all auth endpoints.

finding_ref: PLAN_01_WAVE_1
severity: medium

goals:
  - Add COOKIE_HTTPONLY constant (True)
  - Add COOKIE_SECURE constant (True)
  - Add COOKIE_SAMESITE constant ("strict")
  - Constants are used consistently across auth endpoints

files:
  - path: src/mkobi/core/security.py
    targets:
      - type: module_level
        name: security_constants
    semantic_anchors:
      insert_after:
        type: import_block
    changes:
      - action: add_constants
        description: Add cookie security constants after imports
        code_hint: |
          # Cookie security defaults
          COOKIE_HTTPONLY: bool = True
          COOKIE_SECURE: bool = True
          COOKIE_SAMESITE: str = "strict"
          COOKIE_NAME: str = "mkobi_refresh_token"

acceptance_criteria:
  - Security constants are defined in core/security.py
  - Constants are importable and used in auth routes
  - Cookie attributes are consistently applied

tests_to_run:
  - "python -c \"from mkobi.core.security import COOKIE_HTTPONLY, COOKIE_SECURE, COOKIE_SAMESITE, COOKIE_NAME; print('constants OK')\""

risk_level: low

rollout_notes: >
  Pure additive change. No existing code affected.
  Constants will be used by subsequent tasks in Wave 2.
