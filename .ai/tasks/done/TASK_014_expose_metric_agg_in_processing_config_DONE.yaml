id: TASK_014_expose_metric_agg_in_processing_config

title: LOW — Expose metric_agg field in processing config model

status: completed

priority: low

depends_on:
  - TASK_007_add_yoy_precision_rounding

source_file: .ai/audit/validated/final-report.md
source_finding: DP-004

description: >
  The metric_agg field (aggregation function for metrics) is defined in the
  AggregationConfig model in src/mkobi/models/types.py but is not exposed in the
  processing config API models. This means users cannot specify custom aggregation
  functions for individual metrics through the processing config UI. Add metric_agg
  to the processing config create/update/read models.

goals:
  - Add metric_agg field to ProcessingConfigCreate and ProcessingConfigUpdate models
  - Add metric_agg to ProcessingConfigRead for API response
  - Ensure the field is optional with a sensible default

files:
  - path: src/mkobi/models/processing_configs.py
    targets:
      - type: class
        name: ProcessingConfigCreate
      - type: class
        name: ProcessingConfigUpdate
      - type: class
        name: ProcessingConfigRead
    semantic_anchors:
      insert_after:
        type: field_definition
        name: existing fields
    changes:
      - action: add_code
        description: >
          Add optional metric_agg field to processing config models.
        code_hint: |
          metric_agg: AggregationFunctionEnum | None = None

acceptance_criteria:
  - metric_agg is available in processing config CRUD models
  - Field is optional and defaults to None
  - API accepts and returns metric_agg in processing config endpoints
  - Tests pass

tests_to_run:
  - pytest tests/ -k "processing_config" -v --no-header
  - mypy src/mkobi/models/processing_configs.py

risk: low
risk_notes: >
  Low risk — additive change adding an optional field. Existing processing
  configs without metric_agg continue to work with default behavior.

type: implementation
category: data-processing
severity: low
