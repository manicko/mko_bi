id: TASK_007_int006_align_logout_return_type

title: Fix INT-006 — Align logout() return type with SuccessResponse

status: pending

priority: low

depends_on: []

description: >
  Change `Promise<void>` to `Promise<SuccessResponse>` in frontend logout function
  to match backend which returns `{"message": "Logged out successfully"}`.

source_file: .ai/audit/99-validation/90-integration-validated.md
source_section: INT-006 — BEST-PRACTICE (CONFIRMED)

files:
  - path: frontend/src/features/auth/api/authApi.ts
    targets:
      - type: function
        name: logout
    semantic_anchors:
      - type: function_definition
        value: logout
    changes:
      - action: modify_return_type
        description: >
          Change return type from void to SuccessResponse and import the type.
        code_hint: |
          export async function logout(): Promise<SuccessResponse> {
            const response = await axiosInstance.post<SuccessResponse>('/auth/logout')
            return response.data
          }

  - path: frontend/src/shared/types/api.types.ts
    targets:
      - type: interface
        name: SuccessResponse
    changes:
      - action: add_type
        description: >
          Add SuccessResponse interface if not already present (message: string).

acceptance_criteria:
  - logout function returns SuccessResponse type
  - TypeScript types align with backend
  - No runtime behavior change

risk_notes: >
  Low risk — Pure type change. No runtime behavior change.

