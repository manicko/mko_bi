  `DashboardCreate` and `DashboardUpdate` models have no `max_length` constraint on the
  `description` field. A direct API call could send an arbitrarily long description.
  Add `max_length=200` for defense-in-depth.

objective: >
  Add `StringConstraints(max_length=200)` or `Field(max_length=200)` to the `description`
  field in both `DashboardCreate` and `DashboardUpdate` Pydantic models to enforce
  the same 200-character limit that the frontend already enforces.

