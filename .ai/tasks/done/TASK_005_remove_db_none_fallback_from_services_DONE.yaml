id: TASK_005_remove_db_none_fallback_from_services

title: Remove db=None fallback pattern from all service methods

status: done

priority: medium

depends_on:
  - TASK_004a_service_integration_tests
  - TASK_004b_permissions_tests

description: >
  Systemic refactoring to remove the `db: AsyncSession | None = None` fallback pattern from
  all 8 service classes (72 method signatures). When called without a `db` parameter, each
  service method currently creates its own session internally, breaking transaction atomicity.
  This task makes `db: AsyncSession` mandatory in all service method signatures.
  

goals:
  - Remove `db: AsyncSession | None = None` from all service methods
  - Make `db: AsyncSession` mandatory in all service method signatures
  - Remove `db: AsyncSession | None = None` from `check_dashboard_access()` in permissions.py
  - Update all callers to pass `db` explicitly
  - Preserve backward compatibility via FastAPI dependency injection

files:
  - path: src/mkobi/services/auth_service.py
    targets:
      - type: class
        name: AuthService
    semantic_anchors:
      modify:
        type: method_signature
        pattern: "db: AsyncSession | None = None"
        replacement: "db: AsyncSession"
    affected_methods:
      - register_user
      - login_user
      - get_user_by_id
      - verify_token
      - change_password
      - delete_user
      - get_user_by_email
      - check_rate_limit
      - list_users

  - path: src/mkobi/services/data_service.py
    targets:
