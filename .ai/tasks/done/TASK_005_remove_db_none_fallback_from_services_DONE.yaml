changes:
  - action: modify_signature
    description: Replace `db: AsyncSession | None = None` with `db: AsyncSession` in all service methods
    pattern: "db: AsyncSession | None = None"
    replacement: "db: AsyncSession"
    scope: all service classes (8 files, ~72 methods)

  - action: remove_code
    description: Remove internal session creation logic (the `if db is None: db = ...` blocks)
    pattern: "if db is None:"
    scope: all service classes

  - action: modify_signature
    description: Replace `db: AsyncSession | None = None` with `db: AsyncSession` in check_dashboard_access
    file: src/mkobi/core/permissions.py
    function: check_dashboard_access

acceptance_criteria:
  - Zero occurrences of `db: AsyncSession | None = None` in service files
  - Zero occurrences of `db: AsyncSession | None = None` in permissions.py
  - All service methods require `db: AsyncSession` as mandatory parameter
  - All callers pass `db` explicitly
  - Full test suite passes
  - No runtime regressions

tests_to_run:
  - pytest tests/ -x -v

risk_level: high

execution_blocked_reason: >
  Test quality must be improved before this task can be safely executed. The existing
  test suite has overmocked service tests that will break when signatures change.
  A comprehensive test harness should be created first.

rollout_notes: >
  Must be done as a single atomic change across all services. Cannot be incrementally
  rolled out (changing some services but not others would create inconsistency).
  Requires full test suite rewrite for overmocked service tests.

validated_finding_refs:
  - VF-001
