      - list_dashboards
      - update_dashboard
      - delete_dashboard
      - get_dashboard_by_name
      - get_dashboard_config
      - update_dashboard_config
      - get_dashboard_layout
      - set_dashboard_layout
      - get_dashboard_graphs
      - get_dashboard_filters
      - get_dashboard_users

  - path: src/mkobi/services/layout_service.py
    targets:
      - type: class
        name: LayoutService
    semantic_anchors:
      modify:
        type: method_signature
        pattern: "db: AsyncSession | None = None"
        replacement: "db: AsyncSession"

  - path: src/mkobi/services/graph_service.py
    targets:
      - type: class
        name: GraphService
    semantic_anchors:
      modify:
        type: method_signature
        pattern: "db: AsyncSession | None = None"
