id: TASK_018_remove_pytest_xdist_auto_from_pyproject

title: Remove -n auto from pytest addopts in pyproject.toml

status: pending

priority: medium

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\test_validated_004.md
source_section: TST-002

description: >
  The `pyproject.toml` has `addopts = "... -n auto"` which enables pytest-xdist
  parallel execution. Tests at `tests/test_graphs.py:360,368` directly mutate
  `async_client.headers` without cleanup, creating shared state issues under
  parallel execution. Remove `-n auto` until all shared state issues are fixed.

goals:
  - Remove -n auto from pytest addopts
  - Eliminate race conditions in parallel test execution
  - Ensure test suite runs reliably

files:
  - path: pyproject.toml

    targets:
      - type: config_section
        name: addopts

    semantic_anchors:
      insert_after:
        type: tool_section
        value: pytest

changes:
  - action: modify_code

    description: >
      Remove `-n auto` from the addopts line in [tool.pytest.ini_options].
      Keep all other addopts unchanged.

    code_hint: |
      # Before:
      addopts = "-v --tb=short -n auto --cov=src"
      # After:
      addopts = "-v --tb=short --cov=src"

acceptance_criteria:
  - pyproject.toml addopts does not contain -n auto
  - Full test suite passes without parallel execution
  - No race conditions in test output

tests_to_run:
  - pytest tests/ -v --no-header

risk: low
risk_reason: >
  Removing parallel execution will slow down test suite but eliminates race
  conditions. This is a temporary measure until shared state issues are fixed.

rollback: Restore -n auto in addopts.
