id: TASK_029_P01_rewrite_refresh_endpoint

title: Rewrite refresh endpoint to use cookie instead of request body

status: pending

priority: high

depends_on:
  - TASK_023_P01_remove_refresh_request_model
  - TASK_024_P01_add_refresh_token_creation
  - TASK_027_P01_add_token_validation

phase: PLAN_01
wave: 2

description: >
  Modify the refresh endpoint to read the refresh token from an httpOnly cookie
  instead of the request body. This is the core security improvement that
  eliminates token exposure to XSS.

finding_ref: PLAN_01_WAVE_2
severity: high

goals:
  - Endpoint reads refresh token from cookie (mkobi_refresh_token)
  - Returns new access token on success
  - Proper error handling for missing/invalid cookies
  - Remove RefreshRequest model dependency

files:
  - path: src/mkobi/api/routes/auth.py
    targets:
      - type: function
        name: refresh_endpoint
    semantic_anchors:
      modify:
        type: function_definition
        value: refresh
    changes:
      - action: modify_function
        description: Change refresh endpoint to read token from cookie
        code_hint: |
          @router.post("/refresh", response_model=Token)
          async def refresh_token(
              request: Request,
              session: Annotated[AsyncSession, Depends(get_session)],
          ) -> Token:
              """Refresh access token using httpOnly refresh cookie."""
              refresh_token_value = request.cookies.get(COOKIE_NAME)
              if not refresh_token_value:
                  raise HTTPException(
                      status_code=status.HTTP_401_UNAUTHORIZED,
                      detail="Refresh token missing",
                  )
              
              payload = validate_refresh_token(refresh_token_value)
              if not payload:
                  raise HTTPException(
                      status_code=status.HTTP_401_UNAUTHORIZED,
                      detail="Invalid refresh token",
                  )
              
              user_id = payload.get("sub")
              user = await UserRepository(session).get_by_id(UUID(user_id))
              if not user:
                  raise HTTPException(
                      status_code=status.HTTP_401_UNAUTHORIZED,
                      detail="User not found",
                  )
              
              access_token = create_access_token(
                  data={"sub": str(user.id), "email": user.email, "role": user.role}
              )
              return Token(access_token=access_token, token_type="bearer")

acceptance_criteria:
  - Endpoint reads refresh token from cookie
  - Returns new access token on success
  - Proper 401 error for missing/invalid cookies
  - No dependency on RefreshRequest model

tests_to_run:
  - "pytest tests/ -k test_auth -v"
  - Manual API test: refresh token using cookies

risk_level: high

rollout_notes: >
  Security-critical change. Must ensure cookie is properly read.
  Depends on TASK_023 (RefreshRequest removal), TASK_024 (token creation),
  and TASK_027 (token validation).
