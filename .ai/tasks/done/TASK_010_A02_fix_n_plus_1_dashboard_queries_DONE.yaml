id: TASK_010_A02_fix_n_plus_1_dashboard_queries

title: Add eager loading for dashboard layout relationship in dashboard_service.py

status: pending

priority: medium

type: implementation

finding_id: FINDING-A02
source: audit_validated_findings_001.md

depends_on:
  - TASK_006_verify_mandatory_fixes

description: >
  dashboard_service.py calls _dashboard_to_read() in a loop for each dashboard.
  Each call triggers a separate lazy load for the layout relationship.
  Same pattern in both get_user_dashboards() and get_all_dashboards(),
  creating N+1 query performance issue.

goals:
  - Add selectinload or joinedload for layout relationship in dashboard queries
  - Eliminate N+1 query pattern
  - Preserve serialization behavior

files:
  - path: src/mkobi/services/dashboard_service.py
    targets:
      - type: method
        name: get_user_dashboards
      - type: method
        name: get_all_dashboards
    semantic_anchors:
      insert_after:
        type: function_call
        value: select
        context: dashboard query construction
    changes:
      - action: modify_code
        description: >
          Add .options(selectinload(Dashboard.layout)) to the query in
          get_user_dashboards() and get_all_dashboards() methods.

acceptance_criteria:
  - Dashboard listing loads layout in single query (no N+1)
  - Serialization output unchanged
  - No test failures
  - Performance improvement verified via query log

tests_to_run:
  - pytest tests/ -k dashboard -v

risk: medium
effort: medium
rollback: Remove selectinload option from queries

notes: >
  Merged from AUDIT-MEDIUM-02 and AUDIT-MEDIUM-03.
  For current scale (internal BI tool), this is acceptable but should be
  optimized when dashboard count grows.
