id: TASK_030_STC_audit_docker_issues

title: Audit — Diagnose Docker Issues When Test Environment Gate Fails

status: pending

priority: critical

depends_on:
  - TASK_029_STC_verify_parallel_execution

phase: STC
wave: 3
type: audit

description: >
  Diagnostic audit task triggered when TASK_028 (gate verification) fails one or
  more checks. This task performs systematic diagnosis of Docker environment
  issues, collects evidence from containers, networks, volumes, images, Docker
  daemon, and Dockerfiles, then writes a structured audit report to
  C:\py_dev\mkobi\.ai\problems\docker-compose-test-audit-report.md.

  This is a READ-ONLY audit task — no source code changes. Changes are made only
  by downstream fix tasks that reference this audit's findings.

  The audit covers five diagnostic categories:
  1. Container state (running, exited, restarting, crash-looping)
  2. Image issues (build failures, missing layers, wrong base images)
  3. Network issues (missing networks, DNS resolution, port conflicts)
  4. Volume issues (missing volumes, permission errors, cross-mounting)
  5. Configuration issues (compose syntax, env var resolution, service deps)

trigger_condition: >
  This task is only invoked when TASK_029_STC_verify_parallel_execution reports
  gate_result: FAILED. The specific failed checks from TASK_028.determine which
  diagnostic categories below are most relevant.

finding_ref: TASK_028 gate failure findings
severity: critical

goals:
  - Identify root cause of Docker environment failures
  - Collect diagnostic evidence (logs, inspect, network, volume state)
  - Write structured audit report to C:\py_dev\mkobi\.ai\problems\
  - Provide actionable fix recommendations
  - Determine whether docker-compose.test.yml, docker-compose.yml, or both need fixes

files:
  - path: docker-compose.test.yml
    targets:
      - type: file
        name: docker-compose.test.yml
    changes: []  # audit only, no changes

  - path: docker-compose.yml
    targets:
      - type: file
        name: docker-compose.yml
    changes: []  # audit only, no changes

  - path: docker-compose.override.yml
    targets:
      - type: file
        name: docker-compose.override.yml
    changes: []  # audit only, no changes

  - path: tests/conftest.py
    targets:
      - type: file
        name: conftest.py
    changes: []  # audit only, no changes

audit_steps:
  # === Category 1: Docker Daemon and System ===
  - category: docker_system
    description: Check Docker daemon health and system resources
    commands:
      - name: Docker daemon running
        command: "docker info --format '{{.ServerVersion}}'"
        purpose: "Verify Docker daemon is responsive"
      - name: Docker disk space
        command: "docker system df"
        purpose: "Check available disk space for images and volumes"
      - name: Docker build cache
        command: "docker builder df"
        purpose: "Check build cache health"

  # === Category 2: Compose File Validation ===
  - category: compose_config
    description: Validate compose file syntax and resolved configuration
    commands:
      - name: Test compose syntax
        command: "docker compose -f docker-compose.test.yml config 2>&1"
        purpose: "Validate test compose file syntax and show resolved config"
      - name: Dev compose syntax
        command: "docker compose -f docker-compose.yml -f docker-compose.override.yml config 2>&1"
        purpose: "Validate dev compose file syntax"
      - name: Test compose services list
        command: "docker compose -f docker-compose.test.yml config --services"
        purpose: "List all services defined in test compose"
      - name: Test compose env resolution
        command: "docker compose -f docker-compose.test.yml config --resolve-image-digests 2>&1 | head -50"
        purpose: "Check env var resolution in test compose"

  # === Category 3: Image Audit ===
  - category: images
    description: Check Docker images for test environment
    commands:
      - name: Required images exist
        command: "docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '(postgres:16|redis:7|mkobi)'"
        purpose: "Check if required base images are pulled"
      - name: Test app image build
        command: "docker compose -f docker-compose.test.yml build test-app 2>&1 | tail -30"
        purpose: "Rebuild test-app image and check for errors"
      - name: Test app image layers
        command: "docker history $(docker compose -f docker-compose.test.yml images -q test-app 2>/dev/null) 2>&1 | head -20"
        purpose: "Inspect test-app image layers (if exists)"
      - name: Dockerfile test target
        command: "grep -A 20 'AS test' Dockerfile"
        purpose: "Check if Dockerfile has 'test' build target"

  # === Category 4: Container State ===
  - category: container_state
    description: Inspect container runtime state
    commands:
      - name: All containers
        command: "docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
        purpose: "Full container state overview"
      - name: Test app inspect
        command: "docker inspect test-app 2>&1 | python -c \"import sys,json; d=json.load(sys.stdin); print('State:', d[0]['State']['Status']); print('ExitCode:', d[0]['State'].get('ExitCode','N/A')); print('Health:', d[0].get('State',{}).get('Health',{}).get('Status','disabled'))\""
        purpose: "Detailed test-app container state"
      - name: Test app logs
        command: "docker logs test-app 2>&1 | tail -50"
        purpose: "Test app container logs for errors"
      - name: Test db inspect
        command: "docker inspect test-db 2>&1 | python -c \"import sys,json; d=json.load(sys.stdin); print('State:', d[0]['State']['Status']); print('ExitCode:', d[0]['State'].get('ExitCode','N/A'))\""
        purpose: "Detailed test-db container state"
      - name: Test db logs
        command: "docker logs test-db 2>&1 | tail -30"
        purpose: "Test DB container logs for errors"
      - name: Test migrate inspect
        command: "docker inspect test-migrate 2>&1 | python -c \"import sys,json; d=json.load(sys.stdin); print('State:', d[0]['State']['Status']); print('ExitCode:', d[0]['State'].get('ExitCode','N/A'))\""
        purpose: "Test migrate container state"
      - name: Test migrate logs
        command: "docker logs test-migrate 2>&1 | tail -30"
        purpose: "Test migrate logs for migration errors"

  # === Category 5: Network Audit ===
  - category: networks
    description: Check Docker network configuration and isolation
    commands:
      - name: All networks
        command: "docker network ls --format 'table {{.Name}}\t{{.Driver}}\t{{.Scope}}'"
        purpose: "List all Docker networks"
      - name: Test network inspect
        command: "docker network inspect test_network 2>&1"
        purpose: "Inspect test network configuration and attached containers"
      - name: Dev network inspect
        command: "docker network inspect $(docker compose -f docker-compose.yml -f docker-compose.override.yml config --format '{{.Networks}}' 2>/dev/null || echo 'bridge') 2>&1 | head -20"
        purpose: "Inspect dev network for comparison"
      - name: Port conflicts
        command: "docker ps --format '{{.Names}} {{.Ports}}' | grep -E '5433|8001|6380'"
        purpose: "Check host port mapping for test services"
      - name: DNS resolution in test-app
        command: "docker exec test-app python -c \"import socket; print(socket.gethostbyname('test-db'))\" 2>&1"
        purpose: "Verify test-app can resolve test-db by service name"

  # === Category 6: Volume Audit ===
  - category: volumes
    description: Check Docker volume state and isolation
    commands:
      - name: All volumes
        command: "docker volume ls --format '{{.Name}}'"
        purpose: "List all Docker volumes"
      - name: Test postgres data volume
        command: "docker volume inspect test_postgres_data 2>&1"
        purpose: "Inspect test postgres volume"
      - name: Dev postgres data volume
        command: "docker volume inspect postgres_data 2>&1"
        purpose: "Inspect dev postgres volume (verify separate)"
      - name: Volume mount check
        command: "docker inspect test-db 2>&1 | python -c \"import sys,json; d=json.load(sys.stdin); [print(m['Source'], '->', m['Destination']) for m in d[0]['Mounts']]\""
        purpose: "Verify test-db volume mounts"

  # === Category 7: Environment Variables ===
  - category: environment
    description: Check environment variable resolution and conftest interaction
    commands:
      - name: Test app env vars
        command: "docker exec test-app env | grep -E 'DATABASE__|REDIS__|JWT__|ENV|RECREATE' | sort"
        purpose: "Check actual env vars inside test-app container"
      - name: Test db env vars
        command: "docker exec test-db env | grep -E 'POSTGRES_' | sort"
        purpose: "Check env vars inside test-db container"
      - name: conftest setdefault check
        command: "grep -n 'os.environ' tests/conftest.py | head -20"
        purpose: "Verify conftest.py uses setdefault() not direct assignment"
      - name: Env var precedence test
        command: "docker exec test-app python -c \"import os; print('DATABASE__HOST =', repr(os.environ.get('DATABASE__HOST'))); print('IS OVERRIDE:', os.environ.get('DATABASE__HOST') != 'localhost')\""
        purpose: "Confirm Docker Compose overrides conftest defaults"

  # === Category 8: Service Dependency Chain ===
  - category: dependencies
    description: Verify service startup order and dependency satisfaction
    commands:
      - name: Test-db health check
        command: "docker exec test-db pg_isready -U postgres 2>&1"
        purpose: "Verify test-db is actually accepting connections"
      - name: Test-db from test-app
        command: "docker exec test-app python -c \"import socket; s = socket.create_connection(('test-db', 5432), timeout=5); print('DB connection OK'); s.close()\" 2>&1"
        purpose: "Verify test-app can connect to test-db by DNS name"
      - name: Test-redis from test-app
        command: "docker exec test-app python -c \"import socket; s = socket.create_connection(('test-redis', 6379), timeout=5); print('Redis connection OK'); s.close()\" 2>&1"
        purpose: "Verify test-app can connect to test-redis by DNS name"
      - name: Migration state in test-db
        command: "docker exec test-db psql -U postgres -d bidb_test -c 'SELECT version_num FROM alembic_version;' 2>&1"
        purpose: "Check if migrations were applied to test DB"

acceptance_criteria:
  - All 8 diagnostic categories executed
  - Evidence collected for each failed check from TASK_027
  - Root cause identified for each failure
  - Audit report written to C:\py_dev\mkobi\.ai\problems\docker-compose-test-audit-report.md
  - Report includes: findings, issues_found, root_cause, recommendation sections
  - Report references specific TASK_028 failed checks
  - Report provides actionable fix recommendations with file paths and semantic anchors

