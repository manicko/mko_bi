risk_level: low

rollout_notes: >
  READ-ONLY audit task. No code changes. All findings are diagnostic evidence
  collected from the running Docker environment. The audit report is the primary
  output and serves as the basis for any downstream fix tasks.

  The audit should be run with both environments in their failed state — do NOT
  run `docker compose down` before auditing. The failing state is the evidence.

  If the audit reveals issues that require code changes, create new fix tasks
  that reference this audit report's findings. Each fix task should target one
  specific root cause.

  Report location: C:\py_dev\mkobi\.ai\problems\docker-compose-test-audit-report.md
