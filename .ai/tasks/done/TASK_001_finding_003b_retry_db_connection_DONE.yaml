id: TASK_001_finding_003b_retry_db_connection

title: Add retry logic with exponential backoff to _check_db_connection in DatabaseStarter

type: implementation

status: pending

priority: critical

depends_on: []

description: >
  The application fails to start with "password authentication failed for user mkobi_app"
  because the init script only runs on first PostgreSQL volume creation. On subsequent starts,
  the role may not exist or have a different password. The app has no retry mechanism — it
  attempts one connection and crashes. Add retry logic with exponential backoff to
  _check_db_connection() in db/starter.py to handle the race condition and transient failures.

goals:
  - Add retry with exponential backoff to _check_db_connection()
  - Log each retry attempt with warnings
  - Preserve existing error handling for non-transient failures
  - Default: 5 retries with exponential backoff (1s, 2s, 4s, 8s, 16s)

files:
  - path: src/mkobi/db/starter.py
    targets:
      - type: class
        name: DatabaseStarter
      - type: method
        name: _check_db_connection
    semantic_anchors:
      insert_after:
        type: method_definition
        value: _check_db_connection
      modify_within:
        type: function_call
        value: _check_db_connection
    changes:
      - action: modify_code
        description: >
          Add async retry loop with exponential backoff around the connection check logic.
          Retry on InvalidPasswordError and OperationalError. Log each attempt.
        code_hint: |
          import asyncio
          from asyncpg.exceptions import InvalidPasswordError

          async def _check_db_connection(self, max_retries: int = 5) -> None:
              for attempt in range(max_retries):
                  try:
                      # existing connection check logic
                      return
                  except (InvalidPasswordError, OSError) as e:
                      if attempt < max_retries - 1:
                          delay = 2 ** attempt
                          logger.warning(
                              "DB connection attempt %d/%d failed: %s. Retrying in %ds...",
                              attempt + 1, max_retries, e, delay
                          )
                          await asyncio.sleep(delay)
                      else:
                          raise

acceptance_criteria:
  - _check_db_connection retries up to 5 times with exponential backoff
  - Each retry attempt is logged with WARNING level
  - Existing behavior preserved when connection succeeds on first attempt
  - Application does not crash on transient DB connection failures

tests_to_run:
  - uv run pytest tests/ -k "test_db" -v || echo "No DB tests found — verify manually"

risk_level: low

rollout_notes: >
  Low-risk change — only adds retry wrapping around existing logic. Does not modify
  the init script or database configuration. Can be deployed immediately.
