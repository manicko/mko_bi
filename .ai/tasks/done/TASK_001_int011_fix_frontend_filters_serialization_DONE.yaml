id: TASK_001_int011_fix_frontend_filters_serialization

title: Fix INT-011 — Frontend filters serialization for getAggregatedData

status: pending

priority: critical

depends_on: []

description: >
  Fix the CRITICAL RUNTIME-ERROR where frontend passes `filters` as an object to Axios,
  which serializes it as `?filters[key]=value`. Backend expects `filters` as a JSON
  string (`json.loads(filters)`). Filters are completely non-functional.

source_file: .ai/audit/99-validation/90-integration-validated.md
source_section: INT-011 — RUNTIME-ERROR (CORRECT)

files:
  - path: frontend/src/features/dashboards/api/dashboardApi.ts
    targets:
      - type: hook
        name: useAggregatedData
    semantic_anchors:
      - type: function_call
        value: getAggregatedData
    changes:
      - action: modify_code
        description: >
          Stringify filters before passing as query param in useAggregatedData queryFn.
          Change from passing raw object to JSON.stringify(filters).
        code_hint: |
          queryFn: () =>
            dashboardApi.getAggregatedData({
              dashboard_id: dashboardId,
              graph_id: graphId,
              filters: filters ? JSON.stringify(filters) : undefined,
            }),

  - path: frontend/src/shared/types/api.types.ts
    targets:
      - type: interface
        name: AggregatedDataRequest
    semantic_anchors:
      - type: type_annotation
        value: filters
    changes:
      - action: modify_type
        description: >
          Change `filters` field type from object to string in AggregatedDataRequest
          interface to match backend expectation.

acceptance_criteria:
  - Filters are serialized as JSON string before API call
  - Backend correctly parses filter JSON
  - Filter functionality works end-to-end
  - TypeScript types align with backend contract
  - Frontend build succeeds with no type errors

risk_notes: >
  Low risk — isolated to dashboardApi.ts and api.types.ts. Backward compatible:
  if filters is undefined, behavior unchanged. No database migration required.

tests_to_run:
  - command: cd frontend && npm run build
    reason: Verify TypeScript compilation succeeds
  - command: cd frontend && npm run lint
    reason: Verify linting passes