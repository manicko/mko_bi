issues_found:
    - severity: high
      component: app startup
      description: "App stuck during startup at test database migration step"
      logs: "INFO: Running migrations for postgresql+asyncpg://mkobi_app:***@db:5432/bidb_test..."
      
    - severity: high
      component: test database permissions
      description: "mkobi_app role lacks CREATEDB privilege and schema permissions on bidb_test"
      evidence: "usecreatedb = f in pg_user for mkobi_app"
      
    - severity: medium
      component: frontend
      description: "vite command not found - node_modules volume empty/stale"
      logs: "sh: vite: not found"
      root_cause: "frontend_node_modules volume created fresh but not populated with dependencies"
      
    - severity: low
      component: mkobi_app role privileges
      description: "mkobi_app role created correctly on main DB but lacks CREATE DATABASE privilege needed for test DB operations"

root_cause: >
  The mkobi_app PostgreSQL role lacks CREATE DATABASE privilege needed for
  test database recreation. When RECREATE_TEST_DB=true, the app attempts
  to run migrations on bidb_test using mkobi_app credentials. Additionally,
  the frontend node_modules volume is empty because the node:20-alpine
  image doesn't have vite installed globally and npm install was never run.

recommendation: >
  1. For test DB: Set RECREATE_TEST_DB=false in development since test database
     is not needed for normal development. OR grant CREATE DATABASE to mkobi_app
     role. The code already supports test_admin_database_url using postgres user
     but it's not being used correctly for migration operations.
  
  2. For frontend: The docker-compose.override.yml frontend service uses
     node:20-alpine with a volume for node_modules, but npm install needs to
     run first. Either: (a) use a Dockerfile for frontend that runs npm install,
     or (b) pre-populate node_modules by running npm install locally before
     docker compose up.

gate_result: FAILED

