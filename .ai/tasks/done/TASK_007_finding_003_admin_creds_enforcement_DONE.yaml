id: TASK_007_finding_003_admin_creds_enforcement

title: Enforce admin credentials via ${VAR:?error} and extend config.py validation

type: implementation

status: pending

priority: critical

depends_on:
  - TASK_006_verify_finding_002_db_password_enforcement

description: >
  docker-compose.yml provides default admin credentials (admin@example.com / admin@example.com)
  in the app, migrate, and rq-worker services. The app-level validation in config.py blocks
  'admin'/'admin' but NOT 'admin@example.com'/'admin@example.com' — the default values bypass
  the weak credential check. Fix: remove defaults from compose and extend config.py validation.

goals:
  - Replace default admin credential patterns with enforcement in docker-compose.yml
  - Extend validate_admin_credentials in config.py to reject admin@example.com in production
  - Override file keeps safe defaults for local development

files:
  - path: docker/docker-compose.yml
    targets:
      - type: env_var_reference
        name: ADMIN_USERNAME
      - type: env_var_reference
        name: ADMIN_PASSWORD
    semantic_anchors:
      env_var_pattern: ${ADMIN_USERNAME:-admin@example.com}
      env_var_pattern: ${ADMIN_PASSWORD:-admin@example.com}
    changes:
      - action: replace_value
        description: Replace admin username default with enforcement
        old_value: ${ADMIN_USERNAME:-admin@example.com}
        new_value: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      - action: replace_value
        description: Replace admin password default with enforcement
        old_value: ${ADMIN_PASSWORD:-admin@example.com}
        new_value: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}

  - path: src/mkobi/config.py
    targets:
      - type: class
        name: Settings
      - type: method
        name: validate_admin_credentials
    semantic_anchors:
      insert_after:
        type: function_call
        value: validate_admin_credentials
    changes:
      - action: add_code
        description: >
          Extend WEAK_USERNAMES and WEAK_PASSWORDS to include admin@example.com.
          Or add explicit check in validate_admin_credentials for production environment.
        code_hint: |
          # In WEAK_USERNAMES: add "admin@example.com"
          # In WEAK_PASSWORDS: add "admin@example.com"

acceptance_criteria:
  - Compose config fails without ADMIN_USERNAME and ADMIN_PASSWORD in production
  - config.py validate_admin_credentials rejects admin@example.com in production
  - Dev override file still provides safe defaults

tests_to_run:
  - ADMIN_USERNAME=test ADMIN_PASSWORD=test JWT__SECRET_KEY=test DATABASE__PASSWORD=test docker compose -f docker/docker-compose.yml --env-file .env config
  - uv run pytest tests/ -k "admin or credential" -v || echo "No matching tests"

risk_level: low

rollout_notes: >
  Must ensure production deployment provides admin credentials via secrets.
