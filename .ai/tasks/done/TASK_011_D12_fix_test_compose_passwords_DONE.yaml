id: TASK_011_D12_fix_test_compose_passwords

title: Remove Hardcoded Password Fallback from Test Compose

status: pending

priority: medium

depends_on: []

phase: DOCKER_HARDENING
wave: 1

description: >
  docker-compose.test.yml uses DATABASE__PASSWORD: ${MKOBI_APP_PASSWORD:-1234} with
  a hardcoded fallback. Remove the hardcoded password fallback; source from .env only.
  This is related to the same secrets management pattern as DOCKER-002.

finding_ref: DOCKER-012
severity: medium

goals:
  - Remove hardcoded password fallback from test compose
  - Source DATABASE__PASSWORD from .env in test environment
  - Ensure test compose works with .env file present

files:
  - path: docker-compose.test.yml
    targets:
      - type: service
        name: app
      - type: service
        name: db
    semantic_anchors:
      insert_after:
        type: block
        value: "services:"
    changes:
      - action: modify_directive
        description: Remove hardcoded fallback from app service DATABASE__PASSWORD
        old_value: "DATABASE__PASSWORD: ${MKOBI_APP_PASSWORD:-1234}"
        new_value: "DATABASE__PASSWORD: ${MKOBI_APP_PASSWORD}"
      - action: modify_directive
        description: Remove hardcoded fallback from db service POSTGRES_PASSWORD if present

acceptance_criteria:
  - No hardcoded password fallbacks in docker-compose.test.yml
  - Test compose works with .env file present
  - Test compose fails with clear error if .env is missing (desired behavior)

tests_to_run:
  - "docker compose -f docker-compose.test.yml up -d"
  - "Verify test environment starts correctly with .env present"

risk_level: low

rollout_notes: >
  Related to DOCKER-002 (secrets management). Ensure .env is present in CI/CD
  test environments before rollout.
