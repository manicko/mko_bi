id: TASK_022_V019_login_rate_limit_enumeration

title: Fix login rate limiting email enumeration side-channel

status: pending

priority: medium

depends_on: []

description: >
  Login rate limiting uses f"login:{email}" as the key. An attacker can enumerate
  emails by observing which keys are rate-limited. This task changes to IP-based
  rate limiting or a combination of IP + email with a cooldown period.

finding_ref: V-019
severity: MEDIUM

goals:
  - Change rate limiter key from per-email to per-IP (or IP + email combination)
  - Prevent email enumeration via rate limit side-channel
  - Maintain effective rate limiting against brute force

files:
  - path: src/mkobi/api/routes/auth.py
    targets:
      - type: route_handler
        name: login endpoint
    semantic_anchors:
      replace: rate limiter key construction from email-based to IP-based

changes:
  - action: modify_rate_limiter
    description: >
      Change the rate limiter key from f"login:{email}" to f"login:{client_ip}"
      or a combination that doesn't leak email existence.
    code_hint: |
      # Before:
      rate_key = f"login:{email}"
      # After:
      client_ip = request.client.host
      rate_key = f"login:{client_ip}"

acceptance_criteria:
  - Rate limiter key does not contain email
  - Brute force protection still effective (per-IP limiting)
  - No email enumeration via rate limit side-channel
  - Login endpoint still works correctly

tests_to_run:
  - pytest tests/ -k "auth or login or rate" -v

risk_level: medium

rollout_notes: >
  Security improvement. Must maintain effective rate limiting while preventing
  enumeration. Consider combining IP + email with a cooldown for better security.
