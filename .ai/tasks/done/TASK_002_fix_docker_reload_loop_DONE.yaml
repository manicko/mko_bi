id: TASK_002_fix_docker_reload_loop

title: Fix Docker volume mount reload loop in docker-compose.override.yml

status: completed

priority: high

depends_on: []

type: implementation

description: >
  Fix the backend restart loop caused by mounting ../tests:/app/tests volume
  which triggers uvicorn --reload on every __pycache__ file change. Add
  --reload-exclude to prevent test files from triggering reloads.

goals:
  - Stop backend restart loop in Docker dev environment
  - Preserve uvicorn hot-reload for application code changes
  - Maintain test volume mount for running tests inside container

files:
  - path: docker/docker-compose.override.yml
    targets:
      - type: service
        name: app
    semantic_anchors:
      find:
        - type: key
          value: command
        - context: app service
      find:
        - type: key
          value: volumes
        - context: app service

changes:
  - action: update_code
    description: Add --reload-exclude tests/ to the uvicorn command in app service
    target: docker/docker-compose.override.yml
    code_hint: |
      # Before:
      command: uvicorn mkobi.main:create_app --factory --host 0.0.0.0 --port 8000 --reload

      # After:
      command: uvicorn mkobi.main:create_app --factory --host 0.0.0.0 --port 8000 --reload --reload-exclude tests/

acceptance_criteria:
  - Backend does not restart when test files or __pycache__ change
  - Backend still reloads when application source code changes
  - docker compose logs app shows no repeated "StatReload detected changes in 'tests/...'" messages
  - GET /healthy returns 200 OK consistently without 503 interruptions

risks:
  - Low: --reload-exclude flag must be supported by the uvicorn version in use
  - Low: If flag syntax differs, may need alternative approach (remove tests volume mount)

tests_to_run:
  - command: docker compose -f docker/docker-compose.yml -f docker/docker-compose.override.yml up -d app
    purpose: Start services and verify no restart loop
  - command: docker compose logs app
    purpose: Check logs for absence of test-triggered reload messages

estimated_effort: trivial

risk_level: minimal
