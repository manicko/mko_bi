source_section: Wave 1 — TASK_01_02 — Update exception handlers for RFC 7807 format
source_file: C:\py_dev\mkobi\.ai\plans\tasks\PLAN_01_02_exception_handlers.yaml

description: >
  Refines exception handlers to fully produce RFC 7807 Problem Details responses.
  Depends on TASK_001 for the updated ErrorResponse model and AppException.

goals:
  - AppException handler builds complete RFC 7807 JSON with all fields
  - StarletteHTTPException handler added for FastAPI default errors
  - Global exception handler returns INTERNAL_ERROR without leaking internals
  - Handlers registered in correct order

files:
  - path: src/mkobi/utils/exceptions.py
    targets:
      - type: function
        name: add_exception_handlers
    semantic_anchors:
      insert_after:
        type: function
        name: add_exception_handlers
    changes:
      - action: modify_function
        description: >
          Update app_exception_handler: build ErrorResponse with type (URI format),
          title (human-readable from code), status, detail, code, details.
          Add StarletteHTTPException handler mapping to RFC 7807 format with
          appropriate ErrorCode (404→NOT_FOUND, 422→VALIDATION_ERROR, etc.).
          Update global_exception_handler to return RFC 7807 format with INTERNAL_ERROR.
          Ensure handler registration order: AppException → StarletteHTTPException → Exception.

  - path: src/mkobi/app.py
    targets:
      - type: function
        name: create_app
    semantic_anchors:
      insert_before:
        type: function
        name: _setup_static_files
    changes:
      - action: verify
        description: >
          Verify add_exception_handlers(application) is called in create_app()
          after route registration and before returning the application instance.

acceptance_criteria:
  - [ ] AppException handler produces RFC 7807 JSON with all fields
  - [ ] StarletteHTTPException handler produces same RFC 7807 format
  - [ ] Global exception handler returns INTERNAL_ERROR without leaking internals
  - [ ] Handlers registered in correct order in add_exception_handlers()
  - [ ] type field uses URI format: "https://api.mkobi.com/errors/{code}"
  - [ ] No print() statements
  - [ ] All type hints present

tests_to_run:
  - uv run ruff check src/mkobi/utils/exceptions.py src/mkobi/app.py
  - uv run mypy src/mkobi/utils/exceptions.py src/mkobi/app.py
  - uv run pytest tests/ -v -k "exception or error or handler" --no-header 2>&1 | Select-Object -Last 20

risks:
  - Handler registration order matters — wrong order causes incorrect responses
  - StarletteHTTPException handler may conflict with FastAPI's built-in validation error responses
  - Existing tests checking old response shape will need updates

estimated_effort: small
risk_level: low
