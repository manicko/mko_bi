id: TASK_003_add_error_handling_log_viewer

title: Add error handling to LogViewer component

status: pending

priority: high

depends_on: []

type: implementation

source_reference: C:\py_dev\mkobi\.ai\audit\validated\BUG-004-log-viewer-empty-table.md
source_section: Factor 5 — No error handling in LogViewer — silent failure

description: >
  The `LogViewer` component does not destructure `error` or `isError` from `useQuery`.
  When the API call fails (422, 500, network error), the user sees an empty table with
  no indication of what went wrong. Fix: add error state display using an Alert component,
  following the pattern used in `DashboardManagement.tsx`.

goals:
  - Destructure `error` and `isError` from `useQuery` in `LogViewer`
  - Display an error Alert when the query fails
  - Follow existing error display patterns from `DashboardManagement.tsx`
  - Show the error message to the user with a clear indication

files:
  - path: frontend/src/features/admin/ui/LogViewer.tsx
    targets:
      - type: component
        name: LogViewer
    semantic_anchors:
      insert_after:
        type: useQuery_call
        value: "const { data: logs = [], isLoading } = useQuery({"
    changes:
      - action: add_code
        description: >
          Destructure `error` and `isError` from `useQuery`:
          ```typescript
          const { data: logs = [], isLoading, error, isError } = useQuery({
          ```
      - action: add_code
        description: >
          Add error display in the JSX, before the DataGrid, after the filter Stack:
          ```typescript
          {isError && (
            <Alert severity="error" sx={{ mb: 2 }}>
              Failed to load logs: {error instanceof Error ? error.message : 'Unknown error'}
            </Alert>
          )}
          ```
          Import `Alert` from `@mui/material`.

acceptance_criteria:
  - When the API call fails, an error Alert is displayed to the user
  - The error message is visible and informative
  - When the API call succeeds, no error Alert is shown
  - No TypeScript compilation errors
  - Follows the same pattern as `DashboardManagement.tsx` error handling

tests_to_run:
  - cd frontend && npx tsc --noEmit

risk: low
effort: small
affected_modules:
  - frontend/src/features/admin/ui/LogViewer.tsx
