id: TASK_002_02_test_db_config

title: Test Database Configuration Improvements

status: pending

priority: high

depends_on: []

wave: 1

description: >
  Improve test database configuration: update async_db_session fixture to use
  SAVEPOINT pattern (session.begin_nested()) for proper rollback, add baseline_data
  session-scoped fixture, and register the fast pytest marker in pyproject.toml.

goals:
  - Replace simple rollback with SAVEPOINT pattern in async_db_session
  - Add baseline_data session-scoped fixture
  - Register fast marker in pyproject.toml

files:
  - path: tests/conftest.py
    targets:
      - type: fixture
        name: async_db_session
    semantic_anchors:
      replace:
        type: fixture
        name: async_db_session
    changes:
      - action: replace_fixture
        description: Replace simple rollback with SAVEPOINT pattern
        old_pattern: |
          @pytest.fixture(scope="function")
          async def async_db_session(async_session_maker):
              async with async_session_maker() as session:
                  yield session
                  await session.rollback()
                  await session.close()
        new_pattern: |
          @pytest.fixture(scope="function")
          async def async_db_session(async_session_maker):
              async with async_session_maker() as session:
                  async with session.begin_nested():
                      yield session
      - action: add_fixture
        description: Add baseline_data session-scoped fixture after async_session_maker
        insert_after:
          type: fixture
          name: async_session_maker
        fixture:
          name: baseline_data
          scope: session
          depends_on: setup_test_database
          body: |
            """Load minimal reference data once per test session."""
            # This fixture is a placeholder for future reference data loading.
            # Currently ensures the test database is properly initialized.
            yield

  - path: pyproject.toml
    targets:
      - type: config_section
        name: tool.pytest.ini_options
    semantic_anchors:
      insert_after:
        type: config_key
        value: markers
    changes:
      - action: add_marker
        description: Register fast marker in pytest.ini_options.markers
        marker:
          name: fast
          description: "marks tests that use Base.metadata.create_all() instead of full migrations"

acceptance_criteria:
  - async_db_session uses session.begin_nested() SAVEPOINT pattern
  - baseline_data session-scoped fixture exists
  - fast marker is registered in pyproject.toml
  - Existing tests continue to pass with new fixture behavior

tests_to_run:
  - "pytest tests/ -x -v"

risk_level: low

autonomous: true
