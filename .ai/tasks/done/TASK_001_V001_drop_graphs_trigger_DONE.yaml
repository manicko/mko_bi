id: TASK_001_V001_drop_graphs_trigger

title: Drop broken update_graphs_updated_at trigger on graphs table

status: pending

priority: critical

depends_on: []

description: >
  The migration 7130ecb0388c created an update_graphs_updated_at trigger on the graphs table,
  but the graphs table has no updated_at column. Any UPDATE to a graph row will crash.
  This task drops the broken trigger via a new Alembic migration.

finding_ref: V-001
severity: CRITICAL

goals:
  - Drop the broken update_graphs_updated_at trigger from the graphs table
  - Ensure the migration is idempotent (IF EXISTS)
  - Verify no other code depends on this trigger

files:
  - path: alembic/versions/7130ecb0388c_true_initial_migration.py
    note: Reference only — do not modify existing migration

  - path: alembic/versions/<new_migration>/
    targets:
      - type: migration_operation
        name: drop_trigger
    semantic_anchors:
      insert_after: op.create_table('graphs') equivalent in new migration
      operation: op.execute("DROP TRIGGER IF EXISTS update_graphs_updated_at ON graphs")

changes:
  - action: create_migration
    description: >
      Create a new Alembic migration that executes:
      DROP TRIGGER IF EXISTS update_graphs_updated_at ON graphs;
    code_hint: |
      def upgrade():
          op.execute("DROP TRIGGER IF EXISTS update_graphs_updated_at ON graphs")

      def downgrade():
          # Recreate trigger only if updated_at column exists
          pass

acceptance_criteria:
  - New migration file created and passes alembic upgrade/downgrade
  - Trigger update_graphs_updated_at no longer exists in the database
  - Existing graph UPDATE operations work without error
  - No regression in graph-related API endpoints

tests_to_run:
  - pytest tests/ -k "graph" -v
  - alembic upgrade head --sql (dry run verification)

risk_level: low

rollout_notes: >
  Safe to apply immediately. No dependencies. Reversible.
  The trigger is currently broken and causes runtime crashes on any graph update.
