  The temporary file cleanup in data_worker.py silently ignores exceptions
  with `except Exception: pass`, leaving orphaned temp files and masking
  debugging information. Replace the bare pass with proper logging to aid
  debugging and monitoring.

goals:
  - Replace silent exception swallowing with proper logging in temp file cleanup
  - Add logger.warning or logger.error when cleanup fails
  - Include the file path and exception details in the log message

files:
  - path: src/mkobi/workers/data_worker.py
    targets:
      - type: function
        name: _process_csv_file_async
    semantic_anchors:
