        value: temp file cleanup
    changes:
      - action: modify_code
        description: >
          Replace `except Exception: pass` in the temp file cleanup block with
          proper logging:
          except Exception:
              logger.warning("Failed to clean up temp file %s", temp_path, exc_info=True)

risks:
  - Very low risk: only changes logging behavior, not functional behavior
  - No changes to the cleanup logic itself

acceptance_criteria:
  - Failed temp file cleanup produces a warning log with file path and exception details
