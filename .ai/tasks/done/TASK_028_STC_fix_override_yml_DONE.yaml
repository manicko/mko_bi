id: TASK_028_STC_fix_override_yml

title: Fix docker-compose.override.yml — Remove Test Artifacts and Align With Standalone Test Compose

status: pending

priority: critical

depends_on:
  - TASK_025_STC_rewrite_compose_test
  - TASK_026_STC_cleanup_compose_yml

phase: STC
wave: 2

description: >
  docker-compose.override.yml still contains test-related configuration that
  conflicts with the new standalone test environment. TASK_026 cleaned
  docker-compose.yml but did NOT update the override. This task fixes the
  override to be a pure dev configuration file with zero test artifacts.

  Problems identified:
  1. RECREATE_TEST_DB: "true" in dev app — dev app should NOT create test DB;
     that is the sole responsibility of the standalone test compose (test-migrate service).
     With RECREATE_TEST_DB=true, the dev app tries to create bidb_test on the shared
     dev db container, which conflicts with the standalone test environment's test-db.
  2. DATABASE__TEST_DBNAME in dev app and dev migrate — unnecessary cruft, the dev
     environment only works with the main bidb database. TEST_DBNAME is only relevant
     inside the test compose.
  3. JWT__SECRET_KEY not set in override — production compose mandates it with :?
     syntax, meaning it MUST be resolvable. The override doesn't override it, so dev
     mode depends on .env having it. This works by accident, not by design. The override
     should explicitly set JWT__SECRET_KEY for dev.

  Root cause: TASK_026 only targeted docker-compose.yml. The override was missed.

goals:
  - Dev app does NOT attempt to create or migrate test databases
  - Dev app and dev migrate services have no TEST_DBNAME references
  - JWT__SECRET_KEY explicitly set in dev override for reliability
  - Override is a pure dev configuration file (no test artifacts)
  - Dev environment starts cleanly alongside standalone test environment

files:
  - path: docker-compose.override.yml
    targets:
      - type: service
        name: app
      - type: service
        name: migrate
    semantic_anchors:
      insert_after:
        - type: key
          name: AUTO_MIGRATE
          service: app
      insert_before:
        - type: key
          name: RECREATE_TEST_DB
          service: app
    changes:
      - action: remove_key
        description: >
          Remove RECREATE_TEST_DB: "true" from override app service.
          The dev app must NOT create test databases. Test DB creation is handled
          exclusively by the test-migrate service in docker-compose.test.yml.
        code_hint: |
          # Delete line 62:
          #   RECREATE_TEST_DB: "true"
          # Located in services.app.environment section of docker-compose.override.yml

      - action: remove_key
        description: >
          Remove DATABASE__TEST_DBNAME: bidb_test from override app service.
          Dev app only works with the main bidb database.
          TEST_DBNAME is only relevant inside the standalone test compose.
        code_hint: |
          # Delete line 55:
          #   DATABASE__TEST_DBNAME: bidb_test
          # Located in services.app.environment section of docker-compose.override.yml

      - action: remove_key
        description: >
          Remove DATABASE__TEST_DBNAME: bidb_test from override migrate service.
          Dev migrate only targets the main bidb database.
        code_hint: |
          # Delete line 19:
          #   DATABASE__TEST_DBNAME: bidb_test
          # Located in services.migrate.environment section of docker-compose.override.yml

      - action: add_key
        description: >
          Add JWT__SECRET_KEY to override app service environment.
          The production compose mandates JWT__SECRET_KEY with :? (required).
          The override must explicitly set it so dev mode doesn't depend on .env by accident.
          Insert after JWT__ALGORITHM.
        code_hint: |
          # Insert after line 56 (JWT__ALGORITHM: HS256):
          JWT__SECRET_KEY: dev-secret-key-for-local-development
          # This matches the existing .env value, now explicit in the override.

      - action: add_key
        description: >
          Add JWT__SECRET_KEY to override migrate service environment.
          The migrate service inherits JWT__SECRET_KEY: ${JWT__SECRET_KEY:?...} from
          production compose. Without it, migrate fails if .env is not loaded.
          Insert after JWT__ALGORITHM.
        code_hint: |
          # Insert after line 20 (JWT__ALGORITHM: HS256) in migrate service:
          JWT__SECRET_KEY: dev-secret-key-for-local-development

acceptance_criteria:
  - RECREATE_TEST_DB does not appear anywhere in docker-compose.override.yml
  - DATABASE__TEST_DBNAME does not appear anywhere in docker-compose.override.yml
  - JWT__SECRET_KEY is explicitly set in override app service environment
  - JWT__SECRET_KEY is explicitly set in override migrate service environment
  - docker-compose.override.yml is valid YAML
  - docker compose -f docker-compose.yml -f docker-compose.override.yml config validates
  - Dev app service environment has: ENV, DATABASE__HOST, DATABASE__PORT, DATABASE__USER,
    DATABASE__PASSWORD, DATABASE__ADMIN_USER, DATABASE__ADMIN_PASSWORD, DATABASE__DBNAME,
    JWT__SECRET_KEY, JWT__ALGORITHM, ADMIN_USERNAME, ADMIN_PASSWORD, LOGGING__LEVEL,
    AUTO_MIGRATE — and NO RECREATE_TEST_DB, NO DATABASE__TEST_DBNAME
  - Dev migrate service environment has: ENV, DATABASE__HOST, DATABASE__PORT,
    DATABASE__DBNAME, JWT__SECRET_KEY, JWT__ALGORITHM — and NO DATABASE__TEST_DBNAME

tests_to_run:
  - "docker compose -f docker-compose.yml -f docker-compose.override.yml config  # validate override syntax"
  - "Select-String -Path docker-compose.override.yml -Pattern 'RECREATE_TEST_DB'  # verify removed"
  - "Select-String -Path docker-compose.override.yml -Pattern 'DATABASE__TEST_DBNAME'  # verify removed"
  - "Select-String -Path docker-compose.override.yml -Pattern 'JWT__SECRET_KEY'  # verify present in both services"

risk_level: low

rollout_notes: >
  Low-risk task. Only removes test-specific env vars from the override and adds
  explicit JWT__SECRET_KEY. The production compose file and test compose file
  are NOT modified.

  This task MUST run before TASK_027 (gate verification). With RECREATE_TEST_DB=true
  still in the override, the gate would fail because:
  - Dev app tries to create bidb_test on the shared dev db container
  - This conflicts with the standalone test environment's test-db container
  - The dev app may fail or produce unpredictable behavior

  After this task, docker-compose.override.yml is a pure dev configuration:
  - Dev app connects to dev db (bidb), runs with hot reload
  - Dev migrate runs migrations on dev db (bidb)
  - Test environment is completely separate in docker-compose.test.yml

  Backward compatibility: Dev environment behavior is unchanged. The only difference
  is that the dev app no longer attempts to create a test database (which was already
  not needed for development workflows).
