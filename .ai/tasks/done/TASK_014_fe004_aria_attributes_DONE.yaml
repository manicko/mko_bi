---
id: TASK_014_fe004_aria_attributes
title: FE-004 — Add ARIA attributes to upload components for accessibility
status: pending
priority: low
type: implementation
depends_on:
  - TASK_003_fe001_circular_import

source_reference: .ai/audit/99-validation/02-frontend-validated.md
source_section: FE-004 — Missing Accessibility Attributes

description: >
  Several interactive elements in the upload feature lack proper accessibility
  attributes. The FileDropzone Paper element has no role, aria-label, or tabIndex.
  The ToggleButtonGroup has no aria-label. The file removal IconButton has no
  aria-label. Add proper ARIA attributes to all upload components.

goals:
  - Add role, aria-label, and tabIndex to FileDropzone Paper element
  - Add aria-label to ToggleButtonGroup in UploadModal
  - Add aria-label to file removal IconButton
  - Ensure drag-hover state changes have screen reader announcements

files:
  - path: frontend/src/features/upload/ui/FileDropzone.tsx
    targets:
      - type: component
        name: FileDropzone
    semantic_anchors:
      insert_after:
        type: JSX_element
        value: Paper element (lines 76-99)
    changes:
      - action: modify_code
        description: >
          Add role="button", aria-label="Drop files here or click to upload",
          and tabIndex={0} to the Paper element that uses getRootProps().
          Add an aria-live region for drag-hover state changes.

  - path: frontend/src/features/upload/ui/UploadModal.tsx
    targets:
      - type: component
        name: UploadModal
    semantic_anchors:
      insert_after:
        type: JSX_element
        value: ToggleButtonGroup (lines 183-195)
    changes:
      - action: modify_code
        description: >
          Add aria-label="Upload mode selection" to the ToggleButtonGroup.
          Ensure individual ToggleButton elements have proper accessible names.

risks:
  - Zero functionality risk: only adds HTML attributes
  - Can be applied incrementally per component

acceptance_criteria:
  - FileDropzone Paper has role, aria-label, and tabIndex attributes
  - ToggleButtonGroup has aria-label attribute
  - File removal button has aria-label attribute
  - Screen reader announces drag-drop area purpose and upload mode selection

tests_to_run:
  - cd frontend && npm run build
  - cd frontend && npm run lint
