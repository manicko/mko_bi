id: TASK_011_A04_improve_spa_path_check

title: Improve SPA catch-all path check robustness in app.py

status: pending

priority: low

type: implementation

finding_id: FINDING-A04
source: audit_validated_findings_001.md

depends_on:
  - TASK_006_verify_mandatory_fixes

description: >
  The SPAStaticFiles path check uses api/ prefix without leading slash.
  While the current implementation works for the defined route structure,
  it could be made more robust to handle edge cases.

goals:
  - Make SPA path check more robust (use set-based or regex check)
  - Prevent potential API route leakage to SPA catch-all
  - Current behavior preserved for all defined routes

files:
  - path: src/mkobi/app.py
    targets:
      - type: class
        name: SPAStaticFiles
    semantic_anchors:
      insert_after:
        type: function_call
        value: startswith
        context: path prefix check in SPAStaticFiles
    changes:
      - action: modify_code
        description: >
          Replace the simple string prefix check with a more robust approach:
          use path.startswith('/api/') (with leading slash) or maintain a set
          of API prefixes to check against.

acceptance_criteria:
  - API routes are still correctly excluded from SPA catch-all
  - All non-API, non-static paths still serve the React app
  - No behavioral change for current route structure

tests_to_run:
  - docker compose build
  - Verify API endpoints work and frontend routes work

risk: low
effort: small
rollback: Revert to original prefix check

notes: >
  Defensive improvement. The current implementation is functional.
  Only needed if route structure becomes more complex.
