id: TASK_002_inf001_fix_dockerfile_frontend_build

title: Fix INF-001 — Remove BuildKit cache mount breaking frontend build

status: done

priority: critical

depends_on: []

description: >
  Fix the CRITICAL RUNTIME-ERROR where BuildKit cache mount prevents node_modules
  from being written to the image layer. npm run build fails with `tsc: not found`.
  Production Docker image has no frontend.

source_file: .ai/audit/99-validation/05-docker-validated.md
source_section: INF-001 — Production Docker Build Fails — Frontend Stage tsc Not Found
validated: true
validation_notes: >
  Already implemented in working tree. The --mount=type=cache,target=/app/frontend/node_modules
  was removed from npm ci command. Dockerfile syntax validated with docker build --check.

files:
  - path: docker/Dockerfile
    targets:
      - type: directive
        name: RUN cache mount
    semantic_anchors:
      - type: function_call
        value: npm ci
    changes:
      - action: modify_code
        description: >
          Remove the --mount=type=cache,target=/app/frontend/node_modules cache mount
          from the npm ci command to ensure node_modules are written to image layer.

acceptance_criteria:
  - Docker production build succeeds with frontend compiled
  - npm run build completes without "tsc: not found" error
  - node_modules are present in the final image

risk_notes: >
  Low risk — BuildKit cache optimization removed. Slightly slower builds but correct.

tests_to_run:
  - command: docker compose -f docker/docker-compose.yml build app
    reason: Verify production build succeeds