id: TASK_025_V034
title: Add task ownership validation to upload process endpoint
status: pending
priority: low
depends_on: []

description: >
  The /upload/{dashboard_id}/process endpoint doesn't validate that the task belongs
  to the specified dashboard. A task for a different dashboard could be triggered.

goals:
  - Add validation that the task's dashboard_id matches the URL parameter
  - Return 400/404 if task doesn't belong to the specified dashboard

files:
  - path: src/mkobi/api/routes/upload.py
    targets:
      - type: function
        name: process_upload_endpoint
    semantic_anchors:
      - type: route_decorator
        description: "POST /upload/{dashboard_id}/process endpoint"
    changes:
      - action: add_validation
        description: "Add check that task belongs to the specified dashboard_id"
        code_hint: "Look up the task by task_id, verify task.dashboard_id == dashboard_id, raise HTTPException(404) if mismatch"

acceptance_criteria:
  - Processing a task for a different dashboard returns an error
  - Valid task-dashboard combinations still process correctly
  - Existing tests pass

tests_to_run:
  - uv run pytest tests/test_upload_api.py -x -v
  - uv run pytest tests/ -x -v

risk_level: low
notes: >
  Need to check how tasks are stored and whether they carry dashboard_id metadata.
