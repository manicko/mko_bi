id: TASK_005_03_05_remove_frontend_dist_mount

title: Remove frontend/dist Mount from App Service in Dev Override

status: done

priority: medium

depends_on:
  - TASK_003_03_03_add_frontend_dev_service

phase: PLAN_03
wave: 2

description: >
  The dev override currently mounts ./frontend/dist:/app/frontend/dist, which requires
  a pre-built frontend. With the Vite dev server running separately, this mount is
  unnecessary and misleading. Remove it so the backend works independently of frontend
  build state.

finding_ref: PLAN_03_WAVE_2
severity: medium

goals:
  - Remove the ./frontend/dist volume mount from the app service in the override
  - Backend API works independently of frontend build state
  - No pre-built frontend required for dev

files:
  - path: docker-compose.override.yml
    targets:
      - type: service
        name: app
      - type: volume_mount
        value: "./frontend/dist:/app/frontend/dist"
    semantic_anchors:
      insert_after:
        type: block
        value: "app:"
    changes:
      - action: remove_volume_mount
        description: Remove - ./frontend/dist:/app/frontend/dist from app service volumes

acceptance_criteria:
  - App service in dev mode doesn't require frontend/dist to exist
  - Backend API works independently of frontend build state
  - All other mounts (./src, ./alembic, ./tests) remain intact

docker_health_checks:
  - name: All containers running
    command: "docker compose ps --format json"
    expected: "All services (db, migrate, app, frontend) show 'running' status"
  - name: App starts without frontend/dist
    command: "rm -rf frontend/dist && docker compose up -d"
    expected: "App container starts successfully even though frontend/dist does not exist"
  - name: App health endpoint responds
    command: "curl -sf http://localhost:8000/health"
    expected: "Returns HTTP 200"
  - name: Frontend dev server still responds
    command: "curl -sf http://localhost:5173"
    expected: "Returns HTTP 200 (Vite dev server)"
  - name: No container restarts
    command: "docker compose ps --format '{{.Name}} {{.Status}}'"
    expected: "No container shows 'restarting' or 'unhealthy' status"
  - name: App logs show no mount errors
    command: "docker compose logs app --tail 30"
    expected: "No 'not found' or 'mount' errors related to frontend/dist"

tests_to_run:
  - "rm -rf frontend/dist"
  - "docker compose up -d"
  - "curl -sf http://localhost:8000/health  # verify backend starts"
  - "curl -sf http://localhost:5173  # verify frontend still works"

risk_level: low

rollout_notes: >
  Depends on TASK_003_03_03 (frontend dev service).
  Standalone removal. Rollback: re-add the volume mount line.
