id: TASK_001_remove_unused_typescript_imports

title: Remove 5 unused TypeScript imports across frontend

status: pending

priority: low

depends_on: []

description: >
  Remove 5 unused TypeScript type imports identified by VF-005 through VF-009 in
  audit_validated_findings_002.md. Each is a single-line removal in a different file.
  All are independent and can be executed as a single atomic commit.

goals:
  - Eliminate TS6196/TS6133 warnings for unused imports
  - Reduce dead code cognitive load
  - No runtime behavior changes

files:
  - path: frontend/src/features/admin/api/adminApi.ts
    targets:
      - type: import_statement
        name: UpdateUserRoleRequest
    semantic_anchors:
      remove:
        type: named_import
        value: UpdateUserRoleRequest
        context: import from '../../../shared/types/api.types'

  - path: frontend/src/features/auth/api/authApi.ts
    targets:
      - type: import_statement
        name: RegistrationRequest
    semantic_anchors:
      remove:
        type: named_import
        name: RegistrationRequest
        context: import from '../../../shared/types/api.types'

  - path: frontend/src/features/dashboards/ui/charts/PlotlyChart.tsx
    targets:
      - type: import_statement
        name: Data
    semantic_anchors:
      remove:
        type: named_import
        value: Data
        context: import type { Config, Data } from 'react-plotly.js'
        preserve: Config

  - path: frontend/src/features/dashboards/ui/DashboardFilters.tsx
    targets:
      - type: import_statement
        name: FilterConfig
    semantic_anchors:
      remove:
        type: named_import
        value: FilterConfig
        context: import from '../../../shared/types/api.types'

  - path: frontend/src/features/upload/ui/FileDropzone.tsx
    targets:
      - type: import_statement
        name: DropzoneOptions
    semantic_anchors:
      remove:
        type: named_import
        value: DropzoneOptions
        context: import { useDropzone, type DropzoneOptions, type FileRejection } from 'react-dropzone'
        preserve: [useDropzone, FileRejection]

changes:
  - action: remove_import
    description: Remove `UpdateUserRoleRequest` import from adminApi.ts
    files:
      - frontend/src/features/admin/api/adminApi.ts

  - action: remove_import
    description: Remove `RegistrationRequest` import from authApi.ts
    files:
      - frontend/src/features/auth/api/authApi.ts

  - action: remove_import
    description: Remove `Data` type import from PlotlyChart.tsx (keep `Config`)
    files:
      - frontend/src/features/dashboards/ui/charts/PlotlyChart.tsx

  - action: remove_import
    description: Remove `FilterConfig` import from DashboardFilters.tsx
    files:
      - frontend/src/features/dashboards/ui/DashboardFilters.tsx

  - action: remove_import
    description: Remove `DropzoneOptions` type import from FileDropzone.tsx (keep `FileRejection` and `useDropzone`)
    files:
      - frontend/src/features/upload/ui/FileDropzone.tsx

acceptance_criteria:
  - All 5 unused imports removed
  - `Config` type still importable in PlotlyChart.tsx
  - `FileRejection` type still importable in FileDropzone.tsx
  - `useDropzone` still importable in FileDropzone.tsx
  - Frontend build passes (npm run build)
  - No TypeScript errors

tests_to_run:
  - cd frontend && npm run build
  - cd frontend && npm run lint

risk_level: low

rollout_notes: >
  All 5 changes are in different files with no shared symbols. Removing unused imports
  cannot affect runtime behavior. Trivially safe rollback.

validated_finding_refs:
  - VF-005
  - VF-006
  - VF-007
  - VF-008
  - VF-009
