source_section: INF-006

description: >
  The `docker/docker-compose.test.yml` exposes ports 5433, 6380, and 8001 to the
  host for native test execution. This is intentional per documented design, but
  in CI/CD environments this could pose a security risk. Add a warning in the
  security documentation about avoiding test port exposure in CI/CD pipelines.

goals:
  - Document the security consideration for test port exposure in CI/CD
  - Recommend using `docker compose exec` instead of exposed ports in CI/CD
  - Maintain the existing design rationale for local development

files:
  - path: docs/10-deployment/security-checklist.md

    targets:
      - type: section
        name: Test Environment

    semantic_anchors:
      insert_after:
        type: heading
        value: Network Security

changes:
  - action: add_code

    description: >
      Add a warning section about test port exposure in CI/CD environments.
      Explain that while exposed ports are acceptable for local development,
      CI/CD pipelines should use `docker compose exec` to run tests inside
      the container network without exposing ports.

    code_hint: |
      ### Test Port Exposure in CI/CD

      The test compose file (`docker/docker-compose.test.yml`) exposes database
      and application ports to the host for convenient local test execution.
      In CI/CD environments, avoid exposing these ports:

      ```bash
      # Instead of relying on exposed ports, use:
      docker compose -f docker/docker-compose.test.yml exec app pytest tests/
      ```

