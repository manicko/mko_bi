id: TASK_016_fix_vite_windows_sigbus_crash

title: Fix Vite dev server SIGBUS crash on Windows Docker Desktop

status: pending

priority: high

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\05-docker-validated.md
source_section: INF-003

description: >
  The frontend Vite dev server crashes repeatedly on Docker Desktop for Windows
  with SIGBUS errors. While `CHOKIDAR_USEPOLLING=true` is already configured in
  `docker/docker-compose.override.yml`, additional environment configuration is
  needed to stabilize file watching on Windows.

goals:
  - Add Windows-specific Vite compatibility environment variables
  - Prevent SIGBUS crashes during file watching
  - Maintain hot-reload functionality

files:
  - path: docker/docker-compose.override.yml

    targets:
      - type: service
        name: frontend

    semantic_anchors:
      insert_after:
        type: environment_variable
        value: CHOKIDAR_USEPOLLING

changes:
  - action: add_code

    description: >
      Add `WATCHPACK_POLLING=true` environment variable to the frontend service
      in docker-compose.override.yml. This forces watchpack to use polling mode
      which avoids SIGBUS errors on Windows Docker Desktop.

    code_hint: |
      environment:
        - CHOKIDAR_USEPOLLING=true
        - WATCHPACK_POLLING=true

acceptance_criteria:
  - Frontend container starts without SIGBUS errors on Windows Docker Desktop
  - Hot-reload still works for frontend development
  - No regression on Linux/macOS environments

tests_to_run:
  - docker compose up frontend (verify stable startup on Windows)

risk: medium
risk_reason: >
  This change affects Docker compose override which is used in development.
  The change is additive (new env var) and should not affect non-Windows
  environments. However, the actual fix can only be verified on Windows.

rollback: Remove the WATCHPACK_POLLING environment variable.
