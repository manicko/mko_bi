id: TASK_005_fix_uuid_none_type_in_data_service_check_access

title: Fix UUID|None type mismatch in data_service.py check_dashboard_access()

status: completed

priority: high

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\findings.md
source_section: BE-002

description: >
  In `data_service.py`, `log.dashboard_id` (typed as `UUID | None`) is passed to
  `check_dashboard_access()` which requires a non-nullable `UUID`. This occurs at
  lines 324-325 (get_processing_status) and lines 352-353 (get_processing_result).
  When `log.dashboard_id` is None, access checks would fail or raise errors.
  Add null checks before access verification.

goals:
  - Add null check for dashboard_id before calling check_dashboard_access() in get_processing_status
  - Add null check for dashboard_id before calling check_dashboard_access() in get_processing_result
  - Raise AppException with appropriate ErrorCode when dashboard_id is None
  - Pass ruff and mypy checks

files:
  - path: src/mkobi/services/data_service.py
    targets:
      - type: method
        name: get_processing_status
      - type: method
        name: get_processing_result
    semantic_anchors:
      insert_after:
        type: function_call
        value: check_dashboard_access
    changes:
      - action: add_code
        description: >
          In both `get_processing_status` (around line 324) and `get_processing_result`
          (around line 352), before the `if user_id:` block that calls
          `check_dashboard_access(user_id=user_id, dashboard_id=log.dashboard_id, ...)`,
          add a guard: `if log.dashboard_id is None:` raise AppException with
          ErrorCode.VALIDATION_ERROR and detail "Processing log has no associated dashboard".
          This ensures the None value never reaches check_dashboard_access() which requires
          non-nullable UUID.

acceptance_criteria:
  - When dashboard_id is None, AppException is raised before check_dashboard_access()
  - When dashboard_id is not None, existing behavior is preserved
  - Type checker (mypy) passes — no UUID|None passed to non-nullable UUID parameter
  - ruff and mypy pass without errors

tests_to_run:
  - pytest tests/ -x -q --tb=short

risk: low
effort: small
rollback: trivial
