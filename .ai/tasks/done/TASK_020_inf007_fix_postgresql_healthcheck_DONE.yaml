id: TASK_020_inf007_fix_postgresql_healthcheck

title: Fix INF-007 — Fix PostgreSQL healthcheck with -d flag and start_period

status: done

priority: medium

depends_on: []

description: >
  Fix the MEDIUM issue where PostgreSQL healthcheck uses `pg_isready -U postgres` without
  specifying the database name, causing auth failures during initialization. Add `-d` flag
  with the correct database name and add start_period of 10 seconds.

source_file: .ai/audit/99-validation/05-docker-validated.md
source_section: INF-007: PostgreSQL Auth Failures — Fix Healthcheck and Add start_period

files:
  - path: docker/docker-compose.yml
    targets:
      - type: healthcheck
        service: db
    semantic_anchors:
      find:
        type: healthcheck_test
        value: pg_isready -U postgres
  - path: docker/docker-compose.test.yml
    targets:
      - type: healthcheck
        service: test-db

changes:
  - action: replace_code
    description: >
      In docker-compose.yml db service: change healthcheck to `pg_isready -U postgres -d bidb`
      with `start_period: 10s`.
      In docker-compose.test.yml test-db service: change to `pg_isready -U postgres -d bidb_test`
      with `start_period: 10s`.
    code_hint: |
      # Production compose (db service):
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d bidb"]
        interval: 5s
        timeout: 5s
        retries: 5
        start_period: 10s

      # Test compose (test-db service):
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d bidb_test"]
        interval: 5s
        timeout: 5s
        retries: 5
        start_period: 10s

acceptance_criteria:
  - Both healthchecks specify the correct database name with -d flag
  - Both have start_period: 10s
  - No auth failure logs during PostgreSQL initialization

risk_notes: >
  Low risk — the application database names are `bidb` (production) and `bidb_test` (test).

tests_to_run:
  - command: docker compose -f docker/docker-compose.test.yml config
    reason: Verify test compose healthcheck is valid
  - command: uv run ruff check --select=docker docker/
    reason: Verify no Docker linting issues
  - command: uv run mypy docker/
    reason: Verify no type issues in related code

implemented_in_commit: 5c7493e
implemented_date: 2026-06-16