description: >
  Add a useFilterValues TanStack Query hook to dashboardApi.ts that fetches filter values
  from the new GET /dashboards/{id}/filter-values endpoint. Then modify DashboardFilters.tsx
  to use dynamic values from the API when a filter's config.source === 'data', instead of
  using static config.options only.

goals:
  - useFilterValues hook fetches from /dashboards/{id}/filter-values?filter_name={name}
  - DashboardFilters uses dynamic values from API when config.source === 'data'
  - Falls back to static config.options when source !== 'data' or not set
  - Chips and MenuItems render correctly for multiselect type with dynamic values
  - ALWAYS call useFilterValues unconditionally (enabled flag prevents fetch when not ready)
  - TypeScript typecheck passes on modified files

files:
  - path: frontend/src/features/dashboards/api/dashboardApi.ts

    targets:
      - type: hook
        name: useFilterValues

    semantic_anchors:
      insert_after:
        type: hook
        name: useInvalidateDashboard

    changes:
      - action: edit_file
        description: |
          Add to dashboardApi object:
            getFilterValues: async (dashboardId: string, filterName: string) => {
              const response = await axiosInstance.get(
                `/dashboards/${dashboardId}/filter-values`,
                { params: { filter_name: filterName } }
              )
              return response.data  // { filter_name: string, values: string[] }
            }

          Add new hook (ALWAYS called unconditionally -- use enabled flag, never conditional hook calls):
          export function useFilterValues(dashboardId: string, filterName: string) {
            const accessToken = getToken()
            return useQuery({
              queryKey: ['filterValues', dashboardId, filterName],
              queryFn: () => dashboardApi.getFilterValues(dashboardId, filterName),
              enabled: !!dashboardId && !!filterName && !!accessToken,
            })
          }

  - path: frontend/src/features/dashboards/ui/DashboardFilters.tsx

    targets:
      - type: component
        name: FilterField

    semantic_anchors:
      modify_within:
        type: component
        name: FilterField

    changes:
      - action: edit_file
        description: |
          Modify the FilterField component to support dynamic filter values:

          1. Add import for useFilterValues hook.
          2. In FilterField, check if filter.config.source === 'data'.
          3. Use dynamic values for MenuItem options when source === 'data', falling back
             to config.options or empty array otherwise.

          Pattern:
          function FilterField({ filter, value, onChange, dashboardId }: FilterFieldProps) {
            const config = filter.config
            // ALWAYS call useFilterValues unconditionally -- never conditionally.
            // The enabled flag inside the hook prevents actual fetches when source !== 'data'.
            const { data: filterValuesData } = useFilterValues(dashboardId, filter.name)
            const dynamicValues = config.source === 'data' ? (filterValuesData?.values || []) : []
            const options = config.source === 'data'
              ? dynamicValues.map(v => ({ label: v, value: v }))
              : (config.options || [])
            // ... rest of component uses `options` for MenuItem rendering
          }

          Note: Need to pass dashboardId into FilterField -- either lift from DashboardView or
          via context. Simplest: pass as additional prop from DashboardFilters.

