id: TASK_007_add_session_scoped_temp_file_cleanup_in_conftest

title: Add session-scoped temp file cleanup in conftest.py

status: completed

priority: high

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\findings.md
source_section: BE-007

description: >
  After running all tests, 42+ temp files remain in the temp uploads directory.
  The SPEC mandates that temp files must be deleted after processing. The
  `setup_temp_dir_fixture` in conftest.py only cleans up for `test_file_cleanup.py`
  tests. Other test modules do not clean up their temp files. Add a session-scoped
  autouse fixture or pytest_sessionfinish hook that calls cleanup_stale_temp_files()
  after all tests complete.

goals:
  - Add session-scoped cleanup that removes temp files after all tests complete
  - Use existing cleanup_stale_temp_files() from mkobi.services.file_cleanup
  - Ensure no temp files remain after test suite runs
  - Pass all existing tests

files:
  - path: tests/conftest.py
    targets:
      - type: function
        name: pytest_sessionfinish
    semantic_anchors:
      insert_after:
        type: function_definition
        value: pytest_sessionstart
    changes:
      - action: add_code
        description: >
          Add a `pytest_sessionfinish` hook function that cleans up temp files after
          all tests complete. The hook should:
          1. Import `cleanup_stale_temp_files` from `mkobi.services.file_cleanup`
          2. Call it to remove any remaining temp files
          3. Use `asyncio.run()` or similar if the cleanup function is async
          4. Wrap in try/except to avoid failing the test session on cleanup errors
          5. Log any cleanup failures but not raise them

acceptance_criteria:
  - After test suite completes, no temp files remain in the temp upload directory
  - All existing tests continue to pass
  - Cleanup runs even if tests fail
  - Cleanup errors are logged but do not fail the test session

tests_to_run:
  - pytest tests/ -x -q --tb=short

risk: low
effort: small
rollback: trivial
