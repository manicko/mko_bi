id: TASK_015_D02_doc_port_8000_access

title: Document port 8000 direct access behavior in development

status: completed

priority: low

type: doc-update

finding_id: FINDING-D02
source: audit_validated_findings_001.md

depends_on:
  - TASK_006_verify_mandatory_fixes

description: >
  Accessing http://localhost:8000/ directly serves the production React build,
  which expects secure cookies and uses memory-only token storage. Over HTTP,
  this creates an impossible auth situation. The intended flow is:
  frontend at port 5173 → proxies /api to backend at 8000.

goals:
  - Document that port 8000 is not the intended entry point in dev
  - Explain the intended dev flow (5173 → 8000)
  - Clarify why direct 8000 access doesn't work for auth

files:
  - path: docs/README_DOCKER.md
    targets:
      - type: section
        context: Development environment / port access section
    semantic_anchors:
      insert_after:
        type: heading
        context: Development setup or Port mapping section
    changes:
      - action: add_section
        description: >
          Add a note explaining that port 8000 serves the backend API and
          production React build. Over HTTP, the production build cannot
          authenticate (secure cookies rejected). The intended development
          entry point is http://localhost:5173 which proxies /api to 8000.

acceptance_criteria:
  - README_DOCKER.md documents the intended dev flow
  - Explanation of why direct 8000 access fails for auth in dev

tests_to_run:
  - Review the documentation for clarity

risk: none
effort: trivial
rollback: Remove the added documentation section

notes: >
  Doc-only change. This is expected behavior, not a bug.
  Downgraded from HIGH severity — the problem report was incorrect.
