id: TASK_008_D01_fix_root_user_dev

title: Fix Root User in Dev Stage and Override

status: pending

priority: critical

depends_on: []

phase: DOCKER_HARDENING
wave: 1

description: >
  Two related security issues: (1) docker-compose.override.yml sets user: root for
  the app service, granting container processes full root access. (2) The Dockerfile
  dev stage has no USER app instruction (test and prod stages correctly use USER app).
  Fix both to run as non-root in dev mode.

finding_ref: DOCKER-001, DOCKER-006
severity: critical

goals:
  - Add USER app to Dockerfile dev stage
  - Remove user: root from docker-compose.override.yml app service
  - Handle egg-info write permissions via build-time chown or entrypoint script
  - Dev container runs as non-root user

files:
  - path: Dockerfile
    targets:
      - type: stage
        name: dev
    semantic_anchors:
      insert_after:
        type: comment
        value: "# Run as root in dev mode"
    changes:
      - action: add_directive
        description: Add USER app to dev stage
        code_hint: "USER app"
      - action: modify_comment
        description: Update comment to reflect non-root dev mode
        old_value: "# Run as root in dev mode (needed for writable mounted volumes with egg-info)"
        new_value: "# Run as app user in dev mode"

  - path: docker-compose.override.yml
    targets:
      - type: service
        name: app
      - type: directive
        name: user
    semantic_anchors:
      insert_after:
        type: block
        value: "app:"
    changes:
      - action: remove_directive
        description: Remove user: root from app service in override

acceptance_criteria:
  - Dockerfile dev stage has USER app instruction
  - docker-compose.override.yml does not set user: root for app service
  - Dev container runs as non-root user
  - App starts and functions correctly as non-root user

docker_health_checks:
  - name: Rebuild required (Dockerfile changed)
    command: "docker compose down -v && docker compose build app && docker compose up -d"
    expected: "Build succeeds, all containers start"
  - name: All containers running
    command: "docker compose ps --format json"
    expected: "All services (db, migrate, app) show 'running' status"
  - name: App runs as non-root user
    command: "docker compose exec app whoami"
    expected: "Returns 'app', NOT 'root'"
  - name: App health endpoint responds
    command: "curl -sf http://localhost:8000/health"
    expected: "Returns HTTP 200"
  - name: App logs show clean startup
    command: "docker compose logs app --tail 50"
    expected: "No ERROR or CRITICAL lines; no permission-denied errors"
  - name: No container restarts
    command: "docker compose ps --format '{{.Name}} {{.Status}}'"
    expected: "No container shows 'restarting' or 'unhealthy' status"
  - name: Writable volumes still accessible
    command: "docker compose exec app touch /app/src/test_write && docker compose exec app rm /app/src/test_write"
    expected: "App can write to mounted volume (egg-info, source mounts)"
  - name: Migrate service completed
    command: "docker compose ps migrate --format json"
    expected: "migrate service exited with code 0"

tests_to_run:
  - "docker compose down -v && docker compose build app && docker compose up -d"
  - "docker compose exec app whoami  # should return 'app', not 'root'"
  - "curl -sf http://localhost:8000/health  # verify app is up"
  - "docker compose exec app touch /app/src/test_write && rm /app/src/test_write  # verify write access"

risk_level: medium

rollout_notes: >
  CRITICAL security fix. Pair DOCKER-001 (override) and DOCKER-006 (Dockerfile) together.
  May need to handle volume permissions — if egg-info write fails, add build-time chown
  or an entrypoint script that fixes permissions before switching to app user.
