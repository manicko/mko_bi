source_section: Wave 1 — TASK_01_01 — Create ErrorCode StrEnum and restructure ErrorResponse/AppException
source_file: C:\py_dev\mkobi\.ai\plans\tasks\PLAN_01_01_error_code_enum.yaml

description: >
  Foundation task: creates the centralized ErrorCode(StrEnum) and restructures
  ErrorResponse and AppException to support RFC 7807 Problem Details format.
  This task must complete before all other waves.

goals:
  - Create ErrorCode(StrEnum) with ~40 codes in src/mkobi/models/enums.py
  - Restructure ErrorResponse model to RFC 7807 shape (type, title, status, detail, code, details)
  - Update AppException constructor to accept code: ErrorCode and details: dict | None
  - Update all 4 existing AppException subclasses + add 2 new (AuthenticationException, ConflictException)
  - Create status code mapping mechanism on AppException
  - Update add_exception_handlers() to produce RFC 7807 JSON
  - Add StarletteHTTPException handler producing same RFC 7807 format

files:
  - path: src/mkobi/models/enums.py
    targets:
      - type: class
        name: StrEnum
    semantic_anchors:
      insert_after:
        type: class
        value: AggregationFunctionEnum
    changes:
      - action: add_code
        description: >
          Add ErrorCode(StrEnum) class with all error codes after the last existing enum.
          Categories: General (INTERNAL_ERROR, SERVICE_UNAVAILABLE, RATE_LIMIT_EXCEEDED),
          Auth (AUTHENTICATION_FAILED, TOKEN_EXPIRED, TOKEN_REVOKED, INVALID_TOKEN),
          Authorization (PERMISSION_DENIED, INSUFFICIENT_PERMISSIONS, ACCESS_DENIED),
          Resource (NOT_FOUND, DASHBOARD_NOT_FOUND, USER_NOT_FOUND, GRAPH_NOT_FOUND,
          FILTER_NOT_FOUND, LAYOUT_NOT_FOUND, PROCESSING_CONFIG_NOT_FOUND),
          Validation (VALIDATION_ERROR, INVALID_EMAIL, INVALID_PASSWORD,
          MISSING_REQUIRED_FIELD, INVALID_FIELD_VALUE),
          File (FILE_UPLOAD_ERROR, FILE_TOO_LARGE, INVALID_FILE_TYPE, FILE_PROCESSING_ERROR),
          Conflict (EMAIL_ALREADY_EXISTS, FILTER_ALREADY_BOUND, DUPLICATE_RESOURCE),
          Processing (PROCESSING_FAILED, PROCESSING_IN_PROGRESS).

  - path: src/mkobi/utils/exceptions.py
    targets:
      - type: class
        name: ErrorResponse
      - type: class
        name: AppException
      - type: function
        name: add_exception_handlers
    semantic_anchors:
      insert_after:
        type: class
        name: FileUploadException
    changes:
      - action: modify_class
        description: >
          Restructure ErrorResponse from {error, detail, code} to RFC 7807 shape:
          {type: str, title: str, status: int, detail: str, code: ErrorCode, details: dict | None}.
          type uses URI pattern "https://api.mkobi.com/errors/{code}".
      - action: modify_class
        description: >
          Update AppException constructor: replace error_code: str with code: ErrorCode (required),
          add details: dict | None (optional). Derive status_code from code mapping.
      - action: modify_class
        description: >
          Update NotFoundException, PermissionDeniedException, ValidationException,
          FileUploadException to use ErrorCode values. Add AuthenticationException
          (code=AUTHENTICATION_FAILED, status_code=401) and ConflictException
          (code=EMAIL_ALREADY_EXISTS, status_code=409).
      - action: add_code
        description: >
          Add status_code mapping mechanism (class-level dict or @classmethod)
          mapping ErrorCode → HTTP status code per PLAN_01.md section 3.3.
      - action: modify_function
        description: >
          Update add_exception_handlers(): AppException handler builds ErrorResponse
          with all RFC 7807 fields. Add StarletteHTTPException handler mapping
          to RFC 7807 format. Global handler returns INTERNAL_ERROR without leaking internals.
          Handler order: AppException → StarletteHTTPException → Exception.

acceptance_criteria:
  - [ ] ErrorCode(StrEnum) exists in src/mkobi/models/enums.py with all listed codes
  - [ ] ErrorResponse model has RFC 7807 fields: type, title, status, detail, code, details
  - [ ] AppException accepts code: ErrorCode and details: dict | None
  - [ ] AppException subclasses use ErrorCode values
  - [ ] Status code mapping correctly derives HTTP code from ErrorCode
  - [ ] Exception handlers produce RFC 7807 JSON responses
  - [ ] StarletteHTTPException handler produces same RFC 7807 format
  - [ ] No print() statements added
  - [ ] All type hints present
  - [ ] All docstrings in English

tests_to_run:
  - uv run ruff check src/mkobi/models/enums.py src/mkobi/utils/exceptions.py
  - uv run mypy src/mkobi/models/enums.py src/mkobi/utils/exceptions.py
  - uv run pytest tests/ -v -k "exception or error" --no-header 2>&1 | Select-Object -Last 20

risks:
  - Status code mapping must be comprehensive — missing mappings cause 500 errors
  - Existing tests referencing old ErrorResponse fields (error, code as str) will break
  - StarletteHTTPException handler must not interfere with FastAPI's default validation errors
  - ValidationException status code changes from 400 to 422 — existing tests checking for 400 will fail

estimated_effort: medium
risk_level: medium
wave: 1
