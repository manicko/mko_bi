id: TASK_001_remove_package_lock_from_dockerignore

title: Remove frontend/package-lock.json from .dockerignore

status: done

priority: high

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\05-docker-validated_0906.md
source_section: INF-03 — Frontend Lock File Excluded from Docker Build

description: >
  Remove the `frontend/package-lock.json` exclusion from `.dockerignore` line 69
  so that the lock file is included in the Docker build context. This ensures
  reproducible frontend builds by allowing `npm install` to use pinned dependency
  versions from the lock file instead of resolving floating versions from
  `package.json`.

goals:
  - Enable reproducible frontend Docker builds
  - Ensure npm install uses pinned dependency versions from package-lock.json
  - Eliminate risk of unexpected dependency version changes between builds

files:
  - path: C:\py_dev\mkobi\.dockerignore
    targets:
      - type: line
        name: frontend/package-lock.json exclusion
    semantic_anchors:
      insert_after: N/A (removal)
      insert_before: N/A (removal)
    changes:
      - action: remove_line
        description: >
          Remove line 69 `frontend/package-lock.json` from .dockerignore.
          This allows the lock file to be included in the Docker build context.
        line_content: "frontend/package-lock.json"

acceptance_criteria:
  - .dockerignore does not contain `frontend/package-lock.json`
  - `frontend/package-lock.json` exists in the repository
  - Docker build context includes frontend/package-lock.json (verified via `docker build` output or `docker compose build --no-cache`)
  - `npm install` in the Dockerfile frontend-builder stage uses the lock file

tests_to_run:
  - docker compose -f docker/docker-compose.yml build --no-cache app

risk: low
risk_rationale: >
  Single-line removal from .dockerignore. The lock file already exists in the
  repository. The change only affects the Docker build context — no runtime
  behavior is modified. The Dockerfile already copies `frontend/package*.json`
  which will now include the lock file.

rollback: Add `frontend/package-lock.json` back to .dockerignore line 69.
