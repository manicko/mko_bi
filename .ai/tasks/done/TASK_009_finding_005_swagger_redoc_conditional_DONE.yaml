id: TASK_009_finding_005_swagger_redoc_conditional

title: Conditionally disable Swagger UI and ReDoc in production environment

type: implementation

status: pending

priority: critical

depends_on:
  - TASK_008_verify_finding_003_admin_creds_enforcement

description: >
  src/mkobi/app.py sets docs_url="/docs" and redoc_url="/redoc" unconditionally in create_app().
  These endpoints expose the full API schema, endpoint structure, parameter details, and data
  models to anyone who can reach the server. In production, this is information disclosure.
  Conditionally disable based on environment.

goals:
  - Disable /docs and /redoc endpoints when environment is PRODUCTION
  - Keep endpoints enabled in development/test environments
  - Use existing EnvironmentEnum.PRODUCTION already imported in create_app()

files:
  - path: src/mkobi/app.py
    targets:
      - type: function
        name: create_app
    semantic_anchors:
      insert_after:
        type: function_call
        value: get_config
      modify_within:
        type: function_call
        value: FastAPI
    changes:
      - action: modify_code
        description: >
          Change docs_url and redoc_url parameters in FastAPI() constructor to be
          conditionally set based on config.environment.
        code_hint: |
          docs_url=None if config.environment == EnvironmentEnum.PRODUCTION else "/docs",
          redoc_url=None if config.environment == EnvironmentEnum.PRODUCTION else "/redoc",

acceptance_criteria:
  - /docs returns 404 when environment is PRODUCTION
  - /docs returns 200 when environment is not PRODUCTION
  - EnvironmentEnum.PRODUCTION is already imported — no new imports needed
  - No other behavior changes in create_app()

tests_to_run:
  - uv run pytest tests/ -k "app or docs or redoc" -v || echo "No matching tests"

risk_level: low

rollout_notes: >
  Isolated change in create_app(). EnvironmentEnum already imported and used in same function.
  Zero risk: only affects documentation endpoint availability.
