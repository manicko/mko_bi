id: TASK_050_int009_add_filter_values_consistency_test

title: Fix INT-009 — Add filter values consistency test after APPEND upload

status: done

priority: medium

depends_on:
  - TASK_002_dp02_clear_filter_values_append_mode

description: >
  Fix the MEDIUM issue where filter values consistency after APPEND upload is untested.
  Add a test that verifies filter values match the uploaded data after both OVERWRITE
  and APPEND uploads.

source_file: .ai/audit/99-validation/90-integration-validated.md
source_section: INT-009: Filter Values Consistency is Untested

files:
  - path: tests/test_filter_values_consistency.py
    targets:
      - type: method
        name: test_filter_values_after_overwrite
      - type: method
        name: test_filter_values_after_append
  - path: src/mkobi/workers/data_worker.py
    targets:
      - type: function
        name: _store_aggregates

changes:
  - action: add_code
    description: >
      Add test_filter_values_consistency.py with two tests:
      - test_filter_values_after_overwrite: Upload in OVERWRITE mode, verify filter values match new data
      - test_filter_values_after_append: Upload in APPEND mode, verify filter values include all data
  - action: replace_code
    description: >
      Fix APPEND mode filter value extraction to use all accumulated data.
      In APPEND mode, after save_aggregates() upserts the new data, fetch all
      aggregates via manager.get_aggregates() to extract filter values from the
      combined dataset. This ensures filter values reflect all data in the dashboard.

acceptance_criteria:
  - Test verifies filter values match data after OVERWRITE upload
  - Test verifies filter values match data after APPEND upload
  - APPEND mode extracts filter values from all accumulated data (existing + new)
  - All tests pass

risk_notes: >
  Low risk — adds a new test file. Depends on DP-02 fix.

tests_to_run:
  - command: pytest tests/test_filter_values_consistency.py -v --no-cov
    reason: Verify filter values consistency test passes
  - command: pytest tests/test_data_worker.py -v --no-cov
    reason: Verify existing data_worker tests still pass
