id: TASK_009_rewrite_empty_password_test

title: Rewrite test_register_user_empty_password to actually verify behavior

status: pending

priority: low

depends_on:
  - TASK_001_fix_trailing_slash_redirect

type: implementation

description: >
  Rewrite test_register_user_empty_password in test_auth_service.py. The
  current test asserts isinstance(result, UserRead) but the password_hash
  check is a no-op because UserRead doesn't have password_hash. The test
  provides a false sense of security.

goals:
  - Rewrite test to verify empty password is handled correctly
  - Either verify registration raises validation error (preferred)
  - Or verify created user can authenticate with empty password
  - Remove the no-op assertion

files:
  - path: tests/test_auth_service.py
    targets:
      - type: class
        name: TestAuthService
      - type: method
        name: test_register_user_empty_password
    semantic_anchors:
      find:
        - type: function
          value: test_register_user_empty_password

changes:
  - action: update_code
    description: Rewrite test to actually verify empty password behavior
    target: tests/test_auth_service.py
    code_hint: |
      # Option A (preferred): Verify validation error is raised
      async def test_register_user_empty_password(self, ...):
          with pytest.raises(ValidationException):
              await auth_service.register_user(
                  UserCreate(email="test@example.com", password="")
              )

      # Option B: Verify user can authenticate
      async def test_register_user_empty_password(self, ...):
          result = await auth_service.register_user(...)
          assert isinstance(result, UserRead)
          # Verify authentication works with empty password
          auth_result = await auth_service.login_user(
              LoginRequest(email="test@example.com", password="")
          )
      assert auth_result is not None

acceptance_criteria:
  - test_register_user_empty_password no longer has the no-op assertion
  - Test actually verifies a meaningful behavior (error or auth)
  - Test passes with the new implementation

risks:
  - Low: Need to check if the service currently allows or rejects empty passwords

tests_to_run:
  - command: uv run pytest tests/test_auth_service.py::TestAuthService::test_register_user_empty_password -v
    purpose: Verify the rewritten test passes
  - command: uv run pytest tests/test_auth_service.py -v
    purpose: Verify all auth service tests pass

estimated_effort: small

risk_level: low
