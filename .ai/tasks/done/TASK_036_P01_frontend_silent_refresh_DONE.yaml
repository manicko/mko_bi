id: TASK_036_P01_frontend_silent_refresh

title: Implement silent refresh on app initialization

status: done

priority: high

depends_on:
  - TASK_035_P01_frontend_refresh_api

phase: PLAN_01
wave: 4

description: >
  Modify the frontend auth hook (useAuth) to perform silent token refresh on
  app initialization when no access token exists but a refresh cookie is
  present. This keeps users logged in across page refreshes.

finding_ref: PLAN_01_WAVE_4
severity: high

goals:
  - Add silent refresh logic in useAuth useEffect
  - Handle refresh with credentials: 'include'
  - App stays logged in after page refresh
  - Graceful handling of refresh failures
  - No loading screen interruption

files:
  - path: frontend/src/features/auth/model/useAuth.ts
    targets:
      - type: hook
        name: useAuth
    semantic_anchors:
      insert_after:
        type: hook_definition
        value: useAuth
    changes:
      - action: add_code_block
        description: Add silent refresh on mount
        code_hint: |
          useEffect(() => {
            const initAuth = async () => {
              const token = getAccessToken();
              if (!token) {
                try {
                  const newToken = await refreshToken();
                  setAccessToken(newToken.access_token);
                } catch {
                  // Refresh failed, user needs to log in again
                  clearAccessToken();
                }
              }
            };
            initAuth();
          }, []);

acceptance_criteria:
  - App stays logged in after page refresh
  - No loading screen interruption
  - Graceful handling of refresh failures
  - Silent refresh only attempts when no access token exists

tests_to_run:
  - "npm test -- --testPathPattern=auth --verbose"
  - Manual test: refresh page and verify automatic re-login

risk_level: medium

rollout_notes: >
  Depends on TASK_035 for refreshToken function.
  Must handle network errors gracefully to avoid blocking app render.
