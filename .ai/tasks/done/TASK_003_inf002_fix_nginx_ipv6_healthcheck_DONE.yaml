id: TASK_003_inf002_fix_nginx_ipv6_healthcheck

title: Fix INF-002 — Nginx IPv6 healthcheck mismatch

status: pending

priority: high

depends_on: []

description: >
  Fix the HIGH RUNTIME-ERROR where Nginx binds to IPv4 only (`listen 80;`) but
  healthcheck resolves `localhost` to IPv6 `[::1]`. Healthcheck permanently fails
  (458+ consecutive failures).

source_file: .ai/audit/99-validation/05-docker-validated.md
source_section: INF-002 — PostgreSQL Auth Failures — Fix Healthcheck and Add start_period

files:
  - path: docker/nginx/nginx.conf
    targets:
      - type: server_block
    semantic_anchors:
      - type: directive
        value: listen
    changes:
      - action: modify_code
        description: >
          Change IPv4-only listen directive to dual-stack: `listen [::]:80;`.

acceptance_criteria:
  - Nginx starts and listens on both IPv4 and IPv6
  - Healthcheck passes (container shows healthy)
  - No regression in HTTP service

risk_notes: >
  Low risk — Single directive change for dual-stack binding.

tests_to_run:
  - command: docker compose -f docker/docker-compose.yml up -d app nginx
    reason: Verify Nginx healthcheck passes
  - command: docker ps --filter "health=healthy" --filter "name=app"
    reason: Verify container health status