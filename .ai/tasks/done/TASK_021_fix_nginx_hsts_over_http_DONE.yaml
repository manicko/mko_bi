id: TASK_021_fix_nginx_hsts_over_http

title: Remove HSTS header from HTTP nginx server block (DC-006)

status: done

priority: medium

depends_on: []

description: >
  The nginx configuration adds Strict-Transport-Security (HSTS) header on port 80 (HTTP).
  HSTS is only meaningful over HTTPS and should not be sent on plain HTTP connections.
  The HSTS header should only be added in the HTTPS server block (when TLS is configured).

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: DC-006

goals:
  - Remove HSTS header from the HTTP server block
  - Add a commented HTTPS server block template with HSTS for production TLS setup
  - Document that HSTS requires HTTPS

files:
  - path: docker/nginx/nginx.conf
    targets:
      - type: directive
        name: Strict-Transport-Security
    semantic_anchors:
      - remove_directive:
          value: "add_header Strict-Transport-Security"
          description: Remove HSTS from HTTP server block
      - add_commented_https_block:
          description: Add commented HTTPS server block with HSTS

changes:
  - action: modify
    description: >
      Remove the HSTS header from the HTTP server block. Add a commented HTTPS
      server block template that includes HSTS for when TLS is configured.

    code_hint: |
      # BEFORE (line 21):
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

      # AFTER:
      # NOTE: HSTS header should only be set on HTTPS connections.
      # See the commented HTTPS server block below for proper HSTS configuration.

      # HTTPS server block template (uncomment and configure for production):
      # server {
      #     listen 443 ssl;
      #     server_name _;
      #     ssl_certificate /etc/nginx/ssl/cert.pem;
      #     ssl_certificate_key /etc/nginx/ssl/key.pem;
      #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      #     ... (same location blocks as HTTP server)
      # }

acceptance_criteria:
  - HSTS header not present in HTTP server block
  - Commented HTTPS template with HSTS available for production use
  - nginx config validates successfully (nginx -t)
  - Existing HTTP functionality unchanged

risk: low

tests_to_run:
  - "docker compose -f docker/docker-compose.yml exec nginx nginx -t"
