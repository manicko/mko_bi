---
id: TASK_001_sec001_password_validation
title: SEC-001 — Add password strength validation to registration
status: pending
priority: high
type: implementation
depends_on: []

source_reference: .ai/audit/99-validation/04-security-validated.md
source_section: SEC-001 — Missing Minimum Password Length Enforcement in Registration

description: >
  The RegisterRequest model accepts passwords without any strength validation.
  The validate_password() function exists in utils/validators.py but is never
  called during registration. Wire it into the registration flow at the
  Pydantic model level so that weak passwords are rejected with a proper 422
  response at the API trust boundary.

goals:
  - Validate password strength at the API trust boundary (Pydantic model)
  - Ensure validate_password() is called before hash_password() during registration
  - Return clear 422 error for weak passwords
  - Preserve backward compatibility for existing users (no migration needed)

files:
  - path: src/mkobi/models/auth.py
    targets:
      - type: class
        name: RegisterRequest
    semantic_anchors:
      insert_after:
        type: class_definition
        value: RegisterRequest
    changes:
      - action: add_field_validator
        description: >
          Add @field_validator('password') to RegisterRequest that calls
          validate_password() from mkobi.utils.validators. This validates
          minimum length, presence of digits, and presence of letters before
          the password is processed by the service layer.

  - path: src/mkobi/services/auth_service.py
    targets:
      - type: method
        name: register_user
    semantic_anchors:
      insert_before:
        type: function_call
        value: hash_password
    changes:
      - action: add_code
        description: >
          As a defense-in-depth measure, add an explicit validate_password()
          call before hash_password() in register_user(). This ensures that
          even if the Pydantic model validator is bypassed (e.g., internal
          service calls), the password is still validated.

risks:
  - Low risk: additive validation only, no changes to existing data
  - Must ensure validate_password error messages are user-friendly
  - Should also apply to admin user creation and password change flows (future work)

acceptance_criteria:
  - RegisterRequest with password shorter than 8 characters returns 422
  - RegisterRequest with password missing digits returns 422
  - RegisterRequest with password missing letters returns 422
  - Valid password (8+ chars, digits, letters) is accepted
  - Existing registration tests pass or are updated

tests_to_run:
  - pytest tests/ -k "register" -v
  - pytest tests/ -k "auth" -v
