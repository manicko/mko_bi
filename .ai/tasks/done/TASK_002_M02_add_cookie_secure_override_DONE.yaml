id: TASK_002_M02_add_cookie_secure_override

title: Add APP__COOKIE_SECURE=false to docker-compose.override.yml - DONE

status: completed

priority: high

type: implementation

finding_id: FINDING-M02
source: audit_validated_findings_001.md

depends_on: []

description: >
  AppSettings.cookie_secure defaults to True, which causes browsers to reject
  cookies over HTTP. The docker-compose.override.yml does not override this setting,
  making persistent auth impossible in development mode. Login appears to succeed
  but the refresh token cookie is silently rejected.

goals:
  - Add APP__COOKIE_SECURE=false to docker-compose.override.yml
  - Enable cookie-based auth in development over HTTP
  - No production impact (production uses HTTPS)

files:
  - path: docker/docker-compose.override.yml
    targets:
      - type: config_block
        value: environment
        context: backend service environment block
    semantic_anchors:
      insert_after:
        type: config_key
        value: environment
        context: backend service environment section
    changes:
      - action: add_config
        description: >
          Add APP__COOKIE_SECURE: "false" to the backend service environment block
          in docker-compose.override.yml.

acceptance_criteria:
  - docker-compose.override.yml contains APP__COOKIE_SECURE=false for backend
  - Backend starts without errors
  - Login sets refresh token cookie successfully over HTTP
  - Page reload preserves auth session

tests_to_run:
  - docker compose up -d
  - Verify login flow works end-to-end in browser

risk: low
effort: trivial
rollback: Remove the APP__COOKIE_SECURE line from docker-compose.override.yml

notes: >
  Standalone config change. No code changes. No production impact.
  Purely a dev-mode fix.
