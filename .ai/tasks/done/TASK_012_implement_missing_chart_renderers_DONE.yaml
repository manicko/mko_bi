id: TASK_012_implement_missing_chart_renderers

title: Implement LINE and TABLE chart type rendering in ChartRenderer

status: pending

priority: high

depends_on: []

description: >
  ChartRenderer currently only handles 'bar' and 'pie' chart types. The 'line' and 'table'
  types are defined in GraphType enum but not rendered. LineChart.tsx and TableChart.tsx
  exist but are not used.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: FE-002

goals:
  - Update ChartRenderer to handle 'line' chart type
  - Update ChartRenderer to handle 'table' chart type
  - Integrate existing LineChart and TableChart components

files:
  - path: frontend/src/features/dashboards/ui/charts/ChartRenderer.tsx
    targets:
      - type: function
        name: convertToPlotlyData
    semantic_anchors:
      - add_chart_type_handling:
          after: "type: graph.type === 'pie' ? 'pie' : 'bar'"
          description: Add line and table type handling

changes:
  - action: modify
    description: >
      Update convertToPlotlyData to handle LINE and TABLE chart types.
      Line charts can use Plotly's native line type, table charts need special handling.

    code_hint: |
      # BEFORE (line 30):
      const makeTrace = (xVals: (string | number)[], yVals: (string | number)[], name?: string): Data => {
        const trace: Record<string, unknown> = {
          x: xVals,
          y: yVals,
          type: graph.type === 'pie' ? 'pie' : 'bar',
        }

      # AFTER:
      const makeTrace = (xVals: (string | number)[], yVals: (string | number)[], name?: string): Data => {
        const trace: Record<string, unknown> = {
          x: xVals,
          y: yVals,
          type: graph.type === 'pie' ? 'pie' :
                graph.type === 'line' ? 'scatter' :
                graph.type === 'table' ? 'table' : 'bar',
        }

  - action: modify
    description: >
      Update ChartRenderer to conditionally render different chart types.

    code_hint: |
      # Add import for LineChart and TableChart
      import { LineChart } from './LineChart'
      import { TableChart } from './TableChart'

      # Modify ChartRenderer to handle all types
      export function ChartRenderer({ graph }: ChartRendererProps) {
        if (graph.type === 'line') {
          return <LineChart data={graph.data} layout={graph.layout} />
        }
        if (graph.type === 'table') {
          return <TableChart data={graph.data} />
        }
        const plotlyData = convertToPlotlyData(graph)
        return <PlotlyChart data={plotlyData} layout={graph.layout} />
      }

acceptance_criteria:
  - ChartRenderer handles 'line' chart type
  - ChartRenderer handles 'table' chart type
  - All four chart types (bar, pie, line, table) render correctly
  - Tests pass

risk: medium

tests_to_run:
  - "cd frontend && npm test -- --testPathPattern=ChartRenderer"