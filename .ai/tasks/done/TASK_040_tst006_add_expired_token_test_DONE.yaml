id: TASK_040_tst006_add_expired_token_test

title: Fix TST-006 — Add expired token test to test_auth_service.py

status: pending

priority: medium

depends_on: []

description: >
  Fix the MEDIUM issue where no test verifies that expired JWT tokens are rejected.
  Add a test that creates an expired token and verifies auth_service.is_token_expired
  or the bearer dependency correctly rejects it.

source_file: .ai/audit/99-validation/06-tests-validated.md
source_section: TST-006: Expired token rejection is untested

files:
  - path: tests/test_auth_service.py
    targets:
      - type: method
        name: test_expired_token_rejected

changes:
  - action: add_code
    description: >
      Add test_expired_token_rejected that creates a JWT token with expired timestamp
      (past expiration) and verifies that the auth service or bearer dependency
      rejects it with authentication error.
    code_hint: |
      def test_expired_token_rejected(self):
          # Create token with expired timestamp
          expired_token = create_token(
              user_id=test_user_id,
              expires_in=-3600,  # Expired 1 hour ago
          )
          # Verify token is rejected
          with pytest.raises(AppException) as exc_info:
              # Call auth check with expired token
          assert exc_info.value.error_code == ErrorCode.TOKEN_EXPIRED

acceptance_criteria:
  - Test creates expired token
  - Test verifies expired token is rejected
  - Test verifies correct error code (TOKEN_EXPIRED or AUTHENTICATION_FAILED)

risk_notes: >
  Low risk — adds a new test for existing functionality.

tests_to_run:
  - command: pytest tests/test_auth_service.py -v -k "expired" --no-cov
    reason: Verify expired token test passes
