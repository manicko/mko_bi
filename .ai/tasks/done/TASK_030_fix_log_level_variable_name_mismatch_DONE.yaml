id: TASK_030_fix_log_level_variable_name_mismatch

title: Fix LOG_LEVEL variable name mismatch in docker-compose.yml

status: pending

priority: low

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\08-deployment-config-validated.md
source_section: DC-004

description: >
  The `docker-compose.yml` uses `${LOG_LEVEL:-INFO}` which references a non-existent
  `LOG_LEVEL` variable. The production env file sets `LOGGING__LEVEL=INFO` (with
  double underscores), but compose's variable substitution looks for `LOG_LEVEL`
  (without underscores). Since `LOG_LEVEL` is undefined, the fallback `INFO` is
  used, masking the inconsistency. Fix the variable name to match the production
  env file's `LOGGING__LEVEL`.

goals:
  - Fix the variable name in docker-compose.yml to reference LOGGING__LEVEL
  - Ensure the production env file's LOGGING__LEVEL value is actually used
  - Eliminate the silent fallback behavior

files:
  - path: docker/docker-compose.yml

    targets:
      - type: environment_variable
        value: LOGGING__LEVEL

    semantic_anchors:
      insert_after:
        type: service
        value: app

changes:
  - action: modify_code

    description: >
      Change `${LOG_LEVEL:-INFO}` to `${LOGGING__LEVEL:-INFO}` in the app service
      environment section of docker-compose.yml. This ensures the variable
      references the correct environment variable name that matches the production
      env file.

    code_hint: |
      # Before:
      LOGGING__LEVEL: ${LOG_LEVEL:-INFO}
      # After:
      LOGGING__LEVEL: ${LOGGING__LEVEL:-INFO}

acceptance_criteria:
  - docker-compose.yml references LOGGING__LEVEL (not LOG_LEVEL)
  - Production env file's LOGGING__LEVEL value is picked up by compose
  - docker compose config resolves LOGGING__LEVEL correctly
  - Development override (LOGGING__LEVEL=DEBUG) still works

tests_to_run:
  - docker compose config (verify LOGGING__LEVEL resolves correctly)

risk: low
risk_reason: >
  The fix aligns the variable name with what the env file actually sets. The
  fallback value `INFO` is the same, so behavior is unchanged when the variable
  is unset. The development override already hardcodes `LOGGING__LEVEL=DEBUG`
  and is unaffected.

rollback: Restore `${LOG_LEVEL:-INFO}` syntax.
