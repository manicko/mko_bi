id: TASK_031_fix_type_safety_in_401_request_queue

title: Fix type safety in 401 request queue processQueue callback

status: pending

priority: medium

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\02-frontend-validated.md
source_section: FE-002

description: >
  In `frontend/src/shared/api/axiosInstance.ts`, the `processQueue` function at
  line 39 has signature `(error: Error | null, token: string | null = null)`.
  When called on line 99 as `processQueue(null, newToken.access_token)`, the token
  is a string. When called on line 104 as `processQueue(errorToReject, null)`, the
  error path is taken. The TypeScript non-null assertion `token!` at line 44 masks
  the fact that `token` can be null. While the runtime behavior is correct (error
  and token are never both null), the type system does not reflect this safety.
  Improve the type signature to make the mutual exclusivity explicit.

goals:
  - Make the processQueue type signature reflect the error/token mutual exclusivity
  - Remove the non-null assertion on token
  - Improve type safety without changing runtime behavior

files:
  - path: frontend/src/shared/api/axiosInstance.ts

    targets:
      - type: function
        name: processQueue

    semantic_anchors:
      insert_after:
        type: variable_declaration
        value: failedQueue

changes:
  - action: modify_code

    description: >
      Replace the `processQueue` function signature with a discriminated union
      type that enforces mutual exclusivity between error and token. Use function
      overloads or a typed parameter approach.

    code_hint: |
      # Before:
      const processQueue = (error: Error | null, token: string | null = null): void => {
          failedQueue.forEach((prom) => {
              if (error) {
                  prom.reject(error)
              } else {
                  prom.resolve(token!)
              }
          })
          failedQueue = []
      }

      # After (using typed parameters):
      type ProcessQueueParams =
          | { error: Error; token?: never }
          | { error?: never; token: string }

      const processQueue = (params: ProcessQueueParams): void => {
          failedQueue.forEach((prom) => {
              if (params.error) {
                  prom.reject(params.error)
              } else {
                  prom.resolve(params.token)
              }
          })
          failedQueue = []
      }

      # Update call sites:
      # processQueue(null, newToken.access_token) -> processQueue({ token: newToken.access_token })
      # processQueue(errorToReject, null) -> processQueue({ error: errorToReject })

acceptance_criteria:
  - processQueue uses a type-safe signature with discriminated union
  - Non-null assertion on token is removed
  - Call sites updated to use the new signature
  - TypeScript compilation passes without errors
  - Runtime behavior is unchanged

tests_to_run:
  - cd frontend && npx tsc --noEmit (verify TypeScript compilation)
  - cd frontend && npm test (verify no runtime regressions)

risk: low
risk_reason: >
  This is a type-safety improvement that does not change runtime behavior.
  The discriminated union makes the existing invariant explicit in the type
  system. The call sites are updated to match the new signature.

rollback: Restore the original processQueue signature and call sites.
