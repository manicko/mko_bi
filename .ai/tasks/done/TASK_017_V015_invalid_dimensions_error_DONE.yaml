id: TASK_017_V015_invalid_dimensions_error

title: Raise explicit error for invalid dimensions instead of silent df.columns[:3] fallback

status: pending

priority: medium

depends_on: []

description: >
  When graph.dimensions is empty or invalid, the fallback uses df.columns[:3]
  as dimensions silently. This can produce incorrect aggregation results with
  no error. This task raises an explicit error when dimensions are invalid.

finding_ref: V-015
severity: MEDIUM

goals:
  - Raise explicit error when dimensions are empty or invalid
  - Prevent silent incorrect aggregation results
  - Provide clear error message to help users fix their config

files:
  - path: src/mkobi/workers/data_worker.py
    targets:
      - type: function
        name: dimension processing logic in data worker
    semantic_anchors:
      replace: df.columns[:3] fallback with explicit ValueError

changes:
  - action: add_validation
    description: >
      Replace the silent df.columns[:3] fallback with an explicit error
      when dimensions are empty or invalid.
    code_hint: |
      # Before:
      if not dimensions:
          dimensions = df.columns[:3]
      # After:
      if not dimensions:
          raise ValueError(
              f"Graph {graph_id} has no dimensions configured. "
              "Please set dimensions in the processing config."
          )

acceptance_criteria:
  - Invalid dimensions raise ValueError with clear message
  - No silent fallback to first 3 columns
  - Error message includes graph ID for debugging
  - Existing valid dimension configs still work

tests_to_run:
  - pytest tests/ -k "dimension or aggregate or data" -v

risk_level: low

rollout_notes: >
  Safe. Failing fast is better than silent incorrect results.
  No dependencies on other fixes.
