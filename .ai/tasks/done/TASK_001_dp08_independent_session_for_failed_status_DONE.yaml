id: TASK_001_dp08_independent_session_for_failed_status

title: Fix DP-08 — Error path status update rolls back, leaving no failure record

status: pending

priority: critical

depends_on: []

description: >
  Fix the CRITICAL issue where the FAIL status update in data_worker's production error path
  gets rolled back along with the main transaction, leaving processing logs permanently stuck
  in PROCESSING state. The FAILED status update must use an independent session outside the
  rolled-back transaction.

source_file: .ai/audit/99-validation/07-data-processing-validated.md
source_section: DP-08: Error path status update rolls back — use independent session

files:
  - path: src/mkobi/workers/data_worker.py
    targets:
      - type: function
        name: process_csv_background
    semantic_anchors:
      insert_after:
        type: function_call
        value: _run_with_transaction
      replace_zone:
        type: block
        description: Production error handler in process_csv_background — the except block inside async with session.begin() must re-raise BEFORE the rollback, and _update_processing_log_status must be called OUTSIDE the transaction block using an independent session.

changes:
  - action: replace_code
    description: >
      Reorder the production error path so that `raise` happens inside the `async with session.begin()`
      block, then call `_update_processing_log_status` OUTSIDE the transaction block. This ensures
      the FAILED status update persists in an independent session even after the main transaction
      rolls back. Wrap the status update in its own try/except so a DB connectivity failure during
      status update doesn't mask the original processing error.
    code_hint: |
      # Inside process_csv_background, production mode (else branch):
      # 1. Move `raise` BEFORE the `async with session.begin()` context manager exits
      # 2. After the `async with` block, call `_update_processing_log_status` with NO session argument
      #    (so it creates its own independent session via the `else` branch of _update_processing_log_status)
      # 3. Wrap the status update in try/except to log failures without masking the original error

acceptance_criteria:
  - FAILED status update persists even when the main transaction rolls back
  - Original processing error is still propagated correctly
  - DB connectivity failure during status update is logged but does not mask the original error
  - No connection leaks from the independent session

tests_to_run:
  - command: pytest tests/test_data_worker.py -v -k "test_update_processing_log_status" --no-cov
    reason: Verify unit tests for status update still pass
  - command: pytest tests/test_data_worker.py -v -k "error" --no-cov
    reason: Verify error handling paths

risk_notes: >
  Medium risk — changes the error handling flow in the production data processing pipeline.
  The variable scope of `error_msg` and `error_code` must be verified — Python `except` block
  variables remain accessible after the `try/except` ends, but ensure they are available after
  the `async with` block exits.
