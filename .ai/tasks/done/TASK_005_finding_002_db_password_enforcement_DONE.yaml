id: TASK_005_finding_002_db_password_enforcement

title: Enforce DATABASE__PASSWORD via ${VAR:?error} pattern in docker-compose.yml

type: implementation

status: complete

priority: critical

depends_on:
  - TASK_004_verify_finding_001_jwt_secret_enforcement

description: >
  docker-compose.yml uses ${DATABASE__PASSWORD:-postgres} for the postgres db service and
  application services. If not overridden, production uses a well-known database password.
  Change to ${DATABASE__PASSWORD:?DATABASE__PASSWORD is required}.

goals:
  - Replace default DATABASE__PASSWORD with enforcement pattern in compose file
  - Database fails to start without explicit password configuration

files:
  - path: docker/docker-compose.yml
    targets:
      - type: env_var_reference
        name: DATABASE__PASSWORD
    semantic_anchors:
      env_var_pattern: ${DATABASE__PASSWORD:-postgres}
    changes:
      - action: replace_value
        description: >
          Replace all occurrences of ${DATABASE__PASSWORD:-postgres}
          with ${DATABASE__PASSWORD:?DATABASE__PASSWORD is required}
        old_value: ${DATABASE__PASSWORD:-postgres}
        new_value: ${DATABASE__PASSWORD:?DATABASE__PASSWORD is required}

acceptance_criteria:
  - All occurrences of DATABASE__PASSWORD in docker-compose.yml use :? enforcement
  - Compose config fails with clear error if DATABASE__PASSWORD is not set

tests_to_run:
  - DATABASE__PASSWORD=test docker compose -f docker/docker-compose.yml --env-file .env config >nul 2>&1 && echo "PASS" || echo "FAIL"

risk_level: low

rollout_notes: >
  Must ensure production deployment pipeline provides the password. No application code changes.
