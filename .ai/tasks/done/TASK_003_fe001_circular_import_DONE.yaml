---
id: TASK_003_fe001_circular_import
title: FE-001 — Break circular import between axiosInstance and authApi
status: pending
priority: high
type: implementation
depends_on:
  - TASK_001_sec001_password_validation
  - TASK_002_sec003_mime_validation

source_reference: .ai/audit/99-validation/02-frontend-validated.md
source_section: FE-001 — Potential Circular Import Between Axios Instance and Auth API

description: >
  The axiosInstance response interceptor imports refreshToken from authApi.ts,
  which in turn imports axiosInstance for its API calls. This creates a circular
  dependency: shared/api/ → features/auth/ → shared/api/. While it currently
  works due to JS module hoisting, it is a fragile pattern that could break
  during HMR and violates clean dependency direction. Extract the token refresh
  logic into a callback registration pattern to break the import cycle.

goals:
  - Break the circular dependency between shared/api/ and features/auth/
  - Preserve token refresh interceptor behavior (request queuing, error handling, redirect on auth failure)
  - Restore proper dependency direction: shared layer should not depend on feature modules
  - Use callback registration pattern (e.g., registerRefreshHandler()) to decouple modules

files:
  - path: frontend/src/shared/api/axiosInstance.ts
    targets:
      - type: const
        name: axiosInstance
    semantic_anchors:
      insert_after:
        type: const_declaration
        value: axiosInstance
    changes:
      - action: modify_code
        description: >
          Remove the import of refreshToken from authApi.ts. Instead, implement
          a callback registration pattern where the axiosInstance exports a
          `registerRefreshHandler(handler: () => Promise<string>)` function.
          The response interceptor calls the registered handler instead of
          directly importing refreshToken.

  - path: frontend/src/features/auth/api/authApi.ts
    targets:
      - type: function
        name: refreshToken
    semantic_anchors:
      insert_after:
        type: function_definition
        value: refreshToken
    changes:
      - action: add_code
        description: >
          After the refreshToken function definition, add a call to
          registerRefreshHandler(refreshToken) to register the handler
          with the axiosInstance. This inverts the dependency: authApi
          registers itself with the shared layer, rather than the shared
          layer importing from authApi.

risks:
  - Medium risk: touches the token refresh interceptor which is security-critical
  - Must preserve: request queuing during concurrent 401s, token refresh on 401 response, redirect loop on refresh failure
  - Must test thoroughly in development with HMR

acceptance_criteria:
  - No circular import between shared/api/axiosInstance.ts and features/auth/api/authApi.ts
  - Token refresh on 401 response still works correctly
  - Request queuing during concurrent 401s still works
  - Redirect to login on refresh failure still works
  - Vite HMR works without errors
  - Existing auth tests pass

tests_to_run:
  - cd frontend && npm run build
  - cd frontend && npm run lint
