id: TASK_022_verify_stage1_database_schema

title: Verify — Database schema changes (DB-001, DB-002)

type: verification

status: pending

depends_on:
  - TASK_010_add_processing_logs_composite_index
  - TASK_011_add_started_at_index_for_stale_log_cleanup

verifies:
  - TASK_010_add_processing_logs_composite_index
  - TASK_011_add_started_at_index_for_stale_log_cleanup

verification_steps:
  - build: docker compose build
  - test: pytest tests/ -k "processing_log" -v --no-header
  - smoke_check: docker compose up -d postgres && docker compose exec postgres psql -U postgres -c "\d processing_logs" (verify indexes exist)

pass_criteria:
  - All processing_log tests pass
  - Alembic autogenerate produces no drift for processing_logs
  - Both indexes (idx_processing_logs_status_finished_at, idx_processing_logs_status_started_at) exist in database
  - ruff and mypy pass on modified files

failure_action: return TASK_010_add_processing_logs_composite_index or TASK_011_add_started_at_index_for_stale_log_cleanup to rework

rollback_task: TASK_010_add_processing_logs_composite_index (revert model changes and generate downgrade migration)
