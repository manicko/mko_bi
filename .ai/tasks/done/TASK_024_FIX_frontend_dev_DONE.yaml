id: TASK_024_FIX_frontend_dev

title: Fix Frontend Node Modules Initialization in Docker Dev Mode

status: DONE

priority: high

depends_on: []  # independent fix, no deps on other pending tasks

phase: DOCKER_HARDENING
wave: 3

description: >
  GATE_01 and GATE_02 both reported that the frontend container exits immediately
  with "vite: not found" because the frontend_node_modules named volume is empty.
  The docker-compose.override.yml frontend service uses node:20-alpine image with
  a named volume for node_modules, but npm install is never run inside the container
  before executing npm run dev. Vite is not installed globally in node:20-alpine.

  Root cause: The named volume frontend_node_modules is created empty on first run.
  The container command "npm run dev" fails because vite binary is not in
  node_modules/.bin/. The volume persists the empty state across restarts.

finding_ref: GATE-01-MEDIUM-001, GATE-02-MEDIUM-001
severity: high

goals:
  - Frontend container starts successfully in Docker dev mode
  - Vite dev server is accessible at http://localhost:5173
  - Hot module reload (HMR) works for frontend changes
  - node_modules are properly initialized inside the container

files:
  - path: docker-compose.override.yml
    targets:
      - type: service
        name: frontend
    semantic_anchors:
      insert_before:
        type: key
        value: "command: [\"npm\", \"run\", \"dev\""
    changes:
      - action: update_command
        description: >
          Change the frontend service command to run npm install before npm run dev.
          This ensures node_modules are populated on first container start.
        code_hint: |
          command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]

acceptance_criteria:
  - Frontend container starts and stays running
  - http://localhost:5173 responds with HTML
  - Vite HMR works (touching a frontend file triggers reload in logs)
  - Frontend container does not exit with "vite: not found"

tests_to_run:
  - "docker compose -f docker-compose.yml -f docker-compose.override.yml down -v"
  - "docker compose -f docker-compose.yml -f docker-compose.override.yml up -d"
  - "docker compose ps  # verify frontend is running"
  - "curl -sf http://localhost:5173  # verify frontend responds"
  - "touch frontend/src/App.tsx && sleep 5 && docker compose logs frontend --tail 20  # verify HMR"

risk_level: low

rollout_notes: >
  Simple one-line fix in docker-compose.override.yml. Changes the frontend service
  command to run npm install before npm run dev. The named volume will cache
  node_modules after first successful run, so subsequent starts will be fast.
  The "npm install" is a no-op when node_modules already exists and is up to date.
  This is a common pattern for Node.js Docker dev environments.
