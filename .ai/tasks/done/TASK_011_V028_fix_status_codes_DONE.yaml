id: TASK_011_V028_fix_status_codes

title: Change registration approval/rejection status codes from 400 to 409 Conflict

status: done

priority: low

depends_on: []

description: >
  Registration request approval and rejection endpoints use HTTP_400_BAD_REQUEST
  for already-processed requests. SPEC says 409 Conflict. This task changes the
  status code to match the SPEC.

finding_ref: V-028
severity: LOW

goals:
  - Change status code from 400 to 409 for already-processed registration requests
  - Align with SPEC requirements
  - Two endpoints affected: approval and rejection

files:
  - path: src/mkobi/api/routes/admin.py
    targets:
      - type: route_handler
        name: registration approval endpoint
      - type: route_handler
        name: registration rejection endpoint
    semantic_anchors:
      replace: status.HTTP_400_BAD_REQUEST with status.HTTP_409_CONFLICT

changes:
  - action: modify_status_code
    description: >
      Change HTTP_400_BAD_REQUEST to HTTP_409_CONFLICT in both registration
      approval and rejection endpoints when the request is already processed.
    code_hint: |
      # Before:
      raise HTTPException(status_code=status.HTTP_400_BAD_REQUEST, ...)
      # After:
      raise HTTPException(status_code=status.HTTP_409_CONFLICT, ...)

acceptance_criteria:
  - Both endpoints return 409 for already-processed requests
  - Error message remains informative
  - API contract matches SPEC

tests_to_run:
  - pytest tests/ -k "admin or registration or approval" -v

risk_level: low

rollout_notes: >
  Safe. No dependencies. API contract fix. May need frontend adjustment if
  frontend checks for specific status codes.
