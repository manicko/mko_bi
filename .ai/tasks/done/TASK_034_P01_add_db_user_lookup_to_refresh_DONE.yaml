id: TASK_034_P01_add_db_user_lookup_to_refresh

title: Add database user lookup to refresh token flow

status: done

priority: high

depends_on:
  - TASK_029_P01_rewrite_refresh_endpoint

phase: PLAN_01
wave: 3

description: >
  Ensure the refresh token validation includes a database lookup to verify
  the user still exists and is active. This prevents token refresh for
  deleted or deactivated accounts.

finding_ref: PLAN_01_WAVE_3
severity: high

goals:
  - After validating token, check user exists in database
  - Raise appropriate error if user not found
  - Maintain proper error logging
  - User lookup is atomic with token validation

files:
  - path: src/mkobi/api/routes/auth.py
    targets:
      - type: function
        name: refresh_endpoint
    semantic_anchors:
      insert_after:
        type: function_call
        value: validate_refresh_token
    changes:
      - action: add_code_block
        description: Add user existence check after token validation
        code_hint: |
          # After validating token payload, verify user exists
          user_id = payload.get("sub")
          user = await UserRepository(session).get_by_id(UUID(user_id))
          if not user:
              logger.warning("Refresh token for non-existent user: %s", user_id)
              raise HTTPException(
                  status_code=status.HTTP_401_UNAUTHORIZED,
                  detail="User not found",
              )

acceptance_criteria:
  - Refresh works only for valid, existing users
  - Proper 401 errors for invalid tokens
  - User lookup is atomic with token validation
  - Proper logging of failed attempts

tests_to_run:
  - "pytest tests/ -k test_auth -v"
  - Manual API test: refresh with invalid/deleted user account

risk_level: medium

rollout_notes: >
  Security-critical: prevents token refresh for deleted users.
  Already partially implemented in TASK_029; this task ensures
  the database lookup is robust and well-tested.
