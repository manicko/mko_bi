id: TASK_037_P01_frontend_request_queue

title: Implement request queuing for concurrent 401 handling

status: done

priority: high

depends_on:
  - TASK_035_P01_frontend_refresh_api

phase: PLAN_01
wave: 4

description: >
  Implement a request queuing mechanism in the axios interceptor to handle
  concurrent 401 responses. When multiple requests fail simultaneously, only
  one refresh operation should occur and all failed requests should be retried.

finding_ref: PLAN_01_WAVE_4
severity: high

goals:
  - Add isRefreshing flag to axiosInstance
  - Add failedQueue for pending requests
  - Implement queue management functions
  - Retry queued requests after successful refresh
  - No duplicate refresh calls

files:
  - path: frontend/src/shared/api/axiosInstance.ts
    targets:
      - type: file
        name: axiosInstance
    semantic_anchors:
      insert_after:
        type: response_interceptor
    changes:
      - action: add_code_block
        description: Add request queuing for concurrent 401s
        code_hint: |
          let isRefreshing = false;
          let failedQueue: Array<{
            resolve: (token: string) => void;
            reject: (error: unknown) => void;
          }> = [];

          const processQueue = (error: unknown, token: string | null = null) => {
            failedQueue.forEach((prom) => {
              if (error) {
                prom.reject(error);
              } else {
                prom.resolve(token!);
              }
            });
            failedQueue = [];
          };

          // In 401 response interceptor:
          if (isRefreshing) {
            return new Promise((resolve, reject) => {
              failedQueue.push({ resolve, reject });
            }).then((token) => {
              config.headers.Authorization = `Bearer ${token}`;
              return axiosInstance(config);
            });
          }

          isRefreshing = true;
          try {
            const newToken = await refreshToken();
            setAccessToken(newToken.access_token);
            processQueue(null, newToken.access_token);
            config.headers.Authorization = `Bearer ${newToken.access_token}`;
            return axiosInstance(config);
          } catch (err) {
            processQueue(err);
            clearAccessToken();
            window.location.href = "/login";
            return Promise.reject(err);
          } finally {
            isRefreshing = false;
          }

acceptance_criteria:
  - Only single refresh operation for concurrent 401s
  - All queued requests are retried on successful refresh
  - No duplicate refresh calls
  - Failed refresh redirects to login

tests_to_run:
  - "npm test -- --testPathPattern=auth --verbose"
  - Manual test: multiple concurrent requests during token expiry

risk_level: medium

rollout_notes: >
  Depends on TASK_035 for refreshToken function.
  Critical for preventing race conditions during token refresh.
