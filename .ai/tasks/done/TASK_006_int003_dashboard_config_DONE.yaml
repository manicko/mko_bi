source_reference: .ai/audit/99-validation/90-integration-validated.md
source_section: INT-003 — Frontend DashboardConfig incompatible with backend

description: >
  The frontend DashboardConfig type uses a flat structure while the backend
  expects a nested structure. This causes UI rendering failures when creating
  or editing dashboards. Update the frontend type to match the backend's
  actual response/request shape, and ensure the DashboardManagement component
  sends correctly structured data.

goals:
  - Update frontend DashboardConfig type to match backend Dashboard model
  - Fix DashboardManagement component to send correctly structured data
  - Ensure dashboard creation and editing work end-to-end

files:
  - path: frontend/src/shared/types/api.types.ts
    targets:
      - type: interface
        name: DashboardConfig
    semantic_anchors:
      insert_after:
        type: interface_definition
        value: DashboardConfig
    changes:
      - action: modify_code
        description: >
          Update the DashboardConfig interface to match the backend's
          Dashboard model structure. This includes nested layout config,
          graph definitions with proper typing, and filter configurations
          that align with the backend Pydantic models.

  - path: frontend/src/features/admin/ui/DashboardManagement.tsx
    targets:
      - type: component
        name: DashboardManagement
    semantic_anchors:
      insert_after:
        type: component_definition
        value: DashboardManagement
    changes:
      - action: modify_code
        description: >
          Update the dashboard creation/editing form to build the correct
          nested structure expected by the backend API. Ensure form field
          names match the backend model field names.

risks:
  - Medium risk: touches the dashboard management UI which is a core feature
  - Must ensure the form validation (Zod schema) is updated to match
  - Must test both create and edit flows

acceptance_criteria:
  - Dashboard creation form submits data in the correct structure
  - Dashboard editing loads and displays existing data correctly
  - No TypeScript compilation errors
  - Dashboard list renders correctly after creation

tests_to_run:
  - cd frontend && npm run build
  - cd frontend && npm run lint
