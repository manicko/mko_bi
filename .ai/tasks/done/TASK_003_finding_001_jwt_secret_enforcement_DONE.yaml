id: TASK_003_finding_001_jwt_secret_enforcement

title: Enforce JWT__SECRET_KEY via ${VAR:?error} pattern in docker-compose.yml

type: implementation

status: pending

priority: critical

depends_on:
  - TASK_002_verify_finding_003b_retry_db_connection

description: >
  docker-compose.yml uses ${JWT__SECRET_KEY:-dev-secret-key-for-local-development} for the app,
  migrate, and rq-worker services. If the environment variable is not set externally, all
  environments (including production) sign JWT tokens with a publicly known secret. No
  enforcement pattern exists. Change to ${JWT__SECRET_KEY:?JWT__SECRET_KEY is required} in the
  base compose file.

goals:
  - Replace default JWT__SECRET_KEY with enforcement pattern in base compose file
  - Override file keeps safe default for local development
  - Services fail fast with clear error message if secret is not configured

files:
  - path: docker/docker-compose.yml
    targets:
      - type: env_var_reference
        name: JWT__SECRET_KEY
    semantic_anchors:
      env_var_pattern: ${JWT__SECRET_KEY:-dev-secret-key-for-local-development}
    changes:
      - action: replace_value
        description: >
          Replace all occurrences of ${JWT__SECRET_KEY:-dev-secret-key-for-local-development}
          with ${JWT__SECRET_KEY:?JWT__SECRET_KEY is required}
        old_value: ${JWT__SECRET_KEY:-dev-secret-key-for-local-development}
        new_value: ${JWT__SECRET_KEY:?JWT__SECRET_KEY is required}

acceptance_criteria:
  - All occurrences of JWT__SECRET_KEY in docker-compose.yml use :? enforcement pattern
  - docker compose config fails with clear error if JWT__SECRET_KEY is not set
  - Override file (docker-compose.override.yml) still has safe dev default

tests_to_run:
  - docker compose -f docker/docker-compose.yml --env-file .env config --dry-run || echo "Expected: fails without JWT__SECRET_KEY"

risk_level: low

rollout_notes: >
  Must be coordinated with deployment pipeline — ensure .env or CI/CD provides the secret.
  Apply before next production deployment. Zero-downtime change.
