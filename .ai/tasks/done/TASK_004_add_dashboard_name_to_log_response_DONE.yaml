id: TASK_004_add_dashboard_name_to_log_response

title: Add dashboard_name to ProcessingLogRead response model

status: pending

priority: medium

depends_on: []

type: implementation

source_reference: C:\py_dev\mkobi\.ai\audit\validated\BUG-004-log-viewer-empty-table-table.md
source_section: Factor 3 — Backend ProcessingLogRead model does not include dashboard_name field

description: >
  The `ProcessingLogRead` Pydantic model returns `dashboard_id` but never resolves it to a
  `dashboard_name`. The frontend expects `dashboard_name` as an optional field, so it always
  falls back to 'N/A'. Fix: add `dashboard_name` field to `ProcessingLogRead` and populate it
  in the repository by accessing the `dashboard` relationship on the SQLAlchemy model.

goals:
  - Add `dashboard_name: str | None = None` field to `ProcessingLogRead` model
  - Update `ProcessingLogRepository.get_filtered()` to populate `dashboard_name` from the joined `dashboard` relationship
  - Update `ProcessingLogRepository.get_by_dashboard()` similarly
  - Update `ProcessingLogRepository.get_by_id()` similarly
  - Update `ProcessingLogRepository.get_latest_by_dashboard()` similarly
  - Ensure the `dashboard` relationship is eagerly loaded in queries (use `selectinload` or similar)

files:
  - path: src/mkobi/models/processing_logs.py
    targets:
      - type: class
        name: ProcessingLogRead
    semantic_anchors:
      insert_after:
        type: field_definition
        value: "dashboard_id: UUID | None = None"
    changes:
      - action: add_field
        description: >
          Add `dashboard_name: str | None = None` field after `dashboard_id` in `ProcessingLogRead`.

  - path: src/mkobi/db/repositories/processing_log_repo.py
    targets:
      - type: class
        name: ProcessingLogRepository
      - type: method
        name: get_filtered
      - type: method
        name: get_by_dashboard
      - type: method
        name: get_by_id
      - type: method
        name: get_latest_by_dashboard
    semantic_anchors:
      insert_after:
        type: query_construction
        value: "query = select(processing_log_model.ProcessingLog)"
    changes:
      - action: modify_method
        description: >
          In each method that returns `ProcessingLogRead`, after validating the log object,
          populate `dashboard_name` from the `dashboard` relationship:
          ```python
          log_read = ProcessingLogRead.model_validate(log)
          if log.dashboard is not None:
              log_read.dashboard_name = log.dashboard.name
          return log_read
          ```
          For list methods, do this in the list comprehension.
          Ensure the `dashboard` relationship is loaded — add `selectinload` to queries:
          ```python
          from sqlalchemy.orm import selectinload
          query = select(processing_log_model.ProcessingLog).options(
              selectinload(processing_log_model.ProcessingLog.dashboard)
          )
          ```

acceptance_criteria:
  - `ProcessingLogRead` includes `dashboard_name` field
  - When a log has a linked dashboard, the `dashboard_name` is populated in the response
  - When a log has no dashboard (dashboard_id is null), `dashboard_name` is null
  - The frontend Dashboard column shows the actual dashboard name instead of "N/A"
  - No ruff or mypy errors

tests_to_run:
  - ruff check src/mkobi/models/processing_logs.py src/mkobi/db/repositories/processing_log_repo.py
  - mypy src/mkobi/models/processing_logs.py src/mkobi/db/repositories/processing_log_repo.py

risk: medium
effort: small
affected_modules:
  - src/mkobi/models/processing_logs.py
  - src/mkobi/db/repositories/processing_log_repo.py
