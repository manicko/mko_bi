id: TASK_006_fix_uuid_none_type_in_data_service_graph_repo

title: Fix UUID|None type mismatch in data_service.py graph repository call

status: pending

priority: high

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\findings.md
source_section: BE-003

description: >
  At line 364 in `data_service.py`, `log.dashboard_id` (typed as `UUID | None`) is
  passed to `IGraphRepository.get_by_dashboard_id()` which requires a non-nullable
  `UUID` parameter. When `log.dashboard_id` is None, the repository call would fail.
  Add a null check before the repository call.

goals:
  - Add null check for dashboard_id before calling graph_repo.get_by_dashboard_id()
  - Return appropriate error response when dashboard_id is None
  - Pass ruff and mypy checks

files:
  - path: src/mkobi/services/data_service.py
    targets:
      - type: method
        name: get_processing_result
    semantic_anchors:
      insert_before:
        type: function_call
        value: get_by_dashboard_id
    changes:
      - action: add_code
        description: >
          In `get_processing_result`, before the line
          `graphs = await self.graph_repo.get_by_dashboard_id(log.dashboard_id, db)` (line 364),
          add a guard: `if log.dashboard_id is None:` return a ProcessingResult with
          success=False and message="Processing log has no associated dashboard".
          This ensures the None value never reaches get_by_dashboard_id() which requires
          non-nullable UUID.

acceptance_criteria:
  - When dashboard_id is None, a graceful error response is returned instead of passing None
  - When dashboard_id is not None, existing behavior is preserved
  - Type checker (mypy) passes — no UUID|None passed to non-nullable UUID parameter
  - ruff and mypy pass without errors

tests_to_run:
  - pytest tests/ -x -q --tb=short

risk: low
effort: small
rollback: trivial
