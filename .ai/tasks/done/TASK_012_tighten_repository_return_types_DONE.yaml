id: TASK_012_tighten_repository_return_types

title: LOW — Replace list[Any] with typed list[ProcessingLogRead] in processing log repository

status: pending

priority: low

depends_on:
  - TASK_010_use_registration_status_enum_in_backend

source_file: .ai/audit/validated/final-report.md
source_finding: BE-005

description: >
  The processing log repository interface and implementation use list[Any] as the
  return type for query methods, which defeats the purpose of type checking and weakens
  IDE support. Replace list[Any] with the appropriate Pydantic model type
  (list[ProcessingLogRead]) in both the interface definition and the implementation.

goals:
  - Replace list[Any] with list[ProcessingLogRead] in IProcessingLogRepository
  - Replace list[Any] in ProcessingLogRepository implementation
  - Ensure all callers type-check correctly against the new signature

files:
  - path: src/mkobi/interfaces/repository_interfaces.py
    targets:
      - type: class
        name: IProcessingLogRepository
    semantic_anchors:
      insert_after:
        type: method_definition
        name: list_* methods
    changes:
      - action: modify_code
        description: >
          Change return type from list[Any] to list[ProcessingLogRead].
        code_hint: |
          async def list_by_dashboard(
              self, dashboard_id: UUID
          ) -> list[ProcessingLogRead]: ...

  - path: src/mkobi/db/repositories/processing_log_repo.py
    targets:
      - type: class
        name: ProcessingLogRepository
    semantic_anchors:
      insert_after:
        type: method_definition
        name: list_* methods
    changes:
      - action: modify_code
        description: >
          Change return type annotation and ensure the return value is properly typed.
        code_hint: |
          async def list_by_dashboard(
              self, dashboard_id: UUID
          ) -> list[ProcessingLogRead]:
              ...
              return [ProcessingLogRead.model_validate(row) for row in rows]

acceptance_criteria:
  - list[Any] is eliminated from processing log repository types
  - mypy passes without errors on the affected modules
  - All tests pass
  - Return values are properly validated Pydantic models

tests_to_run:
  - mypy src/mkobi/interfaces/repository_interfaces.py src/mkobi/db/repositories/processing_log_repo.py
  - pytest tests/ -k "processing_log" -v --no-header

risk: low
risk_notes: >
  Low risk — tightening types should not change runtime behavior. The actual
  data returned is the same; only the type annotation changes. If the data
  doesn't match ProcessingLogRead, mypy will catch it.

type: implementation
category: backend
severity: low
