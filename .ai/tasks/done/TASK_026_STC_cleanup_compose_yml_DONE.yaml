id: TASK_026_STC_cleanup_compose_yml

title: Remove test artifacts from docker-compose.yml production config

status: done

priority: high

depends_on: []

phase: STC
wave: 1

description: >
  Clean docker-compose.yml to remove all test-related artifacts. The production
  compose file must not contain RECREATE_TEST_DB, test-related usage comments, or
  any other test-only configuration. The test environment is now fully defined in
  docker-compose.test.yml (standalone). This task modifies docker-compose.yml only.

goals:
  - Remove RECREATE_TEST_DB: "false" from app service environment
  - Remove RECREATE_TEST_DB: "false" from rq-worker service environment
  - Update usage comment to reflect standalone test compose (no merge)
  - docker-compose.yml remains a valid production-only compose file

files:
  - path: docker-compose.yml
    targets:
      - type: service
        name: app
      - type: service
        name: rq-worker
      - type: comment
        name: usage_header
    semantic_anchors:
      insert_after:
        - type: service
          name: app
        - type: service
          name: rq-worker
      insert_before:
        - type: key
          name: RECREATE_TEST_DB
          service: app
        - type: key
          name: RECREATE_TEST_DB
          service: rq-worker
      note: >
        RECREATE_TEST_DB appears in two services (app and rq-worker).
        Each removal targets the key within its respective service block.
        The code_hint disambiguates which block to edit.
    changes:
      - action: remove_key
        description: Remove RECREATE_TEST_DB: "false" from app service environment block
        code_hint: |
          # Delete line: RECREATE_TEST_DB: "false"
          # Located in services.app.environment section
      - action: remove_key
        description: Remove RECREATE_TEST_DB: "false" from rq-worker service environment block
        code_hint: |
          # Delete line: RECREATE_TEST_DB: "false"
          # Located in services.rq-worker.environment section
      - action: update_comment
        description: >
          Update the usage comment block at the top of the file.
          Change the test line from merge pattern to standalone pattern.
        code_hint: |
          # Before:
          #   Test:        docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
          # After:
          #   Test:        docker compose -f docker-compose.test.yml up -d

acceptance_criteria:
  - RECREATE_TEST_DB does not appear anywhere in docker-compose.yml
  - Usage comment shows standalone test invocation (no -f docker-compose.yml -f)
  - docker-compose.yml still defines: db, migrate, app, redis, rq-worker, nginx
  - docker-compose.yml is valid YAML
  - Production compose behavior unchanged (same services, same config minus test artifacts)

tests_to_run:
  - "docker compose config  # validate production compose syntax"
  - "docker compose -f docker-compose.yml -f docker-compose.override.yml config  # validate dev compose syntax"
  - "Select-String -Path docker-compose.yml -Pattern 'RECREATE_TEST_DB'  # verify no test artifacts remain"

risk_level: low

rollout_notes: >
  Low-risk task. Only removes test-specific env vars and updates a comment.
  The production and dev environments should behave identically after this change.
  RECREATE_TEST_DB is test-only and has no place in production config.
  This task is independent of TASK_025 (different file) and can run in parallel.
