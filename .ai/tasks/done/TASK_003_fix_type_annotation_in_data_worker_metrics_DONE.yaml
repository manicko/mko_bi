id: TASK_003_fix_type_annotation_in_data_worker_metrics

title: Fix type annotation clarity in data_worker.py metrics validation

status: completed

priority: low

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\findings.md
source_section: BE-004

description: >
  At lines 127-129 in `data_worker.py`, the code iterates over `config.metrics`
  (typed as `list[dict[str, str]] | None`) and calls `metric.items()` treating
  each item as a dict. The mypy error stems from type ambiguity. The runtime
  behavior is correct but the type checker needs clarification via explicit
  annotation or cast.

goals:
  - Add explicit type annotation or cast to clarify that metric is dict[str, str]
  - Resolve mypy type ambiguity without changing runtime behavior
  - Pass ruff and mypy checks

files:
  - path: src/mkobi/workers/data_worker.py
    targets:
      - type: function
        name: _validate_processing_config
    semantic_anchors:
      insert_after:
        type: for_loop
        value: for metric in config.metrics
    changes:
      - action: add_type_annotation
        description: >
          Add an explicit type annotation or cast on the `metric` variable in the
          metrics validation loop (line 128-129). For example, add a cast:
          `metric_dict = cast(dict[str, str], metric)` before the `metric.items()` call,
          or add a type annotation on the loop variable. The runtime behavior is correct.

acceptance_criteria:
  - mypy no longer reports type ambiguity for the metrics iteration
  - No runtime behavior change
  - ruff and mypy pass without errors

tests_to_run:
  - pytest tests/ -x -q --tb=short

risk: minimal
effort: trivial
rollback: trivial
