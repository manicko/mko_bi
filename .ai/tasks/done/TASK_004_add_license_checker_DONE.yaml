id: TASK_004_add_license_checker

title: Add license-checker-rseidelsohn and license audit script

status: pending

priority: low

depends_on:
  - TASK_002_audit_css_framework_unification
  - TASK_003_audit_react_code_standards

description: >
  Add license-checker-rseidelsohn as a devDependency in frontend/package.json and add
  an npm run licenses script. This is PLAN_06 Wave 2 TASK_03. Depends on both Wave 1
  audits passing.

goals:
  - Add license-checker-rseidelsohn to devDependencies
  - Add npm run licenses script
  - Verify all production dependencies use permissive licenses

files:
  - path: frontend/package.json
    targets:
      - type: json_object
        name: devDependencies
      - type: json_object
        name: scripts
    semantic_anchors:
      insert_into:
        type: json_key
        value: devDependencies
      insert_into:
        type: json_key
        value: scripts

changes:
  - action: add_dependency
    description: Add license-checker-rseidelsohn to devDependencies
    package: license-checker-rseidelsohn
    version: "^4.4.2"
    dependency_type: devDependency

  - action: add_script
    description: Add licenses script to package.json scripts
    script_name: licenses
    script_command: license-checker-rseidelsohn --production --json

acceptance_criteria:
  - license-checker-rseidelsohn listed in devDependencies at version ^4.4.2
  - npm run licenses script added and functional
  - npm install completes without errors
  - npm run licenses outputs JSON with all production dependency licenses
  - All listed licenses are permissive (MIT, BSD, Apache 2.0, ISC, Unlicense)
  - Frontend build still passes (npm run build)

tests_to_run:
  - cd frontend && npm install
  - cd frontend && npm run licenses
  - cd frontend && npm run build

risk_level: low

rollout_notes: >
  Adding a devDependency does not affect production bundles. The license checker only
  reads package metadata. Zero runtime impact.

validated_finding_refs: []
plan_ref: PLAN_06
