id: TASK_016_sec03_env_weak_passwords_guard

title: Fix SEC-003/INF-004 — Add production credential guard and .env warning

status: pending

priority: medium

depends_on: []

description: >
  Fix the MEDIUM issue where .env contains weak development credentials that could accidentally
  be used with production compose. Add a production startup guard in config.py that rejects
  known-weak credential values when ENV=production, and add a warning banner in .env.
  Merges SEC-003 and INF-004 findings.

source_file: .ai/audit/99-validation/04-security-validated.md
source_section: SEC-03: .env Contains Real Values
source_file_2: .ai/audit/99-validation/05-docker-validated.md
source_section_2: INF-004: Development .env — Add Production Credential Guard

files:
  - path: src/mkobi/config.py
    targets:
      - type: class
        name: Settings
    semantic_anchors:
      insert_after:
        type: method
        value: validate_cors_origins_not_placeholder
  - path: .env
    targets:
      - type: file_header
  - path: docker/docker-compose.yml
    targets:
      - type: comment
        description: POSTGRES_PASSWORD line comment

changes:
  - action: add_code
    description: >
      Add a `validate_production_credentials` model_validator to Settings class that checks
      database password and JWT secret against WEAK_PASSWORDS and JWTSettings.WEAK_SECRETS
      when environment is PRODUCTION. Raises ValueError with descriptive message.
  - action: add_code
    description: Add a prominent warning banner at the top of .env file.
  - action: add_code
    description: Add a comment to POSTGRES_PASSWORD line in docker-compose.yml noting that ${VAR:?} enforces presence, not strength.

acceptance_criteria:
  - validate_production_credentials model_validator exists and checks db password + JWT secret
  - .env has a warning banner at the top
  - docker-compose.yml has a comment on POSTGRES_PASSWORD
  - Application fails fast on startup in production with weak credentials

risk_notes: >
  Low risk — adds validation that only runs in production. Development environments are
  unaffected. The WEAK_PASSWORDS and JWTSettings.WEAK_SECRETS sets already exist.

tests_to_run:
  - command: pytest tests/test_config.py -v -k "production" --no-cov
    reason: Verify production credential validation tests
