id: TASK_027_STC_fix_conftest_env

title: Update tests/conftest.py to use os.environ.setdefault() for Docker Compose compatibility

status: done

priority: high

depends_on:
  - TASK_025_STC_rewrite_compose_test

phase: STC
wave: 2

description: >
  Update tests/conftest.py to replace all direct os.environ["KEY"] = value
  assignments with os.environ.setdefault("KEY", value) for environment variables
  that overlap with Docker Compose service definitions. This allows Docker Compose
  environment variables (set in docker-compose.test.yml) to take precedence when
  running inside containers, while preserving localhost defaults for native test
  execution. The same change must be applied to both the module-level assignments
  and the pytest_load_initial_conftests hook.

goals:
  - Replace os.environ["KEY"] = value with os.environ.setdefault("KEY", value) for all Docker-overridable vars
  - Docker Compose env vars (DATABASE__HOST=test-db, REDIS__HOST=test-redis, etc.) take precedence in containers
  - Localhost defaults preserved when running tests natively (no Compose)
  - Both module-level block and pytest_load_initial_conftests hook updated
  - No functional change to test behavior in either execution mode

files:
  - path: tests/conftest.py
    targets:
      - type: function
        name: pytest_load_initial_conftests
      - type: module_level
        name: env_var_block
    semantic_anchors:
      insert_after:
        type: import
        value: "from sqlalchemy.pool import NullPool"
      insert_before:
        type: function
        name: pytest_load_initial_conftests
    changes:
      - action: replace_block
        description: >
          Replace all os.environ["KEY"] = value assignments in the module-level
          env var block (lines ~14-27) with os.environ.setdefault("KEY", value).
          Affected variables: ENV, DATABASE__HOST, DATABASE__PORT, DATABASE__DBNAME,
          DATABASE__USER, DATABASE__PASSWORD, DATABASE__TEST_DBNAME, JWT__SECRET_KEY,
          REDIS__HOST, REDIS__PORT, RECREATE_TEST_DB.
        code_hint: |
          # BEFORE:
          os.environ["ENV"] = "test"
          os.environ["DATABASE__HOST"] = "localhost"
          os.environ["DATABASE__PORT"] = "5432"
          os.environ["DATABASE__DBNAME"] = "bidb_test"
          os.environ["DATABASE__USER"] = "postgres"
          os.environ["DATABASE__PASSWORD"] = "1234"
          os.environ["DATABASE__TEST_DBNAME"] = "bidb_test"
          os.environ["JWT__SECRET_KEY"] = "test_secret_key_change_in_production"
          os.environ["REDIS__HOST"] = "localhost"
          os.environ["REDIS__PORT"] = "6379"
          os.environ["RECREATE_TEST_DB"] = "true"

          # AFTER:
          os.environ.setdefault("ENV", "test")
          os.environ.setdefault("DATABASE__HOST", "localhost")
          os.environ.setdefault("DATABASE__PORT", "5432")
          os.environ.setdefault("DATABASE__DBNAME", "bidb_test")
          os.environ.setdefault("DATABASE__USER", "postgres")
          os.environ.setdefault("DATABASE__PASSWORD", "1234")
          os.environ.setdefault("DATABASE__TEST_DBNAME", "bidb_test")
          os.environ.setdefault("JWT__SECRET_KEY", "test_secret_key_change_in_production")
          os.environ.setdefault("REDIS__HOST", "localhost")
          os.environ.setdefault("REDIS__PORT", "6379")
          os.environ.setdefault("RECREATE_TEST_DB", "true")
      - action: replace_block
        description: >
          Apply the same setdefault change inside the pytest_load_initial_conftests
          function. Replace all os.environ["KEY"] = value with os.environ.setdefault.
        code_hint: |
          # BEFORE (inside pytest_load_initial_conftests):
          os.environ["ENV"] = "test"
          os.environ["DATABASE__HOST"] = "localhost"
          # ... (same pattern for all vars)

          # AFTER:
          os.environ.setdefault("ENV", "test")
          os.environ.setdefault("DATABASE__HOST", "localhost")
          # ... (same pattern for all vars)

acceptance_criteria:
  - All os.environ["KEY"] = value in conftest.py replaced with os.environ.setdefault("KEY", "value")
  - Affected variables: ENV, DATABASE__HOST, DATABASE__PORT, DATABASE__DBNAME, DATABASE__USER, DATABASE__PASSWORD, DATABASE__TEST_DBNAME, JWT__SECRET_KEY, REDIS__HOST, REDIS__PORT, RECREATE_TEST_DB
  - Both module-level block and pytest_load_initial_conftests hook updated
  - No os.environ["KEY"] = value remains for the affected variables
  - When run natively (no Docker): tests work exactly as before (localhost defaults apply)
  - When run inside test-app container: Docker Compose env vars override localhost defaults
  - conftest.py is valid Python (ruff passes)

tests_to_run:
  - "uv run pytest tests/ -v --co  # collect tests natively, verify no import errors"
  - "docker compose -f docker-compose.test.yml exec test-app uv run pytest tests/ -v --co  # collect tests in container"
  - "ruff check tests/conftest.py  # lint check"

risk_level: low

rollout_notes: >
  Low-risk change. setdefault only sets the value if the key is not already
  present in the environment. When running natively, no Docker Compose env vars
  exist, so defaults apply as before. When running inside the test-app container,
  Docker Compose sets DATABASE__HOST=test-db, REDIS__HOST=test-redis, etc., and
  setdefault preserves those values. This is the standard pattern for making
  test configurations work both inside and outside Docker.

  Dependency: TASK_025 must be complete first so we know exactly which env vars
  the compose file sets (DATABASE__HOST, DATABASE__PORT, DATABASE__DBNAME,
  DATABASE__USER, DATABASE__PASSWORD, DATABASE__TEST_DBNAME, REDIS__HOST,
  REDIS__PORT, JWT__SECRET_KEY, RECREATE_TEST_DB).
