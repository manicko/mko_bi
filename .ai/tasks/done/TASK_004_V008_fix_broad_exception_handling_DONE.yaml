id: TASK_004_V008
title: Fix broad exception handling in dashboard filter/graph endpoints
status: pending
priority: medium
depends_on: []

description: >
  Filter bind/unbind endpoints and graph creation endpoint use `except Exception` with
  `HTTPException(status_code=500, detail=str(e))`, leaking internal error details to clients.

goals:
  - Replace broad exception handling with specific exception types
  - Return generic error messages to clients
  - Log internal details server-side

files:
  - path: src/mkobi/api/routes/dashboards.py
    targets:
      - type: function
        name: bind_filter_endpoint
      - type: function
        name: unbind_filter_endpoint
      - type: function
        name: create_graph_endpoint
    semantic_anchors:
      - type: try_except_block
        description: "except Exception blocks with detail=str(e)"
    changes:
      - action: replace_exception_handling
        description: "Replace 'except Exception as e: raise HTTPException(500, detail=str(e))' with specific exceptions"
        code_hint: "Use specific exceptions (IntegrityError, ValueError) and generic messages like 'Operation failed'"

acceptance_criteria:
  - Internal error details are not exposed to API clients
  - Errors are logged server-side with full details
  - Clients receive appropriate HTTP status codes with generic messages
  - Existing tests pass

tests_to_run:
  - uv run pytest tests/test_dashboards_api.py -x -v
  - uv run pytest tests/ -x -v

risk_level: low
notes: >
  Three endpoints need the same pattern fix. Can be done as a single task since
  the fix is consistent across all three.
