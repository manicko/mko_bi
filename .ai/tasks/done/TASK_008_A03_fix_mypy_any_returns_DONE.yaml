id: TASK_008_A03_fix_mypy_any_returns

title: Fix 2 mypy Any return type errors in deps.py and admin.py

status: completed

priority: medium

type: implementation

finding_id: FINDING-A03
source: audit_validated_findings_001.md

depends_on:
  - TASK_006_verify_mandatory_fixes

description: >
  get_current_user_dependency in deps.py returns UserRead.model_validate(user)
  but user from repo.get() is typed such that mypy infers Any. Similarly,
  update_user_role_admin_endpoint in admin.py returns Any from
  user_service.update_user_role().

goals:
  - Add explicit type annotation or cast to get_current_user_dependency return
  - Add explicit type annotation or cast to update_user_role_admin_endpoint return
  - mypy passes clean for both files

files:
  - path: src/mkobi/api/deps.py
    targets:
      - type: function
        name: get_current_user_dependency
    semantic_anchors:
      insert_after:
        type: return_statement
        value: UserRead.model_validate(user)
    changes:
      - action: add_type_hint
        description: >
          Add explicit return type annotation -> UserRead to
          get_current_user_dependency function signature.

  - path: src/mkobi/api/routes/admin.py
    targets:
      - type: function
        name: update_user_role_admin_endpoint
    semantic_anchors:
      insert_after:
        type: return_statement
        context: return from user_service.update_user_role()
    changes:
      - action: add_type_hint
        description: >
          Add explicit return type annotation -> UserRead (or appropriate type) to
          update_user_role_admin_endpoint function signature.

acceptance_criteria:
  - mypy passes for src/mkobi/api/deps.py with no Any inference
  - mypy passes for src/mkobi/api/routes/admin.py with no Any inference
  - No runtime behavior change

tests_to_run:
  - mypy src/mkobi/api/deps.py
  - mypy src/mkobi/api/routes/admin.py

risk: low
effort: small
rollback: Remove type annotations

notes: >
  Standalone type safety improvement. No runtime impact.
  Merged from AUDIT-MEDIUM-04 and AUDIT-MEDIUM-05.
