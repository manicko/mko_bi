id: TASK_005_M05_add_jwt_payload_types

title: Add typed JWT payload interface for frontend token parsing

status: pending

priority: high

type: implementation

finding_id: FINDING-M05
source: audit_validated_findings_001.md

depends_on: []

description: >
  frontend/src/features/auth/model/authToken.ts uses JSON.parse(atob(token.split('.')[1]))
  which returns any. The exp field is accessed without validation. If JWT structure
  changes or is malformed, silent failures occur instead of explicit errors.

goals:
  - Define a typed JWTPayload interface
  - Add runtime validation of JWT payload structure
  - Replace any return type with typed interface
  - No behavioral change for valid tokens

files:
  - path: frontend/src/features/auth/model/authToken.ts
    targets:
      - type: function
        context: JWT parsing function using JSON.parse(atob(...))
    semantic_anchors:
      insert_after:
        type: function_call
        value: JSON.parse
    changes:
      - action: add_type
        description: >
          Define interface JWTPayload { sub: string; exp: number; user_id?: string; role?: string; }
      - action: modify_code
        description: >
          Replace raw JSON.parse(atob(...)) with a validated parse function that
          checks required fields (sub, exp) and returns JWTPayload.
          Throw explicit error if structure is invalid.

acceptance_criteria:
  - JWTPayload interface is defined and exported
  - JWT parsing function returns JWTPayload instead of any
  - Malformed tokens throw explicit error instead of silent undefined
  - Valid tokens continue to work as before
  - No TypeScript compilation errors
  - No any types in JWT parsing path

tests_to_run:
  - cd frontend && npm run build
  - cd frontend && npx tsc --noEmit

risk: low
effort: small
rollback: Remove type interface and revert to raw JSON.parse

notes: >
  Standalone frontend type-safety improvement. Purely defensive.
  The real security enforcement is backend-side.
