id: TASK_008_add_explicit_return_types_for_repository_methods

title: Add explicit return type annotations for repository methods in processing_log_service.py

status: pending

priority: low

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\findings.md
source_section: BE-008

description: >
  Lines 78, 85, and 217 in `processing_log_service.py` return `Any` type when the
  function is declared to return `list[ProcessingLogRead]`. The repository methods
  return `Any` because the repository interfaces use `Any` as return types. This
  violates strict typing requirements (no-any-return). Add explicit
  `cast(list[ProcessingLogRead], ...)` to the return statements.

goals:
  - Add explicit cast(list[ProcessingLogRead], ...) at line 78 (get_processing_logs_by_dashboard)
  - Add explicit cast(list[ProcessingLogRead], ...) at line 85 (get_processing_logs_by_status)
  - Add explicit cast(list[ProcessingLogRead], ...) at line 217 (get_filtered)
  - Ensure mypy passes without no-any-return errors

files:
  - path: src/mkobi/services/processing_log_service.py
    targets:
      - type: method
        name: get_processing_logs_by_dashboard
      - type: method
        name: get_processing_logs_by_status
      - type: method
        name: get_filtered
    semantic_anchors:
      insert_after:
        type: function_call
        value: log_repo.get_by_dashboard
      insert_after:
        type: function_call
        value: log_repo.get_filtered
    changes:
      - action: add_code
        description: >
          Wrap the return values at lines 78, 85, and 217 with
          `cast(list[ProcessingLogRead], ...)` to explicitly convert the `Any`
          return from repository methods to the declared return type.
          Example: `return cast(list[ProcessingLogRead], await self.log_repo.get_by_dashboard(dashboard_id, db))`

acceptance_criteria:
  - All three return statements wrapped with cast(list[ProcessingLogRead], ...)
  - mypy passes without no-any-return errors
  - No runtime behavior change
  - All existing tests pass

