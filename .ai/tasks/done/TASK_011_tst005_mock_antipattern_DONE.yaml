---
id: TASK_011_tst005_mock_antipattern
title: TST-005 — Refactor mock verification anti-pattern in data service tests
status: pending
priority: medium
type: implementation
depends_on:
  - TASK_003_fe001_circular_import

source_reference: .ai/audit/99-validation/06-tests-validated.md
source_section: TST-005 — Mock verification anti-pattern

description: >
  The data service tests use `log_repo.create_log.assert_called_once()` which
  tests mock calls instead of actual outcomes. This is an anti-pattern that
  makes tests brittle and less valuable. Refactor these tests to verify actual
  database state changes instead of mock call assertions, following the
  integration test pattern from test_services_integration.py.

goals:
  - Replace mock verification assertions with outcome-based assertions
  - Tests should verify that log records are actually created in the database
  - Follow the integration test pattern from test_services_integration.py
  - Remove dependency on mock.call assertions for verifying side effects

files:
  - path: tests/test_data_service.py
    targets:
      - type: test_function
    semantic_anchors:
      insert_after:
        type: assert_statement
        value: assert_called_once
    changes:
      - action: modify_code
        description: >
          Replace `log_repo.create_log.assert_called_once()` patterns with
          actual database queries that verify the log record was created
          with the correct values. Use the test database session to query
          the processing_logs table and assert on the returned data.

risks:
  - Medium risk: changes test semantics, must ensure replacement tests are correct
  - Must ensure the test database is properly set up for the new assertions
  - Changes may affect test execution time (real DB queries vs mock assertions)

acceptance_criteria:
  - No assert_called_once() calls remain in test_data_service.py
  - Tests verify actual database state changes
  - All refactored tests pass
  - Test coverage is maintained or improved

tests_to_run:
  - pytest tests/test_data_service.py -v
