id: TASK_035_P01_frontend_refresh_api

title: Add refresh token API function

status: done

priority: high

depends_on: []

phase: PLAN_01
wave: 4

description: >
  Create the frontend API function to call POST /auth/refresh with credentials
  included. This function reads the httpOnly refresh cookie and returns a new
  access token.

finding_ref: PLAN_01_WAVE_4
severity: medium

goals:
  - Add refreshToken() function to features/auth/api/authApi.ts
  - Call with credentials: 'include' for cookie access
  - Return response data with proper typing
  - Function is properly typed

files:
  - path: frontend/src/features/auth/api/authApi.ts
    targets:
      - type: file
        name: authApi
    semantic_anchors:
      insert_after:
        type: function_definition
        pattern: "export async function"
    changes:
      - action: add_function
        description: Add refreshToken API function
        code_hint: |
          export async function refreshToken(): Promise<Token> {
            const { data } = await axiosInstance.post<Token>(
              "/auth/refresh",
              {},
              { withCredentials: true }
            );
            return data;
          }

acceptance_criteria:
  - Function properly calls refresh endpoint
  - Cookies are included in request (withCredentials: true)
  - Function is properly typed with Token return type
  - Function is exported and importable

tests_to_run:
  - "npm test -- --testPathPattern=auth --verbose"

risk_level: low

rollout_notes: >
  Independent of other Wave 4 tasks. Can be done in parallel.
  Uses existing axiosInstance which already has withCredentials support.
