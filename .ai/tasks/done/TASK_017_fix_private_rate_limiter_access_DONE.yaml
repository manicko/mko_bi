id: TASK_017_fix_private_rate_limiter_access

title: Fix private _rate_limiter access across layer boundary (BE-003)

status: pending

priority: medium

depends_on: []

description: >
  The auth route handler accesses `auth_service._rate_limiter` (private attribute) directly
  from the API layer, violating encapsulation. The route should use a public method or
  dependency injection instead of reaching into the service's private state.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: BE-003

goals:
  - Remove direct access to private `_rate_limiter` attribute from route handler
  - Use dependency-injected rate limiter instead of accessing service internals
  - Preserve IP-based rate limiting behavior for login endpoint

files:
  - path: src/mkobi/api/routes/auth.py
    targets:
      - type: function
        name: _handle_login
    semantic_anchors:
      - replace_private_access:
          value: "auth_service._rate_limiter"
          description: Replace with injected rate limiter dependency

changes:
  - action: modify
    description: >
      Replace `auth_service._rate_limiter` access with a directly instantiated
      AsyncRateLimiter in _handle_login, matching the pattern already used in
      the register_request endpoint (lines 515-518). This keeps rate limiting
      logic in the route layer where it belongs.

    code_hint: |
      # BEFORE (line 77):
      rate_limiter = auth_service._rate_limiter

      # AFTER:
      rate_limiter = AsyncRateLimiter(
          redis_client.get_async_redis_client(),
          fail_closed=get_config().rate_limiter_fail_closed,
      )

acceptance_criteria:
  - No direct access to `_rate_limiter` private attribute from route handlers
  - Login rate limiting still works (5 attempts per 5 minutes per IP)
  - Same rate limiter pattern used consistently across all auth endpoints
  - Tests pass for auth flows

risk: low

tests_to_run:
  - "pytest tests/ -v -k 'auth or login or rate_limit'"
