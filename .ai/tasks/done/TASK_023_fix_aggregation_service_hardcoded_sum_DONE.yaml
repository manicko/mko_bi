id: TASK_023_fix_aggregation_service_hardcoded_sum

title: Use metric_agg parameter in AggregationService instead of hardcoding sum (DP-005)

status: completed

priority: medium

depends_on: []

description: >
  The AggregationService.aggregate_for_dashboard() accepts a metric_agg parameter
  but ignores it, hardcoding pl.col(m).sum() for all metric aggregations. The
  aggregation function from the processing config should be used instead.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: DP-005

goals:
  - Use the metric_agg parameter in aggregation expressions
  - Support at minimum: sum, mean, min, max, count
  - Fall back to sum for unknown aggregation functions

files:
  - path: src/mkobi/services/aggregation_service.py
    targets:
      - type: function
        name: aggregate_for_dashboard
    semantic_anchors:
      - replace_hardcoded:
          value: "pl.col(m).sum().alias(f\"{m}_sum\")"
          description: Use metric_agg parameter for aggregation function

changes:
  - action: modify
    description: >
      Replace the hardcoded .sum() with a dynamic aggregation function based on
      the metric_agg parameter. Support sum, mean, min, max, count.

    code_hint: |
      # BEFORE (line 68):
      agg_exprs = [pl.col(m).sum().alias(f"{m}_sum") for m in metric_cols]

      # AFTER:
      _agg_fn_map = {
          "sum": lambda c: c.sum(),
          "mean": lambda c: c.mean(),
          "min": lambda c: c.min(),
          "max": lambda c: c.max(),
          "count": lambda c: c.count(),
      }
      agg_fn = _agg_fn_map.get(metric_agg, lambda c: c.sum())
      agg_exprs = [agg_fn(pl.col(m)).alias(f"{m}_{metric_agg}") for m in metric_cols]

acceptance_criteria:
  - metric_agg parameter is used in aggregation expressions
  - sum, mean, min, max, count are all supported
  - Unknown aggregation functions fall back to sum
  - Aggregation result column names reflect the actual function used
  - Tests pass for aggregation service

risk: medium

tests_to_run:
  - "pytest tests/ -v -k 'aggregation'"
