id: TASK_027_finding_011_test_compose_race

title: Remove redundant AUTO_MIGRATE=true from test-app in docker-compose.test.yml

type: implementation

status: completed

priority: low

depends_on:
  - TASK_026_verify_finding_004_auto_migrate_true

description: >
  docker-compose.test.yml has both a test-migrate service that runs alembic upgrade head
  AND test-app with AUTO_MIGRATE=true. This creates a potential race condition (mitigated
  by depends_on) and wastes CI time running migrations twice. Remove AUTO_MIGRATE from
  test-app since test-migrate already handles it.

goals:
  - Remove AUTO_MIGRATE=true from test-app service
  - Keep test-migrate as the single migration mechanism for tests

files:
  - path: docker/docker-compose.test.yml
    targets:
      - type: compose_service
        name: test-app
    semantic_anchors:
      within_block:
        type: compose_key
        value: environment
    changes:
      - action: remove_code
        description: Remove AUTO_MIGRATE: "true" from test-app environment
        code_hint: |
          # Remove the line: AUTO_MIGRATE: "true"

acceptance_criteria:
  - test-app no longer has AUTO_MIGRATE=true
  - test-migrate service remains as the migration mechanism
  - Test compose config validates successfully

tests_to_run:
  - docker compose -f docker/docker-compose.test.yml config

risk_level: low

rollout_notes: >
  Low risk: only affects test environment. May slightly speed up test container startup.
  depends_on: test-migrate with condition: service_completed_successfully ensures
  migrations run first.
