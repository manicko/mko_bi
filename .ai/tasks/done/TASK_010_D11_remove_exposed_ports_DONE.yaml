id: TASK_010_D11_remove_exposed_ports

title: Remove DB and Redis Ports Exposed to Host in Base Compose

status: pending

priority: medium

depends_on: []

phase: DOCKER_HARDENING
wave: 1

description: >
  docker-compose.yml exposes DB port 5432 and Redis port 6379 to the host in the base
  (production) compose file. This creates unnecessary attack surface. The dev override
  already exposes DB port for local tooling. Remove ports from base compose services.

finding_ref: DOCKER-011
severity: medium

goals:
  - Remove ports from db service in docker-compose.yml
  - Remove ports from redis service in docker-compose.yml
  - Dev override still exposes DB port for local tooling
  - Production compose doesn't expose internal service ports

files:
  - path: docker-compose.yml
    targets:
      - type: service
        name: db
      - type: service
        name: redis
    semantic_anchors:
      insert_after:
        type: block
        value: "db:"
    changes:
      - action: remove_directive
        description: Remove ports from db service
      - action: remove_directive
        description: Remove ports from redis service

acceptance_criteria:
  - DB port 5432 is not exposed to host in base compose
  - Redis port 6379 is not exposed to host in base compose
  - Dev override still exposes DB port 5432 for local tooling
  - App can still connect to DB and Redis via internal network

docker_health_checks:
  - name: All containers running
    command: "docker compose ps --format json"
    expected: "All services (db, migrate, app) show 'running' status"
  - name: DB container healthy
    command: "docker compose ps db --format json"
    expected: "db container shows 'healthy' status"
  - name: App can connect to DB via internal network
    command: "docker compose exec app python -c \"import socket; s = socket.create_connection(('db', 5432), timeout=5); print('DB reachable'); s.close()\""
    expected: "Prints 'DB reachable' — app connects to db via internal network"
  - name: App can connect to Redis via internal network
    command: "docker compose exec app python -c \"import socket; s = socket.create_connection(('redis', 6379), timeout=5); print('Redis reachable'); s.close()\""
    expected: "Prints 'Redis reachable' — app connects to redis via internal network"
  - name: App health endpoint responds
    command: "curl -sf http://localhost:8000/health"
    expected: "Returns HTTP 200"
  - name: No container restarts
    command: "docker compose ps --format '{{.Name}} {{.Status}}'"
    expected: "No container shows 'restarting' or 'unhealthy' status"
  - name: DB port NOT accessible on host (base compose)
    command: "docker compose up -d && ! curl -sf telnet://localhost:5432 2>/dev/null"
    expected: "Port 5432 is NOT directly accessible on host when using base compose only"

tests_to_run:
  - "docker compose up -d"
  - "curl -sf http://localhost:8000/health  # verify app is up"
  - "docker compose exec app python -c \"import socket; s = socket.create_connection(('db', 5432), timeout=5); print('OK')\""

risk_level: low

rollout_notes: >
  Standalone fix. Dev override already exposes DB port 5432 (line 69), which is
  acceptable for local development. Production should not expose these ports.
