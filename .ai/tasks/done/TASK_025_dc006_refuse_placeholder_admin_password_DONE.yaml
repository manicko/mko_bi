id: TASK_025_dc006_refuse_placeholder_admin_password

title: Fix DC-006 — Refuse placeholder ADMIN_PASSWORD in ensure_admin_user()

status: done

priority: high

depends_on:
  - TASK_016_sec03_env_weak_passwords_guard

description: >
  Fix the HIGH issue where ensure_admin_user() in starter.py uses the admin password
  directly without checking if it's a known placeholder value. This could create an
  admin user with a known password if the default config value is not overridden.

source_file: .ai/audit/99-validation/08-deployment-config-validated.md
source_section: DC-006: ADMIN_PASSWORD Placeholder — Refuse Placeholder in ensure_admin_user()

files:
  - path: src/mkobi/db/starter.py
    targets:
      - type: method
        name: ensure_admin_user
    semantic_anchors:
      insert_before:
        type: function_call
        value: hash_password

changes:
  - action: add_code
    description: >
      Add a check at the top of ensure_admin_user() that raises ValueError if the admin
      password matches a known placeholder value (checked against WEAK_PASSWORDS).
      This check runs in ALL environments.
    code_hint: |
      from mkobi.config import WEAK_PASSWORDS

      # At top of ensure_admin_user():
      if admin_password.lower() in {p.lower() for p in WEAK_PASSWORDS}:
          raise ValueError(
              "Admin password is a known placeholder value. "
              "Set ADMIN_PASSWORD to a strong, unique password."
          )

acceptance_criteria:
  - ensure_admin_user raises ValueError for known placeholder passwords
  - Check runs in all environments (not just production)
  - Does not break development workflows (developer must set ADMIN_PASSWORD)

risk_notes: >
  Medium risk — adds a hard check that could break existing dev setups if ADMIN_PASSWORD
  is not set. The Docker Compose ${ADMIN_PASSWORD:?...} syntax already requires it to be set.

tests_to_run:
  - command: pytest tests/test_starter.py -v -k "ensure_admin" --no-cov
    reason: Verify admin user creation tests pass with placeholder check