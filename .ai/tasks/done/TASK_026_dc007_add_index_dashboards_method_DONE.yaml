id: TASK_026_dc007_add_index_dashboards_method

title: Fix DC-007 — Add ensure_indexes to DashboardsService startup for dashboards table

status: pending

priority: low

depends_on: []

description: >
  Fix the LOW issue where the dashboards table has no ensure_indexes method in
  DashboardsService, unlike other services that have startup index creation methods.
  Add ensure_indexes(db) to DashboardsService and wire it into the startup sequence.

source_file: .ai/audit/99-validation/08-deployment-config-validated.md
source_section: DC-007: Missing Indexes on Startup — Dashboards

files:
  - path: src/mkobi/services/dashboard_service.py
    targets:
      - type: class
        name: DashboardService
    semantic_anchors:
      insert_after:
        type: method
        name: delete_dashboard
  - path: src/mkobi/app.py
    targets:
      - type: function
        name: lifespan
    semantic_anchors:
      find:
        type: function_call
        value: ensure_indexes

changes:
  - action: add_code
    description: >
      Add an `ensure_indexes(db)` method to DashboardService that creates commonly used
      indexes on the dashboards table via `CREATE INDEX IF NOT EXISTS`. The dashboards
      table has indexes for lookup by name, owner, type, and is_active status.
    - action: add_code
    description: >
      Wire the new ensure_indexes method into the application startup sequence alongside
      other service ensure_indexes calls.

acceptance_criteria:
  - DashboardService has ensure_indexes method
  - Method creates indexes via CREATE INDEX IF NOT EXISTS (environment-safe)
  - Wired into app.py startup sequence
  - No-op in SQLite (IF NOT EXISTS + ~is_postgres guard)

risk_notes: >
  Low risk — uses CREATE INDEX IF NOT EXISTS which is idempotent. Checker type ensures
  operator class is available.

tests_to_run:
  - command: pytest tests/test_dashboard_service.py -v -k "index" --no-cov
    reason: Verify dashboard service index tests
