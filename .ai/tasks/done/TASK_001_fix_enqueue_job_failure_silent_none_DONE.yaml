id: TASK_001_fix_enqueue_job_failure_silent_none

title: Fix enqueue_job silent failure - task permanently stuck

status: pending

priority: critical

depends_on: []

description: >
  Fix the enqueue_job function to raise an exception instead of returning None on failure,
  and update enqueue_processing_job to handle the failure properly. This prevents tasks from
  getting stuck in UPLOADED status when the enqueue operation fails.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: DP-001

goals:
  - Make enqueue_job raise exception on failure instead of returning None
  - Update enqueue_processing_job to catch and handle enqueue failures
  - Update processing log status on enqueue failure for proper stale cleanup

files:
  - path: src/mkobi/core/task_queue.py
    targets:
      - type: function
        name: enqueue_job
    semantic_anchors:
      - replace_function_call:
          value: "logger.error"
          description: Replace silent return None with AppException raise

  - path: src/mkobi/services/file_processing.py
    targets:
      - type: function
        name: enqueue_processing_job
    semantic_anchors:
      - after_function_call:
          value: "enqueue_job"
          description: Check return value and handle failure

changes:
  - action: modify
    description: >
      In enqueue_job(), replace the silent None return with raising AppException.
      Change lines 176-180 from returning None to raising AppException with appropriate error code.

    code_hint: |
      # BEFORE:
      except Exception as e:
          logger.error("Failed to enqueue job: %s", e)
          return None

      # AFTER:
      except Exception as e:
          logger.error("Failed to enqueue job: %s", e)
          raise AppException(
              code=ErrorCode.FILE_PROCESSING_ERROR,
              detail=f"Failed to enqueue processing job: {e}",
          ) from e

  - action: modify
    description: >
      In enqueue_processing_job(), add error handling after enqueue_job call.
      If enqueue fails, the function should raise to trigger proper error handling upstream.

    code_hint: |
      # BEFORE:
      await enqueue_job(
          process_csv_background,
          file_path_str=file_path,
          dashboard_id_str=str(dashboard_id),
          task_id=str(task_id),
          mode=str(mode),
          processing_config_dict=processing_config,
      )

      # AFTER:
      try:
          job_id = await enqueue_job(
              process_csv_background,
              file_path_str=file_path,
              dashboard_id_str=str(dashboard_id),
              task_id=str(task_id),
              mode=str(mode),
              processing_config_dict=processing_config,
          )
      except Exception as e:
          logger.error("Failed to enqueue processing job: %s", e)
          raise

acceptance_criteria:
  - enqueue_job raises AppException on failure instead of returning None
  - enqueue_processing_job propagates enqueue failures
  - Tests pass for task queue and file processing modules
  - Processing logs properly track task status on failure

risk: high

tests_to_run:
  - "pytest tests/ -v -k 'task_queue or file_processing'"