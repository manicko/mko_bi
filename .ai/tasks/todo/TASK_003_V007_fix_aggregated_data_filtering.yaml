id: TASK_003_V007
title: Fix get_aggregated_data not filtering by dashboard_id
status: pending
priority: medium
depends_on: []
wave: 1

description: >
  The get_aggregated_data method accepts dashboard_id and graph_id parameters
  but doesn't use them to filter results. Returns all aggregated data regardless
  of which dashboard is requested. Add dashboard_id and graph_id filters to the
  repository query.

goals:
  - get_aggregated_data filters by dashboard_id
  - get_aggregated_data filters by graph_id when provided
  - No data leakage between dashboards
  - Backward compatible when parameters are None

files:
  - path: src/mkobi/services/data_service.py
    targets:
      - type: method
        name: DataService.get_aggregated_data
    semantic_anchors:
      insert_after:
        type: method_call
        value: self.aggregated_data_repo
    changes:
      - action: modify_code
        description: Add dashboard_id and graph_id as filter parameters to the repository query. When dashboard_id is provided, filter by it. When graph_id is provided, filter by it.

acceptance_criteria:
  - GET /data/aggregated?dashboard_id=X returns only data for dashboard X
  - GET /data/aggregated?dashboard_id=X&graph_id=Y returns only data for graph Y in dashboard X
  - No data leakage between dashboards
  - Tests pass

tests_to_run:
  - tests/test_data_service.py

risk_level: low
risk_notes: Low risk, independent fix. Add filters to existing query.

validated_finding: V-007
severity: MEDIUM
