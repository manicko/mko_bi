id: TASK_039_fix_graph_data_type_mismatch

title: Fix GraphData type mismatch with backend response (INT-004)

status: pending

priority: medium

depends_on: []

description: >
  The GraphData interface in api.types.ts has a simple `data: Data[]` field,
  but the backend returns GraphDataWithConfig which includes type, name, layout,
  and config fields. The frontend uses GraphDataWithConfig in some places but
  GraphData in others, creating inconsistency.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: INT-004

goals:
  - Consolidate GraphData and GraphDataWithConfig into a single consistent type
  - Ensure all graph data handling uses the same type
  - Remove the unused GraphData interface

files:
  - path: frontend/src/shared/types/api.types.ts
    targets:
      - type: interface
        name: GraphData
      - type: interface
        name: GraphDataWithConfig
    semantic_anchors:
      - merge_interfaces:
          description: Consolidate into single GraphDataWithConfig type

changes:
  - action: modify
    description: >
      Remove the redundant GraphData interface and use GraphDataWithConfig
      consistently throughout the codebase. Update AggregatedDataResponse
      to reference the correct type.

    code_hint: |
      # BEFORE (lines 48-51):
      export interface GraphData {
        graph_id: string
        data: Data[] // Plotly data format
      }

      # AFTER: Remove GraphData interface entirely.
      # GraphDataWithConfig (lines 171-184) is the correct type.
      # Update any references from GraphData to GraphDataWithConfig.

acceptance_criteria:
  - GraphData interface removed
  - All graph data uses GraphDataWithConfig
  - No type errors in chart rendering code
  - Tests pass

risk: low

tests_to_run:
  - "cd frontend && npm test -- --testPathPattern=ChartRenderer or DashboardView"
