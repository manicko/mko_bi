id: TASK_023_v019_jwt_user_id_assertions

title: "V-019: Fix JWT user_id type coercion assertions in test_security.py"

status: pending

priority: medium

depends_on:
  - TASK_022_verify_v022_duplicate_storage_tests

description: >
  Multiple tests in tests/test_security.py create tokens with user_id as int
  (e.g., {"user_id": 123}) and assert payload["user_id"] == 123 (int).
  JWT encodes values as JSON, so 123 becomes string "123" on decode.
  The assertions will FAIL when run against real JWT implementation.

goals:
  - Fix 4 assertions in test_security.py to compare with string values
  - Align with test_auth_service.py which correctly handles JWT type coercion

files:
  - path: tests/test_security.py
    targets:
      - type: test_function
        name: test_valid_refresh_token
      - type: test_class
        name: TestIntegration
    semantic_anchors:
      insert_after:
        type: assert_statement
        value: "payload[\"user_id\"]"
      context: "Assert string comparison for user_id from JWT payload"

changes:
  - action: modify_code
    description: >
      Change assertions from payload["user_id"] == 123 (int) to
      payload["user_id"] == "123" (string) in test_valid_refresh_token
      and TestIntegration tests.
    anchor: "assert statements comparing user_id values from JWT decode"

acceptance_criteria:
  - All assertions use string comparison for user_id
  - Tests pass against real JWT implementation (not mocked)
  - Consistent with test_auth_service.py patterns

tests_to_run:
  - pytest tests/test_security.py -x --tb=short

risk_level: trivial (test assertion fix only)

source_findings:
  - V-019
  - T1-Finding1
  - T2-F10

estimated_effort: trivial (4 assertion lines)
