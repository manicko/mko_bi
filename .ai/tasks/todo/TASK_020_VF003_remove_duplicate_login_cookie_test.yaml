        name: TestLogin
      - type: method
        name: test_login_sets_refresh_token_cookie
    semantic_anchors:
      insert_after:
        type: class
        value: TestLogin
      remove:
        type: method
        value: test_login_sets_refresh_token_cookie
    changes:
      - action: remove_code
        description: >
          Remove the test_login_sets_refresh_token_cookie method from TestLogin class.
          The equivalent test in test_auth_api.py::TestCookieAuthFlow is preferred.

acceptance_criteria:
  - test_login_sets_refresh_token_cookie removed from test_auth.py
  - test_login_sets_refresh_cookie still exists in test_auth_api.py
  - No other tests reference the removed test method
  - All remaining tests pass

tests_to_run:
  - tests/test_auth.py -k "TestLogin" (verify remaining login tests pass)
  - tests/test_auth_api.py::TestCookieAuthFlow::test_login_sets_refresh_cookie

risk_level: low

notes: >
