id: TASK_035_remove_auto_migrate_contradiction

title: Remove AUTO_MIGRATE=true from app service (INF-003)

status: pending

priority: medium

depends_on: []

description: >
  The app service in docker-compose.yml has AUTO_MIGRATE=true, but there is also
  a dedicated migrate service that runs alembic migrations before the app starts.
  Having AUTO_MIGRATE=true on the app service creates a contradiction: migrations
  run twice (once by migrate service, once by app startup). Remove AUTO_MIGRATE
  from the app service since the dedicated migrate service handles it.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: INF-003

goals:
  - Remove AUTO_MIGRATE=true from app service environment
  - Keep AUTO_MIGRATE=false on rq-worker (already correct)
  - Document that migrations are handled by the migrate service

files:
  - path: docker/docker-compose.yml
    targets:
      - type: environment_variable
        name: AUTO_MIGRATE
    semantic_anchors:
      - remove_variable:
          value: "AUTO_MIGRATE: \"true\""
          description: Remove from app service

changes:
  - action: modify
    description: >
      Remove AUTO_MIGRATE=true from the app service. Migrations are handled
      by the dedicated migrate service that runs before the app starts.

    code_hint: |
      # BEFORE (line 100):
      AUTO_MIGRATE: "true"

      # AFTER:
      # AUTO_MIGRATE removed - migrations handled by migrate service

acceptance_criteria:
  - AUTO_MIGRATE not set on app service
  - Migrations still run via dedicated migrate service
  - App starts correctly without running migrations
  - Docker compose validates successfully

risk: low

tests_to_run:
  - "cd docker && docker compose config"
