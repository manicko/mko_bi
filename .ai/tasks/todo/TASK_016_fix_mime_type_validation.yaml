id: TASK_016_fix_mime_type_validation

title: Fix MIME type validation — don't trust client Content-Type header (DP-003)

status: pending

priority: high

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\final-report.md
source_section: DP-003 — MIME type validation trusts client Content-Type header (spoofable)

description: >
  The file processing service validates MIME types using the client-provided Content-Type
  header, which is easily spoofed. An attacker can upload a malicious file with a .csv
  extension and application/csv Content-Type while the actual content is executable.
  Use python-magic or file content sniffing to detect the actual MIME type from file bytes.

goals:
  - Replace client Content-Type header validation with server-side MIME detection
  - Use python-magic or similar library to detect MIME type from file content
  - Reject files whose detected MIME type doesn't match allowed types

files:
  - path: src/mkobi/services/file_processing.py
    targets:
      - type: function
        name: (MIME validation function)
    semantic_anchors:
      insert_after:
        type: function_call
        value: content_type
    changes:
      - action: replace_code
        description: Replace Content-Type header check with server-side MIME detection
        code_hint: |
          import magic
          detected_mime = magic.from_buffer(file_buffer[:2048], mime=True)
          if detected_mime not in settings.allowed_mime_types:
              raise FileValidationError(f"Detected MIME type {detected_mime} not allowed")

  - path: pyproject.toml
    targets:
      - type: dependencies
    changes:
      - action: add_code
        description: Add python-magic dependency
        code_hint: |
          python-magic = "^0.4.27"

acceptance_criteria:
  - MIME type is detected from file content, not client header
  - Spoofed Content-Type headers are rejected
  - Valid files pass validation correctly
  - File processing tests pass

tests_to_run:
  - pytest tests/ -v -k "file" --tb=short
  - pytest tests/ -v -k "upload" --tb=short

risk: medium

notes: >
  HIGH — Security fix. python-magic requires libmagic system library. Document this
  dependency in Dockerfile and setup instructions. Consider python-magic-bin for Windows.
