id: task_001
title: Fix file.size null check in upload endpoint
status: pending
priority: high
depends_on: []
description: >
  Add null check for file.size before comparing with max file size to prevent TypeError when file.size is None.
goals:
  - Prevent TypeError when file.size is None
  - Ensure file size limit is enforced only when file.size is not None
files:
  - path: src/mkobi/api/routes/upload.py
    targets:
      - type: function
        name: upload_file_endpoint
    semantic_anchors:
      - type: function
        name: upload_file_endpoint
    changes:
      - action: replace
        old_text: "if file.size > config.max_file_size * 1024 * 1024:  # Convert MB to bytes"
        new_text: "if file.size is not None and file.size > config.max_file_size * 1024 * 1024:  # Convert MB to bytes"
acceptance_criteria:
  - The file size check does not raise TypeError when file.size is None
  - The file size limit is still enforced when file.size is not None and exceeds the limit
  - Tests pass
tests_to_run:
  - tests/test_upload_api.py
risk_level: low