id: TASK_003_dp07_lower_timeout_orphaned_uploaded_check

title: Fix DP-07 — Lower stale processing timeout and add orphaned UPLOADED startup check

status: pending

priority: high

depends_on:
  - TASK_001_dp08_independent_session_for_failed_status

description: >
  Fix the HIGH issue where in-memory TaskQueue loses tasks on crash and the stale processing
  timeout defaults to 30 minutes. Lower the timeout to 5 minutes and add a startup check that
  marks orphaned UPLOADED logs as FAILED.

source_file: .ai/audit/99-validation/07-data-processing-validated.md
source_section: DP-07: TaskQueue loses tasks on crash — lower timeout + startup check

files:
  - path: src/mkobi/workers/data_worker.py
    targets:
      - type: constant
        name: DEFAULT_STALE_PROCESSING_TIMEOUT_MINUTES
      - type: function
        name: cleanup_stale_processing_logs
    semantic_anchors:
      find:
        type: assignment
        value: DEFAULT_STALE_PROCESSING_TIMEOUT_MINUTES = 30
      insert_after:
        type: function
        value: cleanup_stale_processing_logs

changes:
  - action: replace_code
    description: Change DEFAULT_STALE_PROCESSING_TIMEOUT_MINUTES from 30 to 5.
  - action: add_code
    description: >
      Add new function `mark_orphaned_uploaded_logs_failed()` after `cleanup_stale_processing_logs`.
      This function marks UPLOADED logs older than 1 minute as FAILED, handling both test mode
      (caller-managed session) and production mode (independent session with transaction).
    code_hint: |
      async def mark_orphaned_uploaded_logs_failed(
          session: AsyncSession | None = None,
      ) -> int:
          """Mark UPLOADED logs with no running worker as FAILED.
          On startup, any log stuck in UPLOADED state means the worker
          crashed between enqueue and processing start."""
          cutoff = datetime.now(UTC) - timedelta(minutes=1)
          # Test mode: use caller-managed session
          # Production mode: create independent session with transaction
          # Execute UPDATE ... WHERE status = UPLOADED AND started_at < cutoff
          # UPDATE status=FAILED, message="Worker restart: orphaned...", finished_at=now
  - action: add_code
    description: >
      Wire `mark_orphaned_uploaded_logs_failed()` into the application startup event handler
      (in app.py lifespan), alongside `start_stale_processing_cleanup_task`.

acceptance_criteria:
  - DEFAULT_STALE_PROCESSING_TIMEOUT_MINUTES is 5
  - mark_orphaned_uploaded_logs_failed exists and marks UPLOADED logs older than 1 min as FAILED
  - Startup handler calls the new function
  - Works in both test mode and production mode

risk_notes: >
  Low risk — constant change and new function addition. The startup wiring requires finding
  the correct location in app.py's lifespan handler.

tests_to_run:
  - command: pytest tests/test_data_worker.py -v -k "stale or orphaned or cleanup" --no-cov
    reason: Verify stale/orphaned processing cleanup tests
