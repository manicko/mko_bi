id: TASK_005_add_rate_limiting_refresh_endpoint

title: Add rate limiting to /auth/refresh endpoint

status: pending

priority: high

depends_on: []

description: >
  Add rate limiting to the /auth/refresh endpoint to prevent brute-force token
  refresh attacks. Currently, this endpoint has no rate limiting while /login does.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: SEC-003

goals:
  - Add rate limiting to the refresh endpoint
  - Use same rate limiting pattern as login endpoint
  - Prevent token refresh brute-force attacks

files:
  - path: src/mkobi/api/routes/auth.py
    targets:
      - type: function
        name: refresh
    semantic_anchors:
      - add_function_call_after:
          value: "logger.info"
          description: Add rate limiting check after token retrieval

changes:
  - action: modify
    description: >
      Add rate limiting check to refresh endpoint using AsyncRateLimiter.

    code_hint: |
      # Add rate limiting after retrieving refresh_token_value
      # Similar pattern to login endpoint at lines 76-85:
      client_ip = request.client.host if request.client else "unknown"
      rate_limiter = AsyncRateLimiter(
          redis_client.get_async_redis_client(),
          fail_closed=get_config().rate_limiter_fail_closed,
      )
      rate_limit_key = f"refresh:{client_ip}" if client_ip else "refresh:unknown"
      if not await rate_limiter.check_rate_limit(rate_limit_key, max_attempts=10, ttl=300):
          logger.warning("Refresh rate limit exceeded", extra={"ip": client_ip})
          raise AppException(
              code=ErrorCode.RATE_LIMIT_EXCEEDED,
              detail="Too many refresh attempts. Try again later.",
              headers={"WWW-Authenticate": "Bearer"},
          )

acceptance_criteria:
  - Rate limiting added to /auth/refresh endpoint
  - Same pattern as /login endpoint
  - Tests pass for auth flows with rate limiting

risk: medium

tests_to_run:
  - "pytest tests/ -v -k 'auth or refresh'"