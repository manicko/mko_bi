id: TASK_001_critical_add_dashboard_access_control

title: CRITICAL — Add dashboard access control to processing config endpoints (IDOR)

status: pending

priority: critical

depends_on: []

source_file: .ai/audit/validated/final-report.md
source_finding: CRITICAL-01

description: >
  The processing config endpoints in src/mkobi/api/routes/processing_configs.py are
  missing dashboard-level access control. Any authenticated user can read, create,
  update, or delete processing configs for any dashboard. This is an Insecure Direct
  Object Reference (IDOR) vulnerability. Add a check_dashboard_access call before
  each CRUD operation on processing configs, consistent with how other dashboard-
  scoped endpoints (graphs, layouts, filters) enforce access control.

goals:
  - Add dashboard access check to all CRUD endpoints in processing_configs routes
  - Reuse the existing check_dashboard_access pattern from other route modules
  - Ensure 403 is returned when user lacks access to the target dashboard
  - Do not break existing tests for authorized users

files:
  - path: src/mkobi/api/routes/processing_configs.py
    targets:
      - type: module
        name: processing_configs
    semantic_anchors:
      insert_after:
        type: function_definition
        value: route handler decorators (@router.get, @router.post, etc.)
      insert_before:
        type: return_statement
    changes:
      - action: add_code
        description: >
          Add check_dashboard_access call using dashboard_id from path parameters
          in each endpoint handler. Pattern: access_repo = Depends(get_access_repository);
          await check_dashboard_access(token, dashboard_id, access_repo)
        code_hint: |
          await check_dashboard_access(
              token=token,
              dashboard_id=dashboard_id,
              access_repo=access_repo,
          )

acceptance_criteria:
  - All 4 CRUD endpoints in processing_configs enforce dashboard access control
  - Unauthorized access returns HTTP 403 (not 404, to avoid leaking existence)
  - Existing tests pass without modification for authorized users
  - Ruff and mypy pass without errors

tests_to_run:
  - pytest tests/ -k "processing_config" -v --no-header
  - ruff check src/mkobi/api/routes/processing_configs.py
  - mypy src/mkobi/api/routes/processing_configs.py

risk: low
risk_notes: >
  Low risk because check_dashboard_access is an existing function already used
  across graphs, layouts, and filters routes. The change is adding a consistent
  existing pattern to one module that was missing it.

type: implementation
category: security
severity: critical
