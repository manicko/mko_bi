description: >
  The root route `/` unconditionally redirects to `/login` regardless of authentication state.
  Authenticated users navigating to `/` should be redirected to `/dashboards` instead.
  Fix by replacing the unconditional `<Navigate to="/login" />` with an auth-aware RootRedirect
  component that checks authentication state via `useAuth()` and waits for `isLoading` before
  deciding where to redirect.

objective: >
  Replace the unconditional redirect at the root route with an auth-aware component that:
  1. Shows a loading spinner while silent refresh is in progress (isLoading === true)
  2. Redirects to `/dashboards` if user is authenticated (accessToken exists)
  3. Redirects to `/login` if user is not authenticated (accessToken is null)

affected_files:
  - path: frontend/src/app/routes.tsx
    action: modify
    description: "Replace unconditional Navigate with RootRedirect component"

semantic_targets:
  - type: component
    name: AppRoutes
    file: frontend/src/app/routes.tsx

  - type: route
    name: root route "/"
    file: frontend/src/app/routes.tsx
    anchor: <Route path="/" element={<Navigate to="/login" replace />} />

changes:
  - action: add_component_inline
    description: >
      Add a `RootRedirect` component definition inside routes.tsx (or in a separate file
      if preferred) that uses `useAuth()` to check authentication state.
    target:
      file: frontend/src/app/routes.tsx
    new_component: |
      const RootRedirect = () => {
        const { accessToken, isLoading } = useAuth()
        if (isLoading) {
          return (
            <Box sx={{ display: 'flex', justifyContent: 'center', alignItems: 'center', minHeight: '100vh' }}>
              <CircularProgress />
            </Box>
          )
        }
        return <Navigate to={accessToken ? '/dashboards' : '/login'} replace />
      }

  - action: replace_route_element
    description: >
      Replace the unconditional redirect element at the root route with the new RootRedirect component.
    target:
      type: route
      name: root route "/"
    current_pattern: |
      <Route path="/" element={<Navigate to="/login" replace />} />
    new_pattern: |
      <Route path="/" element={<RootRedirect />} />

  - action: add_imports
    description: >
      Add necessary imports: `useAuth` from `../../features/auth/model/useAuth`,
      `Box` and `CircularProgress` from `@mui/material` (Box may already be imported).
    target:
      file: frontend/src/app/routes.tsx

acceptance_criteria:
  - Authenticated users navigating to `/` are redirected to `/dashboards`
  - Unauthenticated users navigating to `/` are redirected to `/login`
  - A loading spinner is shown during silent refresh (isLoading === true)
  - No flash of login page for authenticated users
  - RootRedirect uses the existing `useAuth()` hook from `features/auth/model/useAuth`
  - BUG-003c (race condition) is resolved by this fix — the redirect waits for isLoading to become false
  - Frontend builds without TypeScript errors

tests_to_run:
  - "cd frontend && npx tsc --noEmit"
  - "cd frontend && npm run build"

