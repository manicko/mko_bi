id: TASK_004_P05_rewrite_notfound_from_tailwind_to_mui

title: Rewrite NotFound.tsx from Tailwind CSS to MUI using ErrorPage component

status: pending

priority: high

depends_on:
  - TASK_001_P05_create_shared_error_page_component

description: >
  Rewrite NotFound.tsx to delegate to the shared ErrorPage component with variant="404".
  Removes all Tailwind CSS classes. The * route in routes.tsx already renders NotFound.

phase: PLAN_05 — Frontend Error Handling
wave: 2

finding_ref: BUG-22
severity: low

goals:
  - Remove all Tailwind CSS classes from NotFound.tsx
  - Delegate to ErrorPage variant="404"
  - Keep named export NotFound

files:
  - path: frontend/src/shared/components/NotFound.tsx
    targets:
      - type: component
        name: NotFound
    semantic_anchors:
      replace:
        type: entire_file
        value: "Replace Tailwind-based NotFound with ErrorPage delegation"

changes:
  - action: rewrite_component
    description: >
      Replace entire file content to delegate to ErrorPage.
    code_hint: |
      import { ErrorPage } from './ErrorPage'

      export function NotFound() {
        return <ErrorPage variant="404" />
      }

acceptance_criteria:
  - No Tailwind CSS classes remain in the file
  - Renders the 404 variant of ErrorPage (WarningAmber icon, "Page not found", subtext, "Go to Home" button)
  - Exported as named export NotFound
  - Zero className attributes in the file

tests_to_run:
  - cd frontend && npx tsc --noEmit

risk_level: low

rollout_notes: >
  Depends on TASK_001 (ErrorPage component).
  Single-file rewrite. The * route in routes.tsx already renders NotFound — no route changes needed.
