id: TASK_023_V032
title: Remove hardcoded database URL from alembic.ini
status: pending
priority: low
depends_on: []

description: >
  alembic.ini contains a hardcoded database URL with plaintext password. The env.py
  overrides it at runtime, but the hardcoded value is a security concern.

goals:
  - Replace hardcoded URL with environment variable placeholder
  - Ensure alembic still works via env.py runtime override

files:
  - path: alembic.ini
    targets:
      - type: ini_key
        name: sqlalchemy.url
    semantic_anchors:
      - type: ini_value
        description: "Hardcoded postgresql+asyncpg:// URL"
    changes:
      - action: replace_value
        description: "Replace hardcoded URL with driver-only placeholder"
        code_hint: "sqlalchemy.url = postgresql+asyncpg://%(DATABASE_USER)s:%(DATABASE_PASSWORD)s@%(DATABASE_HOST)s:%(DATABASE_PORT)s/%(DATABASE_DBNAME)s"

acceptance_criteria:
  - alembic.ini no longer contains hardcoded credentials
  - Alembic migrations still work via env.py runtime URL construction
  - Existing migration tests pass

tests_to_run:
  - uv run alembic current
  - uv run alembic check

risk_level: low
notes: >
  The env.py already constructs the URL from config. This change just removes
  the unused hardcoded value from alembic.ini.
