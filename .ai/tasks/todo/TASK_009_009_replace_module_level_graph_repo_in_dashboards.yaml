id: task_009
title: Replace module-level GraphRepository singleton with DI in dashboards.py
status: pending
priority: low
depends_on: []
description: >
  Replace the module-level `_graph_repo = GraphRepository()` singleton in dashboards.py with dependency injection using `Depends(get_graph_repository)` in the endpoint signatures that use it.
goals:
  - Eliminate module-level repository singleton that bypasses DI
  - Improve testability by allowing repository mocking
  - Align with the project's DI pattern used elsewhere
  - Maintain same functionality while using proper dependency injection
files:
  - path: src/mkobi/api/routes/dashboards.py
    targets:
      - type: variable
        name: _graph_repo
    semantic_anchors:
      - type: variable
        name: _graph_repo
    changes:
      - action: delete
        old_text: "# Initialize repository\n_graph_repo = GraphRepository()"
      - action: add_code
        insert_before: "@router.post(\n    \"/{dashboard_id}/graphs\",\n    response_model=GraphRead,\n    status_code=status.HTTP_201_CREATED,\n    summary=\"Create a new graph for a dashboard\",\n    description=\"Creates a new graph for a specific dashboard. Requires admin role.\",\n    dependencies=[Depends(require_admin_role)],\n)"
        new_text: "from mkobi.api.deps import get_graph_repository\n"
    changes_2:
      - action: replace
        old_text: "result = await _graph_repo.create(\n            db=db,\n            name=graph.name,\n            type=graph.type,\n            dashboard_id=dashboard_id,\n            config=graph.config,\n            dimensions=graph.dimensions,\n            metrics=graph.metrics,\n        )"
        new_text: "graph_repo = get_graph_repository()\n        result = await graph_repo.create(\n            db=db,\n            name=graph.name,\n            type=graph.type,\n            dashboard_id=dashboard_id,\n            config=graph.config,\n            dimensions=graph.dimensions,\n            metrics=graph.metrics,\n        )"
      - action: replace
        old_text: "graphs = await _graph_repo.get_by_dashboard_id(\n            dashboard_id=dashboard_id, db=db\n        )"
        new_text: "graph_repo = get_graph_repository()\n        graphs = await graph_repo.get_by_dashboard_id(\n            dashboard_id=dashboard_id, db=db\n        )"
acceptance_criteria:
  - The module-level `_graph_repo = GraphRepository()` line is removed
  - The `get_graph_repository` function is imported from `mkobi.api.deps`
  - Endpoints that used `_graph_repo` now get the repository via `get_graph_repository()`
  - The functionality remains identical (same database operations)
  - Tests pass
tests_to_run:
  - tests/test_dashboards_api.py
  - tests/test_graphs.py
risk_level: low