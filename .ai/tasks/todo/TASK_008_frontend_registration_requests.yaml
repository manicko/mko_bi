changes:
  - action: modify_code
    description: >
      Add new state variables for the retrieval flow. Import retrieveTempPassword
      from adminApi and ResetPasswordResultDialog.

    code_hint: |
      # Add state after existing state declarations:
      const [pendingRetrievalToken, setPendingRetrievalToken] = useState<string | null>(null)
      const [approvedEmail, setApprovedEmail] = useState<string>('')
      const [showPasswordMode, setShowPasswordMode] = useState(false)

      # Update import:
      import { getRegistrationRequests, approveRequest, rejectRequest, retrieveTempPassword } from '../api/adminApi'

      # Add import for ResetPasswordResultDialog:
      import { ResetPasswordResultDialog } from './ResetPasswordResultDialog'

  - action: modify_code
    description: >
      Modify approveMutation onSuccess handler to store retrieval_token and
      show password dialog instead of just showing success toast.

    code_hint: |
      # Change onSuccess from:
      # onSuccess: () => {
      #   void queryClient.invalidateQueries({ queryKey: ['admin', 'registration-requests'] })
      #   setConfirmDialogOpen(false)
      #   toast.success('Request approved successfully')
      # },

      # To:
      onSuccess: (data) => {
        void queryClient.invalidateQueries({ queryKey: ['admin', 'registration-requests'] })
        setPendingRetrievalToken(data.retrieval_token)
        setApprovedEmail(selectedRequest?.email ?? '')
        setShowPasswordMode(true)
        setConfirmDialogOpen(false)
        toast.success('Request approved successfully')
      },

  - action: add_code
    description: >
      Add RetrievePasswordDialog component (same pattern as UserManagement).
      Add the dialog JSX at the bottom of the RegistrationRequests component.

    code_hint: |
      # Add RetrievePasswordDialog component (same as in UserManagement.tsx):
      interface RetrievePasswordDialogProps {
        open: boolean
        retrievalToken: string
        userEmail: string
        onClose: () => void
      }

      function RetrievePasswordDialog({ open, retrievalToken, userEmail, onClose }: RetrievePasswordDialogProps) {
        const [password, setPassword] = useState<string | null>(null)
        const [loading, setLoading] = useState(false)
        const [error, setError] = useState(false)

        const handleRetrieve = async () => {
          setLoading(true)
          setError(false)
          try {
            const data = await retrieveTempPassword(retrievalToken)
            setPassword(data.temp_password)
          } catch {
            setError(true)
            toast.error('Password expired or already retrieved')
          } finally {
            setLoading(false)
          }
        }

        if (password) {
          return (
            <ResetPasswordResultDialog
              open={true}
              tempPassword={password}
              userEmail={userEmail}
              onClose={() => {
                setPassword(null)
                onClose()
              }}
            />
          )
        }

        return (
          <Dialog open={open} onClose={onClose} maxWidth="sm" fullWidth>
            <DialogTitle>Retrieve Password</DialogTitle>
            <DialogContent>
              <DialogContentText>
                Click "Show Password" to retrieve the temporary password for {userEmail}.
                This can only be done once.
              </DialogContentText>
              {error && (
                <DialogContentText color="error" sx={{ mt: 1 }}>
                  Password expired or already retrieved.
                </DialogContentText>
              )}
            </DialogContent>
            <DialogActions>
              <Button onClick={onClose}>Cancel</Button>
              <Button onClick={() => { void handleRetrieve() }} variant="contained" disabled={loading}>
                {loading ? 'Retrieving...' : 'Show Password'}
              </Button>
            </DialogActions>
          </Dialog>
        )
      }

      # In the return JSX, add after ConfirmDialog:
      {showPasswordMode && (
        <RetrievePasswordDialog
          open={showPasswordMode}
          retrievalToken={pendingRetrievalToken ?? ''}
          userEmail={approvedEmail}
          onClose={() => {
            setShowPasswordMode(false)
            setPendingRetrievalToken(null)
          }}
        />
      )}

