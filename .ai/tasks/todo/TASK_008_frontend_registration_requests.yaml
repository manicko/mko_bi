description: >
  Update RegistrationRequests.tsx to use the new retrieval flow after approval.
  After approve success, show a dialog with "Show Password" button that calls
  retrieveTempPassword API. On success, display password in ResetPasswordResultDialog.
  On 404, show error toast. No temp_password is read from the approve response.

goals:
  - Add state for pendingRetrievalToken, approvedEmail, showPasswordMode
  - Modify approveMutation onSuccess to store retrieval_token and show dialog
  - Add RetrievePasswordDialog (same pattern as UserManagement)
  - Show "Show Password" dialog after approval success
  - Call retrieveTempPassword on button click
  - Display password in ResetPasswordResultDialog on success
  - Show error toast on 404

