id: TASK_016_V032
title: Remove hardcoded database URL from alembic.ini
status: pending
priority: low
depends_on: []
wave: 1

description: >
  alembic.ini contains a hardcoded database URL with plaintext password. While
  env.py overrides it at runtime, the hardcoded value is a security concern.
  Use environment variable substitution.

goals:
  - alembic.ini uses env var substitution for database URL
  - No hardcoded credentials in alembic.ini
  - env.py still works as override mechanism

files:
  - path: alembic.ini
    targets:
      - type: config_key
        value: sqlalchemy.url
    semantic_anchors:
      insert_after:
        type: ini_key
        value: sqlalchemy.url
    changes:
      - action: modify_code
        description: Replace the hardcoded database URL with an environment variable reference (e.g., %(DATABASE_URL)s) or remove the line entirely since env.py overrides it at runtime.

acceptance_criteria:
  - No hardcoded database URL in alembic.ini
  - Alembic migrations still work correctly
  - env.py override mechanism still functions

tests_to_run:
  - tests/

risk_level: low
risk_notes: Configuration change only. env.py already overrides at runtime.

validated_finding: V-032
severity: LOW
