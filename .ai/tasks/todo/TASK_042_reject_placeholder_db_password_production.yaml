id: TASK_042_reject_placeholder_db_password_production

title: Reject placeholder DB password in production at startup (SEC-006)

status: pending

priority: medium

depends_on:
  - TASK_041_validate_db_password_not_placeholder

description: >
  Even with field-level validation, the DATABASE_URL property only raises ValueError
  when password is None in production. A placeholder password like "postgres" would
  still be accepted. Add an explicit check in the DATABASE_URL property or in the
  application startup to reject placeholder passwords.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: SEC-006

goals:
  - Add production-time check for placeholder DB password
  - Fail fast at application startup if password is a known placeholder
  - Complement the field validator with a runtime check

files:
  - path: src/mkobi/config.py
    targets:
      - type: property
        name: DATABASE_URL
    semantic_anchors:
      - add_check:
          value: "DATABASE_URL"
          description: Add placeholder password check in production

changes:
  - action: modify
    description: >
      Add a check in the DATABASE_URL property that rejects known placeholder
      passwords in production, even if they pass field validation.

    code_hint: |
      # MODIFY DATABASE_URL property (around line 460):
      @property
      def DATABASE_URL(self) -> str | None:
          if not self.database.password:
              if self.environment == EnvironmentEnum.PRODUCTION:
                  raise ValueError("DATABASE__PASSWORD is required in production.")
              return None
          if self.environment == EnvironmentEnum.PRODUCTION:
              if self.database.password.lower() in {p.lower() for p in WEAK_PASSWORDS}:
                  raise ValueError(
                      f"DATABASE__PASSWORD is a known placeholder: '{self.database.password}'. "
                      "Set a strong password for production."
                  )
          return str(self.database.database_url)

acceptance_criteria:
  - Placeholder passwords rejected at startup in production
  - Clear error message indicating the issue
  - Development environment still allows any password
  - Tests pass

risk: low

tests_to_run:
  - "pytest tests/ -v -k 'config or database'"
