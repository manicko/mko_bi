id: TASK_007_dp05_preserve_native_dim_types

title: Fix DP-05 — Preserve native types in AggregationService dims values

status: pending

priority: medium

depends_on:
  - TASK_004_dp01_remove_dead_datapipeline_class

description: >
  Fix the MEDIUM issue where AggregationService.aggregate_for_dashboard converts all
  dimension values to strings via `str(row[col])`. This causes lexicographic sorting for
  numeric dimensions ("9" > "10") and breaks date ordering. Native Python types from
  Polars to_dicts() should be preserved for correct JSON serialization and sorting.

source_file: .ai/audit/99-validation/07-data-processing-validated.md
source_section: DP-05: AggregationService converts all dims to strings

files:
  - path: src/mkobi/services/aggregation_service.py
    targets:
      - type: class
        name: AggregationService
      - type: method
        name: aggregate_for_dashboard
    semantic_anchors:
      find:
        type: dict_comprehension
        value: "{col: str(row[col]) for col in groupby_cols}"
      insert_before:
        type: class
        value: AggregationService

changes:
  - action: add_code
    description: >
      Add a module-level helper function `_coerce_dim_value()` that preserves int, float,
      and bool as-is, converts date/datetime types to ISO format strings via `.isoformat()`,
      and converts None to empty string.
    code_hint: |
      def _coerce_dim_value(value: Any) -> str | int | float | bool:
          """Convert a Polars value to a JSON-safe native Python type.
          Preserves int, float, and bool as-is for correct sorting in the frontend.
          Converts date/datetime types to ISO format strings."""
          if value is None:
              return ""
          if isinstance(value, (int, float, bool)):
              return value
          if hasattr(value, "isoformat"):
              return value.isoformat()
          return str(value)
  - action: replace_code
    description: Replace `str(row[col])` with `_coerce_dim_value(row[col])` in the dims dict comprehension.

acceptance_criteria:
  - _coerce_dim_value helper function exists at module level
  - Numeric dimension values are preserved as int/float (not converted to strings)
  - Date/datetime dimension values are converted to ISO format strings
  - None values are converted to empty string
  - mypy passes with no errors

risk_notes: >
  Low risk — adds a helper function and changes the type coercion. Existing tests that
  assert on string dimension values will need updating.

tests_to_run:
  - command: pytest tests/test_aggregation_service.py -v --no-cov
    reason: Verify aggregation service tests pass with native type preservation
