id: TASK_011_remove_weak_default_secrets

title: Remove weak default secrets from Docker configs — require strong secrets (SEC-002)

status: pending

priority: high

depends_on:
  - TASK_005_remove_weak_credentials_from_working_tree

source_reference: C:\py_dev\mkobi\.ai\audit\validated\final-report.md
source_section: SEC-002 — Weak default secrets in docker/.env and docker-compose.override.yml

description: >
  The docker/.env and docker-compose.override.yml files contain weak default secrets
  (e.g., "password", "secret", "admin"). These must be replaced with placeholders that
  force users to provide their own strong secrets. Add validation to refuse startup with
  default/weak secrets.

goals:
  - Replace all weak default secrets with placeholders in Docker configs
  - Add startup validation to reject weak/default JWT secrets
  - Document secret generation procedure

files:
  - path: docker/.env.example
    targets:
      - type: file
    changes:
      - action: replace_file
        description: Replace all weak secrets with placeholder values and comments
        code_hint: |
          # JWT_SECRET_KEY: Generate with `openssl rand -hex 32`
          JWT_SECRET_KEY=CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_HEX_32

  - path: docker/docker-compose.override.yml
    targets:
      - type: environment_variable
    changes:
      - action: modify_code
        description: Replace weak default secrets with ${ENV_VAR:?error} syntax to force explicit setting
        code_hint: |
          JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}

  - path: src/mkobi/core/config.py
    targets:
      - type: class
        name: Settings
    changes:
      - action: add_code
        description: Add validator for JWT secret key strength
        code_hint: |
          @field_validator("jwt_secret_key")
          @classmethod
          def validate_jwt_secret(cls, v: str) -> str:
              weak_secrets = {"password", "secret", "admin", "123456", "change_me", "default"}
              if v.lower() in weak_secrets or len(v) < 32:
                  raise ValueError("JWT secret key must be at least 32 characters and not a common weak value")
              return v

acceptance_criteria:
  - No weak default secrets in any Docker config files
  - Application refuses to start with weak JWT secrets
  - .env.example documents how to generate strong secrets
  - Startup validation tests pass

tests_to_run:
  - pytest tests/ -v -k "config" --tb=short
  - python -c "from mkobi.core.config import Settings" (verify import works)

risk: low

notes: >
  HIGH — Security fix. Depends on TASK_005 for .env cleanup. The config validator
  (SEC-006) is combined here since both touch the same config.py file.
