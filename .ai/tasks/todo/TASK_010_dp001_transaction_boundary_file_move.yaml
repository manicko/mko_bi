id: TASK_010_dp001_transaction_boundary_file_move

title: "DP-001: Fix transaction boundary — move file after DB commit"

status: pending

priority: medium

depends_on:
  - TASK_001_be001_rate_limiter_fix
  - TASK_002_fe006_grant_access_dashboard_id

type: implementation

description: >
  In `process_upload_with_session`, the file is moved from temp to final path before `db.commit()`.
  If the commit fails, the file is at the final path but the DB has no record of it, creating
  an orphan file. Fix: move the file AFTER successful commit, and add rollback logic to move
  it back to temp on commit failure.

source_reference: "C:\\py_dev\\mkobi\\.ai\\audit\\99-validation\\07-data-processing-validated.md"
source_section: "DP-001: Transaction boundary issue — file move before DB commit — MEDIUM (mandatory)"

affected_files:
  - path: "src/mkobi/services/file_processing.py"
    targets:
      - type: function
        name: process_upload_with_session
    semantic_anchors:
      insert_after:
        type: function_call
        value: "await db.commit()"
      remove:
        - type: function_call
          value: "file_path.replace(final_file_path)"
    changes:
      - action: reorder_code
        description: "Move file_path.replace(final_file_path) to after db.commit()"
        old_hint: |
          await db.flush()
          file_path.replace(final_file_path)  # BEFORE commit — wrong
          await db.commit()
        new_hint: |
          await db.flush()
          await db.commit()
          try:
              file_path.replace(final_file_path)  # AFTER commit — correct
          except Exception:
              logger.error("Failed to move file to final path after commit", exc_info=True)
              # File remains at temp path; cleanup will handle it
              raise

acceptance_criteria:
  - "File move happens after db.commit()"
  - "On commit failure, file remains at temp path for cleanup"
  - "On file move failure after commit, error is logged and re-raised"
  - "Existing upload tests pass"
  - "ruff + mypy pass"

