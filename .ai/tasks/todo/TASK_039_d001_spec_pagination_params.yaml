id: TASK_039_d001_spec_pagination_params

title: "D-001: Update SPEC.md to reflect skip/limit pagination for admin logs"

status: pending

priority: low

depends_on:
  - TASK_038_verify_v027_repository_crud_tests

description: >
  SPEC.md describes page/page_size pagination for admin logs, but the
  implementation uses skip/limit. Since skip/limit is a more standard API
  pattern and the team has committed to it, update the spec to match the code
  rather than changing the code.

goals:
  - Update SPEC.md pagination section to use skip/limit
  - Ensure API documentation reflects actual parameter names

files:
  - path: docs/SPEC.md
    targets:
      - type: section
        context: "Admin logs endpoint / pagination description"
    semantic_anchors:
      insert_after:
        type: heading_or_text
        value: "page/page_size"
      context: "Replace page/page_size references with skip/limit"

changes:
  - action: modify_text
    description: >
      Update all references to page/page_size pagination in the admin logs
      endpoint documentation to skip/limit. Update the ProcessingLogFilter
      model documentation accordingly.
    anchor: "SPEC.md admin logs pagination section"

acceptance_criteria:
  - SPEC.md uses skip/limit consistently
  - API documentation matches actual implementation
  - No remaining page/page_size references in admin logs section

tests_to_run:
  - echo "Doc change only — verify manually"

risk_level: trivial (documentation update)

source_findings:
  - D-001
  - V-002 (R1-F002)

estimated_effort: trivial
