id: TASK_065_fix_postgres_collation_mismatch

title: Fix PostgreSQL collation version mismatch in test environment

status: pending

priority: high

depends_on: []
  # No dependencies — infrastructure fix, can run independently

source_reference: C:\py_dev\mkobi\.ai\audit\validated\validated-findings.md
source_section: BE-003 — Test infrastructure failures, PostgreSQL collation version mismatch

description: >
  297 out of 848 tests fail due to PostgreSQL collation version mismatch between
  the Docker image (2.41) and the host OS (2.36). Every test that creates a fresh
  test database via CREATE DATABASE fails immediately. This makes the entire test
  suite non-functional. Apply the documented PostgreSQL fix to refresh the template1
  collation version.

goals:
  - Restore test suite functionality (297 tests currently failing)
  - Apply ALTER DATABASE template1 REFRESH COLLATION_VERSION or recreate test-db container
  - Document the fix procedure for future reference

files:
  - path: docker/docker-compose.test.yml

    targets:
      - type: service
        name: test-db

    semantic_anchors:
      # This is a runtime/infrastructure fix, not a code change.
      # The fix is applied via docker exec command.
      N/A

changes:

  - action: infrastructure_command

    description: >
      Execute the PostgreSQL collation refresh command on the test-db container.
      If the container data volume persists the mismatch, recreate the container
      and volume entirely.

    code_hint: |
      # Option 1: Refresh collation (preferred, preserves data):
      docker compose -f docker/docker-compose.test.yml exec test-db psql -U postgres -c "ALTER DATABASE template1 REFRESH COLLATION_VERSION;"

      # Option 2: Recreate container and volume (nuclear option):
      docker compose -f docker/docker-compose.test.yml down -v
      docker compose -f docker/docker-compose.test.yml up -d test-db

acceptance_criteria:
  - test-db container is healthy after fix
  - pytest tests/ runs without collation version mismatch errors
  - Previously failing 297 tests can now execute (may still fail for other reasons, but not collation)

tests_to_run:
  - docker compose -f docker/docker-compose.test.yml up -d test-db
  - docker compose -f docker/docker-compose.test.yml exec test-db psql -U postgres -c "ALTER DATABASE template1 REFRESH COLLATION_VERSION;"
  - docker compose -f docker/docker-compose.test.yml up -d
  - pytest tests/ -x -q --timeout=60

risk: low
