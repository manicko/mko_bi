id: TASK_018_test_admin_endpoint

title: Write API integration tests for POST /admin/users/{user_id}/reset-password

status: pending

priority: high

depends_on:
  - TASK_007_admin_reset_endpoint
  - TASK_008_approve_sets_force_flag
  - TASK_017_test_auth_service_reset

description: >
  Write API-level integration tests for the new `POST /admin/users/{user_id}/reset-password`
  endpoint and the approve-registration force_password_change behavior.
  Tests go in `tests/test_auth_api.py` (existing file) or a new
  `tests/test_admin_reset_password.py`. Uses the existing async test infrastructure
  (conftest.py with async client fixtures).

  Test cases for reset-password endpoint:
  - Admin can reset another user's password → HTTP 200, returns temp_password
  - Admin cannot reset own password → HTTP 400 with appropriate message
  - Non-existent user → HTTP 400
  - Non-admin user cannot access → HTTP 403
  - Temp password in response is 8 chars with letters + digits

  Test cases for approve-registration force flag:
  - After approve-registration, user has force_password_change=True
  - After password change, force_password_change=False

goals:
  - API integration tests for reset-password endpoint (success, self-guard, not-found, unauthorized)
  - API test for approve-registration sets force_password_change
  - Use existing conftest fixtures (async client, admin/non-admin tokens)
  - All tests pass with pytest

files:
  - path: tests/test_auth_api.py
    targets:
      - type: new_test_functions
        name: test_admin_reset_password_endpoint

changes:
  - action: add_tests
    description: >
      Add async test functions following existing patterns in test_auth_api.py.
      Use authenticated admin client for success cases, non-admin for 403 case.
      Verify response structure: { message, user_id, temp_password }.
    code_hint: |
      @pytest.mark.asyncio
      async def test_admin_reset_password_success(admin_client, test_user):
          response = await admin_client.post(
              f"/api/v1/admin/users/{test_user.id}/reset-password"
          )
          assert response.status_code == 200
          data = response.json()
          assert "temp_password" in data
          assert "user_id" in data
          assert len(data["temp_password"]) == 8

      @pytest.mark.asyncio
      async def test_admin_reset_password_self_guard(admin_client, admin_user):
          response = await admin_client.post(
              f"/api/v1/admin/users/{admin_user.id}/reset-password"
          )
          assert response.status_code == 400

      @pytest.mark.asyncio
      async def test_admin_reset_password_non_admin(client, test_user):
          response = await client.post(
              f"/api/v1/admin/users/{test_user.id}/reset-password"
          )
          assert response.status_code == 403

acceptance_criteria:
  - All new tests pass: pytest tests/test_auth_api.py -v
  - Covers: success (200), self-guard (400), not-found (400), unauthorized (403)
  - Approve-registration test verifies force_password_change=True
  - Uses existing test infrastructure (conftest fixtures)
  - ruff passes on test file

tests_to_run:
  - pytest tests/test_auth_api.py -v
  - ruff check tests/test_auth_api.py

