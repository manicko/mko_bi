id: task_012
title: Replace direct ProcessingLogRepository instantiation with DI in processing_logs.py
status: pending
priority: low
depends_on: []
description: >
  Replace direct ProcessingLogRepository() instantiation in processing_logs.py with dependency injection using Depends(get_processing_log_repository) in the endpoint signature.
goals:
  - Eliminate direct repository instantiation that bypasses DI
  - Improve testability by allowing repository mocking
  - Align with the project's DI pattern used elsewhere
  - Maintain same functionality while using proper dependency injection
files:
  - path: src/mkobi/api/routes/processing_logs.py
    targets:
      - type: variable
        name: repo
    semantic_anchors:
      - type: function
        name: get_log_by_id_endpoint
    changes:
      - action: add_code
        insert_before: "from mkobi.api.deps import (\n    get_db_dependency,\n    get_processing_log_service,\n    require_admin_role,\n)"
        new_text: "from mkobi.api.deps import get_processing_log_repository\n"
    changes_2:
      - action: replace
        old_text: "    try:\n        from mkobi.db.repositories.processing_log_repo import ProcessingLogRepository\n\n        repo = ProcessingLogRepository()\n        log = await repo.get_by_id(log_id, db)"
        new_text: "    try:\n        repo = get_processing_log_repository()\n        log = await repo.get_by_id(log_id, db)"
acceptance_criteria:
  - Direct ProcessingLogRepository() instantiation is removed
  - The get_processing_log_repository function is imported from mkobi.api.deps
  - The endpoint that used ProcessingLogRepository() now gets the repository via get_processing_log_repository()
  - The functionality remains identical (same database operations)
  - Tests pass
tests_to_run:
  - tests/test_processing_logs.py
risk_level: low