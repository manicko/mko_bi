id: TASK_001_fix_docker_test_port_exposure

title: Fix Docker port exposure for test database — resolve 233 test failures (TST-001)

status: pending

priority: critical

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\final-report.md
source_section: TST-001 — 233/603 backend tests fail — DB port 5432 not exposed to host

description: >
  The docker-compose.yml for testing does not expose PostgreSQL port 5432 to the host,
  causing 233 out of 603 backend tests to fail. The test configuration in conftest.py
  expects to connect to a database on the host port, but the Docker network configuration
  prevents this. Fix the Docker Compose test configuration to properly expose the database
  port so tests can connect.

goals:
  - Expose PostgreSQL port in docker-compose.test.yml or docker-compose.yml for test runs
  - Ensure tests/conftest.py database URL matches the exposed port
  - All 603 backend tests pass after the fix

files:
  - path: docker/docker-compose.test.yml
    targets:
      - type: service_definition
        name: db
    semantic_anchors:
      insert_after:
        type: service_property
        value: image: postgres
    changes:
      - action: add_code
        description: Add ports section to db service for test exposure
        code_hint: |
          ports:
            - "5433:5432"

  - path: tests/conftest.py
    targets:
      - type: function
        name: (session-scoped db fixture)
    semantic_anchors:
      insert_after:
        type: function_call
        value: DATABASE_URL
    changes:
      - action: modify_code
        description: Verify DATABASE_URL points to correct test port (5433)
        code_hint: |
          DATABASE_URL = os.environ.get(
              "DATABASE_URL",
              "postgresql+asyncpg://postgres:postgres@localhost:5433/mkobi_test"
          )

acceptance_criteria:
  - docker-compose.test.yml exposes PostgreSQL port to host
  - tests/conftest.py uses correct port for test database
  - Running `pytest tests/ -v` results in 0 failures (all 603 tests pass)
  - No production Docker configuration is affected

tests_to_run:
  - pytest tests/ -v --tb=short

risk: low

notes: >
  This is a CRITICAL infrastructure fix. Without it, no backend tests can be validated.
  This task must complete before any other test-dependent work begins.
