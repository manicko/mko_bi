id: TASK_003_03_03_add_frontend_dev_service

title: Add Frontend Dev Server Service to Docker Compose Override

status: pending

priority: medium

depends_on: []

phase: PLAN_03
wave: 2

description: >
  The current override mounts frontend/dist (pre-built static), requiring manual
  npm run dev on the host. Add a frontend service that runs the Vite dev server
  inside Docker with hot reload. This enables a fully containerized dev workflow.

finding_ref: DOCKER-008
severity: medium

goals:
  - Add frontend service with Vite dev server to docker-compose.override.yml
  - Vite hot reload works for frontend file changes
  - Node modules are persisted in a named volume
  - Remove the frontend/dist mount from the app service (no longer needed in dev)

files:
  - path: docker-compose.override.yml
    targets:
      - type: service
        name: frontend (new)
      - type: service
        name: app
    semantic_anchors:
      insert_after:
        type: block
        value: "services:"
    changes:
      - action: add_service
        description: Add frontend service with Vite dev server
        code_hint: |
          frontend:
            image: node:20-alpine
            working_dir: /app
            volumes:
              - ./frontend:/app
              - frontend_node_modules:/app/node_modules
            ports:
              - "5173:5173"
            command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
            environment:
              - CHOKIDAR_USEPOLLING=true
      - action: add_volume
        description: Add frontend_node_modules named volume
        code_hint: "frontend_node_modules:"
      - action: remove_volume_mount
        description: Remove - ./frontend/dist:/app/frontend/dist from app service

acceptance_criteria:
  - docker compose up -d starts frontend dev server on port 5173
  - Vite hot reload works for frontend file changes
  - Node modules are persisted in a volume (not lost on container restart)
  - App service does not mount frontend/dist

docker_health_checks:
  - name: All containers running (including frontend)
    command: "docker compose ps --format json"
    expected: "All services (db, migrate, app, frontend) show 'running' status"
  - name: Frontend container running
    command: "docker compose ps frontend --format json"
    expected: "frontend container shows 'running' status"
  - name: Frontend dev server responds
    command: "curl -sf http://localhost:5173"
    expected: "Returns HTTP 200 (Vite dev server HTML)"
  - name: Frontend logs show Vite started
    command: "docker compose logs frontend --tail 30"
    expected: "Logs show 'Vite' and 'Local:' with dev server URL"
  - name: Backend still healthy
    command: "curl -sf http://localhost:8000/health"
    expected: "Returns HTTP 200"
  - name: No container restarts
    command: "docker compose ps --format '{{.Name}} {{.Status}}'"
    expected: "No container shows 'restarting' or 'unhealthy' status"
  - name: Frontend node_modules persisted
    command: "docker compose exec frontend ls node_modules/ | head -5"
    expected: "node_modules directory contains installed packages"

tests_to_run:
  - "docker compose up -d"
  - "curl -sf http://localhost:5173  # Vite dev server responds"
  - "curl -sf http://localhost:8000/health  # Backend still healthy"
  - "Edit a .tsx file and verify browser hot reloads"

risk_level: low

rollout_notes: >
  Standalone addition. No dependencies on other tasks.
  Production docker-compose.yml is untouched. Rollback: remove frontend service and volume.
