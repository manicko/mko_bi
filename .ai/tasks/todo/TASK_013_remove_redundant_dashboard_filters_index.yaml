id: TASK_013_remove_redundant_dashboard_filters_index

title: LOW — Remove redundant index on dashboard_filters table. And ensure it will not recreate on future migrations and db recreation

status: pending

priority: low

depends_on:
  - TASK_006_add_processing_logs_status_index

source_file: .ai/audit/validated/final-report.md
source_finding: DB-001

description: >
  The dashboard_filters table has a redundant index that is a prefix of another
  existing index, wasting write performance and storage. Create a migration to drop
  the redundant index while preserving the covering index that handles the same queries.

goals:
  - Identify the redundant index on dashboard_filters
  - Create a migration to drop only the redundant index
  - Verify no queries depend on the redundant index via EXPLAIN

files:
  - path: src/mkobi/db/migrations/
    targets:
      - type: migration
        name: new migration
    semantic_anchors:
      insert_after:
        type: latest_migration
    changes:
      - action: create_file
        description: >
          Create a migration that drops the redundant index on dashboard_filters.
        code_hint: |
          op.drop_index(
              "idx_dashboard_filters_redundant",
              table_name="dashboard_filters",
          )

acceptance_criteria:
  - Migration applies cleanly
  - Redundant index is removed from the database
  - Covering index still handles all queries (verified via EXPLAIN)
  - Downgrade recreates the index

tests_to_run:
  - cd src/mkobi && python -m alembic upgrade head
  - cd src/mkobi && python -m alembic downgrade -1
  - cd src/mkobi && python -m alembic upgrade head

risk: low
risk_notes: >
  Low risk — removing a redundant index that is covered by another index.
  Must verify with EXPLAIN that the remaining index handles the same queries.

type: migration
category: database
severity: low
