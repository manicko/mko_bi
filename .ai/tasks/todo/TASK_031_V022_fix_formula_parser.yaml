id: TASK_031_V022
title: Document formula parser limitation or use a proper expression parser
status: pending
priority: low
depends_on: []

description: >
  _parse_formula uses simple regex split — doesn't handle parentheses, nested expressions,
  or column names with special characters. This limits the custom metrics feature.

goals:
  - Document the current formula parser limitations
  - Either use a proper expression parser (e.g., ast.literal_eval, pyparsing, or simpleeval)
  - Or clearly document the supported syntax

files:
  - path: src/mkobi/data/processing/transformations.py
    targets:
      - type: function
        name: _parse_formula
    semantic_anchors:
      - type: regex_pattern
        description: "Simple regex-based formula parser"
    changes:
      - action: document_or_replace
        description: "Either replace with a proper expression parser or add clear documentation of limitations"
        code_hint: "Consider using simpleeval or ast.literal_eval for safe expression evaluation"

acceptance_criteria:
  - Formula parser limitations are documented
  - If replaced: complex formulas with parentheses work correctly
  - Existing tests pass

tests_to_run:
  - uv run pytest tests/ -x -v

risk_level: low
notes: >
  If replacing the parser, ensure the new parser is safe (no eval() of arbitrary code).
  simpleeval is a good option if adding a dependency is acceptable.
