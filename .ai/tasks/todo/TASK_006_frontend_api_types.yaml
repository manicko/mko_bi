changes:
  - action: modify_code
    description: >
      Change resetUserPassword return type from {message, user_id, temp_password}
      to {message, user_id, retrieval_token}. Update the axios post type parameter
      accordingly.

    code_hint: |
      # Change from:
      export async function resetUserPassword(userId: string): Promise<{
        message: string
        user_id: string
        temp_password: string
      }> {
        const response = await axiosInstance.post<{
          message: string
          user_id: string
          temp_password: string
        }>(`/admin/users/${userId}/reset-password`)
        return response.data
      }

      # To:
      export async function resetUserPassword(userId: string): Promise<{
        message: string
        user_id: string
        retrieval_token: string
      }> {
        const response = await axiosInstance.post<{
          message: string
          user_id: string
          retrieval_token: string
        }>(`/admin/users/${userId}/reset-password`)
        return response.data
      }

  - action: modify_code
    description: >
      Change approveRequest from Promise<void> to returning {message, user_id, retrieval_token}.
      Update the axios post to capture and return response data.

    code_hint: |
      # Change from:
      export async function approveRequest(requestId: string): Promise<void> {
        await axiosInstance.post(`/admin/registration-requests/${requestId}/approve`)
      }

      # To:
      export async function approveRequest(requestId: string): Promise<{
        message: string
        user_id: string
        retrieval_token: string
      }> {
        const response = await axiosInstance.post<{
          message: string
          user_id: string
          retrieval_token: string
        }>(`/admin/registration-requests/${requestId}/approve`)
        return response.data
      }

  - action: add_code
    description: >
      Add new retrieveTempPassword function after the approveRequest function.

    code_hint: |
      export async function retrieveTempPassword(retrievalToken: string): Promise<{
        temp_password: string
      }> {
        const response = await axiosInstance.get<{ temp_password: string }>(
          `/admin/temp-passwords/${retrievalToken}`
        )
        return response.data
      }

