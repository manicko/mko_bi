id: TASK_024_V005
title: Add monitoring/alerting for rate limiter Redis failures
status: pending
priority: medium
depends_on: []
wave: 3

description: >
  If Redis is unavailable, the rate limiter silently disables with only a warning
  log. Add monitoring/alerting when rate limiter is disabled. Consider fail-closed
  behavior for production.

goals:
  - Rate limiter failures are logged at ERROR level
  - Metrics/alerting available for rate limiter health
  - Consider fail-closed behavior (reject requests when rate limiter is down)
  - Operational visibility into rate limiter status

files:
  - path: src/mkobi/services/data_service.py
    targets:
      - type: method
        name: DataService.__init__
    semantic_anchors:
      insert_after:
        type: exception_handler
        value: except Exception
    changes:
      - action: modify_code
        description: Change the except block from warning to error level logging. Add a health check method that reports rate limiter status. Consider adding a configuration option for fail-closed behavior (reject uploads when rate limiter is down).

acceptance_criteria:
  - Rate limiter failures logged at ERROR level
  - Health check endpoint reports rate limiter status
  - Fail-closed behavior is configurable
  - Tests pass

tests_to_run:
  - tests/

risk_level: medium
risk_notes: Requires monitoring infrastructure. Consider fail-closed behavior carefully — could block uploads if Redis has transient issues.

validated_finding: V-005
severity: HIGH
