id: TASK_005_dp03_tighten_glob_pattern

title: Fix DP-03 — Tighten find_task_file glob pattern to exact match

status: pending

priority: medium

depends_on:
  - TASK_004_dp01_remove_dead_datapipeline_class

description: >
  Fix the MEDIUM issue where find_task_file uses a broad glob pattern `*{task_id}*.csv*`
  that could match multiple files. The file is stored as `{task_id}{file_ext}` (uuid.csv.gz),
  so the exact pattern `{task_id}.csv*` is sufficient and safer.

source_file: .ai/audit/99-validation/07-data-processing-validated.md
source_section: DP-03: find_task_file glob too broad

files:
  - path: src/mkobi/services/file_processing.py
    targets:
      - type: function
        name: find_task_file
    semantic_anchors:
      find:
        type: function_call
        value: upload_dir.glob
      replace_zone:
        type: expression
        description: Replace the glob pattern and add multiple-match validation

changes:
  - action: replace_code
    description: >
      Replace `*{task_id}*.csv*` with `{task_id}.csv*`. Add a check for multiple matches
      that raises ValueError with the list of matching file names.
    code_hint: |
      # BEFORE:
      task_files = list(upload_dir.glob(f"*{task_id}*.csv*"))
      if not task_files:
          raise ValueError(f"File for task {task_id} not found in temp directory")
      return str(task_files[0])

      # AFTER:
      task_files = list(upload_dir.glob(f"{task_id}.csv*"))
      if not task_files:
          raise ValueError(f"File for task {task_id} not found in temp directory")
      if len(task_files) > 1:
          raise ValueError(
              f"Multiple files found for task {task_id}: "
              f"{[f.name for f in task_files]}"
          )
      return str(task_files[0])

acceptance_criteria:
  - Glob pattern is `{task_id}.csv*` (exact match on task_id prefix)
  - Multiple matches raise ValueError with file names
  - Single match returns the file path as before

risk_notes: >
  Trivial risk — the naming convention `{task_id}{file_ext}` guarantees the exact pattern works.

tests_to_run:
  - command: pytest tests/test_file_processing.py -v -k "find_task_file" --no-cov
    reason: Verify find_task_file tests pass with new pattern
