id: TASK_FE009_uploadModal_completion_guard

title: Fix FE-009 — Add guard against double-invoke of onUploadComplete callback

status: pending

priority: medium

depends_on: []

description: |
  The polling effect in UploadModal calls onUploadCompleteRef.current?.() when
  status becomes 'completed'. However, handleClose can also trigger this callback.
  Add a hasCompletedRef guard to ensure exactly one invocation.

source_file: .ai/audit/99-validation/02-frontend-validated.md
source_section: FE-009: Add guard against double-invoke

files:
  - path: frontend/src/features/upload/ui/UploadModal.tsx
    targets:
      - type: hook
        name: useRef
      - type: effect
        description: Polling effect completion handler
      - type: function
        name: handleClose

changes:
  - action: add_code
    description: |
      Add hasCompletedRef = useRef(false) after onUploadCompleteRef.
      In polling effect, check !hasCompletedRef.current before calling callback.
      Reset guard in handleClose function.

acceptance_criteria:
  - hasCompletedRef guard prevents duplicate callback invocation
  - Callback fires exactly once per upload cycle
  - Guard resets on modal close for next upload
  - Build succeeds

risk_notes: |
  Low risk — ref-based guard is a standard pattern for preventing duplicate
  side effects in async flows.

tests_to_run:
  - command: cd frontend && npm run build
    reason: Verify build succeeds after guard addition
