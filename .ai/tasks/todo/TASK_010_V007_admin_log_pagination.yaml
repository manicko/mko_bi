id: TASK_010_V007_admin_log_pagination

title: Add date filtering and pagination to admin logs endpoint

status: pending

priority: medium

depends_on: []

description: >
  GET /api/v1/admin/logs lacks date_from/date_to query parameters and pagination
  (page/page_size). The SPEC requires both. The frontend LogViewer.tsx already has
  date filter UI, so the frontend is waiting for backend support. This task adds
  the missing query parameters and implements offset/limit pagination.

finding_ref: V-007
severity: MEDIUM

goals:
  - Add date_from, date_to, page, page_size query parameters to admin logs endpoint
  - Implement offset/limit pagination in the repository
  - Return {items, total, page, page_size} response format
  - Match frontend LogViewer.tsx expectations

files:
  - path: src/mkobi/api/routes/admin.py
    targets:
      - type: route_handler
        name: GET /api/v1/admin/logs
    semantic_anchors:
      insert_after: route decorator for logs endpoint
      modify: function signature to accept query parameters

  - path: src/mkobi/db/repositories/processing_log_repo.py
    targets:
      - type: class
        name: ProcessingLogRepository
      - type: method
        name: get_logs (or equivalent)
    semantic_anchors:
      modify: add date filtering and pagination parameters

changes:
  - action: modify_route
    description: >
      Add date_from, date_to, page, page_size query parameters to the admin logs
      endpoint. Implement pagination in the repository layer.
    code_hint: |
      @router.get("/logs")
      async def get_admin_logs(
          date_from: Optional[datetime] = Query(None),
          date_to: Optional[datetime] = Query(None),
          page: int = Query(1, ge=1),
          page_size: int = Query(50, ge=1, le=200),
          db: AsyncSession = Depends(get_db),
      ):
          log_repo = ProcessingLogRepository(db)
          items, total = await log_repo.get_logs_paginated(
              date_from=date_from, date_to=date_to,
              page=page, page_size=page_size
          )
          return {"items": items, "total": total, "page": page, "page_size": page_size}

acceptance_criteria:
  - Admin logs endpoint accepts date_from, date_to, page, page_size parameters
  - Response includes {items, total, page, page_size}
  - Date filtering works correctly
  - Pagination works correctly (offset/limit)
  - Frontend LogViewer.tsx can use the endpoint without changes

tests_to_run:
  - pytest tests/ -k "admin or log" -v

risk_level: low

rollout_notes: >
  API change — frontend LogViewer.tsx already has date filter UI, so the frontend
  expects this. Backend must be updated to match. No backend dependencies.
