id: TASK_029_v024_mock_large_files

title: "V-024: Replace real large file creation with mocks in upload tests"

status: pending

priority: medium

depends_on:
  - TASK_028_verify_v023_clean_env_fixture

description: >
  test_upload_too_large creates 101MB real file (b"x" * (101 * 1024 * 1024)) —
  allocates in RAM + writes to disk. test_process_upload_file_too_large creates
  102MB real file similarly. Slow I/O, memory-intensive, wasteful since file
  content is never read (mocked validation).

goals:
  - Use unittest.mock.patch to mock Path.stat().st_size or file size validation
  - Remove real file creation for size validation tests
  - Reduce test runtime and resource consumption

files:
  - path: tests/test_upload_api.py
    targets:
      - type: test_function
        name: test_upload_too_large
    semantic_anchors:
      insert_after:
        type: function_definition
        value: "test_upload_too_large"
      context: "Replace real file write with mock of Path.stat().st_size"

  - path: tests/test_data_service.py
    targets:
      - type: test_function
        name: test_process_upload_file_too_large
    semantic_anchors:
      insert_after:
        type: function_definition
        value: "test_process_upload_file_too_large"
      context: "Replace real file write with mock of file size check"

changes:
  - action: modify_code
    description: >
      Use unittest.mock.patch to mock the file size validation instead of
      writing real large files. The content is never read because validation
      is mocked, so there's no need for real data.
    anchor: "test_upload_too_large and test_process_upload_file_too_large"

acceptance_criteria:
  - Tests pass without creating real 100MB+ files
  - Reduced test runtime (no large I/O)
  - Size validation logic still tested

tests_to_run:
  - pytest tests/test_upload_api.py tests/test_data_service.py -x --tb=short -k 'too_large'

risk_level: small (test refactoring, validation logic unchanged)

source_findings:
  - V-024
  - T1-Finding6
  - T2-F4

estimated_effort: small
