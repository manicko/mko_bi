id: TASK_006_int001_aggregated_data_graph_id

title: "INT-001: Fix /data/aggregated graph_id parameter contract"

status: pending

priority: critical

depends_on:
  - TASK_003_sec002_jwt_is_active_check
  - TASK_004_sec003_graph_endpoint_access_control
  - TASK_005_sec004_layout_endpoint_access_control

type: implementation

description: >
  The `/data/aggregated` endpoint requires `graph_id` as a mandatory query parameter, but the
  frontend `getAggregatedData` only sends `dashboard_id` and `filters`. The backend docstring
  says "Returns data for all dashboard charts" but the implementation returns only the single
  graph matching the required `graph_id`. This is a cross-cutting API contract mismatch.

  Fix approach (coordinated backend+frontend):
  1. Backend: Make `graph_id` optional. When absent, return aggregated data for ALL graphs
     in the dashboard (matching the docstring contract).
  2. Frontend: Update `DashboardView.tsx` to handle the new response shape (already iterates
     `aggregatedData.graphs` array, so this should be compatible).
  3. Backend: Update the endpoint return type annotation from `dict[str, str | UUID]` to a
     proper Pydantic response model.

  Note: This is a cross-cutting change requiring coordinated deployment. The backend change
  must be deployed first (making graph_id optional), then the frontend.

source_reference: "C:\\py_dev\\mkobi\\.ai\\audit\\99-validation\\90-integration-validated.md"
source_section: "INT-001: /data/aggregated missing graph_id parameter — CRITICAL (mandatory)"

affected_files:
  - path: "src/mkobi/api/routes/data.py"
    targets:
      - type: function
        name: get_aggregated_data_endpoint
    semantic_anchors:
      insert_after:
        type: parameter_list
        value: "graph_id: UUID | None"
    changes:
      - action: modify_code
        description: "Change graph_id from required to optional, update query to filter by dashboard when absent"
        old_hint: "graph_id: UUID = Query(..., description='Graph ID')"
        new_hint: "graph_id: UUID | None = Query(None, description='Graph ID (optional, returns all dashboard graphs if absent)')"
      - action: add_code
        description: "When graph_id is absent, fetch all graphs for the dashboard and return aggregated data for each"
        code_hint: |
          if graph_id is None:
              graphs = await graph_repo.get_by_dashboard_id(dashboard_id, session)
              results = []
              for graph in graphs:
                  data = await agg_repo.get_by_dashboard_graph(dashboard_id, graph.id, filters, session)
                  results.append({"graph_id": graph.id, "graph_config": graph.config, "data": data})
              return {"dashboard_id": dashboard_id, "graphs": results}

  - path: "frontend/src/features/dashboards/api/dashboardApi.ts"
    targets:
      - type: function
        name: getAggregatedData
    semantic_anchors:
      insert_before:
        type: return_statement
    changes:
      - action: modify_code
        description: "Add optional graph_id parameter to getAggregatedData"
        old_hint: "getAggregatedData({ dashboard_id, filters })"
        new_hint: "getAggregatedData({ dashboard_id, graph_id, filters })"

acceptance_criteria:
