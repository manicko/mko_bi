      Add a "Rollback Procedures" section to the deployment documentation.

    code_hint: |
      ## Rollback Procedures

      ### Docker Image Rollback
      ```bash
      # Revert to previous image tag
      docker compose -f docker/docker-compose.yml pull app:<previous-tag>
      docker compose -f docker/docker-compose.yml up -d
      ```

      ### Database Migration Rollback
      ```bash
      # Revert last migration
      docker compose -f docker/docker-compose.yml exec app alembic downgrade -1

      # Revert to specific revision
      docker compose -f docker/docker-compose.yml exec app alembic downgrade <revision>
      ```

      ### Configuration Rollback
      ```bash
      # Restore previous .env from backup
      cp .env.backup .env
      docker compose -f docker/docker-compose.yml restart app
      ```

