id: TASK_019_fix_test_database_isolation

title: Fix test database isolation — use separate test-db on port 5433 (TST-006)

status: pending

priority: high

depends_on:
  - TASK_001_fix_docker_test_port_exposure

source_reference: C:\py_dev\mkobi\.ai\audit\validated\final-report.md
source_section: TST-006 — Test database not isolated — targets dev instance instead of test-db on port 5433

description: >
  The test configuration targets the development database instance instead of a dedicated
  test database. This risks data corruption and test unreliability. Configure tests to use
  a separate test database service (test-db on port 5433) defined in docker-compose.test.yml.

goals:
  - Configure tests/conftest.py to connect to the isolated test database
  - Ensure test database is created and migrated before tests run
  - Clean up test data after each test session

files:
  - path: tests/conftest.py
    targets:
      - type: fixture
        name: (database session fixture)
    semantic_anchors:
      insert_after:
        type: function_call
        value: DATABASE_URL
    changes:
      - action: modify_code
        description: Update DATABASE_URL to point to test-db on port 5433
        code_hint: |
          DATABASE_URL = os.environ.get(
              "DATABASE_URL",
              "postgresql+asyncpg://postgres:postgres@localhost:5433/mkobi_test"
          )

  - path: docker/docker-compose.test.yml
    targets:
      - type: service_definition
        name: test-db
    changes:
      - action: add_code
        description: Add dedicated test-db service definition
        code_hint: |
          test-db:
            image: postgres:16
            environment:
              POSTGRES_DB: mkobi_test
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgres
            ports:
              - "5433:5432"
            healthcheck:
              test: ["CMD-SHELL", "pg_isready -U postgres"]
              interval: 5s
              timeout: 5s
              retries: 5

acceptance_criteria:
  - Tests connect to isolated test database on port 5433
  - Test database is separate from development database
  - No risk of test data corrupting development data
  - All 603 tests pass

tests_to_run:
  - pytest tests/ -v --tb=short

risk: low

notes: >
  HIGH — Depends on TASK_001 (port exposure fix). This ensures tests run against
  an isolated database, preventing data corruption.
