# =============================================================================
# REJECTED TASKS (not included in execution)
# These are documented here for reference but have no task files generated.
# =============================================================================
rejected:
  - id: V-002
    name: fix_hardcoded_temp_password
    reason: >
      Incomplete specification with critical safety gap. Requires email
      infrastructure for password delivery. Without email, users would be
      locked out. Blocked until email service is operational.
    required_preconditions:
      - Email service (SMTP) configured and operational
      - Alternative secure password delivery mechanism
      - Retry logic for email failures

  - id: V-006
    name: migrate_task_queue_to_redis
    reason: >
      Major architectural change requiring Redis/RQ integration. Not suitable
      for incremental rollout. Requires careful planning, data migration,
      and rollback procedures. Should be planned as a separate phase.
    required_preconditions:
      - Redis infrastructure available
      - RQ (Redis Queue) library integrated
      - Migration plan with rollback procedures

