id: TASK_006_dp04_reraise_in_test_mode

title: Fix DP-04 — Re-raise exception in _update_processing_log_status test mode on SQLAlchemyError

status: pending

priority: low

depends_on:
  - TASK_004_dp01_remove_dead_datapipeline_class

description: >
  Fix the LOW issue where _update_processing_log_status silently swallows SQLAlchemyError
  in test mode (session is not None). The error is logged but never re-raised, leaving
  processing logs in an inconsistent state during tests.

source_file: .ai/audit/99-validation/07-data-processing-validated.md
source_section: DP-04: _update_processing_log_status silently swallows errors in test mode

files:
  - path: src/mkobi/workers/data_worker.py
    targets:
      - type: function
        name: _update_processing_log_status
    semantic_anchors:
      find:
        type: except_clause
        value: except SQLAlchemyError
      description: Two locations — test mode (session is not None) and production mode. Both need re-raise.

changes:
  - action: replace_code
    description: >
      In both the test mode and production mode except blocks for SQLAlchemyError,
      add `raise` after the `logger.error(...)` call so the exception propagates to the caller.
    code_hint: |
      # BEFORE (both locations):
      except SQLAlchemyError as e:
          logger.error("Failed to update processing log status: %s", e)

      # AFTER (both locations):
      except SQLAlchemyError as e:
          logger.error("Failed to update processing log status: %s", e)
          raise

acceptance_criteria:
  - SQLAlchemyError is re-raised after logging in both test and production paths
  - Caller's SAVEPOINT transaction in test mode properly handles the re-raised error

risk_notes: >
  Trivial risk — adding re-raise after logging. The production path already creates an
  independent session, so the re-raise only affects error propagation, not transaction state.

tests_to_run:
  - command: pytest tests/test_data_worker.py -v -k "update_processing_log" --no-cov
    reason: Verify status update error handling tests
