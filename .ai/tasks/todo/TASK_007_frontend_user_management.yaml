  - action: add_code
    description: >
      Add RetrievePasswordDialog component in the same file. It shows when
      showPasswordMode is true, has a "Show Password" button that calls
      retrieveTempPassword(pendingRetrievalToken), and on success shows
      ResetPasswordResultDialog with the password. On error (404), shows error toast.

    code_hint: |
      # Add after UserManagement component or as a separate component in same file:
      interface RetrievePasswordDialogProps {
        open: boolean
        retrievalToken: string
        userEmail: string
        onClose: () => void
      }

      function RetrievePasswordDialog({ open, retrievalToken, userEmail, onClose }: RetrievePasswordDialogProps) {
        const [password, setPassword] = useState<string | null>(null)
        const [loading, setLoading] = useState(false)
        const [error, setError] = useState(false)

        const handleRetrieve = async () => {
          setLoading(true)
          setError(false)
          try {
            const data = await retrieveTempPassword(retrievalToken)
            setPassword(data.temp_password)
          } catch {
            setError(true)
            toast.error('Password expired or already retrieved')
          } finally {
            setLoading(false)
          }
        }

        if (password) {
          return (
            <ResetPasswordResultDialog
              open={true}
              tempPassword={password}
              userEmail={userEmail}
              onClose={() => {
                setPassword(null)
                onClose()
              }}
            />
          )
        }

        return (
          <Dialog open={open} onClose={onClose} maxWidth="sm" fullWidth>
            <DialogTitle>Retrieve Password</DialogTitle>
            <DialogContent>
              <DialogContentText>
                Click "Show Password" to retrieve the temporary password for {userEmail}.
                This can only be done once.
              </DialogContentText>
              {error && (
                <DialogContentText color="error" sx={{ mt: 1 }}>
                  Password expired or already retrieved.
                </DialogContentText>
              )}
            </DialogContent>
            <DialogActions>
              <Button onClick={onClose}>Cancel</Button>
              <Button onClick={() => { void handleRetrieve() }} variant="contained" disabled={loading}>
                {loading ? 'Retrieving...' : 'Show Password'}
              </Button>
            </DialogActions>
          </Dialog>
        )
      }

  - action: modify_code
    description: >
      Add the RetrievePasswordDialog JSX at the bottom of UserManagement component,
