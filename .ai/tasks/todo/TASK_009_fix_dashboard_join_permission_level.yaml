id: TASK_009_fix_dashboard_join_permission_level
title: Include permission level in dashboard join to avoid N+1 queries

status: pending
priority: low

depends_on: []

description: >
  get_by_user() performs JOIN with DashboardAccess but only returns dashboard objects
  without the access permission level, causing extra DB round-trips in service layer.

goals:
  - Include permission data in get_by_user query
  - Consider DTO or hybrid property approach
  - Update DashboardRead if permission included in API response

files:
  - path: src/mkobi/db/repositories/dashboard_repo.py
    targets:
      - type: method
        name: get_by_user
    semantic_anchors:
      modify_query:
        type: function_call
        value: select

  - path: src/mkobi/db/models/access.py
    targets:
      - type: class
        name: DashboardAccess
    semantic_anchors:
      reference:
        type: attribute
        name: permission

  - path: src/mkobi/services/dashboard_service.py
    targets:
      - type: method
        name: get_user_dashboards
    semantic_anchors:
      reference:
        type: method

changes:
  - action: enhance_query
    description: Include permission column in JOIN query

  - action: design_dto
    description: Consider dedicated DTO for dashboard with permission

acceptance_criteria:
  - Permission data available without extra query
  - No N+1 query pattern in dashboard listing
  - DashboardRead model updated if needed

tests_to_run:
  - pytest tests/test_dashboards_api.py -v
  - pytest tests/test_repositories.py -v

risk_level: low