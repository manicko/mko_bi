id: TASK_047_add_e2e_upload_test

title: Add end-to-end test for file upload workflow (TST-003)

status: pending

priority: medium

depends_on:
  - TASK_001_fix_enqueue_job_failure_silent_none
  - TASK_010_fix_data_pipeline_transaction_coordination

description: >
  There is no end-to-end test that covers the complete file upload workflow
  from upload through processing to data availability. Add an integration test
  that uploads a CSV file, waits for processing, and verifies the aggregated
  data is available.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: TST-003

goals:
  - Add E2E test for complete upload -> process -> data flow
  - Test with a real CSV file and verify aggregated results
  - Cover both overwrite and append modes

files:
  - path: tests/
    targets:
      - type: test_file
        name: test_e2e_upload
    semantic_anchors:
      - create_test_file:
          description: Add E2E upload test file

changes:
  - action: add
    description: >
      Create an end-to-end test for the file upload workflow. The test should
      create a dashboard, upload a CSV file, trigger processing, and verify
      the aggregated data is available via the API.

    code_hint: |
      # tests/test_e2e_upload.py
      # 1. Create test dashboard with graphs and filters
      # 2. Upload CSV file via POST /upload/{dashboard_id}
      # 3. Trigger processing (or wait for background worker)
      # 4. Verify aggregated data via GET /data/aggregated
      # 5. Clean up test data

acceptance_criteria:
  - E2E test covers upload -> process -> data flow
  - Test passes with both overwrite and append modes
  - Test cleans up after itself
  - Processing log reflects correct status transitions

risk: medium

tests_to_run:
  - "pytest tests/ -v -k 'e2e_upload' --timeout=120"
