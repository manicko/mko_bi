id: TASK_015_add_docker_resource_limits

title: Add resource limits to all Docker services

status: pending

priority: high

depends_on: []

description: >
  Add resource limits (memory, CPU) to all services in docker-compose.yml.
  Currently no limits are defined, which could cause resource exhaustion.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: INF-002

goals:
  - Add memory limits to app, db, redis, rq-worker, nginx services
  - Add CPU limits where appropriate
  - Ensure production stability

files:
  - path: docker/docker-compose.yml
    targets:
      - type: service
        name: app
      - type: service
        name: db
      - type: service
        name: redis
      - type: service
        name: rq-worker
      - type: service
        name: nginx
    semantic_anchors:
      - add_resource_limits:
          description: Add deploy.resources.limits for each service

changes:
  - action: modify
    description: >
      Add resource limits to each service in docker-compose.yml.

    code_hint: |
      # Add to each service under the service definition:
      deploy:
        resources:
          limits:
            memory: 512M
            cpus: '0.5'
          reservations:
            memory: 256M

      # Example for app service (after line 107):
      app:
        ...
        deploy:
          resources:
            limits:
              memory: 1G
              cpus: '1.0'

acceptance_criteria:
  - All services have memory limits
  - Critical services (app, db) have CPU limits
  - Docker compose validates successfully
  - No performance regression

risk: medium

tests_to_run:
  - "cd docker && docker compose config"