id: TASK_003_P04_fix_admin_table_stale_data_empty_state_blocked_domains

title: Fix admin table stale data + add empty state + align blocked domains

status: pending

priority: high

depends_on: []

description: >
  Three fixes: (1) Add refetchOnMount: 'always' to useQuery in RegistrationRequests
  to prevent stale cache. (2) Add empty state overlay to DataGrid showing
  "No pending registration requests". (3) Align BLOCKED_DOMAINS with backend config
  (throwaway.email instead of throwawaymail.com).

phase: PLAN_04 — Registration Request Fixes
wave: 1

finding_ref: BUG-19, BUG-20, BUG-21
severity: low

goals:
  - Add refetchOnMount: 'always' to useQuery for registration requests
  - Add NoRegistrationRequestsOverlay component to DataGrid slots
  - Align BLOCKED_DOMAINS with backend: ['tempmail.com', 'throwaway.email']

files:
  - path: frontend/src/features/admin/ui/RegistrationRequests.tsx
    targets:
      - type: component
        name: RegistrationRequests
    semantic_anchors:
      update:
        type: hook_call
        value: "useQuery — add refetchOnMount: 'always'"
      add:
        type: component
        value: "NoRegistrationRequestsOverlay component"
      update:
        type: jsx_element
        value: "DataGrid — add slots.noRowsOverlay"

  - path: frontend/src/shared/types/formSchemas.ts
    targets:
      - type: constant
        name: BLOCKED_DOMAINS
    semantic_anchors:
      update:
        type: array_value
        value: "Replace 'throwawaymail.com' with 'throwaway.email'"

changes:
  - action: add_refetch_on_mount
    description: >
      Add refetchOnMount: 'always' to useQuery options.
    code_hint: |
      const { data: requests = [], isLoading } = useQuery({
        queryKey: ['admin', 'registration-requests'],
        queryFn: getRegistrationRequests,
        refetchOnMount: 'always',
      })

  - action: add_empty_state
    description: >
      Add NoRegistrationRequestsOverlay component and wire it to DataGrid slots.
    code_hint: |
      function NoRegistrationRequestsOverlay() {
        return (
          <Typography sx={{ p: 3, textAlign: 'center', color: 'text.secondary' }}>
            No pending registration requests
          </Typography>
        )
      }
      // In DataGrid:
      slots={{ noRowsOverlay: NoRegistrationRequestsOverlay }}

  - action: align_blocked_domains
    description: >
      Update BLOCKED_DOMAINS to match backend config.
    code_hint: |
      # Before:
      const BLOCKED_DOMAINS = ['tempmail.com', 'throwawaymail.com']
      # After:
      const BLOCKED_DOMAINS = ['tempmail.com', 'throwaway.email']

acceptance_criteria:
  - Admin table always fetches fresh data when the tab is mounted (no stale cache)
  - Empty state shows "No pending registration requests" when the table has no rows
  - Frontend BLOCKED_DOMAINS matches backend: ['tempmail.com', 'throwaway.email']
  - approveMutation and rejectMutation still invalidate queries on success (unchanged)
  - Other admin components (UserManagement, DashboardManagement) are unaffected

tests_to_run:
  - cd frontend && npx tsc --noEmit

risk_level: low

rollout_notes: >
  Two-file change but independent of other tasks.
  The BLOCKED_DOMAINS fix is a single-value correction.
