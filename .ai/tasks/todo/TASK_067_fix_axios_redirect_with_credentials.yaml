id: TASK_067_fix_axios_redirect_with_credentials

title: Fix Axios instance redirect-with-credentials configuration

status: pending

priority: high

depends_on: []
  # No dependencies — standalone frontend config change

source_reference: C:\py_dev\mkobi\.ai\audit\validated\validated-findings.md
source_section: FE-001 — Axios instance configured to follow redirects with credentials enabled

description: >
  The shared Axios instance is configured with both withCredentials: true and
  maxRedirects: 5. When withCredentials is true, credentials (cookies, auth headers)
  are included in cross-origin requests. If the server returns a redirect to a different
  origin, Axios will follow it and attach credentials to the new origin, risking
  authentication token leakage to unintended domains.

goals:
  - Prevent credential leakage on cross-origin redirects
  - Maintain same-origin redirect following for legitimate use cases
  - Keep withCredentials enabled for cookie-based auth

files:
  - path: frontend/src/shared/api/axiosInstance.ts

    targets:
      - type: variable
        name: axiosInstance

    semantic_anchors:

      replace:
        type: property_assignment
        old_value: "maxRedirects: 5"
        new_value: "maxRedirects: 0"

      # Alternative: add response interceptor for cross-origin redirect detection
      insert_after:
        type: interceptor_response_error
        value: "axiosInstance.interceptors.response.use"

changes:

  - action: replace_config

    description: >
      Set maxRedirects to 0 to prevent automatic redirect following. Since the backend
      API does not use HTTP redirects (all responses are direct JSON), disabling
      redirects is safe. If redirects are needed in the future, a response interceptor
      should validate redirect targets before following.

    code_hint: |
      # Before:
      export const axiosInstance = axios.create({
        baseURL: '/api/v1',
        withCredentials: true,
        headers: {
          'Content-Type': 'application/json',
        },
        maxRedirects: 5,
      })

      # After:
      export const axiosInstance = axios.create({
        baseURL: '/api/v1',
        withCredentials: true,
        headers: {
          'Content-Type': 'application/json',
        },
        maxRedirects: 0,
      })

acceptance_criteria:
  - maxRedirects set to 0 in axiosInstance config
  - withCredentials remains true
  - API requests function normally (no regressions from redirect change)
  - Build passes (npm run build)
  - Tests pass

tests_to_run:
  - npm run build
  - npm test

risk: low
