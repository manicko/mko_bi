        code_hint: |
          import io
          import pytest
          from httpx import AsyncClient
          from mkobi.core.config import get_config


          class TestStreamingSizeLimit:
            """Test cumulative size check during file streaming."""

            async def test_file_within_limit_no_content_length(
                self, client: AsyncClient, auth_headers
            ):
                """File under max size without Content-Length should succeed."""
                settings = get_config()
                csv_content = b"name,value\n" + b"foo,1\n" * 100
                assert len(csv_content) < settings.max_file_size

                files = {"file": ("test.csv", io.BytesIO(csv_content), "text/csv")}
                response = await client.post(
                    "/api/v1/upload/some-dashboard-id",
                    headers=auth_headers, files=files
                )
                assert response.status_code in (200, 201)

            async def test_file_exceeds_limit_returns_413(
                self, client: AsyncClient, auth_headers
            ):
                """File exceeding max_file_size should return 413."""
                settings = get_config()
                oversized = b"x" * (settings.max_file_size + 1024)
                files = {"file": ("huge.csv", io.BytesIO(oversized), "text/csv")}
                response = await client.post(
                    "/api/v1/upload/some-dashboard-id",
                    headers=auth_headers, files=files
                )
                assert response.status_code == 413

            async def test_temp_file_cleaned_after_rejection(
                self, client: AsyncClient, auth_headers, tmp_path
            ):
                """Temp file should be deleted after size limit rejection."""
                import tempfile
                import os

                settings = get_config()
                oversized = b"x" * (settings.max_file_size + 1024)
                files = {"file": ("huge.csv", io.BytesIO(oversized), "text/csv")}
                await client.post(
                    "/api/v1/upload/some-dashboard-id",
                    headers=auth_headers, files=files
                )
                # Verify no lingering temp files (check temp dir)
                temp_dir = tempfile.gettempdir()
                temp_files = [f for f in os.listdir(temp_dir) if f.startswith("mkobi")]
                assert len(temp_files) == 0, f"Lingering temp files: {temp_files}"

acceptance_criteria:
