id: TASK_015_add_processing_config_upfront_validation

title: LOW — Add upfront validation for processing config fields in data worker

status: pending

priority: low

depends_on:
  - TASK_014_expose_metric_agg_in_processing_config

source_file: .ai/audit/validated/final-report.md
source_finding: DP-005

description: >
  The data worker in src/mkobi/workers/data_worker.py processes config fields
  without upfront validation, leading to late-stage errors that are hard to debug.
  Add validation at the start of processing to catch invalid config early with
  clear error messages.

goals:
  - Validate processing config fields before starting data processing
  - Raise AppException with a descriptive error code for invalid configs
  - Fail fast with clear messages rather than failing mid-processing

files:
  - path: src/mkobi/workers/data_worker.py
    targets:
      - type: function
        name: process_csv_background_sync
    semantic_anchors:
      insert_after:
        type: function_definition
        value: process_csv_background_sync entry
    changes:
      - action: add_code
        description: >
          Add a validation block at the start of the processing function that
          checks config fields and raises AppException on invalid values.
        code_hint: |
          # Validate processing config before starting
          if config.required_columns and not all(col for col in config.required_columns):
              raise AppException(
                  ErrorCode.VALIDATION_ERROR,
                  detail="Processing config has empty required column names",
              )

acceptance_criteria:
  - Invalid configs are caught before data processing begins
  - Error messages clearly identify which config field is invalid
  - Valid configs proceed without any change in behavior
  - Tests cover both valid and invalid config scenarios

tests_to_run:
  - pytest tests/ -k "data_worker or processing_config" -v --no-header
  - ruff check src/mkobi/workers/data_worker.py
  - mypy src/mkobi/workers/data_worker.py

risk: low
risk_notes: >
  Low risk — additive validation that only affects error paths. Valid configs
  proceed identically. Must ensure the validation doesn't reject configs that
  were previously accepted.

type: implementation
category: data-processing
severity: low
