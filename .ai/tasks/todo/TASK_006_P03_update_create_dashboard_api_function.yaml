id: TASK_006_P03_update_create_dashboard_api_function

title: Update createDashboard API function to send layout inside config

status: pending

priority: high

depends_on:
  - TASK_004_P03_update_zod_schema_and_api_types

description: >
  Update the createDashboard API function to send layout inside the config object
  alongside graph_types. The backend DashboardConfig model has no layout field,
  so Pydantic v2 extra='ignore' would silently discard it. Instead, layout is
  stored inside the config JSONB column.

phase: PLAN_03 — Admin Dashboard Creation
wave: 3

finding_ref: BUG-11
severity: low

goals:
  - Send layout inside config object when layout is selected
  - Send description only when non-empty
  - Keep other API functions unchanged

files:
  - path: frontend/src/features/admin/api/adminApi.ts
    targets:
      - type: function
        name: createDashboard
    semantic_anchors:
      update:
        type: function_body
        value: "Build payload with layout inside config object"

changes:
  - action: update_api_function
    description: >
      Update createDashboard to send layout inside config object.
    code_hint: |
      export async function createDashboard(data: CreateDashboardRequest): Promise<DashboardAdmin> {
        const payload: Record<string, unknown> = { name: data.name }
        if (data.description) {
          payload.description = data.description
        }
        if (data.layout) {
          payload.config = { graph_types: ['bar'], layout: data.layout }
        }
        const response = await axiosInstance.post<DashboardAdmin>('/dashboards', payload)
        return response.data
      }

acceptance_criteria:
  - createDashboard sends layout inside config object when layout is selected
  - createDashboard sends description only when non-empty
  - Layout value is stored in the config JSONB column (not silently dropped)
  - Other API functions (getDashboardsAdmin, updateDashboard, deleteDashboard) unchanged

tests_to_run:
  - cd frontend && npx tsc --noEmit

risk_level: low

rollout_notes: >
  Depends on TASK_004 for updated types.
  Frontend-only change. The layout is stored in config JSONB — no backend
  schema change needed.
