description: >
  Three test functions create hardcoded temp directories under `tempfile.gettempdir()`
  (`mkobi_streaming_test`, `mkobi_streaming_cleanup_test`). Files inside are cleaned by
  assertions, but the parent directories remain. Replace with `tmp_path` fixture or
  `tempfile.TemporaryDirectory()` context manager.

goals:
  - Eliminate temp directory leaks in 3 test functions
  - Use tmp_path fixture or TemporaryDirectory context manager
  - No functional test behavior changes

files:
  - path: tests/test_streaming_size_limit.py
    targets:
      - type: function
        name: test_streaming_within_limit
      - type: function
        name: test_streaming_exceeds_limit
      - type: function
        name: test_streaming_cleanup
    semantic_anchors:
      insert_after:
        type: function_definition
        value: test_streaming_within_limit
    changes:
      - action: modify_code
        description: >
          Replace hardcoded temp directory paths with `tmp_path` fixture or
          `tempfile.TemporaryDirectory()` context manager.

acceptance_criteria:
  - All 3 test functions use tmp_path or TemporaryDirectory
  - No temp directories remain after test execution
  - All 3 tests pass
  - No production code is modified

