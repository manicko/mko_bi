id: TASK_010_db002_move_commit_after_none_check

title: Fix DB-002 — Move db.commit() after the None check in create_layout

status: pending

priority: medium

depends_on:
  - TASK_009_db001_fix_cleanup_old_logs_filter

description: >
  Fix the MEDIUM issue where `await db.commit()` at line 64 in layout_service.py executes
  before the `if layout_obj is None` check at line 66. If layout_repo.create() returns None,
  the transaction is already committed before validation, making the except block's rollback
  ineffective.

source_file: .ai/audit/99-validation/03-database-validated.md
source_section: DB-002: Move db.commit() after the None check in create_layout

files:
  - path: src/mkobi/services/layout_service.py
    targets:
      - type: method
        name: create_layout
    semantic_anchors:
      find:
        type: function_call
        value: await db.commit
      description: Swap the order of await db.commit() and the None check

changes:
  - action: replace_code
    description: >
      Move `await db.commit()` after the `if layout_obj is None: raise ValueError(...)` check.
      Commit only after all business logic validation passes.
    code_hint: |
      # BEFORE:
      layout_obj = await self.layout_repo.create(db=db, name=name, definition=definition)
      await db.commit()
      if layout_obj is None:
          raise ValueError("Failed to create layout")

      # AFTER:
      layout_obj = await self.layout_repo.create(db=db, name=name, definition=definition)
      if layout_obj is None:
          raise ValueError("Failed to create layout")
      await db.commit()

acceptance_criteria:
  - db.commit() is called only after the None check passes
  - If layout_obj is None, the exception handler's rollback() correctly undoes the flush()
  - No behavioral change when layout_repo.create() returns a valid object

risk_notes: >
  Low risk — only swaps the order of commit and None check. The current implementation
  of layout_repo.create() raises SQLAlchemyError rather than returning None, but the
  service layer should be robust against the declared return type (Layout | None).

tests_to_run:
  - command: pytest tests/test_layout_service.py -v -k "create_layout" --no-cov
    reason: Verify create_layout tests pass with reordered commit
