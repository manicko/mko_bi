id: TASK_009_fix_dual_router_mounting

title: Consolidate dual sub-router mounting pattern in app.py (BE-001)

status: pending

priority: high

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\final-report.md
source_section: BE-001 — Dual sub-router mounting pattern (composite + individual) — fragile architecture

description: >
  The API uses a dual route mounting pattern where routers are mounted both as a composite
  (via a parent router) and individually in app.py. This creates fragile architecture where
  routes can be registered twice or inconsistently. Consolidate to a single mounting approach.

goals:
  - Remove duplicate router mounting in app.py
  - Use a single, consistent router mounting pattern
  - Ensure all routes remain accessible at the same paths

files:
  - path: src/mkobi/api/app.py
    targets:
      - type: function
        name: create_app
    semantic_anchors:
      insert_after:
        type: function_call
        value: include_router
    changes:
      - action: remove_code
        description: Remove duplicate include_router calls for routers already mounted via composite

  - path: src/mkobi/api/routes/dashboards.py
    targets:
      - type: router
        name: router
    changes:
      - action: verify_code
        description: Verify dashboard routes are mounted exactly once

acceptance_criteria:
  - Each router is mounted exactly once
  - All API endpoints remain accessible at the same paths
  - No duplicate route registrations
  - All API tests pass

tests_to_run:
  - pytest tests/ -v --tb=short
  - ruff check src/mkobi/

risk: medium

notes: >
  HIGH — Architectural fix. Carefully verify all routes remain accessible after consolidation.
  Test all API endpoints to ensure no regressions.
