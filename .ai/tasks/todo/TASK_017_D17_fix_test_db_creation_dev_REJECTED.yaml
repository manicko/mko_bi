    command: "docker compose ps --format json"
    expected: "All services (db, migrate, app) show 'running' status"
  - name: App container healthy
    command: "curl -sf http://localhost:8000/health"
    expected: "Returns HTTP 200"
  - name: App logs show test DB created
    command: "docker compose logs app --tail 80"
    expected: "Logs contain 'Test database recreated successfully' or 'recreate_test_database' success message"
  - name: bidb_test database exists
    command: "docker compose exec db psql -U postgres -c \"SELECT datname FROM pg_database WHERE datname = 'bidb_test';\""
    expected: "Returns one row with 'bidb_test'"
  - name: bidb_test has schema (migrations applied)
    command: "docker compose exec db psql -U postgres -d bidb_test -c \"SELECT version_num FROM alembic_version LIMIT 1;\""
    expected: "Returns an alembic revision hash (not empty)"
  - name: No container restarts
    command: "docker compose ps --format '{{.Name}} {{.Status}}'"
    expected: "No container shows 'restarting' or 'unhealthy' status"
  - name: App logs show no critical errors
    command: "docker compose logs app --tail 100"
    expected: "No CRITICAL lines; no 'Failed to recreate test database' errors"

tests_to_run:
  - "docker compose down -v && docker compose up -d"
  - "docker compose logs app --tail 80 | grep -i 'test database'"
  - "docker compose exec db psql -U postgres -c \"SELECT datname FROM pg_database WHERE datname = 'bidb_test';\""
  - "docker compose exec app python -m pytest tests/ -v --timeout=60"

risk_level: medium

