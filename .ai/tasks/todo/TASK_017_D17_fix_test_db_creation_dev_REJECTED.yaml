description: >
  [REJECTED — STALE] The dev override sets RECREATE_TEST_DB: "true" and DATABASE__USER: mkobi_app for the
  app service, but test database recreation requires superuser privileges (CREATE DATABASE)
  that mkobi_app lacks. The recreate_test_database() method in db/starter.py derives its
  admin connection URL from the test_url (mkobi_app credentials) instead of using the
  TEST_ADMIN_DATABASE_URL (postgres superuser credentials). This causes test DB creation
  to fail silently or error out in dev mode.

  NOTE: This description is outdated. The current starter.py already uses TEST_ADMIN_DATABASE_URL.

finding_ref: INTERNAL — Dev environment test DB creation gap
severity: high

goals:
  - recreate_test_database() uses postgres superuser credentials for admin operations
  - Dev override provides admin DB credentials for test DB creation
  - Test database is automatically created on app startup in dev mode
  - No impact on production (RECREATE_TEST_DB is "false" in base compose)

files:
  - path: src/mkobi/db/starter.py
    targets:
      - type: method
        name: DatabaseStarter.recreate_test_database
    semantic_anchors:
      insert_after:
        type: statement
        value: "test_url = self._config.test_database_url or get_config().test_database_url"
    changes:
      - action: modify_method
        description: >
          [STALE] Replace the admin connection URL derivation. Instead of deriving base_url from
          test_url (which uses mkobi_app credentials), use the TEST_ADMIN_DATABASE_URL
          from config which provides postgres superuser credentials.
          NOTE: This change is already implemented in the current codebase.
        old_code_hint: |
          # Connect to 'postgres' database to be able to drop/create target database
          base_url = test_url.rsplit("/", 1)[0] + "/postgres"

          # Create engine connected to 'postgres' database with autocommit
          admin_engine = create_async_engine(
              base_url,
              isolation_level="AUTOCOMMIT",
          )
        new_code_hint: |
          # Use admin URL with superuser credentials for CREATE DATABASE operations
          admin_url = get_config().TEST_ADMIN_DATABASE_URL
          if not admin_url:
              logger.warning(
                  "TEST_ADMIN_DATABASE_URL not configured — "
                  "set DATABASE__ADMIN_USER and DATABASE__ADMIN_PASSWORD for test DB creation"
              )
              return

          # Create engine connected to 'postgres' database with autocommit
          admin_engine = create_async_engine(
              admin_url,
              isolation_level="AUTOCOMMIT",
          )

  - path: docker-compose.override.yml
    targets:
      - type: service
        name: app
    semantic_anchors:
      insert_after:
        type: directive
        value: "RECREATE_TEST_DB: \"true\""
    changes:
      - action: add_directive
        description: Add admin DB credentials for test DB recreation in dev
        code_hint: |
          # Admin credentials for test database (re)creation (requires superuser)
          DATABASE__ADMIN_USER: postgres
          DATABASE__ADMIN_PASSWORD: ${DATABASE__PASSWORD}

acceptance_criteria:
  - App starts in dev mode and automatically creates bidb_test database
  - Test database is accessible and has correct schema (migrations applied)
  - Tests can run against bidb_test
  - Production docker-compose.yml is unchanged (RECREATE_TEST_DB: "false")
  - If DATABASE__ADMIN_PASSWORD is not set, a warning is logged and test DB creation is skipped

docker_health_checks:
