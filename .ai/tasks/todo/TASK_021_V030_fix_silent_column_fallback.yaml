id: TASK_021_V030
title: Fix silent fallback to first 3 columns when graph dimensions are invalid
status: pending
priority: low
depends_on: []

description: >
  data_worker.py silently falls back to first 3 columns when graph dimensions are invalid.
  This may produce unexpected data without any warning to the user.

goals:
  - Add warning log when falling back to first 3 columns
  - Consider skipping the graph instead of silent fallback
  - Improve debuggability of data processing issues

files:
  - path: src/mkobi/workers/data_worker.py
    targets:
      - type: function
        name: process_csv_background
    semantic_anchors:
      - type: conditional
        description: "Fallback to first 3 columns when dimensions are invalid"
    changes:
      - action: add_logging
        description: "Add logger.warning() call when falling back to first 3 columns"
        code_hint: "logger.warning('Graph dimensions invalid, falling back to first 3 columns', extra={'graph_id': str(graph_id)})"

acceptance_criteria:
  - Invalid graph dimensions are logged with a warning
  - Processing continues with fallback (no data loss)
  - Existing tests pass

tests_to_run:
  - uv run pytest tests/ -x -v

risk_level: low
notes: >
  Simple logging addition. Consider whether skipping the graph entirely would be
  better UX than showing potentially incorrect data.
