id: TASK_028_fix_login_force_password_change

title: Fix login callback to check force_password_change flag (INT-009)

status: pending

priority: high

depends_on:
  - TASK_027_add_force_password_change_to_test_db

source_reference: C:\py_dev\mkobi\.ai\audit\validated\final-report.md
source_section: INT-009 — login callback doesn't check force_password_change

description: >
  The login flow in the frontend succeeds without checking the force_password_change
  flag returned by the backend. Users with force_password_change=True should be redirected
  to a password change page instead of the dashboard. Add the check in the login callback
  and redirect to password change when needed.

goals:
  - Check force_password_change flag after successful login
  - Redirect to password change page when force_password_change is True
  - Prevent normal dashboard access when password change is required

files:
  - path: frontend/src/features/auth/model/useAuth.ts
    targets:
      - type: hook
        name: useAuth
    semantic_anchors:
      insert_after:
        type: function_call
        value: login
    changes:
      - action: add_code
        description: Check force_password_change in login callback and redirect
        code_hint: |
          const result = await loginMutationAsync(credentials);
          if (result.force_password_change) {
              navigate('/change-password?forced=true');
              return;
          }

  - path: src/mkobi/api/routes/auth.py
    targets:
      - type: route_handler
        name: (login endpoint)
    changes:
      - action: verify_code
        description: Ensure login endpoint returns force_password_change in response

acceptance_criteria:
  - Users with force_password_change=True are redirected to password change
  - Normal users proceed to dashboard
  - Login flow tests pass

tests_to_run:
  - pytest tests/ -v -k "login" --tb=short
  - cd frontend && npm test -- --testPathPattern="auth|login"

risk: low

notes: >
  HIGH/MEDIUM — Security flow fix. Depends on TASK_027 for test DB schema alignment.
