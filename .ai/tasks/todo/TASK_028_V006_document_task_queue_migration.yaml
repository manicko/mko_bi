id: TASK_028_V006

title: Document in-memory task queue limitation and Redis/RQ migration plan

status: pending

priority: medium

depends_on: []

description: >
  The TaskQueue in src/mkobi/core/task_queue.py uses asyncio.Queue — an in-memory queue.
  All queued tasks are lost on application restart. The module already has inline comments
  noting this limitation. This task creates a formal migration plan document only.
  No code changes are made.

goals:
  - Create a migration plan document at docs/TASK_QUEUE_MIGRATION.md
  - Document the current in-memory queue behavior and its limitations
  - Describe the migration path to Redis/RQ for persistent task processing
  - Document what needs to change in TaskQueue, enqueue_job, and worker code
  - NO code changes — this is a documentation-only task

files:
  - path: docs/TASK_QUEUE_MIGRATION.md
    targets:
      - type: new_file
        description: "Migration plan document for replacing in-memory TaskQueue with Redis/RQ"

changes:
  - action: create_document
    description: >
      Create docs/TASK_QUEUE_MIGRATION.md containing:
      1. Current State: describe asyncio.Queue behavior, task loss on restart, MVP rationale
      2. Limitations: task loss, no persistence, no horizontal scaling, no retry on crash
      3. Target State: Redis/RQ architecture overview
      4. Migration Steps:
         - Install redis and rq packages
         - Create Redis connection configuration
         - Replace TaskQueue.enqueue with rq.Queue.enqueue
         - Replace TaskQueue.process_next with rq worker
         - Replace TaskQueue.get_status/get_result/get_error with rq job status API
         - Update enqueue_job compatibility function
         - Update all worker code that depends on TaskQueue
      5. Rollback Plan: how to revert to in-memory queue if Redis is unavailable
      6. Testing Strategy: how to verify migration correctness
    code_hint: |
      # Task Queue Migration Plan: In-Memory to Redis/RQ

      ## Current State
      ...

      ## Limitations
      ...

      ## Target Architecture (Redis/RQ)
      ...

      ## Migration Steps
      ...

      ## Rollback Plan
      ...

      ## Testing Strategy
      ...

acceptance_criteria:
  - docs/TASK_QUEUE_MIGRATION.md exists and is complete
  - Document covers current state, limitations, target architecture, migration steps, rollback plan, and testing strategy
  - No source code files are modified
  - No new dependencies are added
  - Document references actual code symbols (TaskQueue, enqueue_job, get_task_queue, default_queue)

tests_to_run: []

risk_level: none

notes: >
  This is a pure documentation task. The original task was rejected because it included
  code changes (adding module-level warnings, configuration flags) disguised as documentation.
  This refined version strictly creates a migration plan document without touching any source code.
  The existing inline comments in task_queue.py already note the limitation adequately.
