id: TASK_002_V002_add_composite_index

title: Add composite index idx_aggregated_data_dashboard_graph on aggregated_data

status: pending

priority: high

depends_on: []

description: >
  The aggregated_data table is missing a composite index on (dashboard_id, graph_id),
  which is the most common query pattern. Individual indexes exist but the composite
  index was missed in the initial migration. This causes sequential scans for the
  primary data retrieval path.

finding_ref: V-002
severity: HIGH

goals:
  - Add composite index on (dashboard_id, graph_id) to aggregated_data table
  - Make the migration idempotent with IF NOT EXISTS
  - Improve query performance for the most common access pattern

files:
  - path: alembic/versions/<new_migration>/
    targets:
      - type: migration_operation
        name: create_composite_index
    semantic_anchors:
      insert_after: index creation section in new migration
      operation: op.execute("CREATE INDEX IF NOT EXISTS idx_aggregated_data_dashboard_graph ON aggregated_data (dashboard_id, graph_id)")

changes:
  - action: create_migration
    description: >
      Create a new Alembic migration that adds the composite index.
    code_hint: |
      def upgrade():
          op.execute(
              "CREATE INDEX IF NOT EXISTS idx_aggregated_data_dashboard_graph "
              "ON aggregated_data (dashboard_id, graph_id)"
          )

      def downgrade():
          op.execute("DROP INDEX IF EXISTS idx_aggregated_data_dashboard_graph")

acceptance_criteria:
  - New migration created and passes upgrade/downgrade
  - Index idx_aggregated_data_dashboard_graph exists in the database
  - EXPLAIN ANALYZE shows index usage for dashboard_id + graph_id queries
  - No regression in data retrieval endpoints

tests_to_run:
  - pytest tests/ -k "aggregated_data or data" -v
  - alembic upgrade head --sql (dry run verification)

risk_level: low

rollout_notes: >
  Safe. IF NOT EXISTS makes it idempotent. No dependencies on other fixes.
  Can be applied independently at any time.
