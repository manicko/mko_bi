    targets:
      - type: test_file
    changes:
      - action: create_file
        description: Create error response contract tests
        code_hint: |
          import pytest
          from httpx import AsyncClient


          class TestErrorResponseFormat:
            """Verify all error responses conform to the standard format."""

            async def test_400_validation_error_format(self, client: AsyncClient):
                """Validation errors should return structured ErrorResponse."""
                response = await client.post("/api/v1/auth/login", json={
                    "email": "not-an-email",
                    "password": "x"
                })
                assert response.status_code == 422
                body = response.json()
                # Verify standard fields exist
                assert "error" in body or "detail" in body

            async def test_401_unauthenticated_format(
                self, client: AsyncClient
            ):
                """Unauthenticated requests should return structured error."""
                response = await client.get("/api/v1/dashboards")
                assert response.status_code == 401
                body = response.json()
                assert "error" in body or "detail" in body

            async def test_404_not_found_format(self, client: AsyncClient, auth_headers):
                """Not-found errors should return structured error."""
                response = await client.get(
                    "/api/v1/dashboards/00000000-0000-0000-0000-000000000000",
                    headers=auth_headers
                )
                assert response.status_code == 404
                body = response.json()
                assert "error" in body or "detail" in body

            async def test_403_permission_error_format(
                self, client: AsyncClient, viewer_headers, admin_only_endpoint
            ):
                """Permission errors should return structured error."""
                response = await client.delete(
                    f"/api/v1/dashboards/{admin_only_endpoint}",
                    headers=viewer_headers
                )
                assert response.status_code == 403
                body = response.json()
                assert "error" in body or "detail" in body

acceptance_criteria:
