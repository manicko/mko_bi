description: >
  Implementing TASK_030 adds a global ErrorResponse model and exception handlers.
  Write contract tests that verify all error responses conform to the standard format
  across different endpoint categories.

goals:
  - Test that 400 validation errors return the standard ErrorResponse format
  - Test that 401 authentication errors return the standard format
  - Test that 403 permission errors return the standard format
  - Test that 404 not-found errors return the standard format
  - Test that 500 internal errors return the standard format (no stack traces in production)
  - Verify the response contains the `error` and `code` fields

files:
