description: >
  The frontend `grantDashboardAccess` function in `adminApi.ts` sends only `{user_id, permission}`
  in the request body, but the backend `POST /dashboards/{dashboard_id}/access` endpoint requires
  `dashboard_id` in the request body as well (it's also in the path). Without it, the request
  will fail with HTTP 422. Add `dashboard_id` to the request body object.

