id: TASK_005_V012
title: Fix @lru_cache on token decode without TTL
status: pending
priority: medium
depends_on: []

description: >
  _decode_token_cached uses @lru_cache to cache decoded tokens indefinitely. If a user's
  role changes, the cached token data is stale until app restart.

goals:
  - Replace @lru_cache with TTL-based caching for decoded tokens
  - Ensure role changes take effect within a reasonable time window
  - Maintain performance benefit of caching

files:
  - path: src/mkobi/core/permissions.py
    targets:
      - type: function
        name: _decode_token_cached
    semantic_anchors:
      - type: decorator
        value: lru_cache
    changes:
      - action: replace_decorator
        description: "Replace @lru_cache with TTL-based cache (e.g., cachetools.TTLCache or manual TTL tracking)"
        code_hint: "Use cachetools.TTLCache(maxsize=1024, ttl=300) or implement manual TTL with timestamp check"

acceptance_criteria:
  - Token decode results are cached for a limited time (e.g., 5 minutes)
  - After TTL expires, fresh token decode is performed
  - Role changes take effect after cache TTL expires
  - Existing tests pass

tests_to_run:
  - uv run pytest tests/ -x -v

risk_level: low
notes: >
  If cachetools is not in dependencies, implement a simple manual TTL dict with
  timestamp checking rather than adding a new dependency.
