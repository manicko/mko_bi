id: TASK_012_be001_fix_jwt_secret_test_for_container

title: Fix BE-001 — Update test_none_jwt_secret_accepted for containerized environment

status: pending

priority: high

depends_on: []

description: >
  Fix the HIGH issue where test_none_jwt_secret_accepted in test_config.py assumes .env file
  is available as a fallback in the Docker test container, but no .env is mounted. The test
  should verify the env-var-to-settings pipeline instead of depending on .env fallback.

source_file: .ai/audit/99-validation/01-backend-validated.md
source_section: BE-001: Fix test_none_jwt_secret_accepted for Containerized Environment

files:
  - path: tests/test_config.py
    targets:
      - type: method
        name: test_none_jwt_secret_accepted
    semantic_anchors:
      replace:
        type: method
        value: test_none_jwt_secret_accepted

changes:
  - action: replace_code
    description: >
      Replace the test to use monkeypatch.setenv to set a known test value, then verify
      settings.jwt.secret_key matches. This makes the test environment-agnostic and verifies
      the primary production path (env var → settings).
    code_hint: |
      # BEFORE:
      def test_none_jwt_secret_accepted(self, monkeypatch):
          monkeypatch.delenv("JWT__SECRET_KEY", raising=False)
          settings = Settings()
          assert settings.jwt.secret_key == "dev-secret-key-for-security-testing-do-not-use-in-prod-32chars"

      # AFTER:
      def test_env_jwt_secret_accepted(self, monkeypatch):
          """Verify JWT__SECRET_KEY from env var is loaded into settings."""
          monkeypatch.setenv("JWT__SECRET_KEY", "test-jwt-secret-key-for-unit-tests-32-chars!")
          settings = Settings()
          assert settings.jwt.secret_key == "test-jwt-secret-key-for-unit-tests-32-chars!"

acceptance_criteria:
  - Test passes in both host and Docker container environments
  - Test verifies the env-var-to-settings pipeline
  - Does not depend on .env file presence

risk_notes: >
  Trivial risk — rename and simplify an existing test.

tests_to_run:
  - command: pytest tests/test_config.py -v -k "jwt_secret" --no-cov
    reason: Verify JWT secret config tests pass
