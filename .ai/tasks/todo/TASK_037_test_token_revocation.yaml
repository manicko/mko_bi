description: >
  Implementing TASK_010 adds a complete token revocation mechanism with Redis-backed
  blacklist. Existing authentication tests do not cover revocation scenarios. Write
  comprehensive tests that validate the full lifecycle: token creation, revocation on
  logout, rejection of revoked tokens, automatic expiry of blacklist entries, and
  behavior during user deactivation.

goals:
  - Test that a valid token works before revocation
  - Test that a revoked token returns 401 on authenticated endpoints
  - Test that logout revokes the current access token
  - Test that blacklist entries expire after TTL (no indefinite growth)
  - Test that user deactivation revokes all active tokens
  - Test that other users' tokens are not affected by one user's revocation

