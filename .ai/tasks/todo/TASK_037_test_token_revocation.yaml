          import pytest
          from httpx import AsyncClient


          class TestTokenRevocation:
              """Test token blacklist mechanism."""

              async def test_valid_token_works(self, client: AsyncClient, auth_headers):
                  """Valid token should grant access."""
                  response = await client.get("/api/v1/dashboards", headers=auth_headers)
                  assert response.status_code == 200

              async def test_revoked_token_returns_401(self, client: AsyncClient, auth_headers):
                  """After logout, old token should be rejected."""
                  logout_response = await client.post("/api/v1/auth/logout", headers=auth_headers)
                  assert logout_response.status_code == 200

                  response = await client.get("/api/v1/dashboards", headers=auth_headers)
                  assert response.status_code == 401
                  assert "revoked" in response.json()["detail"].lower()

              async def test_blacklist_entry_expires(self, client: AsyncClient, auth_headers):
                  """Blacklist entry should expire after TTL, restoring token validity."""
                  import asyncio
                  from mkobi.core.config import get_config

                  settings = get_config()
                  ttl = settings.jwt_access_token_expire_minutes * 60

                  await client.post("/api/v1/auth/logout", headers=auth_headers)
                  assert (await client.get("/api/v1/dashboards", headers=auth_headers)).status_code == 401

                  # Wait for expiry (use shorter TTL in test config or mock)
                  # await asyncio.sleep(ttl + 1)
                  # assert (await client.get("/api/v1/dashboards", headers=auth_headers)).status_code == 200

              async def test_other_user_token_unaffected(
                  self, client: AsyncClient, admin_headers, user_headers
              ):
                  """Revoking one user's token should not affect another user."""
                  await client.post("/api/v1/auth/logout", headers=admin_headers)

                  # Admin token is revoked
                  assert (await client.get("/api/v1/dashboards", headers=admin_headers)).status_code == 401

                  # User token still works
                  assert (await client.get("/api/v1/dashboards", headers=user_headers)).status_code == 200

