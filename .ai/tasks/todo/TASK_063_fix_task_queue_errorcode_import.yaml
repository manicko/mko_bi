id: TASK_063_fix_task_queue_errorcode_import

title: Fix ErrorCode import path in task_queue.py

status: pending

priority: medium

depends_on: []
  # No dependencies — standalone import fix

source_reference: C:\py_dev\mkobi\.ai\audit\validated\validated-findings.md
source_section: BE-002/BE-005 — Interface contract violation for delete_old_logs

description: >
  Fix the implicit ErrorCode re-export import in task_queue.py by importing ErrorCode from
  its canonical definition location (mkobi.models.enums) instead of mkobi.utils.exceptions.
  AppException remains imported from mkobi.utils.exceptions since it is used at line 184.
  This resolves the mypy attr-defined error.

goals:
  - Resolve mypy error for ErrorCode import
  - Use canonical import path matching project conventions
  - Preserve backward compatibility (ErrorCode values unchanged)

files:
  - path: src/mkobi/core/task_queue.py

    targets:
      - type: module
        name: mkobi/core/task_queue.py

    semantic_anchors:

      replace:
        type: import_statement
        old_value: "from mkobi.utils.exceptions import AppException, ErrorCode"
        new_value: "from mkobi.utils.exceptions import AppException\nfrom mkobi.models.enums import ErrorCode"

changes:

  - action: replace_import

    description: >
      Split the combined import into two lines: AppException stays from mkobi.utils.exceptions
      (used at line 184), ErrorCode moves to mkobi.models.enums (canonical definition).

    code_hint: |
      # Before (line 14):
      from mkobi.utils.exceptions import AppException, ErrorCode

      # After:
      from mkobi.utils.exceptions import AppException
      from mkobi.models.enums import ErrorCode

acceptance_criteria:
  - mypy passes without attr-defined error for ErrorCode in task_queue.py
  - AppException still importable from mkobi.utils.exceptions (no regression)
  - All existing tests pass

tests_to_run:
  - mypy src/mkobi/core/task_queue.py
  - pytest tests/ -x -q

risk: low
