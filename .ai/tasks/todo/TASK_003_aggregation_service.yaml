        name: AggregationService

    semantic_anchors:
      create_new_file: true
      follow_pattern:
        type: service
        file: src/mkobi/services/graph_service.py

    changes:
      - action: create_file
        description: |
          Create AggregationService with logger = logging.getLogger(__name__).

          Method: async def aggregate_for_dashboard(
              df: pl.DataFrame,
              graphs: list[Graph],
              dashboard_filters: list[Filter],
              metric_agg: str = "sum",
          ) -> list[dict]:
          """
          For each graph, GROUP BY graph.dimensions + dashboard.filters.dims, aggregate metrics.
          Returns list of {dashboard_id, graph_id, dims: {all str}, metrics: {}} dicts.
          """
          Logic:
          1. Compute dashboard_filter_dim_names = [f.name for f in dashboard_filters]
          2. For each graph:
             a. groupby_cols = [d for d in (graph.dimensions + dashboard_filter_dim_names) if d in df.columns]
             b. metric_cols = [m for m in graph.metrics if m in df.columns]
             c. If no groupby_cols or metric_cols, skip (log warning)
             d. Build agg expressions: pl.col(m).sum().alias(f"{m}_sum") for each metric
             e. result = df.group_by(groupby_cols).agg(agg_exprs)
             f. For each row in result.to_dicts():
                - dims = {col: str(row[col]) for col in groupby_cols}
                - metrics = {k: v for k, v in row.items() if k not in groupby_cols}
                - Append {"dashboard_id": graph.dashboard_id, "graph_id": str(graph.id), "dims": dims, "metrics": metrics}
          3. Return the full list of record dicts.

          Method: async def extract_filter_values(
              aggregated_records: list[dict],
              dashboard_filter_names: list[str],
          ) -> dict[str, list[str]]:
          """
          From aggregated records, extract distinct values for each dashboard filter dimension.
          Returns {filter_name: [sorted unique string values]}.
          """
          Logic:
          1. Initialize {name: set() for name in dashboard_filter_names}
          2. For each record, for each filter_name in dashboard_filter_names:
             if filter_name in record["dims"], add record["dims"][filter_name] to the set
          3. Return {name: sorted(list(values)) for name, values in sets.items()}

