id: TASK_026_V002

title: Generate random temporary password for approved registration users

status: pending

priority: high

depends_on: []

description: >
  The admin approval endpoint creates users with a hardcoded predictable password "temppass123".
  Replace this with a cryptographically random password generated via secrets.token_urlsafe().
  The generated password is returned in the admin API response so the admin can communicate it
  to the user through any available channel. No email infrastructure required.

goals:
  - Replace hardcoded "temppass123" with a cryptographically random password
  - Return the generated password in the admin API response
  - Preserve backward compatibility of the response structure (add field, don't remove existing ones)
  - No new dependencies or infrastructure required

files:
  - path: src/mkobi/api/routes/admin.py
    targets:
      - type: function
        name: approve_registration_request_admin_endpoint
    semantic_anchors:
      insert_after:
        type: function_call
        value: auth_service.create_user
      replace:
        type: string_literal
        value: "temppass123"

changes:
  - action: add_import
    description: >
      Add `import secrets` at the top of the file (alphabetically after `import logging`).
    code_hint: import secrets

  - action: replace_code
    description: >
      Replace the hardcoded password with a generated random password.
      Store the generated password in a variable before passing to create_user,
      then include it in the response dict.
    code_hint: |
      temp_password = secrets.token_urlsafe(16)
      user = await auth_service.create_user(
          email=req["email"],
          password=temp_password,
          role=UserRole.VIEWER,
          db=db,
      )

  - action: modify_return
    description: >
      Add the temporary password to the success response so the admin can see it.
    code_hint: |
      return {
          "message": "Registration request approved",
          "user_id": str(user.id),
          "temp_password": temp_password,
      }

acceptance_criteria:
  - Hardcoded "temppass123" string is completely removed from the codebase
  - Generated password is cryptographically random (secrets module, not random module)
  - Generated password is included in the API response
  - Response still includes "message" and "user_id" fields (backward compatible)
  - No new external dependencies or infrastructure required
  - Ruff and mypy pass

tests_to_run:
  - tests/test_admin.py

risk_level: low

notes: >
  This approach avoids the email infrastructure dependency that caused the original
  rejection. The admin receives the temporary password in the API response and
  can communicate it to the user through any available channel (in-person, phone, etc.).
  For a better UX, a future task can add forced password change on first login or
  email notification, but those are separate concerns with their own infrastructure requirements.
