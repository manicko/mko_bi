id: TASK_022_VF005_make_cookie_secure_configurable

title: Make COOKIE_SECURE configurable via environment variable

status: pending

priority: low

depends_on: []

phase: VALIDATED_FINDINGS_001
wave: 1
group: auth_bug_fixes

description: >
  COOKIE_SECURE is hardcoded to True at security.py:47 with no environment-based
  override. In local development without HTTPS, the browser will refuse to set
  the cookie, silently breaking the refresh token flow. This is a developer
  experience issue — production should always use HTTPS.

goals:
  - Make COOKIE_SECURE configurable via environment variable
  - Default to True for production safety
  - Allow False for development environments without HTTPS

files:
  - path: src/mkobi/core/security.py
    targets:
      - type: constant
        name: COOKIE_SECURE
    semantic_anchors:
      insert_after:
        type: constant_block
        value: COOKIE_SECURE
      replace:
        type: constant_value
        value: "True"
    changes:
      - action: replace_code
        description: >
          Replace the hardcoded COOKIE_SECURE constant with a value read from
          the Settings config, defaulting to True.
        code_hint: |
          # Before:
          # COOKIE_SECURE: bool = True
          #
          # After: read from config at runtime
          # COOKIE_SECURE is now accessed via get_config().cookie_secure
          # or add a COOKIE_SECURE field to AppSettings

acceptance_criteria:
  - COOKIE_SECURE can be set via environment variable
  - Defaults to True when not explicitly set
  - Production behavior unchanged (secure by default)
  - Development without HTTPS can set COOKIE_SECURE=False
  - All existing tests pass

tests_to_run:
  - tests/ -k "cookie" (cookie-related tests)
  - tests/test_auth_api.py (full cookie auth flow tests)

risk_level: low

notes: >
  Optional/deferrable task. Does not block production. The fix should add a
  cookie_secure field to AppSettings (or similar) and use get_config() to
  read it at runtime, following the existing pattern for other settings.
