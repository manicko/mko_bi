description: >
  Final verification gate after ALL tasks are complete. This is the comprehensive
  end-to-end check that the entire Docker development environment works correctly
  after all changes from PLAN_03 (Waves 1-3) and Docker Hardening (Waves 1-2).

  This is a READ-ONLY verification task — no source code changes.

goals:
  - Full stack starts cleanly from scratch (docker compose down -v && docker compose up -d)
  - All containers healthy and stable
  - Backend hot reload works
  - Frontend dev server works with API proxy
  - Test database auto-created
  - App runs as non-root
  - Documentation cross-links valid
  - No regressions

files: []

acceptance_criteria:
  - Full stack starts from clean state
  - All containers healthy
  - Backend + frontend hot reload both work
  - Test DB auto-created
  - Non-root user confirmed
  - All doc cross-links resolve
  - No container restart loops

docker_health_checks:
  # === Clean Start ===
  - name: Clean start from scratch
    command: "docker compose down -v && docker compose build app && docker compose up -d"
    expected: "All containers start without errors"
  - name: All containers running
    command: "docker compose ps --format '{{.Name}} {{.Status}}'"
    expected: "db: running (healthy), migrate: exited (0), app: running, frontend: running"
  - name: No restarting containers
    command: "docker compose ps --format '{{.Name}} {{.Status}}' | grep -c 'restarting\\|unhealthy'"
    expected: "Count is 0"

  # === Database ===
  - name: DB healthy
    command: "docker compose exec db pg_isready -U postgres"
    expected: "Returns 'accepting connections'"
  - name: Main DB has schema
    command: "docker compose exec db psql -U postgres -d bidb -c \"SELECT version_num FROM alembic_version LIMIT 1;\""
    expected: "Returns alembic revision hash"
  - name: Test DB exists with schema
    command: "docker compose exec db psql -U postgres -d bidb_test -c \"SELECT version_num FROM alembic_version LIMIT 1;\""
    expected: "Returns alembic revision hash"

  # === Backend ===
  - name: App health
    command: "curl -sf http://localhost:8000/health"
    expected: "HTTP 200"
  - name: App runs as non-root
    command: "docker compose exec app whoami"
    expected: "Returns 'app'"
  - name: App logs clean
    command: "docker compose logs app --tail 100"
    expected: "No ERROR or CRITICAL lines"
  - name: Backend hot reload
    command: "touch src/mkobi/main.py && sleep 5 && docker compose logs app --tail 20"
    expected: "Logs show reload activity"

  # === Frontend ===
  - name: Frontend responds
    command: "curl -sf http://localhost:5173"
    expected: "HTTP 200 with HTML"
  - name: API proxy works
    command: "curl -sf http://localhost:5173/api/v1/health 2>/dev/null || curl -sf http://localhost:8000/health"
    expected: "HTTP 200"
  - name: Frontend hot reload
    command: "touch frontend/src/App.tsx && sleep 5 && docker compose logs frontend --tail 20"
    expected: "Logs show Vite HMR update"

  # === Network Isolation ===
  - name: Internal connectivity
    command: "docker compose exec app python -c \"import socket; s = socket.create_connection(('db', 5432), timeout=5); print('DB OK'); s.close(); s = socket.create_connection(('redis', 6379), timeout=5); print('Redis OK'); s.close()\""
    expected: "Prints 'DB OK' and 'Redis OK'"

  # === Documentation ===
  - name: Docker guide cross-links valid
    command: "cd docs && python -c \"import os; links = ['99-reference/run-guide.md', '10-deployment/deployment.md', '11-guides/task-queue-migration.md']; [os.path.exists(l) for l in links]\""
    expected: "All referenced doc files exist"

  # === Resource Stability ===
  - name: Stable resource usage
    command: "docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' app frontend db"
    expected: "CPU reasonable, no OOM"

tests_to_run:
  - "docker compose down -v && docker compose build app && docker compose up -d"
  - "docker compose ps"
  - "curl -sf http://localhost:8000/health"
  - "curl -sf http://localhost:5173"
  - "docker compose exec app whoami"
  - "docker compose exec db psql -U postgres -c \"SELECT datname FROM pg_database;\""
  - "touch src/mkobi/main.py && sleep 5 && docker compose logs app --tail 20"
  - "touch frontend/src/App.tsx && sleep 5 && docker compose logs frontend --tail 20"

risk_level: low

rollout_notes: >
  READ-ONLY final gate. No code changes. This is the final verification that the
  entire Docker development environment is healthy after all changes. If any check
  fails, investigate and fix before considering the refactoring complete.
