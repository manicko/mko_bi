id: TASK_005_05_password_change_page

title: Frontend Password Change Page

status: pending

priority: high

depends_on:
  - TASK_003_03_sidebar_conditional

wave: 2

description: >
  Create the frontend password change flow: ChangePasswordRequest type,
  changePasswordSchema with Zod validation, changePassword() API function,
  ChangePasswordPage component, "Change password" button on UserProfile,
  and route at /profile/change-password.

goals:
  - Add ChangePasswordRequest interface to api.types.ts
  - Add changePasswordSchema to formSchemas.ts
  - Add changePassword() to userApi.ts
  - Create ChangePasswordPage.tsx component
  - Add "Change password" button to UserProfile.tsx
  - Add /profile/change-password route to routes.tsx

files:
  - path: frontend/src/shared/types/api.types.ts
    targets:
      - type: interface
        name: GrantAccessRequest
    semantic_anchors:
      insert_after:
        type: interface
        name: GrantAccessRequest
    changes:
      - action: add_interface
        description: Add ChangePasswordRequest interface after GrantAccessRequest
        interface:
          name: ChangePasswordRequest
          fields:
            - name: current_password
              type: string
            - name: new_password
              type: string
            - name: confirm_password
              type: string

  - path: frontend/src/shared/types/formSchemas.ts
    targets:
      - type: schema
        name: grantAccessSchema
    semantic_anchors:
      insert_after:
        type: schema
        name: grantAccessSchema
    changes:
      - action: add_schema
        description: Add changePasswordSchema after grantAccessSchema
        schema:
          name: changePasswordSchema
          definition: |
            z.object({
              current_password: z.string().min(1, 'Current password is required'),
              new_password: z.string().min(8, 'Password must be at least 8 characters'),
              confirm_password: z.string().min(1, 'Password confirmation is required'),
            }).refine((data) => data.new_password === data.confirm_password, {
              message: 'Passwords do not match',
              path: ['confirm_password'],
            })
          type_export: ChangePasswordFormData

  - path: frontend/src/features/users/api/userApi.ts
    targets:
      - type: function
        name: deleteAccount
    semantic_anchors:
      insert_after:
        type: function
        name: deleteAccount
    changes:
      - action: add_function
        description: Add changePassword() function after deleteAccount
        function:
          name: changePassword
          signature: "export async function changePassword(data: ChangePasswordRequest): Promise<void>"
          body: "await axiosInstance.post('/auth/change-password', data)"

  - path: frontend/src/features/users/ui/ChangePasswordPage.tsx
    targets:
      - type: file
        name: ChangePasswordPage.tsx
    semantic_anchors:
      action: create_new_file
    changes:
      - action: create_component
        description: Create ChangePasswordPage component
        component:
          name: ChangePasswordPage
          features:
            - Uses useForm with zodResolver and changePasswordSchema
            - Three fields: current_password, new_password, confirm_password
            - On success: toast.success + navigate to /profile
            - On error: Alert with error message
            - Cancel button navigates to /profile

  - path: frontend/src/features/users/ui/UserProfile.tsx
    targets:
      - type: component
        name: UserProfile
    semantic_anchors:
      insert_after:
        type: jsx_block
        value: role display box (before delete account section)
    changes:
      - action: add_jsx
        description: Add "Change password" button before delete account section
        code: |
          <Box sx={{ mt: 4 }}>
            <Button
              variant="outlined"
              onClick={() => navigate('/profile/change-password')}
            >
              Change Password
            </Button>
          </Box>

  - path: frontend/src/app/routes.tsx
    targets:
      - type: route
        name: /profile
    semantic_anchors:
      insert_after:
        type: route
        path: /profile
    changes:
      - action: add_route
        description: Add /profile/change-password route after /profile route
        route:
          path: /profile/change-password
          element: "<ProtectedRoute><ChangePasswordPage /></ProtectedRoute>"
        import: "import { ChangePasswordPage } from '../features/users/ui/ChangePasswordPage'"

acceptance_criteria:
  - Change password page accessible at /profile/change-password
  - Form has three fields: current password, new password, confirm password
  - Validation: min 8 chars for new password, confirmation must match
  - On success: redirects to /profile with toast success message
  - On error: shows error message on page
  - User remains logged in after password change
  - "Change password" button visible on profile page
  - Frontend typecheck and lint pass

tests_to_run:
  - "cd frontend && npm run typecheck"
  - "cd frontend && npm run lint"

risk_level: medium

autonomous: true
