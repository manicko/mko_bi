id: TASK_005_P02_remove_is_active_from_admin_user

title: Remove is_active from AdminUser type and verify UserProfile data display

status: pending

priority: high

depends_on:
  - TASK_003_P02_remove_status_column_and_block_action

description: >
  (1) Remove is_active from AdminUser type since backend UserRead model doesn't return it.
  (2) Verify UserProfile component already correctly displays Email, Display Name, Role
  as read-only fields with Change Password and Delete Account buttons.

phase: PLAN_02 — Frontend Bug Fixes
wave: 2

finding_ref: BUG-04a, BUG-04b
severity: low

goals:
  - Remove is_active field from AdminUser interface
  - Verify UserProfile component structure is correct (no changes needed)

files:
  - path: frontend/src/shared/types/api.types.ts
    targets:
      - type: interface
        name: AdminUser
    semantic_anchors:
      remove:
        type: property
        value: "is_active: boolean"

  - path: frontend/src/features/users/ui/UserProfile.tsx
    targets:
      - type: component
        name: UserProfile
    semantic_anchors:
      verify:
        type: jsx_structure
        value: "Read-only display of email, display_name, role + Change Password and Delete Account buttons"

changes:
  - action: remove_type_field
    description: >
      Remove is_active from AdminUser interface.
    code_hint: |
      # Before:
      export interface AdminUser {
        id: string
        email: string
        role: UserRole
        is_active: boolean
        created_at: string
      }
      # After:
      export interface AdminUser {
        id: string
        email: string
        role: UserRole
        created_at: string
      }

  - action: verify_component
    description: >
      Verify UserProfile.tsx already has correct read-only display structure.
      No structural changes needed — the existing code satisfies Bug #4a requirements.

acceptance_criteria:
  - AdminUser type no longer has is_active field
  - AdminUser interface has exactly 4 fields: id, email, role, created_at
  - UserProfile displays Email, Display Name, Role as read-only (already correct)
  - "Change Password" and "Delete Account" buttons present (already correct)
  - No TypeScript errors from removing is_active (all references removed in TASK_003)

tests_to_run:
  - cd frontend && npx tsc --noEmit

risk_level: low

rollout_notes: >
  Depends on TASK_003 to remove is_active references from UserManagement
  before the type change will compile. UserProfile investigation may reveal
  no changes needed — the component structure is already correct.
