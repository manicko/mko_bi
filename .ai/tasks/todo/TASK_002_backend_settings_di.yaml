description: >
  Add TEMP_PASSWORD_TTL_SECONDS configuration field to Settings class in config.py
  with a field validator enforcing minimum 60 seconds. Add get_temp_password_store()
  factory function in deps.py for dependency injection of TempPasswordStore.

goals:
  - Add temp_password_ttl_seconds field to Settings with default 86400 (24h)
  - Add field_validator to enforce minimum TTL of 60 seconds
  - Add get_temp_password_store() factory in deps.py
  - Export get_temp_password_store in deps.py __all__

