id: TASK_054_pin_docker_image_versions

title: Pin floating major-version Docker image tags (INF-010)

status: pending

priority: low

depends_on: []

description: >
  Some Docker images use floating major-version tags (e.g., postgres:16, redis:7-alpine).
  While better than unversioned tags, these can still change minor versions.
  Pin to specific patch versions for fully reproducible builds.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: INF-010

goals:
  - Pin postgres to specific patch version
  - Pin redis to specific patch version
  - Document the image update procedure

files:
  - path: docker/docker-compose.yml
    targets:
      - type: service
        name: db
      - type: service
        name: redis
    semantic_anchors:
      - modify_image:
          value: "postgres:16"
          description: Pin to specific patch version
      - modify_image:
          value: "redis:7-alpine"
          description: Pin to specific patch version

changes:
  - action: modify
    description: >
      Pin Docker images to specific patch versions.

    code_hint: |
      # BEFORE:
      postgres:16
      redis:7-alpine

      # AFTER:
      postgres:16.3
      redis:7.4-alpine

acceptance_criteria:
  - All Docker images use specific patch versions
  - Services start correctly
  - Docker compose validates

risk: low

tests_to_run:
  - "cd docker && docker compose config"
