changes:
  - action: modify_code
    description: >
      In auth_service.py, add temp_password_store: TempPasswordStore | None = None
      parameter to AuthService.__init__(). Store it as self.temp_password_store.
      Add import: from mkobi.core.temp_password_store import TempPasswordStore (TYPE_CHECKING only).

    code_hint: |
      # In __init__ signature, add after config parameter:
      temp_password_store: TempPasswordStore | None = None,

      # In __init__ body, add:
      self.temp_password_store = temp_password_store

  - action: modify_code
    description: >
      In reset_password_admin(), after generating temp_password and before the return dict:
      - Import uuid4 at module top
      - Generate retrieval_token = str(uuid4())
      - If self.temp_password_store is not None, call await self.temp_password_store.store(retrieval_token, temp_password)
      - Change return dict to: {"message": "Password reset successfully", "user_id": str(user_id), "retrieval_token": retrieval_token}
      - Remove "temp_password" key from return dict

    code_hint: |
      # Add import at top of file:
      from uuid import uuid4

      # In reset_password_admin(), after password_hash = hash_password(temp_password):
      retrieval_token = str(uuid4())
      if self.temp_password_store is not None:
          await self.temp_password_store.store(retrieval_token, temp_password)

      # Change return dict from:
      # return {"message": "Password reset successfully", "user_id": str(user_id), "temp_password": temp_password}
      # To:
      return {
          "message": "Password reset successfully",
          "user_id": str(user_id),
          "retrieval_token": retrieval_token,
      }

  - action: modify_code
    description: >
      In service_interfaces.py, update IAuthService.reset_password_admin() docstring
      to reflect that it returns retrieval_token instead of temp_password.
      No signature change needed (return type is dict[str, Any] | None).

acceptance_criteria:
  - reset_password_admin() returns retrieval_token (UUID string) instead of temp_password
  - Password is stored in Redis when temp_password_store is provided
  - No temp_password key in any return path of reset_password_admin()
  - When temp_password_store is None, no Redis call is made (backward compatible)
  - IAuthService interface updated to reflect new behavior
  - All type hints present

