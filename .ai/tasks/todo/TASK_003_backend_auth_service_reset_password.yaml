source_section: TASK_003_backend_auth_service_reset_password

description: >
  Modify AuthService.__init__() to accept optional TempPasswordStore parameter.
  Update reset_password_admin() to generate a UUID retrieval_token, store the
  plaintext password in Redis via TempPasswordStore, and return retrieval_token
  instead of temp_password in the response dict. Update IAuthService interface
  accordingly.

goals:
  - Add temp_password_store optional parameter to AuthService.__init__()
  - Generate retrieval_token (UUID4) in reset_password_admin()
  - Store password in Redis via temp_password_store.store()
  - Return {message, user_id, retrieval_token} — NO temp_password key
  - Update IAuthService interface signature and return type
  - Maintain backward compatibility (temp_password_store=None skips Redis)

files:
  - path: src/mkobi/services/auth_service.py
    targets:
      - type: class
        name: AuthService
      - type: method
