id: TASK_003_backend_auth_service_reset_password

title: Update AuthService.reset_password_admin to return retrieval_token instead of temp_password

status: pending

priority: high

depends_on:
  - TASK_001_backend_temp_password_store
  - TASK_002_backend_settings_di

