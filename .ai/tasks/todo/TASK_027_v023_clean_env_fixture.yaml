id: TASK_027_v023_clean_env_fixture

title: "V-023: Fix clean_env fixture to populate env_backup before yield"

status: pending

priority: medium

depends_on:
  - TASK_026_verify_v020_aggregated_data_test

description: >
  clean_env fixture in tests/test_config.py initializes env_backup = {} but
  never populates it with pre-yield env values. The cleanup loop checks
  if key in env_backup which is always false, so it always pops rather than
  restoring. Test environment variables are deleted instead of restored.

goals:
  - Populate env_backup with pre-yield environment values
  - Fix cleanup loop to properly restore env vars

files:
  - path: tests/test_config.py
    targets:
      - type: fixture
        name: clean_env
    semantic_anchors:
      insert_after:
        type: variable_assignment
        value: "env_backup = {}"
      context: "Populate env_backup with current environment values before yield"

changes:
  - action: modify_code
    description: >
      Before yield, populate env_backup with relevant environment variables:
      env_backup = {key: os.environ[key] for key in os.environ if key.startswith('APP_') or key.startswith('JWT_')}
      This ensures the cleanup loop restores values instead of blindly deleting.
    anchor: "clean_env fixture, env_backup initialization"

acceptance_criteria:
  - env_backup is populated before yield
  - Cleanup loop restores env vars correctly
  - Tests pass with proper env var restoration

tests_to_run:
  - pytest tests/test_config.py -x --tb=short

risk_level: small (test infrastructure fix)

source_findings:
  - V-023
  - T1-Finding5

estimated_effort: small
