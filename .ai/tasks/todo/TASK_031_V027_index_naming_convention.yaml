id: TASK_031_V027_index_naming_convention

title: Rename idx_dashboard_filters_dashboard_filter to follow naming convention

status: pending

priority: low

depends_on: []

description: >
  Index name idx_dashboard_filters_dashboard_filter does not follow the naming
  convention of other indexes. This task renames it to follow the established pattern.

finding_ref: V-027
severity: LOW

goals:
  - Rename index to follow naming convention
  - Make index management consistent

files:
  - path: alembic/versions/<new_migration>/
    targets:
      - type: migration_operation
        name: rename_index
    semantic_anchors:
      operation: op.execute("ALTER INDEX idx_dashboard_filters_dashboard_filter RENAME TO idx_dashboard_filters_dashboard_id")

changes:
  - action: create_migration
    description: >
      Create a migration to rename the index to follow convention.
    code_hint: |
      def upgrade():
          op.execute(
              "ALTER INDEX IF EXISTS idx_dashboard_filters_dashboard_filter "
              "RENAME TO idx_dashboard_filters_dashboard_id"
          )

      def downgrade():
          op.execute(
              "ALTER INDEX IF EXISTS idx_dashboard_filters_dashboard_id "
              "RENAME TO idx_dashboard_filters_dashboard_filter"
          )

acceptance_criteria:
  - Index renamed to follow convention
  - Migration passes upgrade/downgrade
  - No functional impact

tests_to_run:
  - pytest tests/ -k "filter or dashboard" -v

risk_level: low

rollout_notes: >
  Low risk. Index rename is non-breaking. Can be deferred if desired.
