id: TASK_GATE_02_wave2_complete

title: GATE — Verify Docker Stack After PLAN_03 Wave 2 (Frontend Dev Server)

status: pending

priority: critical

depends_on:
  - TASK_003_03_03_add_frontend_dev_service
  - TASK_004_03_04_add_vite_proxy
  - TASK_005_03_05_remove_frontend_dist_mount

phase: PLAN_03
wave: 2
type: gate

description: >
  Verification gate after completing PLAN_03 Wave 2 (Frontend Dev Server).
  Wave 2 added the frontend Vite dev service, configured API proxy, and removed
  the frontend/dist mount. This gate ensures the full stack (backend + frontend +
  db) works together end-to-end before proceeding to Wave 3 documentation.

  This is a READ-ONLY verification task — no source code changes.

goals:
  - Confirm all 4 containers (db, migrate, app, frontend) are healthy
  - Verify Vite dev server serves content
  - Verify API proxy forwards requests to backend
  - Verify frontend hot reload works
  - Verify backend still works independently

files: []

acceptance_criteria:
  - All 4 containers running and healthy
  - Vite dev server responds on port 5173
  - API proxy works (frontend can reach backend via /api)
  - Frontend hot reload functional
  - Backend API still functional
  - No container restart loops

docker_health_checks:
  # === Container Status ===
  - name: All containers running
    command: "docker compose ps --format '{{.Name}} {{.Status}}'"
    expected: "db: running (healthy), migrate: exited (0), app: running, frontend: running"
  - name: No restarting containers
    command: "docker compose ps --format '{{.Name}} {{.Status}}' | grep -c 'restarting\\|unhealthy'"
    expected: "Count is 0"

  # === Database Layer ===
  - name: DB container healthy
    command: "docker compose exec db pg_isready -U postgres"
    expected: "Returns 'accepting connections'"
  - name: App can connect to DB
    command: "docker compose exec app python -c \"import socket; s = socket.create_connection(('db', 5432), timeout=5); print('OK'); s.close()\""
    expected: "Prints 'OK'"

  # === Backend Layer ===
  - name: App health endpoint
    command: "curl -sf http://localhost:8000/health"
    expected: "HTTP 200"
  - name: App logs clean
    command: "docker compose logs app --tail 50"
    expected: "No ERROR or CRITICAL lines"

  # === Frontend Layer ===
  - name: Frontend dev server responds
    command: "curl -sf http://localhost:5173"
    expected: "HTTP 200 with HTML content (Vite dev server)"
  - name: Frontend logs show Vite running
    command: "docker compose logs frontend --tail 30"
    expected: "Contains 'Vite' and 'Local:' with dev server URL"
  - name: Frontend node_modules persisted
    command: "docker compose exec frontend ls node_modules/ | wc -l"
    expected: "node_modules contains packages (count > 0)"

  # === Integration: API Proxy ===
  - name: API proxy forwards to backend
    command: "curl -sf http://localhost:5173/api/v1/health 2>/dev/null || curl -sf http://localhost:8000/health"
    expected: "HTTP 200 — API reachable either through proxy or directly"
  - name: No CORS errors (check response headers)
    command: "curl -sI http://localhost:5173/api/v1/health 2>/dev/null | head -20"
    expected: "Response headers present, no connection refused"

  # === Hot Reload (Both) ===
  - name: Backend hot reload still works
    command: "touch src/mkobi/main.py && sleep 5 && docker compose logs app --tail 20"
    expected: "Logs show reload activity"
  - name: Frontend hot reload works
    command: "touch frontend/src/App.tsx && sleep 5 && docker compose logs frontend --tail 20"
    expected: "Logs show Vite HMR update (e.g., 'hot updated', 'hmr')"

  # === Resource Stability ===
  - name: No memory/CPU issues
    command: "docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' app frontend db"
    expected: "CPU reasonable, no OOM"

tests_to_run:
  - "docker compose down -v && docker compose up -d"
  - "docker compose ps  # all 4 services running"
  - "curl -sf http://localhost:8000/health  # backend"
  - "curl -sf http://localhost:5173  # frontend"
  - "curl -sf http://localhost:5173/api/v1/health  # proxy"
  - "touch frontend/src/App.tsx && sleep 5 && docker compose logs frontend --tail 20  # HMR"

risk_level: low

rollout_notes: >
  READ-ONLY gate task. No code changes. If any check fails, fix the underlying
  Wave 2 task before proceeding to Wave 3. This gate must pass before starting
  TASK_006_03_06 (Wave 3 docs).
