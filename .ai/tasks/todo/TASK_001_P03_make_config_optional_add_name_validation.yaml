id: TASK_001_P03_make_config_optional_add_name_validation

title: Make config optional + add name validation in DashboardCreate model

status: pending

priority: high

depends_on: []

description: >
  Update the DashboardCreate Pydantic model to make config optional with a default
  value of DashboardConfig(graph_types=["bar"]). Add field_validator for name:
  3-100 chars, alphanumeric + spaces + hyphens only. This eliminates the 422 error
  when frontend sends only {name, description}.

phase: PLAN_03 — Admin Dashboard Creation
wave: 1

finding_ref: BUG-06, BUG-07
severity: medium

goals:
  - Make config optional with default DashboardConfig(graph_types=["bar"])
  - Add name field_validator: 3-100 chars, alphanumeric+spaces+hyphens regex
  - Add description field pass-through to model

files:
  - path: src/mkobi/models/dashboard.py
    targets:
      - type: class
        name: DashboardCreate
    semantic_anchors:
      update:
        type: class_definition
        value: "DashboardCreate class — make config optional, add name validator, add description field"
      insert_after:
        type: import
        value: "Add field_validator import, add import re"

changes:
  - action: update_model
    description: >
      Replace DashboardCreate class with config optional, name validator, description field.
    code_hint: |
      class DashboardCreate(BaseModel):
          """Model for creating new dashboard."""
          name: str
          description: str | None = None
          config: DashboardConfig = DashboardConfig(graph_types=["bar"])
          layout_id: UUID | None = None

          @field_validator('name')
          @classmethod
          def validate_name(cls, v: str) -> str:
              if len(v) < 3:
                  raise ValueError('Name must be at least 3 characters')
              if len(v) > 100:
                  raise ValueError('Name must be at most 100 characters')
              if not re.match(r'^[a-zA-Z0-9\s-]+$', v):
                  raise ValueError('Name can only contain letters, numbers, spaces, and hyphens')
              return v

acceptance_criteria:
  - DashboardCreate can be instantiated with only name (config defaults to DashboardConfig(graph_types=["bar"]))
  - DashboardCreate(name="ab") raises ValueError — too short
  - DashboardCreate(name="a" * 101) raises ValueError — too long
  - DashboardCreate(name="test@dashboard") raises ValueError — invalid chars
  - DashboardCreate(name="test-dashboard 123") succeeds — valid chars
  - DashboardUpdate class is unchanged

tests_to_run:
  - cd src/mkobi && python -c "from models.dashboard import DashboardCreate; d = DashboardCreate(name='test'); print(d.config)"
  - ruff check src/mkobi/models/dashboard.py

risk_level: low

rollout_notes: >
  Model-only change. No database migration needed since config has a default.
  Must complete before TASK_003_P03 (endpoint update).
