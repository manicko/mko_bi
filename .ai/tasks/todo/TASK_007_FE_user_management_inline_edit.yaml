id: TASK_007_FE_user_management_inline_edit

title: Upgrade UserManagement with inline editing and ConfirmDialog

status: pending

priority: high

depends_on:
  - TASK_005_FE_confirm_dialog
  - TASK_003_FE_short_uuid

description: >
  Upgrade UserManagement.tsx with DataGrid inline editing (role column as singleSelect dropdown),
  per-row parallel save with revert-on-error, row highlight during save, ConfirmDialog for delete,
  and toast notifications instead of Snackbar.

goals:
  - Role column uses editable: true, type: 'singleSelect', valueOptions: ['admin', 'editor', 'viewer']
  - processRowUpdate handles save with revert on error
  - Row highlight (yellow background) during save via getRowClassName
  - Parallel saves: each row saves independently
  - ConfirmDialog replaces window.confirm for delete
  - Toast notifications via react-hot-toast instead of Snackbar
  - Default page size: 25

files:
  - path: frontend/src/features/admin/ui/UserManagement.tsx
    targets:
      - type: component
        name: UserManagement
    semantic_anchors:
      update_zone:
        type: data_grid_configuration
        value: UserManagement DataGrid columns and editing configuration

changes:
  - action: update_code
    description: Update role column with editable: true, type: 'singleSelect', valueOptions
  - action: add_code
    description: Add savingRows state and processRowUpdate with row highlight logic
  - action: add_code
    description: Add getRowClassName for row-saving highlight CSS
  - action: remove_code
    description: Remove old Dialog-based role editing code (roleDialogOpen, selectedUser, newRole state and handler)
  - action: update_code
    description: Replace window.confirm with ConfirmDialog for delete action
  - action: update_code
    description: Replace Snackbar/Alert with toast.success/toast.error from react-hot-toast
  - action: update_code
    description: Update pagination defaults to pageSize: 25

acceptance_criteria:
  - Inline editing works on role column
  - Row highlight during save
  - Revert on error
  - ConfirmDialog for delete
  - No Snackbar/Alert usage
  - Default page size 25

tests_to_run:
  - cd frontend && npx tsc --noEmit

risk_level: medium

wave: 2

plan_source: PLAN_01_user_management_inline_edit.md
