  - Graphs with invalid dimensions are skipped, not displayed with wrong data
  - Warning includes graph_id and expected vs actual dimensions

files:
  - path: src/mkobi/workers/data_worker.py
    targets:
      - type: function
        name: process_csv_background_sync
    semantic_anchors:
      insert_after:
        type: conditional
        value: column count check
    changes:
      - action: modify_code
        description: Replace the silent fallback to first 3 columns with a logger.warning() call that includes graph_id and dimension details. Skip the graph processing instead of using fallback columns.

acceptance_criteria:
  - Invalid graph dimensions log a warning with context
  - Graphs with invalid dimensions are not processed
  - Valid graphs still process correctly
  - Tests pass

