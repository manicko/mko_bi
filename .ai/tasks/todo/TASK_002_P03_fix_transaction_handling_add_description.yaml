id: TASK_002_P03_fix_transaction_handling_add_description

title: Fix transaction handling + add description param in DashboardService.create_dashboard

status: pending

priority: high

depends_on: []

description: >
  (1) Add description parameter to create_dashboard method signature.
  (2) Pass description to dashboard_repo.create(). (3) Remove db.commit() from
  create_dashboard when db is provided externally — the endpoint handles commit.
  (4) Ensure the recursive db=None branch commits before returning.

phase: PLAN_03 — Admin Dashboard Creation
wave: 1

finding_ref: BUG-08, BUG-09
severity: medium

goals:
  - Add description parameter to create_dashboard method
  - Pass description to repository create call
  - Remove db.commit() when db is provided externally
  - Keep commit in recursive db=None branch

files:
  - path: src/mkobi/services/dashboard_service.py
    targets:
      - type: method
        name: create_dashboard
    semantic_anchors:
      update:
        type: method_signature
        value: "Add description: str | None = None parameter"
      update:
        type: function_call
        value: "Pass description to dashboard_repo.create()"
      remove:
        type: function_call
        value: "await db.commit() and its log line when db is provided"
      update:
        type: function_call
        value: "Recursive branch: pass description and commit before returning"

changes:
  - action: update_signature
    description: >
      Add description parameter to create_dashboard method.
    code_hint: |
      async def create_dashboard(
          self,
          name: str,
          config: dict[str, Any],
          owner_id: UUID,
          description: str | None = None,
          db: AsyncSession | None = None,
      ) -> DashboardRead:

  - action: update_recursive_call
    description: >
      Pass description in recursive call and commit before returning.
    code_hint: |
      if db is None:
          async with get_session() as db:
              result = await self.create_dashboard(name, config, owner_id, description, db)
              await db.commit()
              return result

  - action: update_repo_call
    description: >
      Pass description to dashboard_repo.create().
    code_hint: |
      dashboard_obj = await self.dashboard_repo.create(
          db=db, name=name, config=config_obj.model_dump(),
          created_by=owner_id, description=description,
      )

  - action: remove_commit
    description: >
      Remove await db.commit() and its log line from the main path (when db is provided).

acceptance_criteria:
  - create_dashboard() accepts optional description parameter
  - description is passed to dashboard_repo.create()
  - No db.commit() call in create_dashboard() when db is provided
  - Recursive db=None branch commits before returning
  - update_dashboard, delete_dashboard, grant_access, revoke_access methods unchanged

tests_to_run:
  - ruff check src/mkobi/services/dashboard_service.py

risk_level: medium

rollout_notes: >
  Must complete before TASK_003_P03 (endpoint update).
  The transaction fix is critical — without it, the endpoint throws
  "A transaction is already begun on this Session" error.
