description: >
  Comprehensive end-to-end verification of the entire error handling standardization.
  Runs all checks and confirms correctness. If any checks fail, identifies specific
  tasks that need rework.

verification_steps:
  - build: |
      # Verify zero HTTPException raise sites
      Get-ChildItem src/mkobi/api/routes/*.py src/mkobi/api/deps.py |
        Select-String -Pattern "raise HTTPException" | Measure-Object
      # Backend lint
      uv run ruff check src/
      # Backend type check
      uv run mypy src/
      # Frontend build
      cd frontend; npm run build
      # Frontend lint
      npm run lint

  - test: |
      uv run pytest tests/ -v
      cd frontend; npm run test

  - smoke_check: |
      # Verify OpenAPI spec includes ErrorCode enum and RFC 7807 error schemas
      # Verify documentation files exist: AGENTS.md error section, error-format.md, error-handling-guide.md
      # Verify frontend error handling files: ApiError interface, extractApiError(), error message maps, axios interceptor

pass_criteria:
  - Zero HTTPException raise sites in any route/deps file
  - Backend ruff check passes
  - Backend mypy check passes
  - Frontend build succeeds (TypeScript compilation)
  - Frontend lint passes
  - Backend tests pass (or failures are documented as known issues)
  - Frontend tests pass (or failures are documented as known issues)
  - ErrorCode enum appears in OpenAPI spec
  - All documentation files created and valid
  - All frontend error handling files created

failure_action: >
  Return the specific implementation task(s) that caused the failure to rework.
  If backend lint/type check fails → return the task that modified the failing file.
  If frontend build/lint fails → return TASK_012, TASK_013, or TASK_014.
  If tests fail due to old response format → update tests or document as known issue.
  If HTTPException sites remain → return the corresponding migration task.

rollback_task: >
  Each individual task should be independently revertible by reverting the
  specific file changes. No single rollback task — revert the failing task's changes.

