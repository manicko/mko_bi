id: TASK_024_dc004_weak_passwords_startup_warning

title: Fix DC-004 — Add startup warning for weak/default credentials in non-production

status: pending

priority: medium

depends_on:
  - TASK_016_sec03_env_weak_passwords_guard

description: >
  Fix the MEDIUM issue where weak passwords in development don't trigger warnings at
  startup. Add a `_log_security_warnings()` method to Settings.__init__ that checks
  database password, admin password/username, and JWT secret against WEAK_PASSWORDS.

source_file: .ai/audit/99-validation/08-deployment-config-validated.md
source_section: DC-004: Weak Passwords Without Warning — Startup Warning Implementation

files:
  - path: src/mkobi/config.py
    targets:
      - type: class
        name: Settings
      - type: method
        name: __init__
    semantic_anchors:
      insert_after:
        type: method_call
        value: _ensure_upload_dir

changes:
  - action: add_code
    description: >
      Add a `_log_security_warnings()` method to Settings class that checks all credentials
      against WEAK_PASSWORDS in non-production environments. Call it from __init__ after
      `_ensure_upload_dir()`.
    code_hint: |
      def _log_security_warnings(self) -> None:
          """Log security warnings for weak/default credentials in non-production."""
          if self.environment == EnvironmentEnum.PRODUCTION:
              return
          # Check database password, admin password, admin username, JWT secret
          # against WEAK_PASSWORDS and WEAK_USERNAMES
          # Log warnings for each weak value found

      # In __init__:
      def __init__(self, **data: Any) -> None:
          super().__init__(**data)
          self._log_initialization()
          self._ensure_upload_dir()
          self._log_security_warnings()

acceptance_criteria:
  - _log_security_warnings method exists and checks all credential types
  - Called from __init__ after _ensure_upload_dir
  - Only logs warnings (does not block startup)
  - Only runs in non-production environments

risk_notes: >
  Low risk — adds warning logging only. WEAK_PASSWORDS and WEAK_USERNAMES sets already exist.
  Must import WEAK_USERNAMES if it exists, or use a hardcoded list.

tests_to_run:
  - command: pytest tests/test_config.py -v -k "security or warning" --no-cov
    reason: Verify security warning tests
