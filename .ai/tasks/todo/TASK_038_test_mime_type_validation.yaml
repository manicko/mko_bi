        code_hint: |
          import io
          import pytest
          from httpx import AsyncClient


          class TestMimeTypeValidation:
            """Test server-side MIME type detection."""

            async def test_genuine_csv_passes(self, client: AsyncClient, auth_headers):
                """A real CSV file with correct MIME should be accepted."""
                csv_content = b"name,value\nfoo,1\nbar,2\n"
                files = {"file": ("test.csv", io.BytesIO(csv_content), "text/csv")}
                response = await client.post(
                    "/api/v1/upload/some-dashboard-id",
                    headers=auth_headers, files=files
                )
                assert response.status_code in (200, 201)

            async def test_spoofed_content_type_rejected(self, client: AsyncClient, auth_headers):
                """Executable content disguised as CSV should be rejected."""
                exe_content = b"\x7fELF...binary content..."
                files = {"file": ("malicious.csv", io.BytesIO(exe_content), "text/csv")}
                response = await client.post(
                    "/api/v1/upload/some-dashboard-id",
                    headers=auth_headers, files=files
                )
                assert response.status_code == 400
                assert "MIME" in response.json()["detail"] or "type" in response.json()["detail"].lower()

            async def test_genuine_excel_passes(self, client: AsyncClient, auth_headers):
                """A real Excel file should pass validation."""
                # Minimal valid XLSX header bytes
                xlsx_content = b"\x50\x4B\x03\x04" + b"\x00" * 100
                files = {"file": ("report.xlsx", io.BytesIO(xlsx_content), "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet")}
                response = await client.post(
                    "/api/v1/upload/some-dashboard-id",
                    headers=auth_headers, files=files
                )
                assert response.status_code in (200, 201)

