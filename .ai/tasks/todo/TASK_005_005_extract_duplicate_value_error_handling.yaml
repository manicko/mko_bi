id: task_005
title: Extract duplicate ValueError handling into shared helper function in upload endpoint with proper logging and stable anchoring
status: pending
priority: medium
depends_on: []
description: >
  Extract the identical ValueError -> HTTPException mapping logic from both inner and outer except blocks into a shared helper function to eliminate code duplication.
  Update both except blocks to use the helper function.
  Add logger.warning inside the helper function to preserve original logging behavior.
  Use stable symbol-level anchoring instead of whitespace-sensitive insert_before.
goals:
  - Eliminate code duplication in error handling
  - Improve maintainability by having single source of truth for error mapping
  - Reduce risk of inconsistency between inner and outer error handling
  - Preserve original logging behavior in helper function
  - Use stable semantic anchors for reliable code modification
files:
  - path: src/mkobi/api/routes/upload.py
    targets:
      - type: function
        name: upload_file_endpoint
    semantic_anchors:
      - type: function
        name: upload_file_endpoint
    changes:
      - action: add_code
        insert_after: |
                     extra={
                         "file_name": file.filename,
                         "dashboard_id": str(dashboard_id),
                         "user_id": str(current_user.id),
                     },
        new_text: |

        def _handle_value_error(e: ValueError) -> None:
            """Handle ValueError by mapping to appropriate HTTPException with logging."""
            logger.warning("Validation error during upload: %s", e)
            error_msg = str(e).lower()
            if "mime" in error_msg or "invalid mime" in error_msg:
                raise HTTPException(
                    status_code=status.HTTP_415_UNSUPPORTED_MEDIA_TYPE,
                    detail=str(e),
                ) from e
            elif (
                "format" in error_msg
                or "invalid format" in error_msg
                or "extension" in error_msg
            ):
                raise HTTPException(
                    status_code=status.HTTP_415_UNSUPPORTED_MEDIA_TYPE,
                    detail=str(e),
                ) from e
            elif "size" in error_msg or "exceeds" in error_msg or "max" in error_msg:
                raise HTTPException(
                    status_code=status.HTTP_413_CONTENT_TOO_LARGE,
                    detail=str(e),
                ) from e
            elif "limit" in error_msg or "rate limit" in error_msg:
                raise HTTPException(
                    status_code=status.HTTP_429_TOO_MANY_REQUESTS,
                    detail=str(e),
                ) from e
            else:
                raise HTTPException(
                    status_code=status.HTTP_422_UNPROCESSABLE_CONTENT,
                    detail=str(e),
                ) from e
