id: TASK_013_V018_migration_job_compose

title: Add migration job/service to Docker Compose for production deployments

status: pending

priority: medium

depends_on:
  - TASK_012_V004_migration_advisory_lock

description: >
  Production docker-compose.yml sets AUTO_MIGRATE: "false" but provides no
  alternative migration mechanism. If someone deploys without running migrations,
  the app will fail to start. This task adds a migration service/job that runs
  before the app starts.

finding_ref: V-018
severity: MEDIUM

goals:
  - Add a migration service to docker-compose.yml that runs before the app
  - Ensure migrations are applied before app startup
  - Use init container or depends_on pattern

files:
  - path: docker-compose.yml
    targets:
      - type: service_definition
        name: app service
    semantic_anchors:
      insert_after: app service definition
      add: migration service with depends_on

changes:
  - action: add_service
    description: >
      Add a migration service to docker-compose.yml that runs alembic upgrade head
      before the app service starts.
    code_hint: |
      services:
        migrate:
          build: .
          command: ["alembic", "upgrade", "head"]
          environment:
            - DATABASE_URL=${DATABASE_URL}
          depends_on:
            db:
              condition: service_healthy
        app:
          build: .
          depends_on:
            migrate:
              condition: service_completed_successfully

acceptance_criteria:
  - Migration service defined in docker-compose.yml
  - App service depends on migration service completion
  - Migrations run before app starts in production
  - AUTO_MIGRATE can remain "false" in app config

tests_to_run:
  - docker-compose config (validate compose file syntax)

risk_level: medium

rollout_notes: >
  Deployment infrastructure change. Must be coordinated with CI/CD pipeline.
  Depends on TASK_012 for the advisory lock mechanism.
