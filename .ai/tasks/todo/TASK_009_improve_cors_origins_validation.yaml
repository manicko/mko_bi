id: TASK_009_improve_cors_origins_validation

title: MEDIUM — Improve CORS origins validation to reject placeholder values in production

status: pending

priority: medium

depends_on:
  - TASK_008_add_graceful_shutdown_for_session_engine

source_file: .ai/audit/validated/final-report.md
source_finding: DC-006

description: >
  The CORS origins configuration uses a placeholder value (e.g., "*" or an example URL)
  that passes runtime validation but doesn't match real production domains. This could
  lead to misconfigured CORS in production. Add validation that rejects obvious placeholder
  values when the environment is production.

goals:
  - Add Settings validator for cors_origins that rejects placeholder patterns in production
  - Reject "http://localhost:3000", "*", "https://example.com" in prod environment
  - Keep permissive behavior in development without breaking local workflows

files:
  - path: src/mkobi/config.py
    targets:
      - type: class
        name: Settings
    semantic_anchors:
      insert_after:
        type: method
        name: validate_cors_origins
    changes:
      - action: modify_code
        description: >
          Enhance validate_cors_origins to check environment and reject known
          placeholder patterns when environment is production.
        code_hint: |
          @field_validator("cors_origins")
          @classmethod
          def validate_cors_origins(cls, v):
              settings = get_config()
              if settings.app.environment == EnvironmentEnum.PRODUCTION:
                  PLACEHOLDERS = {"*", "http://localhost:3000", "https://example.com"}
                  if any(origin in PLACEHOLDERS for origin in v):
                      raise ValueError(
                          f"Placeholder CORS origins not allowed in production: {v}"
                      )
              return v

acceptance_criteria:
  - Settings initialization fails in production with placeholder CORS origins
  - Development startup is unaffected
  - Error message clearly identifies which origin is a placeholder
  - Existing .env.production values are updated or documented

tests_to_run:
  - pytest tests/ -k "config or cors" -v --no-header
  - python -c "from mkobi.config import Settings; Settings()"

risk: medium
risk_notes: >
  Medium risk — validation change could break production deployment if
  .env.production actually contains placeholder values. Must coordinate with
  deployment team to ensure real origins are configured before this ships.

type: implementation
category: deployment-config
severity: medium
