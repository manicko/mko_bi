id: TASK_014_D16_remove_redundant_mounts

title: Remove Redundant Alembic Volume Mounts from App Service

status: pending

priority: low

depends_on: []

phase: DOCKER_HARDENING
wave: 2

description: >
  docker-compose.yml mounts ./alembic and ./alembic.ini as read-only volumes, but
  these are already copied into the image at build time (Dockerfile lines for dev
  and prod stages). Remove the redundant volume mounts.

finding_ref: DOCKER-016
severity: low

goals:
  - Remove redundant ./alembic volume mount from app service
  - Remove redundant ./alembic.ini volume mount from app service
  - Document runtime migration command using docker compose exec

files:
  - path: docker-compose.yml
    targets:
      - type: service
        name: app
      - type: volume_mount
        value: "./alembic"
      - type: volume_mount
        value: "./alembic.ini"
    semantic_anchors:
      insert_after:
        type: block
        value: "app:"
    changes:
      - action: remove_volume_mount
        description: Remove - ./alembic:/app/alembic:ro from app service volumes
      - action: remove_volume_mount
        description: Remove - ./alembic.ini:/app/alembic.ini:ro from app service volumes

acceptance_criteria:
  - App service does not mount alembic volumes
  - Alembic files are still available in the image (copied at build time)
  - Migrations can be run via: docker compose exec app uv run alembic upgrade head

tests_to_run:
  - "docker compose up -d"
  - "docker compose exec app uv run alembic current  # verify alembic works from image"

risk_level: low

rollout_notes: >
  Standalone fix. If runtime migration support is needed, document the use of
  `docker compose exec app uv run alembic upgrade head` instead.
