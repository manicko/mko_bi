id: TASK_026_V002
title: Replace hardcoded temp password with random password generation for approved registration users
status: pending
priority: high
depends_on: []

description: >
  The admin approval endpoint creates users with a predictable hardcoded password "temppass123".
  No email notification is sent. This is a security risk.

goals:
  - Generate a random secure password for approved registration users
  - Send the password via email to the user
  - Force password change on first login (optional, if time permits)

files:
  - path: src/mkobi/api/routes/admin.py
    targets:
      - type: function
        name: approve_registration_request_admin_endpoint
    semantic_anchors:
      - type: function_call
        description: "create_user call with password='temppass123'"
    changes:
      - action: replace_password
        description: "Generate random password using secrets.token_urlsafe(16) or similar"
        code_hint: "import secrets; temp_password = secrets.token_urlsafe(16)"
      - action: add_email_notification
        description: "Send email with the temporary password to the user"
        code_hint: "Call email_service.send_welcome_email(email, temp_password)"

acceptance_criteria:
  - Approved users get a random, unpredictable password
  - Password is sent to the user via email
  - User can log in with the provided password
  - Existing tests pass

tests_to_run:
  - uv run pytest tests/ -x -v

risk_level: high
notes: >
  CRITICAL: Do NOT deploy a fix that generates random passwords without also implementing
  email notification. This would lock users out of their accounts. Requires email
  service (SMTP) to be configured and operational.
