id: TASK_001_be001_rate_limiter_fix

title: "BE-001: Replace sync RateLimiter with async-compatible alternative in DataService"

status: pending

priority: critical

depends_on: []

type: implementation

description: >
  The `DataService.__init__` initializes a synchronous `RateLimiter` (from the `ratelimit` library)
  backed by a synchronous Redis client, but `DataService` is used in an async context (FastAPI async
  route handlers). Calling the sync `RateLimiter` from async code blocks the event loop.
  The rate limiter is also never actually called anywhere in the service — it is dead code.

  Fix: Remove the unused sync `RateLimiter` and sync Redis client from `DataService.__init__`.
  If rate limiting is needed in the future, implement it as a FastAPI middleware or dependency
  using an async Redis client (`redis.asyncio`) with a token-bucket algorithm implemented via
  Lua scripts.

