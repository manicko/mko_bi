id: task_004
title: Fix hardcoded dimension count in data worker to use graph.dimensions with validation
status: pending
priority: medium
depends_on: []
description: >
  Replace the hardcoded df.columns[:3] with validated graph.dimensions to correctly partition dimensions and metrics based on graph configuration.
  Add validation to ensure graph.dimensions is non-empty and contains valid column names from the DataFrame.
  Specify fallback behavior when dimensions are empty or invalid.
goals:
  - Use graph.dimensions to determine dimension columns instead of assuming first 3 columns
  - Add validation for graph.dimensions to prevent data corruption
  - Fix incorrect dimension/metric partitioning for dashboards with non-standard column layouts
  - Prevent data corruption in aggregated results
  - Add logging for debugging dimension partitioning issues
files:
  - path: src/mkobi/workers/data_worker.py
    targets:
      - type: function
        name: _store_aggregates
    semantic_anchors:
      - type: function
        name: _store_aggregates
    changes:
      - action: replace
        old_text: |
             aggregates = []
             for row in rows:
                 for graph in graphs:
                     dims = {k: v for k, v in row.items() if k in df.columns[:3]}
                     metrics = {k: v for k, v in row.items() if k not in dims}
                     aggregates.append({
                         "graph_id": str(graph.id),
                         "dims": dims,
                         "metrics": metrics,
                     })
        new_text: |
             aggregates = []
             for row in rows:
                 for graph in graphs:
                     # Validate graph.dimensions is non-empty and contains valid column names
                     valid_dimensions = [dim for dim in graph.dimensions if dim in df.columns] if graph.dimensions else []
                     if not valid_dimensions:
                         logger.warning(
                             "Graph %s has invalid or empty dimensions: %s. DataFrame columns: %s. Falling back to first 3 columns.",
                             graph.id, graph.dimensions, list(df.columns)
                         )
                         # Fallback to original behavior if dimensions are invalid
                         dims = {k: v for k, v in row.items() if k in df.columns[:3]}
                     else:
                         dims = {k: v for k, v in row.items() if k in valid_dimensions}
                     metrics = {k: v for k, v in row.items() if k not in dims}
                     aggregates.append({
                         "graph_id": str(graph.id),
                         "dims": dims,
                         "metrics": metrics,
                     })
acceptance_criteria:
  - The dimension partitioning uses validated graph.dimensions instead of the first 3 columns when valid
  - Metrics are correctly derived as the remaining columns
  - Aggregated data is stored with correct dimension/metric mapping
  - Invalid or empty graph.dimensions fall back to first 3 columns with warning logged
  - Tests pass
tests_to_run:
  - tests/test_data_worker.py
risk_level: low