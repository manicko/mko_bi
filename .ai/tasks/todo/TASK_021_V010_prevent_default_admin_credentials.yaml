id: TASK_021_V010
title: Prevent default admin credentials in production
status: pending
priority: medium
depends_on: []
wave: 2

description: >
  Default admin_username is "admin" and admin_password is "admin". If env vars
  are not set, a default admin account with well-known credentials is created.
  Add production validation that fails startup if default credentials are used.

goals:
  - Production startup fails if ADMIN_USERNAME/ADMIN_PASSWORD env vars are not set
  - Development mode shows warning but continues
  - Clear error message indicating which env vars must be set
  - No impact on existing development workflows

files:
  - path: src/mkobi/config.py
    targets:
      - type: class
        name: Settings
    semantic_anchors:
      insert_after:
        type: validator
        value: validate_admin_credentials
    changes:
      - action: modify_code
        description: Enhance validate_admin_credentials to check if environment is production. In production, raise ValueError if admin_username is "admin" or admin_password is "admin". In development, log a warning. Add clear error message about setting ADMIN_USERNAME and ADMIN_PASSWORD env vars.

acceptance_criteria:
  - Production startup fails with clear error if default credentials used
  - Development mode shows warning but continues
  - Error message specifies which env vars to set
  - Tests pass

tests_to_run:
  - tests/

risk_level: medium
risk_notes: CRITICAL: Do not deploy without ensuring all production deployment configurations have explicit credentials set. Could cause production outages.

validated_finding: V-010
severity: MEDIUM
