id: TASK_015_v008_raw_sql_fstrings

title: "V-008: Replace f-string raw SQL in starter.py with SQLAlchemy DDL constructs"

status: pending

priority: low

depends_on:
  - TASK_014_verify_v009_remove_sidebar_dead_code

description: >
  src/mkobi/db/starter.py interpolates database names via f-strings in raw SQL
  (e.g., f"DROP DATABASE {db_name}"). Mitigated by regex validation
  (^[a-zA-Z0-9_]+$), but f-string SQL is an anti-pattern. Use SQLAlchemy DDL
  constructs instead. Keep regex validation as defense-in-depth.

goals:
  - Replace f-string SQL with SQLAlchemy DDL constructs
  - Keep regex validation as defense-in-depth
  - Preserve existing behavior for database creation/drop

files:
  - path: src/mkobi/db/starter.py
    targets:
      - type: class
        name: DatabaseStarter
      - type: method
        name: recreate_test_database
    semantic_anchors:
      insert_after:
        type: method_definition
        value: "recreate_test_database"
      context: "Replace raw SQL string execution with DDL constructs"

changes:
  - action: modify_code
    description: >
      Replace text(f"...") SQLAlchemy raw SQL calls with proper DDL constructs
      (e.g., sqlalchemy.schema.DropTable, CreateSchema, etc.) or use SQLAlchemy's
      text() with explicit parameter binding via sqlalchemy.bindparam().
      Keep the existing regex validation as defense-in-depth.
    anchor: "DatabaseStarter methods that use f-strings for SQL"

acceptance_criteria:
  - No f-string SQL remains in starter.py
  - regex validation still present as defense-in-depth
  - Database creation/drop behavior unchanged
  - ruff + mypy pass

tests_to_run:
  - ruff check src/mkobi/db/starter.py
  - mypy src/mkobi/db/starter.py

risk_level: low (defense-in-depth improvement, behavior unchanged)

source_findings:
  - V-008
  - R1-F003

estimated_effort: small
