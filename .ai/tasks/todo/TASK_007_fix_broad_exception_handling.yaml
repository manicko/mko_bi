id: TASK_007_fix_broad_exception_handling
title: Replace broad Exception catch with specific exception types in dashboard service

status: pending
priority: medium

depends_on: []

description: >
  _dashboard_to_read() catches broad Exception instead of specific exception types,
  masking unexpected errors and making debugging difficult.

goals:
  - Replace except Exception with specific types: NoResultFound, PermissionError, ValueError
  - Add logging for unexpected exceptions as catch-all safety net
  - Improve error diagnostics in production

files:
  - path: src/mkobi/services/dashboard_service.py
    targets:
      - type: method
        name: _dashboard_to_read
    semantic_anchors:
      replace_except:
        type: except_clause
        value: Exception

changes:
  - action: replace_exception_types
    description: Replace broad Exception with NoResultFound, PermissionError, ValueError

  - action: add_logging
    description: Add logging for unexpected exceptions

acceptance_criteria:
  - Specific exception types are caught
  - Unexpected errors are logged
  - Stack traces preserved for debugging

tests_to_run:
  - pytest tests/test_dashboards_api.py -v

risk_level: medium