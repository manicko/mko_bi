id: TASK_004_P02_add_profile_to_user_menu

title: Add Profile to user menu, remove from NAV_ITEMS, fix active highlight color

status: pending

priority: high

depends_on: []

description: >
  (1) Remove "Profile" from top-level NAV_ITEMS in Header. (2) Add Profile (Settings icon)
  + Divider + Logout to the user dropdown menu. (3) Change active nav button highlight
  color from secondary (red) to success (green).

phase: PLAN_02 — Frontend Bug Fixes
wave: 2

finding_ref: BUG-04, BUG-05
severity: low

goals:
  - Remove Profile from NAV_ITEMS array
  - Add Profile menu item with Settings icon to user dropdown
  - Add Divider between Profile and Logout in dropdown
  - Change active nav color from secondary to success palette

files:
  - path: frontend/src/shared/components/Layout/Header.tsx
    targets:
      - type: component
        name: Header
    semantic_anchors:
      update:
        type: constant
        value: "NAV_ITEMS array — remove Profile entry"
      update:
        type: jsx_props
        value: "Button color prop — secondary to success"
      update:
        type: jsx_props
        value: "borderBottomColor — secondary.main to success.light"
      insert_after:
        type: jsx_element
        value: "Add Profile MenuItem + Divider to Menu"

changes:
  - action: update_nav_items
    description: >
      Remove Profile entry from NAV_ITEMS array.
    code_hint: |
      # Before: [{ label: 'Dashboards', ... }, { label: 'Admin', ... }, { label: 'Profile', path: '/profile' }]
      # After:  [{ label: 'Dashboards', ... }, { label: 'Admin', ... }]

  - action: update_menu
    description: >
      Add Profile + Divider to the user Menu component.
    code_hint: |
      <MenuItem onClick={() => { handleMenuClose(); void navigate('/profile') }}>
        <Settings sx={{ mr: 1, fontSize: 20 }} />
        Profile
      </MenuItem>
      <Divider />

  - action: update_highlight_color
    description: >
      Change active nav button color from secondary to success.
    code_hint: |
      # Before: color={isActive(item.path) ? 'secondary' : 'inherit'}
      # After:  color={isActive(item.path) ? 'success' : 'inherit'}
      # Before: borderBottomColor: 'secondary.main'
      # After:  borderBottomColor: 'success.light'

  - action: add_imports
    description: >
      Add Divider to MUI import, add Settings icon import.

acceptance_criteria:
  - "Profile" is NOT visible as a top-level nav button in the header
  - Clicking the account icon opens dropdown with: Profile (gear icon) → Divider → Logout
  - Clicking Profile navigates to /profile
  - Active nav button text is green (success palette), bottom border is success.light
  - Inactive nav buttons remain inherit (white on dark AppBar)

tests_to_run:
  - cd frontend && npx tsc --noEmit

risk_level: low

rollout_notes: >
  Single-file change. Independent of other tasks.
  No backend changes needed.
