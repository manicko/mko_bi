description: >
  Rate limiting silently defaults to fail-open (requests allowed) when Redis is unavailable.
  The configurable `RATE_LIMITER_FAIL_CLOSED` variable defaults to `False`. For production
  deployments, this should be set to `true`. This task adds production documentation and
  updates `docker-compose.yml` (production profile) to set `RATE_LIMITER_FAIL_CLOSED=true`.

