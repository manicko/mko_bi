id: TASK_018_VF001_fix_token_payload_key

title: Fix token payload key mismatch in refresh endpoint

status: pending

priority: critical

depends_on: []

phase: VALIDATED_FINDINGS_001
wave: 1
group: auth_bug_fixes

description: >
  The refresh endpoint in auth.py creates a new access token using "sub" as the
  user identifier key, but get_current_user_dependency in deps.py reads
  payload.get("user_id"). This causes all access tokens issued by the refresh
  endpoint to fail subsequent authentication with HTTP 401 "Token missing user_id".
  This is a blocking production bug.

goals:
  - Change the token payload key from "sub" to "user_id" in the refresh endpoint
  - Align with the login endpoint's correct implementation in auth_service.py
  - Ensure refreshed access tokens pass authentication on subsequent requests

files:
  - path: src/mkobi/api/routes/auth.py
    targets:
      - type: function
        name: _handle_refresh_token
    semantic_anchors:
      insert_after:
        type: function_call
        value: create_access_token
      replace:
        type: dict_key
        value: "sub"
    changes:
      - action: replace_code
        description: >
          Change the dict key from "sub" to "user_id" in the create_access_token
          call within the refresh endpoint.
        code_hint: |
          access_token = create_access_token(
              data={"user_id": str(user.id), "email": user.email, "role": user.role}
          )

acceptance_criteria:
  - Refresh endpoint creates access tokens with "user_id" key (not "sub")
  - Refreshed access tokens pass get_current_user_dependency validation
  - No change to login endpoint behavior (already correct)
  - Existing tests still pass

tests_to_run:
  - tests/test_auth.py::TestRefreshToken::test_refresh_valid_token
  - tests/test_auth_api.py::TestCookieAuthFlow::test_refresh_reads_from_cookie
  - tests/ -k "refresh" (full refresh-related test suite)

risk_level: low

notes: >
  This is a single-key rename fix. The login endpoint at auth_service.py:198-201
  already uses "user_id" correctly. The fix is a copy-paste correction.
  After fixing, users with active sessions will need to re-login once.
