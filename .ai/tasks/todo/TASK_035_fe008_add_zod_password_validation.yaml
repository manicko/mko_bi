id: TASK_035_fe008_add_zod_password_validation

title: Fix FE-008 — Add Zod password validation to match backend security rules

status: pending

priority: medium

depends_on: []

description: >
  Fix the MEDIUM issue where password validation in ChangePasswordPage has no Zod schema
  enforcement matching backend rules (min length, complexity). Add Zod validation.

source_file: .ai/audit/99-validation/02-frontend-validated.md
source_section: FE-008: Add Zod Password Validation

files:
  - path: frontend/src/features/users/ui/ChangePasswordPage.tsx
    targets:
      - type: component
        name: ChangePasswordPage
    semantic_anchors:
      find:
        type: zod_schema
        value: password validation schema

changes:
  - action: replace_code
    description: >
      Add Zod validation for password fields in ChangePasswordPage:
      - Min 8 characters
      - At least one uppercase letter
      - At least one digit
      - Passwords must match (.refine on confirmPassword)
    code_hint: |
      const passwordSchema = z.object({
          currentPassword: z.string().min(1, "Current password is required"),
          newPassword: z.string()
              .min(8, "Password must be at least 8 characters")
              .regex(/[A-Z]/, "Password must contain at least one uppercase letter")
              .regex(/[0-9]/, "Password must contain at least one digit"),
          confirmPassword: z.string(),
      }).refine((data) => data.newPassword === data.confirmPassword, {
          message: "Passwords do not match",
          path: ["confirmPassword"],
      });

acceptance_criteria:
      - Zod schema enforces min 8 chars, uppercase, digit requirements
      - Confirm password must match new password
      - Validation errors displayed inline in the form

risk_notes: >
  Low risk — adds client-side validation that matches backend rules.

tests_to_run:
  - command: cd frontend && npm run build
    reason: Verify build succeeds
