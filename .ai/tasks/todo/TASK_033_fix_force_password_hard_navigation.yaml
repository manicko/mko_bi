id: TASK_033_fix_force_password_hard_navigation

title: Replace window.location.href with React Router navigation for force password change (FE-013)

status: pending

priority: medium

depends_on: []

description: >
  The useAuth hook uses window.location.href for force password change redirects,
  which causes a full page reload and loses the JWT token from memory. Replace
  with React Router's useNavigate() to preserve the SPA state and token.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: FE-013

goals:
  - Replace window.location.href with useNavigate() in useAuth hook
  - Preserve JWT token in memory during force password change redirect
  - Maintain the force_password_change redirect behavior

files:
  - path: frontend/src/features/auth/model/useAuth.ts
    targets:
      - type: function
        name: useAuth
    semantic_anchors:
      - replace_call:
          value: "window.location.href = '/profile/change-password?force=true'"
          description: Replace with navigate() from react-router-dom

changes:
  - action: modify
    description: >
      Replace window.location.href with useNavigate() from react-router-dom
      for force password change redirects. This preserves the SPA state and
      keeps the JWT token in memory.

    code_hint: |
      # ADD import:
      import { useNavigate } from 'react-router-dom'

      # In useAuth function, add:
      const navigate = useNavigate()

      # REPLACE all instances of:
      window.location.href = '/profile/change-password?force=true'

      # WITH:
      navigate('/profile/change-password?force=true')

acceptance_criteria:
  - No window.location.href in useAuth.ts
  - Force password change redirect uses React Router navigation
  - JWT token preserved in memory after redirect
  - Tests pass for auth flows

risk: low

tests_to_run:
  - "cd frontend && npm test -- --testPathPattern=useAuth"
