id: TASK_006_fix_custom_permission_error_shadow

title: Rename custom PermissionError to avoid shadowing Python builtin (BE-004)

status: pending

priority: high

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\final-report.md
source_section: BE-004 — Custom PermissionError shadows Python builtin

description: >
  A custom PermissionError class in core/permissions.py shadows Python's built-in PermissionError.
  This causes real bugs when code expects the builtin but gets the custom one. The custom
  exception does not inherit from the correct HTTP-aware error model. Rename the custom
  exception to DashboardPermissionError and update all imports/usages across the codebase.

goals:
  - Rename custom PermissionError to DashboardPermissionError in core/permissions.py
  - Update all imports and usages across the codebase
  - Ensure Python builtin PermissionError is never shadowed

files:
  - path: src/mkobi/core/permissions.py
    targets:
      - type: class
        name: PermissionError
    semantic_anchors:
      insert_before:
        type: class_definition
        value: class PermissionError
    changes:
      - action: rename_symbol
        description: Rename PermissionError to DashboardPermissionError
        code_hint: |
          class DashboardPermissionError(HTTPException):
              def __init__(self, detail: str = "Permission denied"):
                  super().__init__(status_code=403, detail=detail)

  - path: src/mkobi/api/routes/data.py
    targets:
      - type: import
        value: PermissionError
    changes:
      - action: update_import
        description: Update import to use DashboardPermissionError

  - path: src/mkobi/services/data_service.py
    targets:
      - type: import
        value: PermissionError
    changes:
      - action: update_import
        description: Update import to use DashboardPermissionError

acceptance_criteria:
  - Custom exception is renamed to DashboardPermissionError
  - All imports updated across the codebase
  - Python builtin PermissionError is not shadowed
  - ruff check and mypy pass without errors
  - All existing tests pass

tests_to_run:
  - ruff check src/mkobi/
  - mypy src/mkobi/
  - pytest tests/ -v --tb=short

risk: medium

notes: >
  HIGH — This is a prerequisite for BE-003 (PermissionError not imported in data.py).
  Must be done before BE-002/BE-003 since those tasks touch the same files.
  Search the entire codebase for `PermissionError` references to ensure complete migration.
