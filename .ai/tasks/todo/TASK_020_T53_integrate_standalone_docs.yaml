id: TASK_020_T53_integrate_standalone_docs
title: Integrate standalone docs into 99-reference/
status: pending
priority: high
depends_on:
  - TASK_018_T51_add_yaml_frontmatter
description: >
  Create 99-reference/swagger.md from docs/SWAGGER_README.md and 99-reference/run-guide.md from docs/RUN.md.
  Add deprecation notes to original files.
goals:
  - 99-reference/swagger.md contains all content from SWAGGER_README.md
  - 99-reference/run-guide.md contains all content from RUN.md (translated to English)
  - Original files have deprecation notes at the top
  - TASK_QUEUE_MIGRATION.md content is integrated into task-queue.md (done in T2.4)
files:
  - path: docs/99-reference/swagger.md
    targets:
      - type: file
        name: swagger.md
    changes:
      - action: create_file
        description: Swagger guide migrated from SWAGGER_README.md with YAML frontmatter
  - path: docs/99-reference/run-guide.md
    targets:
      - type: file
        name: run-guide.md
    changes:
      - action: create_file
        description: Run guide migrated from RUN.md with YAML frontmatter (translated to English)
  - path: docs/SWAGGER_README.md
    targets:
      - type: file
        name: SWAGGER_README.md
    changes:
      - action: prepend_text
        description: Add deprecation note pointing to 99-reference/swagger.md
  - path: docs/RUN.md
    targets:
      - type: file
        name: RUN.md
    changes:
      - action: prepend_text
        description: Add deprecation note pointing to 99-reference/run-guide.md
acceptance_criteria:
  - 99-reference/swagger.md contains all content from SWAGGER_README.md
  - 99-reference/run-guide.md contains all content from RUN.md
  - Original files have deprecation notes at the top
