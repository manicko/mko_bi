id: TASK_002_V003
title: Fix SPA fallback route registration to be conditional on frontend build existence
status: pending
priority: medium
depends_on: []

description: >
  The SPA fallback route (/{full_path:path}) is registered even when frontend/dist doesn't
  exist (e.g., in development without a frontend build). This can catch API routes and return
  HTML instead of JSON 404s.

goals:
  - Only register SPA fallback route when frontend/dist directory exists
  - Ensure API 404s return JSON in development mode
  - Preserve production behavior when frontend build exists

files:
  - path: src/mkobi/app.py
    targets:
      - type: function
        name: _setup_static_files
    semantic_anchors:
      - type: function_call
        value: StaticFiles
      - type: function_call
        value: FileResponse
    changes:
      - action: add_condition
        description: "Add explicit check for frontend/dist existence before registering SPA fallback route"
        code_hint: "Wrap the fallback route registration with: if static_dir.exists() and (static_dir / 'index.html').exists():"

acceptance_criteria:
  - In development without frontend build: API 404s return JSON
  - In production with frontend build: SPA fallback works correctly
  - Static files still served correctly in both modes

tests_to_run:
  - uv run pytest tests/ -x -v

risk_level: low
notes: >
  The _setup_static_files function already checks static_dir.exists() for mounting StaticFiles,
  but the fallback route registration needs the same guard.
