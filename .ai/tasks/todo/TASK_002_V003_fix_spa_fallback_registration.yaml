id: TASK_002_V003
title: Fix SPA fallback route registered unconditionally
status: pending
priority: medium
depends_on: []
wave: 1

description: >
  The SPA fallback route (/{full_path:path}) is registered even when frontend/dist
  doesn't exist (e.g., in development without a frontend build). This can catch
  API routes and return HTML instead of JSON 404s. Add explicit check for the
  existence of the static files directory before registering the fallback.

goals:
  - SPA fallback only registers when frontend/dist exists with index.html
  - API 404s return JSON in development mode
  - No impact on production deployment where frontend/dist always exists

files:
  - path: src/mkobi/app.py
    targets:
      - type: function
        name: _setup_static_files
    semantic_anchors:
      insert_before:
        type: function_call
        value: FileResponse
    changes:
      - action: modify_code
        description: Add explicit check for index.html existence in static_dir before registering the SPA fallback route. Only register fallback when static_dir / "index.html" exists.

acceptance_criteria:
  - In development without frontend build, API 404s return JSON
  - In production with frontend build, SPA fallback works correctly
  - Static files still served correctly in both modes
  - Tests pass

tests_to_run:
  - tests/

risk_level: low
risk_notes: Low risk fix. No dependencies. Safe to deploy independently.

validated_finding: V-003
severity: MEDIUM
