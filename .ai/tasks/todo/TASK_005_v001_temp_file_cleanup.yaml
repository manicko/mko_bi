id: TASK_005_v001_temp_file_cleanup

title: "V-001: Add try/finally temp file cleanup in upload endpoint"

status: pending

priority: high

depends_on:
  - TASK_004_verify_v003_pydantic_500_to_422

description: >
  The upload endpoint (src/mkobi/api/routes/upload.py, _upload_file_endpoint)
  streams the uploaded file to a temporary file on disk. If data_service.process_upload()
  raises an exception after the temp file is written, no cleanup occurs. The file
  remains on disk indefinitely. The SPEC explicitly states temp files must be
  removed after processing.

goals:
  - Wrap temp file lifecycle in try/finally block
  - Unlink temp_file_path in finally block if processing failed
  - Preserve temp file if processing succeeded and file was moved to final location

files:
  - path: src/mkobi/api/routes/upload.py
    targets:
      - type: function
        name: _upload_file_endpoint
    semantic_anchors:
      insert_after:
        type: variable_assignment
        value: "temp_file_path"
      insert_before:
        type: return_statement
        context: "at the end of successful processing"
      temp_file_path exists check as cleanup trigger in finally block

changes:
  - action: add_code
    description: >
      Wrap the processing block (data_service.process_upload() call) in try/finally.
      In the finally block, check if temp_file_path exists and unlink it if an
      exception occurred. Track success state to avoid deleting moved files.
    anchor: "temp_file_path variable and data_service.process_upload() call"

acceptance_criteria:
  - Temp file is cleaned up on upload failure
  - Temp file is preserved when processing succeeds and file is moved
  - No disk space leak on repeated failed uploads
  - Existing upload tests continue to pass

tests_to_run:
  - pytest tests/test_upload_api.py -x --tb=short

risk_level: low (isolated change, SPEC-mandated behavior)

source_findings:
  - V-001
  - R1-F005
  - R3-HIGH-upload
  - R3-FileRec-upload

estimated_effort: small (~15 lines)
