id: TASK_027_V032_upload_memory_streaming

title: Consider streaming file upload with chunked reads to reduce memory pressure

status: pending

priority: low

depends_on: []

description: >
  File content is read entirely into memory (await file.read()). For very large
  files (up to 100MB limit), this creates memory pressure. This task considers
  streaming the file write using aiofiles with chunked reads.

finding_ref: V-030
severity: LOW

goals:
  - Replace full file read with chunked streaming write
  - Reduce memory pressure for large uploads
  - Handle partial writes correctly

files:
  - path: src/mkobi/api/routes/upload.py
    targets:
      - type: route_handler
        name: upload endpoint
    semantic_anchors:
      replace: await file.read() with chunked read loop

changes:
  - action: add_streaming
    description: >
      Replace full file read with chunked streaming write using aiofiles.
    code_hint: |
      # Before:
      content = await file.read()
      with open(temp_path, "wb") as f:
          f.write(content)
      # After:
      import aiofiles
      async with aiofiles.open(temp_path, "wb") as f:
          while chunk := await file.read(8192):
              await f.write(chunk)

acceptance_criteria:
  - File upload uses chunked streaming
  - Memory usage reduced for large files
  - Partial writes handled correctly
  - All file types still upload successfully

tests_to_run:
  - pytest tests/ -k "upload" -v

risk_level: medium

rollout_notes: >
  Moderate complexity. Must handle partial writes correctly. No dependencies.
