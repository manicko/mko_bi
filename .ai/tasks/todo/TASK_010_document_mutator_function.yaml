id: TASK_010_document_mutator_function
title: Improve documentation for mutating _set_nested_value function

status: pending
priority: low

depends_on: []

description: >
  _set_nested_value() modifies its dict argument in-place and returns None, but the
  return type annotation doesn't clearly signal the mutating nature.

goals:
  - Add explicit docstring note about in-place mutation
  - Consider renaming to _set_nested_value_inplace or returning modified dict

files:
  - path: src/mkobi/config.py
    targets:
      - type: function
        name: _set_nested_value
    semantic_anchors:
      update_docstring:
        type: docstring
      consider_rename:
        type: function_name

changes:
  - action: update_docstring
    description: Add explicit in-place mutation documentation

  - action: consider_refactor
    description: Evaluate returning dict or renaming for clarity

acceptance_criteria:
  - Docstring clearly indicates in-place mutation
  - Function name or behavior signals mutation intent
  - No breaking changes to internal callers

tests_to_run:
  - pytest tests/test_config.py -v

risk_level: low