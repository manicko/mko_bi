id: TASK_022_V011
title: Refactor user endpoints to use request body instead of query params
status: pending
priority: medium
depends_on: []
wave: 2

description: >
  User creation endpoint accepts email/password/role as query params. User update
  endpoint accepts new_role as query param. Non-standard REST pattern. Change to
  Pydantic request body models. Requires frontend API client updates.

goals:
  - User creation uses Pydantic request body model
  - User update uses Pydantic request body model
  - No query parameters for sensitive data (password)
  - Frontend API client updated to match

files:
  - path: src/mkobi/api/routes/users.py
    targets:
      - type: function
        name: create_user_endpoint
      - type: function
        name: update_user_endpoint
    semantic_anchors:
      insert_after:
        type: function_definition
        value: create_user_endpoint
    changes:
      - action: modify_code
        description: Change create_user_endpoint to accept a Pydantic UserCreateRequest body instead of query parameters. Change update_user_endpoint to accept a Pydantic UserUpdateRequest body. Create the Pydantic request models in models/user.py if they don't exist.

  - path: frontend/src/features/admin/api/adminApi.ts
    targets:
      - type: function
        name: createUser
      - type: function
        name: updateUserRole
    changes:
      - action: modify_code
        description: Update frontend API client to send request body instead of query parameters for user creation and role update.

acceptance_criteria:
  - User creation accepts POST body with email, password, role
  - User update accepts POST body with new_role
  - No sensitive data in query parameters
  - Frontend admin panel works correctly
  - Tests pass

tests_to_run:
  - tests/
  - frontend/src/

risk_level: medium
risk_notes: Requires coordinated frontend+backend changes. Deploy backend first with backward compatibility, then frontend.

validated_finding: V-011
severity: MEDIUM
