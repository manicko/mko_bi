id: TASK_008_add_pagination_to_admin_endpoints
title: Add pagination to admin user and registration request endpoints

status: pending
priority: low

depends_on: []

description: >
  GET /admin/users and GET /admin/registration-requests return all records without
  pagination, causing unbounded memory usage and slow responses at scale.

goals:
  - Add page/limit query parameters with defaults (page=1, limit=50)
  - Implement pagination via query slicing
  - Maintain backward compatibility

files:
  - path: src/mkobi/api/routes/admin.py
    targets:
      - type: function
        name: get_users_admin_endpoint
      - type: function
        name: get_registration_requests_admin_endpoint
    semantic_anchors:
      add_params:
        type: query_parameter
      apply_slicing:
        type: function_call

changes:
  - action: add_pagination_params
    description: Add page and limit query parameters

  - action: add_slicing
    description: Apply limit/offset slicing to repository calls

acceptance_criteria:
  - Pagination parameters accepted with defaults
  - Large datasets return paginated results
  - Backward compatible with existing clients

tests_to_run:
  - pytest tests/test_admin_api.py -v

risk_level: low