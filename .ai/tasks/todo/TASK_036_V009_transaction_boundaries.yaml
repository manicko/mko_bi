id: TASK_036_V009_transaction_boundaries

title: Refactor service methods to require db parameter (remove create-own-session fallback)

status: pending

priority: medium

depends_on: []

description: >
  Multiple service methods (register_user, login_user, get_user_by_id, process_upload, etc.)
  create their own DB session when called without db parameter. This breaks atomicity
  when a caller starts a transaction and calls multiple service methods. This task
  removes the create-own-session fallback and requires db as a mandatory parameter.

finding_ref: V-009
severity: MEDIUM

goals:
  - Remove create-own-session fallback from all service methods
  - Make db a mandatory parameter in all service methods
  - Let FastAPI dependency injection handle session lifecycle
  - Ensure transaction atomicity across multiple service calls

files:
  - path: src/mkobi/services/auth_service.py
    targets:
      - type: class
        name: AuthService
      - type: method
        name: register_user
      - type: method
        name: login_user
      - type: method
        name: get_user_by_id
    semantic_anchors:
      remove: db=None fallback and session creation logic

  - path: src/mkobi/services/data_service.py
    targets:
      - type: class
        name: DataService
      - type: method
        name: process_upload
    semantic_anchors:
      remove: db=None fallback and session creation logic

changes:
  - action: refactor_signatures
    description: >
      Remove db=None fallback from all service methods. Make db mandatory.
      Remove any internal session creation logic.
    code_hint: |
      # Before:
      async def register_user(self, user_data, db=None):
          if db is None:
              async with get_session() as db:
                  return await self._do_register(user_data, db)
          return await self._do_register(user_data, db)
      # After:
      async def register_user(self, user_data, db: AsyncSession):
          return await self._do_register(user_data, db)

acceptance_criteria:
  - All service methods require db as mandatory parameter
  - No internal session creation in any service method
  - All callers updated to pass db
  - Transaction atomicity preserved across multiple service calls

tests_to_run:
  - pytest tests/ -v (full test suite — NOTE: tests may need rewriting first)

risk_level: high

rollout_notes: >
  HIGH RISK. This is a systemic refactoring that touches many service methods.
  Must update all callers. The test infrastructure issues identified in the
  audit mean the test suite cannot be fully trusted as a safety net. Consider
  rewriting overmocked service tests before undertaking this refactoring.
  This task should not be started until test quality is improved.
