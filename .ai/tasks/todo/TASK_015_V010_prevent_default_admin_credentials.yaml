id: TASK_015_V010
title: Add production validation to prevent default admin credentials
status: pending
priority: medium
depends_on: []

description: >
  Default admin credentials (admin/admin) are used if ADMIN_USERNAME/ADMIN_PASSWORD env vars
  are not set. In production, this is a critical security risk.

goals:
  - Add startup validation that fails if default credentials are used in production
  - Log a warning in development if defaults are used
  - Ensure production deployments must set explicit credentials

files:
  - path: src/mkobi/config.py
    targets:
      - type: class
        name: Settings
    semantic_anchors:
      - type: field_definition
        description: "admin_username and admin_password field definitions"
    changes:
      - action: add_validator
        description: "Add a model_validator that checks for default credentials in production"
        code_hint: "@model_validator(mode='after') def validate_admin_credentials(self): if self.env == EnvironmentEnum.PRODUCTION and self.admin_username == 'admin': raise ValueError('Must set ADMIN_USERNAME in production')"

  - path: src/mkobi/db/starter.py
    targets:
      - type: method
        name: ensure_admin_user
    semantic_anchors:
      - type: method_call
        value: get_config
    changes:
      - action: add_warning
        description: "Add a warning log if default admin credentials are used"
        code_hint: "if admin_username == 'admin': logger.warning('Using default admin credentials')"

acceptance_criteria:
  - Production startup fails if ADMIN_USERNAME/ADMIN_PASSWORD are not explicitly set
  - Development startup works with defaults but logs a warning
  - Existing tests pass

tests_to_run:
  - uv run pytest tests/ -x -v

risk_level: medium
notes: >
  CRITICAL: Do NOT add production startup validation without first ensuring all
  deployment configurations have explicit credentials set. Could cause outages.
