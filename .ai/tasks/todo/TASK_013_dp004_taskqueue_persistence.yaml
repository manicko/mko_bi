description: >
  The in-memory `TaskQueue` is not persistent — if the application restarts, all queued tasks
  are lost. While the SPEC documents this as an MVP limitation with a migration path to Redis/RQ,
  the code should at minimum log a warning when tasks are lost on shutdown and provide a
  configuration option to enable file-based task persistence as an intermediate step.

