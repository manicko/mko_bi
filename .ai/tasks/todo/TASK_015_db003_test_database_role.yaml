description: >
  The test `docker-compose.test.yml` uses the `postgres` superuser for the test-app service,
  bypassing all privilege checks. Production uses the limited-privilege `mkobi_app` role.
  Switch tests to use `mkobi_app` so access control is properly validated. This must be
  done BEFORE fixing BE-005/SEC-003 to surface any hidden privilege dependencies.

source_reference: "C:\\py_dev\\mkobi\\.ai\\audit\\99-validation\\03-database-validated.md"
