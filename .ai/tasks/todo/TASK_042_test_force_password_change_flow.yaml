source_section: INT-009 — login callback doesn't check force_password_change

description: >
  Implementing TASK_028 adds frontend-side force_password_change checking in the login
  flow. Write tests that verify: (1) backend login response includes the
  force_password_change flag, (2) the flag triggers proper frontend redirect behavior.

goals:
  - Test that login response includes force_password_change field (True/False)
  - Test that a user with force_password_change=True is redirected to password change
  - Test that a user with force_password_change=False proceeds to dashboard
  - Test that the backend login endpoint returns the correct flag based on user state

files:
  - path: tests/test_force_password_change_backend.py
    targets:
      - type: test_file
    changes:
      - action: create_file
        description: Create backend tests for force_password_change in login response
        code_hint: |
          import pytest
          from httpx import AsyncClient


          class TestForcePasswordChangeBackend:
            """Test force_password_change flag in login response."""

            async def test_login_includes_force_password_change_flag(
                self, client: AsyncClient, normal_user
            ):
                """Login response should include force_password_change field."""
                response = await client.post("/api/v1/auth/login", json={
                    "email": normal_user.email,
                    "password": normal_user.plain_password
                })
                assert response.status_code == 200
                body = response.json()
                assert "force_password_change" in body
                assert isinstance(body["force_password_change"], bool)

            async def test_new_user_has_force_password_change_true(
                self, client: AsyncClient, temp_password_user
            ):
                """User with temporary password should have force_password_change=True."""
                response = await client.post("/api/v1/auth/login", json={
                    "email": temp_password_user.email,
                    "password": temp_password_user.temp_password
                })
                assert response.status_code == 200
                assert response.json()["force_password_change"] is True

            async def test_normal_user_has_force_password_change_false(
                self, client: AsyncClient, normal_user
            ):
                """Normal user should have force_password_change=False."""
                response = await client.post("/api/v1/auth/login", json={
                    "email": normal_user.email,
                    "password": normal_user.plain_password
                })
                assert response.status_code == 200
                assert response.json()["force_password_change"] is False

