id: TASK_008_dp06_remove_round_from_storage

title: Fix DP-06 — Remove round(4) precision loss from storage layer

status: pending

priority: low

depends_on:
  - TASK_004_dp01_remove_dead_datapipeline_class

description: >
  Fix the LOW issue where _calculate_yoy and _calculate_share apply round(4) during
  storage, causing precision loss when downstream calculations aggregate YoY values.
  Store full precision; round only at the presentation layer.

source_file: .ai/audit/99-validation/07-data-processing-validated.md
source_section: DP-06: _calculate_yoy round(4) precision loss

files:
  - path: src/mkobi/data/processing/aggregate_transforms.py
    targets:
      - type: function
        name: _calculate_yoy
      - type: function
        name: _calculate_share
    semantic_anchors:
      find:
        type: method_chain
        value: .round(4)
      description: Three locations — _calculate_yoj with group_cols, _calculate_share with group_cols, and _calculate_share without group_cols.

changes:
  - action: replace_code
    description: >
      Remove `.round(4)` from all three locations in _calculate_yoy and _calculate_share.
      The rounding should be applied at the presentation layer (frontend or API serialization),
      not during storage.
    code_hint: |
      # BEFORE (3 locations):
      .otherwise(((pl.col(value_column) - prev_value_expr) / prev_value_expr * 100).round(4))
      .otherwise(((pl.col(value_column) / pl.col("total") * 100)).round(4))
      result = df.with_columns(((pl.col(value_column) / total * 100).round(4)).alias(alias))

      # AFTER (3 locations):
      .otherwise((pl.col(value_column) - prev_value_expr) / prev_value_expr * 100)
      .otherwise((pl.col(value_column) / pl.col("total") * 100))
      result = df.with_columns((pl.col(value_column) / total * 100).alias(alias))

acceptance_criteria:
  - No `.round(4)` calls remain in aggregate_transforms.py
  - Full precision values are stored in aggregated_data
  - Tests asserting exact float values updated to use pytest.approx

risk_notes: >
  Low risk — removes rounding from storage. Any downstream tests asserting exact float
  values with 4-decimal precision must be updated to use pytest.approx.

tests_to_run:
  - command: pytest tests/test_aggregation_service.py -v --no-cov
    reason: Verify aggregation tests pass without rounding
