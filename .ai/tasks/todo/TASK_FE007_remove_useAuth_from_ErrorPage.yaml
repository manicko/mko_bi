id: TASK_FE007_remove_useAuth_from_ErrorPage

title: Fix FE-007 — Remove unnecessary useAuth() call from ErrorPage

status: pending

priority: medium

depends_on: []

description: |
  ErrorPage.tsx calls useAuth() to determine home link target. For unauthenticated
  users hitting error pages, this triggers unnecessary API calls. Replace with
  hardcoded '/login' since unauthenticated users should always go to login.

source_file: .ai/audit/99-validation/02-frontend-validated.md
source_section: FE-007: Remove useAuth from ErrorPage

files:
  - path: frontend/src/shared/components/ErrorPage.tsx
    targets:
      - type: import
        value: useAuth
      - type: hook_call
        value: useAuth

changes:
  - action: delete_code
    description: |
      Remove useAuth import and the user state variable. Change goToHome from
      'user ? '/dashboards' : '/login'' to just '/login'.

acceptance_criteria:
  - useAuth removed from ErrorPage.tsx
  - goToHome hardcoded to '/login'
  - Build succeeds
  - No unnecessary API calls on error pages

risk_notes: |
  Low risk — ErrorPage is rendered for unauthenticated users hitting 404/500.
  Authenticated users never reach this component through normal flow.

tests_to_run:
  - command: cd frontend && npm run build
    reason: Verify build succeeds after removal
