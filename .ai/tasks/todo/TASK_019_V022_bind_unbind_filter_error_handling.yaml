id: TASK_019_V022_bind_unbind_filter_error_handling

title: Fix incomplete try block in bind_filter_endpoint and unbind_filter_endpoint

status: pending

priority: medium

depends_on: []

description: >
  bind_filter_endpoint and unbind_filter_endpoint handle IntegrityError and generic
  Exception with db.rollback(), but the filter_repo.get() call is outside the try
  block. If it raises an exception, the error handlers won't catch it, resulting in
  a 500 without proper logging.

finding_ref: V-022
severity: MEDIUM

goals:
  - Move filter_repo.get() inside the try block
  - Ensure all error paths are properly handled
  - Add proper logging for uncaught exceptions

files:
  - path: src/mkobi/api/routes/dashboards.py
    targets:
      - type: route_handler
        name: bind_filter_endpoint
      - type: route_handler
        name: unbind_filter_endpoint
    semantic_anchors:
      move: filter_repo.get() call inside try block

changes:
  - action: move_code
    description: >
      Move the filter_repo.get() call inside the existing try block so that
      any exceptions from the repository call are properly caught and handled.
    code_hint: |
      # Before:
      filter_obj = await filter_repo.get(filter_id)
      try:
          # ... binding logic
      except IntegrityError:
          ...
      # After:
      try:
          filter_obj = await filter_repo.get(filter_id)
          # ... binding logic
      except IntegrityError:
          ...

acceptance_criteria:
  - filter_repo.get() is inside the try block in both endpoints
  - All exception paths are properly handled
  - No 500 errors from uncaught filter_repo.get() exceptions
  - Existing error handling still works

tests_to_run:
  - pytest tests/ -k "filter or dashboard or bind" -v

risk_level: low

rollout_notes: >
  Safe. No dependencies. Simple code move.
