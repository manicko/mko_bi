id: TASK_001_V001
title: Fix double-multiplication of file size limit in upload endpoint
status: pending
priority: critical
depends_on: []

description: >
  The upload endpoint at api/routes/upload.py multiplies config.max_file_size by 1024*1024,
  but the Settings.max_file_size property already converts MB to bytes. This makes the effective
  limit ~100 TB instead of 100 MB, effectively disabling file size validation.

goals:
  - Remove the redundant * 1024 * 1024 multiplication in the upload endpoint
  - Ensure file size limit is enforced at the configured MB value
  - Preserve backward compatibility

files:
  - path: src/mkobi/api/routes/upload.py
    targets:
      - type: function
        name: upload_file_endpoint
    semantic_anchors:
      - type: comparison_operator
        description: "File size comparison: file.size > config.max_file_size * 1024 * 1024"
    changes:
      - action: modify_code
        description: "Remove '* 1024 * 1024' from the file size comparison"
        code_hint: "Change 'file.size > config.max_file_size * 1024 * 1024' to 'file.size > config.max_file_size'"

acceptance_criteria:
  - File size check uses config.max_file_size directly (already in bytes)
  - Upload of file exceeding limit is rejected with 413
  - Upload of file within limit proceeds normally
  - Existing tests pass

tests_to_run:
  - uv run pytest tests/test_upload_api.py -x -v
  - uv run pytest tests/ -x -v

risk_level: low
notes: >
  Single-line fix. No dependencies. The config.max_file_size property at config.py:385
  already returns bytes (self.upload.max_file_size_mb * 1024 * 1024). The upload endpoint
  just needs to use it directly.
