id: TASK_001_V001
title: Fix double-multiplication of file size limit in upload endpoint
status: pending
priority: high
depends_on: []
wave: 1

description: >
  The `config.max_file_size` property in Settings already converts MB to bytes
  (upload.max_file_size_mb * 1024 * 1024). The upload endpoint then multiplies
  again by 1024 * 1024, making the effective limit ~100 TB instead of 100 MB.
  Remove the redundant multiplication.

goals:
  - File size validation works correctly at the configured MB limit
  - No double-multiplication of the byte value
  - Single-line fix with no side effects

files:
  - path: src/mkobi/api/routes/upload.py
    targets:
      - type: function
        name: upload_file_endpoint
    semantic_anchors:
      insert_after:
        type: comparison
        value: file.size > config.max_file_size
    changes:
      - action: modify_code
        description: Remove "* 1024 * 1024" from the file size comparison. Change `file.size > config.max_file_size * 1024 * 1024` to `file.size > config.max_file_size`

acceptance_criteria:
  - Upload endpoint rejects files larger than configured max_file_size_mb
  - Upload endpoint accepts files smaller than configured max_file_size_mb
  - Config property max_file_size returns bytes, endpoint uses it directly
  - Tests pass

tests_to_run:
  - tests/test_upload_api.py

risk_level: low
risk_notes: Single-line fix. No dependencies. Safe to deploy independently.

validated_finding: V-001
severity: HIGH
