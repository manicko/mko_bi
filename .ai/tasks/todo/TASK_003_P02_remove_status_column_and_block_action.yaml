id: TASK_003_P02_remove_status_column_and_block_action

title: Remove Status column and Block action from UserManagement DataGrid

status: pending

priority: high

depends_on: []

description: >
  The UserManagement DataGrid has a Status column (is_active) that always shows "Blocked"
  because the backend UserRead model doesn't return is_active. The Block action button
  is non-functional (shows "coming soon" toast). Remove both.

phase: PLAN_02 — Frontend Bug Fixes
wave: 1

finding_ref: BUG-03
severity: low

goals:
  - Remove is_active column from DataGrid columns
  - Remove Block action button from DataGrid actions
  - Remove is_active from rows mapping
  - Remove unused BlockIcon import

files:
  - path: frontend/src/features/admin/ui/UserManagement.tsx
    targets:
      - type: component
        name: UserManagement
    semantic_anchors:
      remove:
        type: column_definition
        value: "is_active column object"
      remove:
        type: jsx_element
        value: "Block GridActionsCellItem"
      update:
        type: variable
        value: "rows mapping — remove is_active field"
      remove:
        type: import
        value: "BlockIcon (if no longer used)"

changes:
  - action: remove_column
    description: >
      Remove the is_active column definition (field: 'is_active', headerName: 'Status').
    code_hint: |
      DELETE the column object:
      {
        field: 'is_active',
        headerName: 'Status',
        width: 120,
        valueGetter: (value: boolean) => (value ? 'Active' : 'Blocked'),
      }

  - action: remove_action
    description: >
      Remove the Block GridActionsCellItem element.
    code_hint: |
      DELETE the <GridActionsCellItem icon={<BlockIcon>} label="Block" .../> element.

  - action: update_rows
    description: >
      Remove is_active from the rows mapping.
    code_hint: |
      # Before:
      is_active: user.is_active,
      # After: (remove this line entirely)

  - action: cleanup_imports
    description: >
      Remove BlockIcon import if no longer used in the file.

acceptance_criteria:
  - DataGrid columns: ID, Email, Role, Created, Actions (Delete only)
  - No Status column in the table
  - No Block button in the Actions column
  - BlockIcon import removed (no unused import warnings)

tests_to_run:
  - cd frontend && npx tsc --noEmit

risk_level: low

rollout_notes: >
  Single-file change. Purely removals. No functional additions.
  Must complete before TASK_005_P02 which removes is_active from AdminUser type.
