id: TASK_005_P03_update_dashboard_management_ui

title: Update DashboardManagement.tsx — layout dropdown, char counter, inline errors, no toast

status: pending

priority: high

depends_on:
  - TASK_004_P03_update_zod_schema_and_api_types

description: >
  Update the DashboardManagement component: (1) Add layout dropdown with 3 options.
  (2) Add character counter "X/200" to description field. (3) Replace toast errors
  with inline Alert. (4) Remove toast on success. (5) Disable submit button during request.

phase: PLAN_03 — Admin Dashboard Creation
wave: 3

finding_ref: BUG-11, BUG-12, BUG-13, BUG-14, BUG-15
severity: low

goals:
  - Add layout dropdown (Single column, Two columns, Grid)
  - Add description character counter via MUI helperText
  - Replace toast errors with inline Alert in modal
  - Remove toast on success (modal closes, list refreshes)
  - Disable submit button during request

files:
  - path: frontend/src/features/admin/ui/DashboardManagement.tsx
    targets:
      - type: component
        name: DashboardManagement
    semantic_anchors:
      add:
        type: state
        value: "error state for inline error display"
      update:
        type: mutation
        value: "createMutation — remove toast, add inline error"
      update:
        type: jsx_element
        value: "Create Dialog — add layout dropdown, char counter, inline Alert"
      update:
        type: state
        value: "formData — add layout field"

changes:
  - action: add_error_state
    description: >
      Add error state alongside formData state.

  - action: update_mutation
    description: >
      Remove toast from createMutation, add inline error handling.
    code_hint: |
      const createMutation = useMutation({
        mutationFn: createDashboard,
        onSuccess: () => {
          queryClient.invalidateQueries({ queryKey: ['admin', 'dashboards'] })
          setCreateDialogOpen(false)
          setFormData({ name: '', description: '', layout: '' })
          setError(null)
        },
        onError: (err: Error) => {
          setError(err.message || 'Failed to create dashboard')
        },
      })

  - action: update_dialog
    description: >
      Add layout dropdown, character counter, inline error Alert to Create Dialog.
    code_hint: |
      <FormControl fullWidth sx={{ mt: 2 }}>
        <InputLabel>Layout</InputLabel>
        <Select value={formData.layout || ''} label="Layout"
          onChange={(e) => setFormData({ ...formData, layout: e.target.value })}>
          <MenuItem value="single-column">Single column</MenuItem>
          <MenuItem value="two-columns">Two columns</MenuItem>
          <MenuItem value="grid">Grid</MenuItem>
        </Select>
      </FormControl>
      {error && (<Alert severity="error" sx={{ mt: 2 }}>{error}</Alert>)}

acceptance_criteria:
  - Create dialog has Name, Description (with "X/200" counter), Layout dropdown, inline error Alert
  - Description field truncates input at 200 chars
  - Layout dropdown has 3 options: Single column, Two columns, Grid
  - On error: Alert appears below form fields, modal stays open, form data preserved
  - On success: modal closes, list refreshes, no toast
  - Submit button disabled when createMutation.isPending or name is empty

tests_to_run:
  - cd frontend && npx tsc --noEmit

risk_level: low

rollout_notes: >
  Depends on TASK_004 for updated schema/types.
  Single-file frontend change. The react-hot-toast import should be kept
  if toast is used elsewhere in the file (edit/delete).
