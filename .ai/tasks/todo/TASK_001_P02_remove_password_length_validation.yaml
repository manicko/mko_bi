id: TASK_001_P02_remove_password_length_validation

title: Remove password length validation from login schema

status: pending

priority: high

depends_on: []

description: >
  Remove client-side minimum length check on login password field.
  The login schema currently requires min 6 chars for password, but the server
  handles actual validation. Only requirement: password field is not empty.
  Registration and change-password schemas are unaffected.

phase: PLAN_02 — Frontend Bug Fixes
wave: 1

finding_ref: BUG-01
severity: low

goals:
  - Remove min(6) from loginSchema password field
  - Keep min(1) to ensure non-empty password
  - Leave registerSchema, changePasswordSchema, and other schemas unchanged

files:
  - path: frontend/src/shared/types/formSchemas.ts
    targets:
      - type: constant
        name: loginSchema
    semantic_anchors:
      update:
        type: zod_schema
        value: "z.string().min(6, { error: 'Password must be at least 6 characters' })"
        replacement: "z.string().min(1, { error: 'Password is required' })"

changes:
  - action: modify_schema
    description: >
      Replace min(6) with min(1) for loginSchema password field.
    code_hint: |
      # Before:
      password: z.string().min(6, { error: 'Password must be at least 6 characters' }),
      # After:
      password: z.string().min(1, { error: 'Password is required' }),

acceptance_criteria:
  - loginSchema validates password as non-empty string (min 1 char)
  - registerSchema, changePasswordSchema, createDashboardSchema, updateDashboardSchema, grantAccessSchema unchanged
  - Zod v4 { error: '...' } syntax preserved

tests_to_run:
  - cd frontend && npx tsc --noEmit

risk_level: low

rollout_notes: >
  Single-line change in a Zod schema. No runtime dependencies.
  Safe to execute independently.
