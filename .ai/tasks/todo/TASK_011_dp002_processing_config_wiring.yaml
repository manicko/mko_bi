description: >
  The `processing_config` from the `processing_configs` table is never fetched in the primary
  upload→process flow. The `enqueue_processing_job` function doesn't accept a `processing_config`
  parameter. The `DataPipeline` class in `registry.py` does fetch config, but it's not used by
  the main flow. Fix: add config fetching to the `data_worker.py` path by passing the config
  from `process_upload_with_session` through to `enqueue_processing_job`.

source_reference: "C:\\py_dev\\mkobi\\.ai\\audit\\99-validation\\07-data-processing-validated.md"
