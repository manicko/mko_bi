    targets:
      - type: function
        name: enqueue_processing_job
    semantic_anchors:
      insert_after:
        type: parameter_list
    changes:
      - action: add_parameter
        description: "Add processing_config parameter to enqueue_processing_job"
        old_hint: "async def enqueue_processing_job(..., session: AsyncSession)"
        new_hint: "async def enqueue_processing_job(..., processing_config: dict | None, session: AsyncSession)"

  - path: "src/mkobi/services/data_service.py"
    targets:
