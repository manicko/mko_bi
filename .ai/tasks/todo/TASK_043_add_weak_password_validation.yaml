id: TASK_043_add_weak_password_validation

title: Add weak password validation for database admin_password (SEC-007)

status: pending

priority: medium

depends_on: []

description: >
  The DatabaseSettings.admin_password field has no validation for weak or placeholder
  values. In production, a weak admin password would allow unauthorized database
  administration. Add validation similar to the existing admin_username/admin_password
  validation in the Settings model.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: SEC-007

goals:
  - Add weak password validation to DatabaseSettings.admin_password
  - Reject known weak passwords in production
  - Align with existing admin credential validation pattern

files:
  - path: src/mkobi/config.py
    targets:
      - type: class
        name: DatabaseSettings
      - type: field
        name: admin_password
    semantic_anchors:
      - add_validator:
          value: "admin_password"
          description: Add weak password validation

changes:
  - action: modify
    description: >
      Add a field validator to DatabaseSettings.admin_password that checks
      for weak passwords in production.

    code_hint: |
      # ADD to DatabaseSettings class:
      @field_validator("admin_password")
      @classmethod
      def validate_admin_password_strength(cls, v: str | None) -> str | None:
          """Validate admin password is not weak in production."""
          if v is not None and len(v) < 8:
              raise ValueError("Admin password must be at least 8 characters")
          return v

acceptance_criteria:
  - Admin password must be at least 8 characters
  - Weak passwords rejected in production
  - Tests pass

risk: low

tests_to_run:
  - "pytest tests/ -v -k 'config or database'"
