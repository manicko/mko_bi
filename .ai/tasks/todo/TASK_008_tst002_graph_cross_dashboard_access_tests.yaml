      - type: function
        name: test_get_graph_by_id
    semantic_anchors:
      insert_after:
        type: function_definition
        value: "def test_get_graph_by_id"
    changes:
      - action: add_code
        description: "Add cross-dashboard access test: create graph on dashboard A, attempt access from user with access only to dashboard B, assert 403"
        code_hint: |
          @pytest.mark.asyncio
          async def test_get_graph_cross_dashboard_forbidden(
              self, session, user_factory, dashboard_factory, graph_factory, access_factory
          ):
              """Graph on dashboard A should not be accessible from user with access only to dashboard B."""
              # Setup: two dashboards, two users with separate access
              dashboard_a = await dashboard_factory.create(session)
              dashboard_b = await dashboard_factory.create(session)
              user_a = await user_factory.create(session, role=RoleEnum.VIEWER)
              user_b = await user_factory.create(session, role=RoleEnum.VIEWER)
              await access_factory.create(session, user_id=user_a.id, dashboard_id=dashboard_a.id, permission=PermissionEnum.READ)
              await access_factory.create(session, user_id=user_b.id, dashboard_id=dashboard_b.id, permission=PermissionEnum.READ)
              graph = await graph_factory.create(session, dashboard_id=dashboard_a.id)

              # User B tries to access graph from dashboard A → should get 403
              token = create_access_token(user_b.id)
              response = await authenticated_client.get(
                  f"/graphs/{graph.id}",
                  headers={"Authorization": f"Bearer {token}"}
              )
              assert response.status_code == 403

