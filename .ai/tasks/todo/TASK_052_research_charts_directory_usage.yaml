id: TASK_052_research_charts_directory_usage

title: Research empty charts directory purpose and document recommendations (FE-012)

status: pending

priority: low

depends_on: []

description: >
  The frontend/src/features/charts directory exists but is completely empty (no files).
  Before removing it, research its intended purpose and document the findings. This is a
  research + documentation task, not a deletion task.

  Under Feature-Sliced Design (FSD), features/charts/ would be the natural home for
  chart-related business features (chart configuration, chart templates, chart export,
  etc.). The existing chart rendering components live in features/dashboards/ui/charts/,
  but a dedicated charts feature could provide reusable chart utilities independent
  of the dashboard context.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: FE-012

goals:
  - Research why the features/charts directory was created and left empty
  - Identify chart-related functionality that could live in this directory
  - Document recommendations in PLAN_02.md for the charts feature module
  - Decide whether to: (a) populate with planned chart features, (b) keep as documented
    placeholder for future development, or (c) remove if not needed

files:
  - path: frontend/src/features/charts/
    targets:
      - type: directory
        name: charts
    semantic_anchors:
      - research_and_document:
          description: Research purpose and document recommendations

  - path: .ai/plans/PLAN_02.md
    targets:
      - type: document
        name: PLAN_02.md
    semantic_anchors:
      - update:
          description: Add charts feature module recommendations to PLAN_02.md

changes:
  - action: research
    description: |
      Investigate the following:
      1. Check git history for features/charts/ to understand why it was created
      2. Review the existing chart components in features/dashboards/ui/charts/
         (BarChart, LineChart, PieChart, TableChart, ChartRenderer, PlotlyChart)
         to identify what could be extracted into a standalone charts feature
      3. Identify chart-related functionality that doesn't belong in dashboards:
         - Chart configuration builder/edito
         - Chart export (PNG, PDF, SVG)
         - Chart templates library
         - Chart data transformation utilities
         - Embeddable chart widget for external use
      4. Determine if the directory should be: (a) populated with a planned feature,
         (b) kept with a README.md explaining its purpose, or (c) removed

  - action: create
    description: |
      If the directory is kept, add a README.md explaining its intended purpose
      and planned features. If removed, document the decision in PLAN_02.md.

    code_hint: |
      # Option A: Keep with README.md
      # frontend/src/features/charts/README.md:
      # Charts Feature Module
      #
      # This module provides reusable chart utilities independent of the dashboard context.
      #
      # Planned features:
      # - Chart configuration builder
      # - Chart export (PNG, PDF, SVG)
      # - Chart templates library
      # - Embeddable chart widget
      #
      # Related: features/dashboards/ui/charts/ for dashboard-specific chart rendering.

      # Option B: Remove and document in PLAN_02.md

acceptance_criteria:
  - PLAN_02.md updated with charts directory research findings and recommendations
  - Decision documented: populate, keep with docs, or remove
  - If kept: README.md exists explaining the module's purpose and planned features
  - If removed: justification documented and directory deleted
  - No broken imports or references to features/charts/

risk: minimal

tests_to_run:
  - "cd frontend && npm run build"
