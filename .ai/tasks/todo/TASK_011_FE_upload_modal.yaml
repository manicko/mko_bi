id: TASK_011_FE_upload_modal

title: Convert upload flow from page to modal dialog

status: pending

priority: high

depends_on:
  - TASK_002_FE_toast_config

description: >
  Convert the upload flow from a separate page (UploadPage at /dashboard/:id/upload) to a
  modal dialog (UploadModal) opened from the dashboard view page. Remove the upload route
  and integrate the modal into DashboardView.

goals:
  - UploadModal.tsx created with upload logic extracted from UploadPage.tsx
  - Modal opens from "Upload Data" button on DashboardView
  - Modal contains: mode toggle, FileDropzone, upload progress, processing status polling
  - On success: close modal and invalidate dashboard data queries
  - /dashboard/:id/upload route removed from routes.tsx
  - UploadPage.tsx deleted
  - No page reload on upload — only dashboard data refreshes

files:
  - path: frontend/src/features/upload/ui/UploadModal.tsx
    targets:
      - type: component
        name: UploadModal
    semantic_anchors:
      insert_after:
        type: component_creation
        value: UploadModal component

  - path: frontend/src/features/dashboards/ui/DashboardView.tsx
    targets:
      - type: component
        name: DashboardView
    semantic_anchors:
      update_zone:
        type: jsx_block
        value: Upload button onClick handler — replace navigate with modal state

  - path: frontend/src/app/routes.tsx
    targets:
      - type: component
        name: AppRoutes
    semantic_anchors:
      remove_zone:
        type: route_definition
        value: /dashboard/:id/upload route

  - path: frontend/src/features/upload/index.ts
    targets:
      - type: file
        name: upload feature index
    semantic_anchors:
      update_zone:
        type: export_statement
        value: Export UploadModal instead of UploadPage

  - path: frontend/src/features/upload/ui/UploadPage.tsx
    targets:
      - type: file
        name: UploadPage.tsx
    semantic_anchors:
      remove_zone:
        type: file_deletion
        value: UploadPage.tsx — delete after logic extraction

changes:
  - action: create_file
    description: Create UploadModal.tsx with upload logic extracted from UploadPage.tsx, wrapped in Dialog
  - action: update_code
    description: Update DashboardView to use UploadModal instead of navigation to upload page
  - action: remove_code
    description: Remove /dashboard/:id/upload route from routes.tsx
  - action: remove_code
    description: Remove UploadPage import from routes.tsx
  - action: update_code
    description: Update upload feature index to export UploadModal instead of UploadPage
  - action: delete_file
    description: Delete UploadPage.tsx after confirming all logic extracted and route removed

acceptance_criteria:
  - UploadModal created and functional
  - Upload route removed from routes.tsx
  - DashboardView opens upload as modal
  - No page navigation during upload
  - Dashboard data refreshes after successful upload
  - UploadPage.tsx deleted and no dead imports remain

tests_to_run:
  - cd frontend && npx tsc --noEmit

risk_level: high

wave: 3

plan_source: PLAN_01_upload_modal.md
