id: TASK_029_V020
title: Remove weak default JWT secret from docker-compose production config
status: pending
priority: medium
depends_on: []

description: >
  Default JWT__SECRET_KEY in docker-compose.yml is "change-me-in-production". This weak
  default could be used in production if not overridden.

goals:
  - Remove default JWT secret from production docker-compose
  - Require explicit env var or Docker secret
  - Add a comment documenting the requirement

files:
  - path: docker-compose.yml
    targets:
      - type: environment_variable
        name: JWT__SECRET_KEY
    semantic_anchors:
      - type: env_value
        description: "JWT__SECRET_KEY: ${JWT__SECRET_KEY:-change-me-in-production}"
    changes:
      - action: remove_default
        description: "Remove the default value, require explicit env var"
        code_hint: "JWT__SECRET_KEY: ${JWT__SECRET_KEY:?JWT__SECRET_KEY must be set}"

  - path: docker-compose.prod.yml
    targets:
      - type: environment_variable
        name: JWT__SECRET_KEY
    semantic_anchors:
      - type: env_value
        description: "JWT__SECRET_KEY in production compose"
    changes:
      - action: remove_default
        description: "Remove default from production compose too"

acceptance_criteria:
  - Production compose files require explicit JWT secret
  - Development compose still works (or has a documented dev-only default)
  - Application fails to start without JWT secret in production

tests_to_run:
  - uv run pytest tests/ -x -v

risk_level: medium
notes: >
  Ensure all deployment configurations have JWT__SECRET_KEY set before making
  this change. Could cause production outages if not coordinated.
