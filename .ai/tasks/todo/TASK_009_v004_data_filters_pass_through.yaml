id: TASK_009_v004_data_filters_pass_through

title: "V-004: Pass parsed filters to get_aggregated_data service method"

status: pending

priority: high

depends_on:
  - TASK_008_verify_v005_inline_access_checks

description: >
  src/mkobi/api/routes/data.py accepts a filters query parameter (JSON string),
  validates it with json.loads(), but the parsed result is never passed to
  data_service.get_aggregated_data(). The service call only passes dashboard_id,
  graph_id, and db. Filters are silently discarded. This is a data correctness
  issue — clients believing they are filtering data receive unfiltered results.

goals:
  - Pass parsed filters from route handler to data_service.get_aggregated_data()
  - Implement filtering logic in the service layer (DB query or Polars post-processing)
  - Ensure filter contract is defined (structure, operators, semantics)

files:
  - path: src/mkobi/api/routes/data.py
    targets:
      - type: function
        name: get_aggregated_data_endpoint
    semantic_anchors:
      insert_before:
        type: function_call
        value: "data_service.get_aggregated_data"
      context: "Pass filters as additional parameter to service call"

  - path: src/mkobi/services/data_service.py
    targets:
      - type: method
        name: get_aggregated_data
    semantic_anchors:
      insert_after:
        type: method_parameter_list
        value: "get_aggregated_data"
      context: "Add filters parameter and filtering logic"

changes:
  - action: modify_code
    description: >
      Route handler: forward the parsed filters variable to
      data_service.get_aggregated_data(... filters=parsed_filters).
      Service method: accept optional filters parameter and apply filtering
      either at DB query level (preferred for performance) or in Polars
      post-processing (for complex JSONB filtering).
    anchor: "get_aggregated_data_endpoint function and get_aggregated_data method"

acceptance_criteria:
  - Filters parameter is forwarded from route to service
  - Service applies filters to returned data
  - Existing tests pass (filters=None default preserves current behavior)
  - New test verifies filters actually filter the response

tests_to_run:
  - pytest tests/test_data_service.py tests/ -x --tb=short -k 'data or aggregat'

risk_level: medium (requires defining filter contract, risk of incomplete implementation)

source_findings:
  - V-004
  - R1-F009
  - R3-data-filters

estimated_effort: medium (route parameter passing + service layer filtering logic)
