id: TASK_014_useauth_force_redirect

title: Handle force password redirect in useAuth.ts login callback and silent refresh

status: pending

priority: medium

depends_on:
  - TASK_010_apitypes_force_flag

description: >
  Modify `frontend/src/features/auth/model/useAuth.ts` to handle force password
  redirect. (1) Change the `login()` callback so it returns the AuthResponse
  (including user data) to the caller instead of being void. This allows
  LoginForm.tsx to check `response.user.force_password_change` and navigate
  accordingly. (2) In the silent refresh `useEffect`: after fetching the profile,
  check `profile.force_password_change`. If true, redirect via `window.location.href`
  to `/profile/change-password?force=true`.

goals:
  - login() returns AuthResponse so caller can check force_password_change
  - LoginForm will use the response to navigate to correct destination
  - No navigation logic remains inside useAuth.login()
  - Silent refresh also checks force_password_change and redirects
  - Clean separation: useAuth manages auth state, LoginForm manages navigation

files:
  - path: frontend/src/features/auth/model/useAuth.ts
    targets:
      - type: function
        name: login
      - type: useEffect
        name: silent_refresh
    semantic_anchors:
      modify:
        type: callback
        name: login
      insert_after:
        type: statement
        name: setUser(profile)
        # In the silent refresh useEffect block

changes:
  - action: modify_login
    description: >
      Change the login callback from void to returning AuthResponse.
      After `setUser(response.user)`, add `return response`.
    code_hint: |
      # FROM:
      const login = useCallback(async (email: string, password: string) => {
        setIsLoading(true)
        try {
          const response = await apiLogin(email, password)
          setToken(response.access_token)
          setUser(response.user)
        } catch (error) {
          removeToken()
          setUser(null)
          throw error
        } finally {
          setIsLoading(false)
        }
      }, [])

      # TO:
      const login = useCallback(async (email: string, password: string) => {
        setIsLoading(true)
        try {
          const response = await apiLogin(email, password)
          setToken(response.access_token)
          setUser(response.user)
          return response
        } catch (error) {
          removeToken()
          setUser(null)
          throw error
        } finally {
          setIsLoading(false)
        }
      }, [])

  - action: modify_silent_refresh
    description: >
      In the silent refresh useEffect (the block starting `if (!token)`),
      after `setUser(profile)`, check `profile.force_password_change`. If true,
      use `window.location.href` to navigate to `/profile/change-password?force=true`
      (avoids navigate() dependency inside useEffect).
    code_hint: |
      # After setUser(profile) in the silent refresh block:
      if (profile.force_password_change) {
        window.location.href = '/profile/change-password?force=true'
      }

acceptance_criteria:
  - login() returns the AuthResponse (including user data with force_password_change)
  - No navigation logic inside useAuth.login()
  - LoginForm receives the response to make routing decision
  - Silent refresh checks profile.force_password_change and redirects via window.location.href
  - TypeScript compiles without error

tests_to_run:
  - cd frontend && npx tsc --noEmit

