---
id: TASK_019_be008_exception_handler_format

title: "BE-008: Standardize exception handlers to use consistent error format"

status: pending

priority: low

depends_on:
  - TASK_001_be001_rate_limiter_fix
  - TASK_002_fe006_grant_access_dashboard_id

type: implementation

description: >
  The exception handlers in `app.py` for `StarletteHTTPException`, `RequestValidationError`,
  and `Pydantic ValidationError` return responses without the `error_code` field that
  `AppException` provides. Also, the custom `AppException` handler in `utils/exceptions.py`
  is registered but never wired in `create_app()`. Fix: add `error_code` to the standard
  handlers and wire the `AppException` handler in `create_app()`.

source_reference: "C:\\py_dev\\mkobi\\.ai\\audit\\99-validation\\01-backend-validated.md"
source_section: "BE-008: Exception handlers don't use standard error format — LOW (advisory)"

affected_files:
  - path: "src/mkobi/app.py"
    targets:
      - type: function
        name: create_app
      - type: function
        name: http_exception_handler
      - type: function
        name: validation_exception_handler
    semantic_anchors:
      insert_after:
        type: decorator
        value: "app.add_exception_handler"
    changes:
      - action: add_code
        description: "Wire the AppException handler in create_app()"
        code_hint: |
          from src.mkobi.utils.exceptions import AppException, app_exception_handler
          app.add_exception_handler(AppException, app_exception_handler)
      - action: modify_code
        description: "Add error_code to StarletteHTTPException handler response"
        old_hint: |
          return JSONResponse(
              status_code=exc.status_code,
              content={"detail": exc.detail},
          )
        new_hint: |
          return JSONResponse(
              status_code=exc.status_code,
              content={"detail": exc.detail, "error_code": f"HTTP_{exc.status_code}"},
          )

acceptance_criteria:
  - "AppException handler is wired in create_app()"
  - "HTTP exception responses include error_code field"
  - "Validation exception responses include error_code field"
  - "ruff + mypy pass"

