id: TASK_068_remove_redundant_filter_invalidation

title: Remove redundant filter invalidation useEffect in DashboardView

status: pending

priority: medium

depends_on: []
  # No dependencies — standalone frontend cleanup

source_reference: C:\py_dev\mkobi\.ai\audit\validated\validated-findings.md
source_section: FE-002 — Double data fetch in DashboardView due to redundant invalidation

description: >
  DashboardView has a useEffect that explicitly calls invalidateAggregatedData(id)
  on every filter change. However, the useAggregatedData query already includes
  filters in its queryKey, so TanStack Query automatically refetches when filters
  change. The explicit invalidation causes an unnecessary additional request cycle:
  one from the automatic key change and one from the manual invalidation.

goals:
  - Remove redundant useEffect causing double data fetch
  - Rely on TanStack Query automatic refetch via queryKey change
  - Reduce unnecessary network requests
  - Preserve existing filter change behavior

files:
  - path: frontend/src/features/dashboards/ui/DashboardView.tsx

    targets:
      - type: component
        name: DashboardView

      - type: react_hook
        name: useEffect

    semantic_anchors:

      remove:
        type: effect_block
        value: "useEffect(() => {\n    if (id && Object.keys(filters).length > 0) {\n      void invalidateAggregatedData(id)\n    }\n  }, [filters, id, invalidateAggregatedData])"

changes:

  - action: remove_code

    description: >
      Remove the useEffect block at lines 62-66 that manually invalidates aggregated
      data on filter changes. The useAggregatedData query key already includes filters,
      so TanStack Query automatically refetches when filters change.

    code_hint: |
      # Remove this entire block:
      useEffect(() => {
        if (id && Object.keys(filters).length > 0) {
          void invalidateAggregatedData(id)
        }
      }, [filters, id, invalidateAggregatedData])

      # If invalidateAggregatedData is no longer used elsewhere in this file,
      # also remove the import and destructuring from useDashboardData().

acceptance_criteria:
  - Redundant useEffect removed
  - Filter changes still trigger data refetch (via TanStack Query key change)
  - No double network requests on filter change
  - Build passes (npm run build)
  - Tests pass

tests_to_run:
  - npm run build
  - npm test

risk: low
