id: TASK_043_d003_temp_password_security_note

title: "D-003: Add temp password security note in SPEC.md"

status: pending

priority: low

depends_on:
  - TASK_042_verify_d002_spec_upload_version_history

description: >
  Registration approval returns temp_password in plaintext JSON response.
  Spec requires secrets.token_urlsafe(16) returned to admin but has no
  documentation about secure transmission. Add security note in SPEC.md
  about handling temp passwords.

goals:
  - Add security note about temp_password in SPEC.md
  - Document secure transmission requirements (HTTPS, one-time use, etc.)

files:
  - path: docs/SPEC.md
    targets:
      - type: section
        context: "Registration approval endpoint documentation"
    semantic_anchors:
      insert_after:
        type: heading_or_text
        value: "registration"
      context: "Find the registration approval section"

changes:
  - action: add_text
    description: >
      Add a security note near the temp_password documentation:
      - Temp password is returned in plaintext — ensure HTTPS is enforced
      - Password should be one-time use (force change on first login)
      - Do not log temp_password in application logs
      - Recommend admin communicates temp password through secure channel
    anchor: "SPEC.md, registration approval endpoint section"

acceptance_criteria:
  - Security note added to SPEC.md
  - Note covers HTTPS, one-time use, no-logging, secure channel
  - Spec documents secure transmission requirements

tests_to_run:
  - echo "Doc change only — verify manually"

risk_level: trivial (documentation update)

source_findings:
  - D-003

estimated_effort: trivial
