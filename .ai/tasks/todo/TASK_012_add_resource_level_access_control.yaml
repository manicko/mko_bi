id: TASK_012_add_resource_level_access_control

title: Add resource-level access control to dashboard update/delete endpoints (SEC-003)

status: pending

priority: high

depends_on:
  - TASK_006_fix_custom_permission_error_shadow

source_reference: C:\py_dev\mkobi\.ai\audit\validated\final-report.md
source_section: SEC-003 — Dashboard update/delete endpoints lack resource-level access control

description: >
  The dashboard update and delete endpoints only check role-level permissions (admin/editor)
  but do not verify that the user has access to the specific dashboard resource. Any editor
  can update/delete any dashboard. Add resource-level access control that checks the user's
  explicit access grants before allowing modifications.

goals:
  - Add resource-level access check to dashboard update endpoint
  - Add resource-level access check to dashboard delete endpoint
  - Return 403 when user lacks access to the specific dashboard
  - Admin role bypasses resource-level checks (already has full access)

files:
  - path: src/mkobi/api/routes/dashboards_crud.py
    targets:
      - type: route_handler
        name: (update_dashboard and delete_dashboard handlers)
    semantic_anchors:
      insert_after:
        type: decorator
        value: @router.put
    changes:
      - action: add_code
        description: Add resource-level access check before update/delete operations
        code_hint: |
          # Check resource-level access
          access_repo = AccessRepository(session)
          if not await access_repo.has_access(current_user.id, dashboard_id):
              raise DashboardPermissionError("You don't have access to this dashboard")

acceptance_criteria:
  - Dashboard update endpoint checks resource-level access
  - Dashboard delete endpoint checks resource-level access
  - Users without dashboard access get 403 on update/delete
  - Admin users can still update/delete any dashboard
  - Access control tests pass

tests_to_run:
  - pytest tests/ -v -k "dashboard" --tb=short
  - pytest tests/ -v -k "access" --tb=short

risk: medium

notes: >
  HIGH — Security-critical. Depends on TASK_006 for DashboardPermissionError rename.
  Ensure the access check is efficient (single DB query per request).
