id: TASK_052_int011_fix_frontend_env_validation

title: Fix INT-011 — Add frontend environment variable validation at startup

status: pending

priority: high

depends_on: []

description: >
  Fix the HIGH issue where frontend environment variables are not validated at startup.
  Missing VITE_API_URL causes a runtime error with an unhelpful message. Add validation
  in a startup check file that verifies all required env vars are set.

source_file: .ai/audit/99-validation/90-integration-validated.md
source_section: INT-011: Frontend Environment Variables are Not Validated

files:
  - path: frontend/src/shared/config/env.ts
    targets:
      - type: function
        name: validateEnv
  - path: frontend/src/main.tsx
    targets:
      - type: function
        name: main entry point

changes:
  - action: add_code
    description: >
      Create frontend/src/shared/config/env.ts with a validateEnv() function that
      checks all required VITE_* environment variables are set. Throw a descriptive
      error listing all missing variables.
    - action: add_code
    description: Call validateEnv() at the top of main.tsx before ReactDOM.createRoot.

acceptance_criteria:
  - validateEnv() function exists and checks all required VITE_* variables
  - Called at startup before React renders
  - Throws descriptive error listing all missing variables
  - Error message is user-friendly: "Missing required environment variables: VITE_API_URL"

risk_notes: >
  Low risk — adds startup validation. Only affects failure mode (better error message).

tests_to_run:
