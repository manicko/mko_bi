id: TASK_029_V033_plotly_type_imports

title: Fix Plotly type imports to use react-plotly.js instead of plotly.js

status: pending

priority: low

depends_on: []

description:
  Data and Layout types are imported from plotly.js but the actual chart
  components use react-plotly.js. This type mismatch may cause subtle issues.
  This task verifies type compatibility and updates imports if needed.

finding_ref: V-033
severity: LOW

goals:
  - Verify type compatibility between plotly.js and react-plotly.js
  - Update imports to use react-plotly.js types if available
  - Ensure type safety in chart components

files:
  - path: frontend/src/shared/types/api.types.ts
    targets:
      - type: import_statement
        name: Data and Layout from plotly.js
    semantic_anchors:
      replace: import from 'plotly.js' to 'react-plotly.js' if types available

changes:
  - action: update_imports
    description: >
      Update type imports to match the actual runtime library (react-plotly.js).
    code_hint: |
      # Before:
      import { Data, Layout } from 'plotly.js';
      # After:
      import { Data, Layout } from 'react-plotly.js';
      # OR use Plotly.PlotData from plotly.js if react-plotly.js doesn't export types

acceptance_criteria:
  - Type imports match the runtime library
  - No TypeScript compilation errors
  - Chart components render correctly

tests_to_run:
  - cd frontend && npx tsc --noEmit

risk_level: low

rollout_notes: >
  Low risk. Type-level fix. No backend dependencies.
