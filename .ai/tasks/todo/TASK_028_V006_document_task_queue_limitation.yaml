id: TASK_028_V006
title: Document in-memory task queue limitation and plan Redis/RQ migration path
status: pending
priority: medium
depends_on: []

description: >
  The TaskQueue uses asyncio.Queue — an in-memory queue. All queued tasks are lost on
  application restart. This is an MVP limitation that needs documentation and a migration plan.

goals:
  - Document the current in-memory queue limitation
  - Add a comment/warning in the code about task loss on restart
  - Create a migration plan for Redis/RQ integration
  - Add a configuration flag to warn in production

files:
  - path: src/mkobi/core/task_queue.py
    targets:
      - type: class
        name: TaskQueue
    semantic_anchors:
      - type: class_definition
        description: "TaskQueue class using asyncio.Queue"
    changes:
      - action: add_warning
        description: "Add module-level warning about in-memory queue limitations"
        code_hint: "logger.warning('Using in-memory task queue - tasks will be lost on restart')"

  - path: docs/TASK_QUEUE_MIGRATION.md
    targets:
      - type: new_file
        description: "Migration plan document"
    changes:
      - action: create_file
        description: "Create migration plan from in-memory queue to Redis/RQ"

acceptance_criteria:
  - In-memory queue limitation is documented in code
  - Migration plan document exists
  - Production deployments are aware of the limitation
  - Existing tests pass

tests_to_run:
  - uv run pytest tests/ -x -v

risk_level: low
notes: >
  This is a documentation/planning task, not a full Redis/RQ integration.
  Full integration is a larger architectural change that should be planned separately.
