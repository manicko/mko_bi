    description: >
      Create tests/core/test_temp_password_store.py with unit tests for TempPasswordStore.
      Use fakeredis for isolated testing.

    code_hint: |
      import pytest
      import fakeredis
      from mkobi.core.temp_password_store import TempPasswordStore


      @pytest.fixture
      def redis_client():
          return fakeredis.FakeRedis(decode_responses=True)


      @pytest.fixture
      def store(redis_client):
          return TempPasswordStore(redis_client=redis_client, ttl_seconds=3600)


      @pytest.mark.asyncio
      async def test_store_and_retrieve(store):
          await store.store("test-token-123", "secret-password")
          result = await store.retrieve("test-token-123")
          assert result == "secret-password"


      @pytest.mark.asyncio
      async def test_retrieve_single_use(store):
          await store.store("test-token-456", "secret-password")
          first = await store.retrieve("test-token-456")
          assert first == "secret-password"
          second = await store.retrieve("test-token-456")
          assert second is None


      @pytest.mark.asyncio
      async def test_retrieve_nonexistent_token(store):
          result = await store.retrieve("nonexistent-token")
          assert result is None


      @pytest.mark.asyncio
      async def test_store_failure_logged(redis_client, caplog):
          # Simulate Redis failure by using a closed client
          redis_client.close()
          store = TempPasswordStore(redis_client=redis_client, ttl_seconds=3600)
          # Should not raise, just log error
          await store.store("token", "password")


      @pytest.mark.asyncio
      async def test_retrieve_failure_returns_none(redis_client):
          redis_client.close()
          store = TempPasswordStore(redis_client=redis_client, ttl_seconds=3600)
          result = await store.retrieve("token")
          assert result is None

