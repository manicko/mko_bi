      import pytest
      from uuid import uuid4


      @pytest.mark.asyncio
      async def test_approve_returns_retrieval_token(async_client, admin_headers, test_db):
          """Approve endpoint returns retrieval_token, not temp_password."""
          # Create a registration request first
          # ... setup code ...
          response = await async_client.post(
              f"/api/v1/admin/registration-requests/{request_id}/approve",
              headers=admin_headers,
          )
          assert response.status_code == 200
          data = response.json()
          assert "retrieval_token" in data
          assert "temp_password" not in data
          assert "message" in data
          assert "user_id" in data


      @pytest.mark.asyncio
      async def test_reset_returns_retrieval_token(async_client, admin_headers, test_db):
          """Reset endpoint returns retrieval_token, not temp_password."""
          # ... setup code with existing user ...
          response = await async_client.post(
              f"/api/v1/admin/users/{user_id}/reset-password",
              headers=admin_headers,
          )
          assert response.status_code == 200
          data = response.json()
          assert "retrieval_token" in data
          assert "temp_password" not in data


      @pytest.mark.asyncio
      async def test_retrieve_valid_token(async_client, admin_headers, test_db):
          """Full flow: approve -> retrieve password."""
          # Approve a request to get retrieval_token
          # ... setup and approve ...
          response = await async_client.get(
              f"/api/v1/admin/temp-passwords/{retrieval_token}",
              headers=admin_headers,
          )
          assert response.status_code == 200
          data = response.json()
          assert "temp_password" in data
          assert len(data["temp_password"]) > 0


      @pytest.mark.asyncio
      async def test_retrieve_single_use(async_client, admin_headers, test_db):
          """Second retrieval returns 404."""
          # Approve -> retrieve once -> retrieve again -> 404
          response1 = await async_client.get(
              f"/api/v1/admin/temp-passwords/{retrieval_token}",
              headers=admin_headers,
          )
          assert response1.status_code == 200
          response2 = await async_client.get(
              f"/api/v1/admin/temp-passwords/{retrieval_token}",
              headers=admin_headers,
          )
          assert response2.status_code == 404


      @pytest.mark.asyncio
      async def test_retrieve_invalid_token(async_client, admin_headers):
          """Random token returns 404."""
          response = await async_client.get(
              f"/api/v1/admin/temp-passwords/{uuid4()}",
              headers=admin_headers,
          )
          assert response.status_code == 404


      @pytest.mark.asyncio
      async def test_retrieve_requires_admin(async_client, viewer_headers):
          """Non-admin gets 403."""
          response = await async_client.get(
              f"/api/v1/admin/temp-passwords/{uuid4()}",
              headers=viewer_headers,
          )
          assert response.status_code == 403


      @pytest.mark.asyncio
      async def test_retrieve_expired_token(async_client, admin_headers, test_db):
