id: TASK_028_V021
title: Remove weak default database password from Docker Compose
status: pending
priority: medium
depends_on: []
wave: 3

description: >
  Default DATABASE__PASSWORD is "1234" in production compose. Remove default
  in production compose. Require explicit env var or Docker secret.

goals:
  - No default database password in production compose files
  - Database password must be explicitly configured
  - Development compose can have a default for convenience
  - Documentation updated to explain database password configuration

files:
  - path: docker-compose.yml
    targets:
      - type: environment_variable
        value: DATABASE__PASSWORD
    semantic_anchors:
      insert_after:
        type: yaml_key
        value: DATABASE__PASSWORD
    changes:
      - action: modify_code
        description: Remove the default value for DATABASE__PASSWORD. Add a comment indicating this must be set via environment variable or Docker secret. For docker-compose.override.yml (dev), a development default is acceptable.

acceptance_criteria:
  - Production compose has no default database password
  - Application fails to start with clear error if database password not set
  - Development compose still works with a default
  - Documentation explains how to set database password

tests_to_run:
  - tests/

risk_level: medium
risk_notes: CRITICAL: Ensure all production deployments have database password configured before deploying this change.

validated_finding: V-021
severity: MEDIUM
