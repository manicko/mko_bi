id: task_006
title: Fix rate limiter instance creation in _handle_login to use cached instance from auth_service
status: pending
priority: medium
depends_on: []
description: >
  Modify the _handle_login function in auth.py to use the AsyncRateLimiter instance already cached in the auth_service (auth_service._rate_limiter) instead of creating a new instance on every login attempt.
goals:
  - Eliminate unnecessary rate limiter instance creation
  - Improve efficiency by reusing the existing rate limiter
  - Maintain consistency with the service pattern used elsewhere in the codebase
files:
  - path: src/mkobi/api/routes/auth.py
    targets:
      - type: function
        name: _handle_login
    semantic_anchors:
      - type: function
        name: _handle_login
    changes:
      - action: replace
        old_text: "    # Apply rate limiting for login attempts\n    rate_limiter = AsyncRateLimiter(redis_client.get_async_redis_client())\n    if not await rate_limiter.check_rate_limit(\n        f\"login:{email}\", max_attempts=5, ttl=300\n    ):"
        new_text: "    # Apply rate limiting for login attempts\n    rate_limiter = auth_service._rate_limiter\n    if not await rate_limiter.check_rate_limit(\n        f\"login:{email}\", max_attempts=5, ttl=300\n    ):"
acceptance_criteria:
  - The _handle_login function uses auth_service._rate_limiter instead of creating a new AsyncRateLimiter instance
  - The rate limiting functionality remains the same (same key, max_attempts, ttl)
  - Tests pass
tests_to_run:
  - tests/test_auth.py
risk_level: low