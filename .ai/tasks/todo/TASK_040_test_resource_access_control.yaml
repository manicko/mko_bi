description: >
  Implementing TASK_012 adds resource-level access checks to dashboard update/delete
  endpoints. Write tests that verify users without explicit access to a dashboard
  cannot modify or delete it, while users with access and admins can.

goals:
  - Test that a user without dashboard access gets 403 on update
  - Test that a user without dashboard access gets 403 on delete
  - Test that a user with editor access can update
  - Test that an admin can update/delete any dashboard (bypass)
  - Test that the dashboard owner can update/delete
  - Test that access list is checked (not just role level)

