    changes:
      - action: create_file
        description: Create resource-level access control tests
        code_hint: |
          import pytest
          from httpx import AsyncClient


          class TestResourceAccessControl:
            """Test resource-level access control on dashboard CRUD."""

            async def test_no_access_user_cannot_update(
                self, client: AsyncClient, no_access_headers, dashboard_id
            ):
                """User without dashboard access should get 403 on update."""
                response = await client.put(
                    f"/api/v1/dashboards/{dashboard_id}",
                    headers=no_access_headers,
                    json={"name": "Hacked Name"}
                )
                assert response.status_code == 403

            async def test_no_access_user_cannot_delete(
                self, client: AsyncClient, no_access_headers, dashboard_id
            ):
                """User without dashboard access should get 403 on delete."""
                response = await client.delete(
                    f"/api/v1/dashboards/{dashboard_id}",
                    headers=no_access_headers
                )
                assert response.status_code == 403

            async def test_admin_can_update_any_dashboard(
                self, client: AsyncClient, admin_headers, dashboard_id
            ):
                """Admin should bypass resource-level checks."""
                response = await client.put(
                    f"/api/v1/dashboards/{dashboard_id}",
                    headers=admin_headers,
                    json={"name": "Admin Updated"}
                )
                assert response.status_code == 200

            async def test_user_with_access_can_update(
                self, client: AsyncClient, editor_headers, editor_dashboard_id
            ):
                """User with explicit dashboard access should succeed."""
                response = await client.put(
                    f"/api/v1/dashboards/{editor_dashboard_id}",
                    headers=editor_headers,
                    json={"name": "Editor Updated"}
                )
                assert response.status_code == 200

acceptance_criteria:
