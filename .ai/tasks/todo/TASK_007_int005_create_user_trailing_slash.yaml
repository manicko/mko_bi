description: >
  The frontend `createUser` function posts to `/users` (no trailing slash), but the backend
  registers the route with `prefix="/users"` and `redirect_slashes=False`. With redirect_slashes
  disabled, FastAPI won't redirect `/users` to `/users/`, causing a 404 for any admin user
  creation attempt. This is a single-line frontend URL fix.

