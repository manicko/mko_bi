id: TASK_004_04_password_change_endpoint

title: Backend Password Change Endpoint

status: pending

priority: high

depends_on:
  - TASK_001_01_admin_user_creation

wave: 2

description: >
  Add POST /auth/change-password endpoint with ChangePasswordRequest model and
  AuthService.change_password() method. Requires current password verification,
  new password + confirmation matching, and returns appropriate HTTP status codes.

goals:
  - Add ChangePasswordRequest Pydantic model
  - Add change_password() method to AuthService
  - Add POST /auth/change-password route
  - Require authentication via JWT

files:
  - path: src/mkobi/models/auth.py
    targets:
      - type: class
        name: RefreshRequest
    semantic_anchors:
      insert_after:
        type: class
        name: RefreshRequest
    changes:
      - action: add_class
        description: Add ChangePasswordRequest model after RefreshRequest
        class:
          name: ChangePasswordRequest
          base: BaseModel
          fields:
            - name: current_password
              type: str
            - name: new_password
              type: str
            - name: confirm_password
              type: str
          config:
            from_attributes: true
            json_schema_extra:
              example:
                current_password: "old_password123"
                new_password: "new_secure_password456"
                confirm_password: "new_secure_password456"

  - path: src/mkobi/services/auth_service.py
    targets:
      - type: class
        name: AuthService
    semantic_anchors:
      insert_after:
        type: method
        name: register_request
    changes:
      - action: add_method
        description: Add change_password() method to AuthService after register_request
        method:
          name: change_password
          signature: |
            async def change_password(
                self,
                user_id: UUID,
                current_password: str,
                new_password: str,
                db: AsyncSession | None = None,
            ) -> bool
          logic: |
            If db is None, open new session and recurse.
            Get user by email with hash from user_repo.
            Verify current password with verify_password().
            Check new password is different from current.
            Hash new password and update via user_repo.update().
            Commit and return True.
            Raise ValueError for invalid cases.

  - path: src/mkobi/api/routes/auth.py
    targets:
      - type: route
        name: get_current_user_info
    semantic_anchors:
      insert_after:
        type: route
        name: get_current_user_info
    changes:
      - action: add_route
        description: Add POST /auth/change-password endpoint after get_current_user_info
        route:
          path: /auth/change-password
          method: POST
          status_code: 200
          summary: "Change password"
          description: "Change current user password. Requires current current password verification."
          auth_required: true
          request_model: ChangePasswordRequest
          logic: |
            Validate new_password == confirm_password (400 if mismatch).
            Call auth_service.change_password() with current_user.id.
            Return 200 with success message.
            Handle ValueError as 401.

acceptance_criteria:
  - POST /auth/change-password requires authentication
  - Current password must be verified before change
  - New password and confirmation must match
  - Returns 400 if confirmation mismatch
  - Returns 401 if current password is wrong
  - Returns 200 with success message on success
  - User remains logged in (token not invalidated)
  - Existing tests pass

tests_to_run:
  - "pytest tests/ -x -v"

risk_level: medium

autonomous: true
