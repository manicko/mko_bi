id: TASK_033_fe006_consolidate_error_query_hooks

title: Fix FE-006 — Consolidate error/query hooks into a shared API error handler

status: pending

priority: low

depends_on: []

description: >
  Fix the LOW issue where each feature has its own error/query hooks with duplicated
  error handling logic. Consolidate into a shared error handler in shared/api/errorHandler.ts
  with a single useApiError hook.

source_file: .ai/audit/99-validation/02-frontend-validated.md
source_section: FE-006: Consolidate Error/Query Hooks

files:
  - path: frontend/src/shared/api/errorHandler.ts
    targets:
      - type: function
        description: Existing error extraction chain
  - path: frontend/src/shared/hooks/useApiError.ts
    targets:
      - type: hook
        name: useApiError
  - path: frontend/src/features/dashboards/api/dashboardApi.ts
  - path: frontend/src/features/upload/api/uploadApi.ts

changes:
  - action: add_code
    description: >
      Create useApiError hook that extracts error messages from the standardized
      RFC 7807 error format. Use the existing error extraction chain in
      errorHandler.ts (legacy → RFC 7807 → field-level → AxiosError → generic).
  - action: replace_code
    description: >
      Refactor dashboardApi.ts and uploadApi.ts query hooks to use the shared
      useApiError hook instead of inline error handling.

acceptance_criteria:
  - useApiError hook exists and extracts messages from RFC 7807 format
  - dashboardApi.ts and uploadApi.ts use useApiError
  - No duplicate error handling logic across features

risk_notes: >
  Low risk — refactoring existing error handling into a shared location.

tests_to_run:
  - command: cd frontend && npm run build
    reason: Verify build succeeds after hook consolidation
