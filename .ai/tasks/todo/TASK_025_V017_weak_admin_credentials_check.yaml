id: TASK_025_V017_weak_admin_credentials_check

title: Strengthen validate_admin_credentials() to check against known-weak values

status: pending

priority: medium

depends_on: []

description: >
  validate_admin_credentials() checks admin_username == "admin" but the default
  admin email in .env is admin@example.com. The validator won't catch if someone
  sets ADMIN_USERNAME=admin in production. This task checks against a set of
  known-weak values.

finding_ref: V-017
severity: MEDIUM

goals:
  - Check against a set of known-weak values: {"admin", "administrator", "root"}
  - Strengthen weak credential detection
  - Cover both username and password fields

files:
  - path: src/mkobi/config.py
    targets:
      - type: class
        name: Settings
      - type: method
        name: validate_admin_credentials
    semantic_anchors:
      replace: single-value "admin" check with set-based check

changes:
  - action: strengthen_validation
    description: >
      Replace single-value check with a set of known-weak values.
    code_hint: |
      WEAK_USERNAMES = {"admin", "administrator", "root", "test", "user"}
      WEAK_PASSWORDS = {"password", "123456", "admin", "secret", "test"}

      @model_validator(mode="after")
      def validate_admin_credentials(self):
          if self.admin_username.lower() in WEAK_USERNAMES:
              raise ValueError(
                  f"Admin username '{self.admin_username}' is too common. "
                  "Please choose a more secure username."
              )
          if self.admin_password.lower() in WEAK_PASSWORDS:
              raise ValueError(
                  "Admin password is too common. Please choose a more secure password."
              )
          return self

acceptance_criteria:
  - Validation checks against set of known-weak usernames
  - Validation checks against set of known-weak passwords
  - Clear error messages for weak credentials
  - Non-weak credentials pass validation

tests_to_run:
  - pytest tests/ -k "config or admin or credential" -v

risk_level: low

rollout_notes: >
  Safe. No dependencies. Simple validation improvement.
