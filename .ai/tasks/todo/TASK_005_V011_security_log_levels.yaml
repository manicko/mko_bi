id: TASK_005_V011_security_log_levels

title: Change security operation log statements from INFO to DEBUG level

status: pending

priority: medium

depends_on: []

description: >
  hash_password(), verify_password(), and decode_token() in security.py log
  success at INFO level. In production, this creates noise and could leak timing
  information about user creation/registration events. All security-relevant
  operations should log at DEBUG level only.

finding_ref: V-011
severity: MEDIUM

goals:
  - Change all security operation log statements from INFO to DEBUG
  - Reduce production log noise
  - Prevent timing information leakage

files:
  - path: src/mkobi/core/security.py
    targets:
      - type: function
        name: hash_password
      - type: function
        name: verify_password
      - type: function
        name: decode_token
    semantic_anchors:
      replace: logger.info(...) calls with logger.debug(...) in each function

changes:
  - action: modify_log_level
    description: >
      Change all logger.info() calls in hash_password, verify_password, and
      decode_token to logger.debug().
    code_hint: |
      # Before:
      logger.info("Password hashed successfully")
      # After:
      logger.debug("Password hashed successfully")

acceptance_criteria:
  - All security operation log statements use DEBUG level
  - No INFO-level logs for password hashing, verification, or token decoding
  - Logging still works when LOG_LEVEL is set to DEBUG

tests_to_run:
  - pytest tests/ -k "security or auth or token" -v

risk_level: low

rollout_notes: >
  Safe. No dependencies. Simple log level change across 3 functions.
