id: TASK_013_remove_plaintext_temp_passwords

title: Remove plaintext temporary passwords from HTTP responses (SEC-004)

status: pending

priority: high

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\final-report.md
source_section: SEC-004 — Plaintext temp passwords returned in HTTP responses

description: >
  The auth service returns plaintext temporary passwords in HTTP responses during user
  creation or password reset. This is a security risk as passwords are exposed in transit
  and potentially in logs. Remove plaintext passwords from responses and instead send
  them via a separate secure channel (email) or use a one-time setup link.

goals:
  - Remove plaintext password fields from all API responses
  - Send temporary passwords via email instead of API response
  - Ensure password reset flow does not expose passwords

files:
  - path: src/mkobi/services/auth_service.py
    targets:
      - type: method
        name: (create_user and reset_password methods)
    changes:
      - action: modify_code
        description: Remove plaintext password from return values; send via email instead
        code_hint: |
          # Instead of returning temp_password in the response:
          await email_service.send_temporary_password(user.email, temp_password)
          return UserResponse(...)  # No password field

  - path: src/mkobi/models/auth.py
    targets:
      - type: class
        name: (response models)
    changes:
      - action: remove_code
        description: Remove any password fields from response Pydantic models

acceptance_criteria:
  - No plaintext passwords in any API response
  - Temporary passwords sent via email
  - Password reset flow does not expose passwords
  - Auth tests pass

tests_to_run:
  - pytest tests/ -v -k "auth" --tb=short
  - pytest tests/ -v -k "password" --tb=short

risk: medium

notes: >
  HIGH — Security fix. If email service is not yet configured, use a one-time setup
  link approach instead. Coordinate with the email service implementation.
