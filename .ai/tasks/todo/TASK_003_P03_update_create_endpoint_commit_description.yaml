id: TASK_003_P03_update_create_endpoint_commit_description

title: Update create dashboard endpoint to commit + pass description + remove redundant reconstruction

status: pending

priority: high

depends_on:
  - TASK_001_P03_make_config_optional_add_name_validation
  - TASK_002_P03_fix_transaction_handling_add_description

description: >
  (1) Update the create_dashboard_endpoint to pass description to the service.
  (2) Add db.commit() after successful service call (since service no longer commits).
  (3) Remove redundant DashboardCreate reconstruction — FastAPI already validates
  the request body into a DashboardCreate instance.

phase: PLAN_03 — Admin Dashboard Creation
wave: 2

finding_ref: BUG-08, BUG-09
severity: medium

goals:
  - Pass description from request to service
  - Commit transaction after service returns
  - Remove redundant DashboardCreate reconstruction

files:
  - path: src/mkobi/api/routes/dashboards.py
    targets:
      - type: function
        name: create_dashboard_endpoint
    semantic_anchors:
      update:
        type: function_call
        value: "Add description=dashboard_data.description to service call"
      insert_after:
        type: function_call
        value: "Add await db.commit() after service call"
      remove:
        type: variable
        value: "Redundant DashboardCreate reconstruction"
      update:
        type: variable
        value: "Use dashboard_data instead of dashboard in logger and service calls"

changes:
  - action: update_service_call
    description: >
      Pass description and use dashboard_data directly.
    code_hint: |
      result = await dashboard_service.create_dashboard(
          name=dashboard_data.name,
          config=dashboard_data.config.model_dump(),
          owner_id=current_user.id,
          description=dashboard_data.description,
          db=db,
      )
      await db.commit()

  - action: remove_reconstruction
    description: >
      Remove the redundant DashboardCreate(...) reconstruction block.
      FastAPI already validates the request body into a DashboardCreate instance.

acceptance_criteria:
  - Endpoint passes description to create_dashboard()
  - Endpoint calls await db.commit() after successful service call
  - No redundant DashboardCreate reconstruction
  - Error handling (ValueError → 422, Exception → 500) unchanged

tests_to_run:
  - ruff check src/mkobi/api/routes/dashboards.py

risk_level: medium

rollout_notes: >
  Depends on TASK_001 (model has description field) and TASK_002
  (service signature has description param). This is the integration
  task that wires the model and service changes into the endpoint.
