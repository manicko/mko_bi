id: TASK_032_add_zod_validation_dashboard_form

title: Add Zod schema validation to dashboard create/edit forms (FE-011)

status: pending

priority: medium

depends_on: []

description: >
  The DashboardManagement.tsx create/edit forms do not use the existing
  createDashboardSchema Zod schema for client-side validation. The form data
  is sent directly to the API without validation. Add Zod validation using
  react-hook-form + @hookform/resolvers/zod, matching the pattern used by
  LoginForm and RegisterForm.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: FE-011

goals:
  - Add react-hook-form with Zod resolver to dashboard create/edit forms
  - Use existing createDashboardSchema and updateDashboardSchema
  - Show validation errors inline before submitting to API

files:
  - path: frontend/src/features/admin/ui/DashboardManagement.tsx
    targets:
      - type: function
        name: DashboardManagement
      - type: function
        name: handleCreate
      - type: function
        name: handleEdit
    semantic_anchors:
      - add_form_validation:
          value: "handleCreate"
          description: Add react-hook-form with Zod resolver

changes:
  - action: modify
    description: >
      Add react-hook-form with Zod validation to the dashboard create and edit
      dialogs. Import useForm from react-hook-form and zodResolver from
      @hookform/resolvers/zod. Use createDashboardSchema for create and
      updateDashboardSchema for edit.

    code_hint: |
      # ADD imports:
      import { useForm } from 'react-hook-form'
      import { zodResolver } from '@hookform/resolvers/zod'
      import { createDashboardSchema, updateDashboardSchema } from '../../../shared/types/formSchemas'

      # In DashboardManagement component, add forms:
      const createForm = useForm<CreateDashboardFormData>({
        resolver: zodResolver(createDashboardSchema),
        defaultValues: { name: '', description: '', layout: '' },
      })

      const editForm = useForm<UpdateDashboardFormData>({
        resolver: zodResolver(updateDashboardSchema),
        defaultValues: { name: '', description: '' },
      })

      # Replace handleCreate with:
      const handleCreate = (data: CreateDashboardFormData) => {
        createMutation.mutate({
          name: data.name,
          description: data.description,
          layout: data.layout || undefined,
        })
      }

acceptance_criteria:
  - Dashboard create form validates name (3-100 chars, alphanumeric + spaces + hyphens)
  - Dashboard edit form validates name (1-100 chars)
  - Validation errors shown inline before API call
  - Form submission blocked when validation fails
  - Tests pass

risk: medium

tests_to_run:
  - "cd frontend && npm test -- --testPathPattern=DashboardManagement"
