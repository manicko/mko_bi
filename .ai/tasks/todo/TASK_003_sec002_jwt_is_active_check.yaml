---
id: TASK_003_sec002_jwt_is_active_check

title: "SEC-002: Add is_active check in JWT authentication flow"

status: pending

priority: high

depends_on:
  - TASK_001_be001_rate_limiter_fix
  - TASK_002_fe006_grant_access_dashboard_id

type: implementation

description: >
  JWT tokens remain valid even after a user is deactivated because `is_active` is never checked
  during token validation. The `get_current_user_dependency()` in `deps.py` fetches the user
  by ID from the token but doesn't verify `user.is_active`. Similarly, `user_repo.get_by_id()`
  and `user_repo.get_by_email_with_hash()` don't filter by `is_active`.

  Fix: Add an `is_active` check in `get_current_user_dependency()` after fetching the user.
  If `user.is_active` is False, raise HTTP 401 with detail "User account is deactivated".
  This is the minimal, least-invasive fix — it doesn't require changes to the repository layer
  or the token encoding scheme.

source_reference: "C:\\py_dev\\mkobi\\.ai\\audit\\99-validation\\04-security-validated.md"
source_section: "SEC-002: JWT Tokens Not Revoked on User Deactivation — HIGH (mandatory)"

affected_files:
  - path: "src/mkobi/api/deps.py"
    targets:
      - type: function
        name: get_current_user_dependency
    semantic_anchors:
      insert_after:
        type: assignment
        value: "user = await self.user_repo.get_by_id(user_id)"
      insert_before:
        type: return_statement
        value: "return user"
    changes:
      - action: add_code
        description: "Add is_active check after fetching user and before returning"
        code_hint: |
          if not user.is_active:
              raise HTTPException(
                  status_code=status.HTTP_401_UNAUTHORIZED,
                  detail="User account is deactivated",
                  headers={"WWW-Authenticate": "Bearer"},
              )

acceptance_criteria:
