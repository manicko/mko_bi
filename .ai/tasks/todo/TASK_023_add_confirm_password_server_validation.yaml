id: TASK_023_add_confirm_password_server_validation

title: Add server-side confirm_password match validation (FE-009)

status: pending

priority: medium

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\final-report.md
source_section: FE-009 — confirm_password sent to backend but no server-side match validation

description: >
  The frontend sends confirm_password to the backend during registration and password change,
  but the backend does not validate that password matches confirm_password. Add server-side
  validation to ensure both fields match before processing.

goals:
  - Add password == confirm_password validation in the backend
  - Return 422 error if passwords don't match
  - Apply to both registration and password change endpoints

files:
  - path: src/mkobi/models/auth.py
    targets:
      - type: class
        name: (RegisterRequest or ChangePasswordRequest)
    semantic_anchors:
      insert_after:
        type: field
        value: confirm_password
    changes:
      - action: add_code
        description: Add model_validator to check password matches confirm_password
        code_hint: |
          @model_validator(mode="after")
          def check_passwords_match(self):
              if self.password != self.confirm_password:
                  raise ValueError("Passwords do not match")
              return self

acceptance_criteria:
  - Backend validates password == confirm_password
  - Mismatched passwords return 422 with clear error message
  - Registration and password change both validated
  - Auth tests pass

tests_to_run:
  - pytest tests/ -v -k "auth" --tb=short
  - pytest tests/ -v -k "register" --tb=short
  - pytest tests/ -v -k "password" --tb=short

risk: low

notes: >
  MEDIUM — Adds defense-in-depth validation. Low risk, focused change to auth model.
