id: TASK_022_add_nginx_client_max_body_size

title: Add client_max_body_size to nginx config (DC-007)

status: pending

priority: medium

depends_on: []

description: >
  The nginx configuration does not set client_max_body_size, which defaults to 1MB.
  This will cause file uploads larger than 1MB to be rejected by nginx with a 413
  Request Entity Too Large error, even though the backend allows up to 100MB uploads.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: DC-007

goals:
  - Add client_max_body_size directive to nginx config
  - Match the backend's max_file_size setting (100MB)
  - Ensure large file uploads pass through nginx

files:
  - path: docker/nginx/nginx.conf
    targets:
      - type: server_block
        name: server
    semantic_anchors:
      - add_directive:
          value: "client_max_body_size"
          description: Add inside server block, before location directives

changes:
  - action: modify
    description: >
      Add client_max_body_size directive to the server block, set to match
      the backend's max upload size (100MB).

    code_hint: |
      # BEFORE (inside server block, after server_name):
      server {
          listen 80;
          server_name localhost;

          add_header X-Content-Type-Options "nosniff" always;

      # AFTER:
      server {
          listen 80;
          server_name localhost;

          # Allow large file uploads (must match backend max_file_size)
          client_max_body_size 100m;

          add_header X-Content-Type-Options "nosniff" always;

acceptance_criteria:
  - client_max_body_size set to 100m in nginx config
  - nginx config validates successfully
  - File uploads up to 100MB pass through nginx
  - Uploads exceeding limit return proper 413 error

risk: low

tests_to_run:
  - "docker compose -f docker/docker-compose.yml exec nginx nginx -t"
