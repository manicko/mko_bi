id: TASK_009_V018
title: Fix logger inconsistency in data service
status: pending
priority: low
depends_on: []
wave: 1

description: >
  data_service.py uses logging.getLogger(__name__) instead of get_logger(__name__)
  from core.logging_config. This causes inconsistent logging format (JSON logging
  may not apply to this module).

goals:
  - Data service uses get_logger from core.logging_config
  - Consistent JSON logging format across all modules
  - One-line fix

files:
  - path: src/mkobi/services/data_service.py
    targets:
      - type: module
        name: logger
    semantic_anchors:
      insert_after:
        type: import_statement
        value: logging
    changes:
      - action: modify_code
        description: Replace `import logging` and `logger = logging.getLogger(__name__)` with `from mkobi.core.logging_config import get_logger` and `logger = get_logger(__name__)`.

acceptance_criteria:
  - Data service uses get_logger from core.logging_config
  - Log output is in JSON format consistent with other modules
  - Tests pass

tests_to_run:
  - tests/test_data_service.py

risk_level: low
risk_notes: One-line fix. Trivial.

validated_finding: V-018
severity: LOW
