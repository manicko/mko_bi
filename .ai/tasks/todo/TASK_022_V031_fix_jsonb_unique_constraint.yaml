id: TASK_022_V031
title: Fix unique constraint on JSONB dims column in aggregated_data
status: pending
priority: low
depends_on: []

description: >
  UPSERT conflict target includes dims JSONB. JSONB equality for conflict detection may
  not work as expected for all JSON values (e.g., key ordering differences).

goals:
  - Test the UPSERT behavior with various JSON structures
  - If needed, use a hash of dims for conflict target instead of raw JSONB
  - Document the limitation

files:
  - path: src/mkobi/data/storage/manager.py
    targets:
      - type: method
        name: save_aggregates
    semantic_anchors:
      - type: on_conflict
        description: "ON CONFLICT clause using dims in conflict target"
    changes:
      - action: evaluate_and_fix
        description: "Test and potentially replace dims JSONB conflict target with md5(dims::text) or similar"
        code_hint: "Consider using a generated column with hash of dims for conflict detection"

acceptance_criteria:
  - UPSERT correctly detects duplicate records regardless of JSON key ordering
  - No duplicate aggregated data is inserted
  - Existing tests pass

tests_to_run:
  - uv run pytest tests/ -x -v

risk_level: medium
notes: >
  This may require a migration to add a generated column or change the conflict target.
  Test thoroughly with nested JSON before deploying.
