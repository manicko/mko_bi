source_section: DC-001 — .env files with weak credentials exist in working tree

description: >
  The working tree contains .env files with weak default credentials (e.g., default passwords,
  placeholder secrets). These must be removed or replaced with .env.example templates, and
  actual secrets must be injected via environment variables or secrets management.

goals:
  - Remove all .env files with actual credentials from git working tree
  - Create .env.example files with placeholder values
  - Update .gitignore to prevent .env files from being committed
  - Document secret management approach

files:
  - path: .env
    targets:
      - type: file
        name: .env
    changes:
      - action: replace_file
        description: Replace .env with .env.example containing placeholder values only

  - path: docker/.env
    targets:
      - type: file
        name: docker/.env
    changes:
      - action: replace_file
        description: Replace docker/.env with docker/.env.example containing placeholder values

  - path: .gitignore
    targets:
      - type: file
        name: .gitignore
    changes:
      - action: verify_code
        description: Ensure .env files are listed in .gitignore

acceptance_criteria:
  - No .env files with real credentials exist in the working tree
  - .env.example files contain only placeholder values
  - .gitignore includes .env entries
  - Application still runs with environment-injected secrets

tests_to_run:
  - git status --short (verify no .env files tracked)
  - ruff check src/mkobi/
  - mypy src/mkobi/

risk: medium

notes: >
  HIGH — Security fix. Coordinate with deployment team to ensure secrets management
  pipeline is in place before removing .env files.
