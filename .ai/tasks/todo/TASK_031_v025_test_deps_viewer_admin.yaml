id: TASK_031_v025_test_deps_viewer_admin

title: "V-025: Rewrite test_deps viewer/admin misleading test"

status: pending

priority: medium

depends_on:
  - TASK_030_verify_v024_mock_large_files

description: >
  test_viewer_cannot_access_admin_endpoint docstring says "cannot access admin
  endpoints" but the actual test accesses /auth/me (a viewer-level endpoint) and
  asserts 200 OK. No 403 assertion exists. Misleading test name gives false
  impression that admin endpoint access control is tested.

goals:
  - Rewrite to test actual admin endpoint (e.g., GET /admin/users) with viewer token, asserting 403
  - OR rename test to reflect what it actually tests
  - Ensure admin endpoint access control is properly tested

files:
  - path: tests/test_deps.py
    targets:
      - type: test_function
        name: test_viewer_cannot_access_admin_endpoint
    semantic_anchors:
      insert_after:
        type: function_definition
        value: "test_viewer_cannot_access_admin_endpoint"
      context: "Rewrite test to verify admin endpoint returns 403 for viewer"

changes:
  - action: modify_code
    description: >
      Rewrite the test to access an actual admin endpoint (e.g., GET /admin/users)
      with a viewer token and assert 403 Forbidden. Or if renaming, ensure
      the new name accurately describes the test behavior.
    anchor: "test_viewer_cannot_access_admin_endpoint function body"

acceptance_criteria:
  - Test name matches actual behavior
  - If testing access control, it returns 403 for unauthorized roles
  - Test passes

tests_to_run:
  - pytest tests/test_deps.py -x --tb=short -k 'admin or viewer'

risk_level: small (test rewrite)

source_findings:
  - V-025
  - T1-Finding7
  - T2-F7

estimated_effort: small
