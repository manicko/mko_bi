id: TASK_024_V016_config_reloadable

title: Add reload mechanism to get_config() for testing flexibility

status: pending

priority: medium

depends_on: []

description: >
  get_config() uses a global singleton (_settings). Once initialized, the config
  cannot be reloaded without restarting the process. This makes testing with
  different configs require monkeypatching. This task adds a reload mechanism.

finding_ref: V-016
severity: MEDIUM

goals:
  - Add a reload mechanism to get_config()
  - Allow tests to reload config without monkeypatching
  - Preserve singleton behavior for production

files:
  - path: src/mkobi/config.py
    targets:
      - type: function
        name: get_config
      - type: module_variable
        name: _settings
    semantic_anchors:
      add: reload parameter or clear_cache function

changes:
  - action: add_reload
    description: >
      Add a reload parameter to get_config() or a separate clear_cache function
      for testing.
    code_hint: |
      _settings: Optional[Settings] = None

      def get_config(reload: bool = False) -> Settings:
          global _settings
          if _settings is None or reload:
              _settings = Settings()
          return _settings

      def clear_config_cache() -> None:
          global _settings
          _settings = None

acceptance_criteria:
  - get_config() can be reloaded with reload=True
  - clear_config_cache() function available for tests
  - Production behavior unchanged (singleton by default)
      - Tests can use different configs without monkeypatching

tests_to_run:
  - pytest tests/ -k "config" -v

risk_level: low

rollout_notes: >
  Low risk. Testing improvement, not production-critical. No dependencies.
