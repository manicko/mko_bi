id: TASK_041_validate_db_password_not_placeholder

title: Validate database password is not a placeholder value (SEC-005)

status: pending

priority: medium

depends_on: []

description: >
  The DatabaseSettings model accepts any string as password, including placeholder
  values like "CHANGE_ME" or empty strings in production. Add a field validator
  that rejects known placeholder passwords in production environment.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: SEC-005

goals:
  - Add field validator to DatabaseSettings.password
  - Reject known placeholder passwords in production
  - Align with existing admin credential validation pattern

files:
  - path: src/mkobi/config.py
    targets:
      - type: class
        name: DatabaseSettings
      - type: field
        name: password
    semantic_anchors:
      - add_validator:
          value: "password"
          description: Add field validator for placeholder passwords

changes:
  - action: modify
    description: >
      Add a field validator to DatabaseSettings that rejects known placeholder
      passwords in production, similar to the existing admin credential validation.

    code_hint: |
      # ADD to WEAK_PASSWORDS set (line 18):
      WEAK_PASSWORDS = {
          "password", "123456", "admin", "secret", "test",
          "admin@example.com", "change_me_admin_password",
          "CHANGE_ME", "change_me", "placeholder", "postgres",
      }

      # ADD validator to DatabaseSettings class:
      @field_validator("password")
      @classmethod
      def validate_password_not_placeholder(cls, v: str | None) -> str | None:
          """Reject placeholder passwords in production."""
          if v is not None and v.lower() in {p.lower() for p in WEAK_PASSWORDS}:
              raise ValueError(
                  f"Database password '{v}' is a known placeholder. "
                  "Set a strong password via DATABASE__PASSWORD environment variable."
              )
          return v

acceptance_criteria:
  - Placeholder passwords rejected in production
  - Valid passwords accepted normally
  - Error message clearly indicates the issue
  - Tests pass

risk: low

tests_to_run:
  - "pytest tests/ -v -k 'config or database'"
