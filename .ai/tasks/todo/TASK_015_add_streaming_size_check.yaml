id: TASK_015_add_streaming_size_check

title: Add cumulative size check during file streaming when file.size is None (DP-001)

status: pending

priority: high

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\final-report.md
source_section: DP-001 — No cumulative size check during file streaming when file.size is None

description: >
  When uploading files, if the client does not provide file.size (Content-Length header),
  the streaming write has no cumulative size limit. This allows an attacker to upload
  unlimited data, causing disk exhaustion. Add a cumulative byte counter during streaming
  that enforces the max_file_size limit regardless of Content-Length.

goals:
  - Track cumulative bytes written during file streaming
  - Enforce max_file_size limit even when file.size is None
  - Abort upload and clean up temp file when limit is exceeded

files:
  - path: src/mkobi/api/routes/upload.py
    targets:
      - type: route_handler
        name: (upload endpoint handler)
    semantic_anchors:
      insert_after:
        type: loop
        value: chunk
    changes:
      - action: add_code
        description: Add cumulative size check inside the streaming loop
        code_hint: |
          cumulative_size += len(chunk)
          if cumulative_size > settings.max_file_size:
              await file.close()
              temp_path.unlink(missing_ok=True)
              raise HTTPException(
                  status_code=413,
                  detail=f"File exceeds maximum size of {settings.max_file_size} bytes"
              )

acceptance_criteria:
  - File streaming enforces max_file_size even without Content-Length
  - Oversized uploads return 413 and clean up temp files
  - Normal uploads within size limit work correctly
  - Upload tests pass

tests_to_run:
  - pytest tests/test_upload_api.py -v --tb=short
  - pytest tests/ -v -k "upload" --tb=short

risk: low

notes: >
  HIGH — Security fix. Low risk, additive change. Ensure temp file cleanup happens
  on limit exceed to prevent disk space leaks.
