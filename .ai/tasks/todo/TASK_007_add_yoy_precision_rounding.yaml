id: TASK_007_add_yoy_precision_rounding

title: MEDIUM — Add precision rounding to YoY calculations to avoid floating-point artifacts

status: pending

priority: medium

depends_on:
  - TASK_005_clear_filter_values_on_overwrite

source_file: .ai/audit/validated/final-report.md
source_finding: DP-003

description: >
  The YoY (Year-over-Year) calculations in src/mkobi/data/processing/aggregate_transforms.py
  use raw floating-point division, which can produce results like 33.333333333333336
  instead of 33.33. This affects chart display precision and can confuse users.
  Add rounding to a reasonable number of decimal places (e.g., 2 or 4) to YoY
  percentage/share results.

goals:
  - Round YoY and share calculation results to 4 decimal places
  - Apply rounding consistently across all aggregation transforms
  - Ensure rounding does not affect downstream integer-based calculations

files:
  - path: src/mkobi/data/processing/aggregate_transforms.py
    targets:
      - type: function
        name: _calculate_yoy
      - type: function
        name: _calculate_share
    semantic_anchors:
      insert_after:
        type: arithmetic_expression
        value: division operations producing YoY/share values
    changes:
      - action: modify_code
        description: >
          Wrap division results with round(value, 4) to prevent floating-point artifacts.
        code_hint: |
          yoy_value = round((current - previous) / previous * 100, 4)

acceptance_criteria:
  - YoY results are rounded to 4 decimal places maximum
  - No floating-point artifacts like 33.333333333333336 in output
  - Existing aggregate values that were already clean are not altered
  - Tests pass with updated expected values

tests_to_run:
  - pytest tests/ -k "yoy or aggregate or transform" -v --no-header
  - ruff check src/mkobi/data/processing/aggregate_transforms.py
  - mypy src/mkobi/data/processing/aggregate_transforms.py

risk: low
risk_notes: >
  Low risk — rounding improves UX without changing business logic. Must verify
  test expectations match new precision. Uses standard Python round().

type: implementation
category: data-processing
severity: medium
