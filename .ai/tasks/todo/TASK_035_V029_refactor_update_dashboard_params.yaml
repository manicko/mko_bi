id: TASK_035_V029_refactor_update_dashboard_params

title: Refactor update_dashboard() parameter normalization for clarity

status: pending

priority: low

depends_on: []

description: >
  update_dashboard() has complex nested if/else for handling config parameter
  with update_data being either dict or Pydantic model. This task refactors to
  normalize update_data to a dict at the start of the method.

finding_ref: V-029
severity: LOW

goals:
  - Normalize update_data to dict at method start
  - Simplify nested if/else logic
  - Improve code readability

files:
  - path: src/mkobi/services/dashboard_service.py
    targets:
      - type: class
        name: DashboardService
      - type: method
        name: update_dashboard
    semantic_anchors:
      insert_after: method signature
      replace: nested if/else with normalized dict handling

changes:
  - action: refactor_method
    description: >
      Normalize update_data to a dict at the start of the method, then use
      the normalized dict throughout.
    code_hint: |
      async def update_dashboard(self, dashboard_id, update_data, db):
          # Normalize to dict at start
          if hasattr(update_data, 'model_dump'):
              data = update_data.model_dump(exclude_unset=True)
          elif hasattr(update_data, 'dict'):
              data = update_data.dict(exclude_unset=True)
          else:
              data = dict(update_data)
          # ... use data dict throughout

acceptance_criteria:
  - update_data normalized to dict at method start
  - Nested if/else simplified
  - No functional changes
  - All existing tests pass

tests_to_run:
  - pytest tests/ -k "dashboard" -v

risk_level: low

rollout_notes: >
  Internal refactoring. No external dependencies. Code quality improvement.
