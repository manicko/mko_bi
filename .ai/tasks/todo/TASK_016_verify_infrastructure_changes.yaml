id: TASK_016_verify_infrastructure_changes

title: Verify infrastructure changes (CREATEDB removal, port binding, migrations, resources)

type: verification

status: pending

depends_on:
  - TASK_008_remove_createdb_privilege_mkobi_app
  - TASK_009_fix_port_8000_exposed_production
  - TASK_013_run_pending_migrations
  - TASK_015_add_docker_resource_limits

verifies:
  - TASK_008_remove_createdb_privilege_mkobi_app
  - TASK_009_fix_port_8000_exposed_production
  - TASK_013_run_pending_migrations
  - TASK_015_add_docker_resource_limits

verification_steps:
  - build: "cd docker && docker compose -f docker-compose.yml config"
  - test: "pytest tests/ -v -k 'database or docker'"
  - smoke_check: >
      Verify all services start correctly and health endpoints respond.
      Check mkobi_app role has no CREATEDB privilege.

pass_criteria:
  - Docker compose configuration validates
  - All tests pass
  - mkobi_app role verified without CREATEDB
  - Migration applied successfully
  - Resource limits visible in docker inspect output

failure_action: return TASK_008_remove_createdb_privilege_mkobi_app to rework

notes: >
  This verification covers all infrastructure changes. If any sub-task fails,
  return TASK_008 (CREATEDB removal) to rework as it was the cause of previous rollbacks.