id: TASK_012_add_weak_credential_tests

title: Add weak admin credential detection tests

status: pending

priority: low

depends_on:
  - TASK_004_fix_test_upload_too_large
  - TASK_008_delete_harmful_test
  - TASK_009_rewrite_empty_password_test
  - TASK_010_fix_misleading_test_names

type: implementation

description: >
  Add tests for validate_admin_credentials() which checks against known-weak
  usernames and passwords. Per SPEC.md, weak credentials should be rejected
  at production startup. No tests currently exist for this security feature.

goals:
  - Add tests verifying weak usernames are rejected
  - Add tests verifying weak passwords are rejected
  - Add tests verifying strong credentials pass validation

files:
  - path: tests/test_config.py
    targets:
      - type: class
        name: TestWeakCredentialDetection
    semantic_anchors:
      insert_after:
        - type: class
          value: last test class in file

changes:
  - action: add_code
    description: Add TestWeakCredentialDetection class with tests for validate_admin_credentials
    target: tests/test_config.py
    code_hint: |
      class TestWeakCredentialDetection:
          @pytest.mark.parametrize("weak_username", [
              "admin", "administrator", "root", "test", "user"
          ])
          def test_weak_username_rejected(self, weak_username):
              """Verify known-weak usernames are rejected."""
              with pytest.raises(ValueError):
                  Settings(admin_user=weak_username, admin_pass="StrongP@ss1")

          @pytest.mark.parametrize("weak_password", [
              "password", "123456", "admin", "secret", "test"
          ])
          def test_weak_password_rejected(self, weak_password):
              """Verify known-weak passwords are rejected."""
              with pytest.raises(ValueError):
                  Settings(admin_user="custom_admin", admin_pass=weak_password)

          def test_strong_credentials_accepted(self):
              """Verify strong credentials pass validation."""
              # Should not raise
              Settings(admin_user="custom_admin", admin_pass="StrongP@ss1")

acceptance_criteria:
  - TestWeakCredentialDetection class exists with at least 3 test methods
  - All weak usernames from the known-weak list are tested
  - All weak passwords from the known-weak list are tested
  - Strong credentials test passes
  - All new tests pass

risks:
  - None: pure addition of tests for existing functionality

tests_to_run:
  - command: uv run pytest tests/test_config.py::TestWeakCredentialDetection -v
    purpose: Verify new weak credential tests pass
  - command: uv run pytest tests/test_config.py -v
    purpose: Verify all config tests pass

estimated_effort: small

risk_level: minimal
