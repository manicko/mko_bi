id: TASK_014_consolidate_data_worker_transactions

title: Consolidate multiple transactions in data_worker to single atomic transaction

status: pending

priority: high

depends_on:
  - TASK_001_fix_enqueue_job_failure_silent_none
  - TASK_010_fix_data_pipeline_transaction_coordination

description: >
  The data_worker.py uses three separate database transactions creating partial failure scenarios.
  Consolidate to single transaction or ensure proper rollback on any failure.

source_reference:
  - C:\py_dev\mkobi\.ai\audit\validated\final-report.md
  - finding: DP-002

goals:
  - Consolidate three DB transactions into one atomic transaction
  - Add proper rollback handling on any processing failure
  - Ensure processing log status reflects actual state

files:
  - path: src/mkobi/workers/data_worker.py
    targets:
      - type: function
        name: process_csv_background
      - type: class
        name: STMT_UPDATE_STATUS
    semantic_anchors:
      - wrap_transactions:
          description: Wrap all DB operations in single transaction

changes:
  - action: modify
    description: >
      Refactor process_csv_background to use single transaction with proper rollback.

    code_hint: |
      # Wrap all database operations in a single async context manager
      # Current pattern has separate transactions at lines ~98-156
      # Should use:
      async with db.begin() as transaction:  # Single transaction
          try:
              # All DB operations here
              await update_status(...)
              await process_data(...)
              await save_aggregates(...)
          except Exception as e:
              await transaction.rollback()
              raise

acceptance_criteria:
  - Single atomic transaction for all processing operations
  - Proper rollback on any failure
  - Processing log status accurate after any failure
  - Tests pass

risk: high

tests_to_run:
  - "pytest tests/ -v -k 'data_worker or processing'"