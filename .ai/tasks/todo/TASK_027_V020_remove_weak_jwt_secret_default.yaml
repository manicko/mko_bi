id: TASK_027_V020
title: Remove weak default JWT secret from Docker Compose
status: pending
priority: medium
depends_on: []
wave: 3

description: >
  Default JWT__SECRET_KEY is "change-me-in-production" in docker-compose.yml.
  Remove defaults in production compose files. Require explicit env vars or
  Docker secrets.

goals:
  - No default JWT secret in production compose files
  - JWT secret must be explicitly configured
  - Development compose can have a default for convenience
  - Documentation updated to explain JWT secret configuration

files:
  - path: docker-compose.yml
    targets:
      - type: environment_variable
        value: JWT__SECRET_KEY
    semantic_anchors:
      insert_after:
        type: yaml_key
        value: JWT__SECRET_KEY
    changes:
      - action: modify_code
        description: Remove the default value for JWT__SECRET_KEY. Add a comment indicating this must be set via environment variable or Docker secret. For docker-compose.override.yml (dev), a development default is acceptable.

acceptance_criteria:
  - Production compose has no default JWT secret
  - Application fails to start with clear error if JWT secret not set
  - Development compose still works with a default
  - Documentation explains how to set JWT secret

tests_to_run:
  - tests/

risk_level: medium
risk_notes: CRITICAL: Ensure all production deployments have JWT secret configured before deploying this change.

validated_finding: V-020
severity: MEDIUM
