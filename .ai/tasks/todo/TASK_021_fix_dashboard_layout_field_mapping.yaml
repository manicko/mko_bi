  - Backend `DashboardCreate` model has `layout_id: UUID | None` field
  - Dashboard service layer persists `layout_id` to the database
  - No TypeScript errors in frontend
  - ruff and mypy pass on backend
  - Dashboard created via admin form has the correct layout_id stored (not NULL)

