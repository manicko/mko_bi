description: >
  When creating a dashboard via the admin form, the frontend sends `layout` as a string enum
  ('single-column' | 'two-columns' | 'grid') but the backend expects `layout_id: UUID`.
  Additionally, the frontend `adminApi.ts` silently drops the `layout` field entirely — it is
  never included in the API payload. Fix by: (1) adding a layout name-to-ID mapping in the
  frontend API layer, (2) including `layout_id` in the create payload, and (3) ensuring the
  backend `DashboardCreate` model properly handles the field.

objective: >
  Enable dashboard creation to correctly persist the selected layout by mapping the frontend
  layout string to a `layout_id` UUID in the API layer before sending to the backend.

affected_files:
  - path: frontend/src/features/admin/api/adminApi.ts
    action: modify
    description: "Add layout name-to-ID mapping and include layout_id in createDashboard payload"

  - path: frontend/src/features/admin/ui/DashboardManagement.tsx
    action: verify_no_change
    description: "Verify that formData.layout is correctly passed to createMutation.mutate (already works)"

  - path: src/mkobi/models/dashboard.py
    action: verify_or_modify
    description: "Ensure DashboardCreate model properly accepts layout_id and that the service layer persists it"

semantic_targets:
  - type: function
    name: createDashboard
    file: frontend/src/features/admin/api/adminApi.ts
    anchor: export async function createDashboard(data: CreateDashboardRequest)

  - type: type
    name: CreateDashboardRequest
    file: frontend/src/shared/types/api.types.ts
    anchor: export interface CreateDashboardRequest

  - type: class
    name: DashboardCreate
    file: src/mkobi/models/dashboard.py
    anchor: class DashboardCreate(BaseModel)

changes:
  - action: add_layout_mapping
    description: >
      In `adminApi.ts`, add a mapping from layout name strings to UUIDs. The layout UUIDs
      should be deterministic (e.g., generated from a known seed or hardcoded if layouts
      are pre-seeded in the database). Include `layout_id` in the payload when layout is provided.
    target:
      file: frontend/src/features/admin/api/adminApi.ts
    new_code: |
      // Layout name to UUID mapping — must match seeded layout records in DB
      const LAYOUT_NAME_TO_ID: Record<string, string> = {
        'single-column': '00000000-0000-0000-0000-000000000001',
        'two-columns':   '00000000-0000-0000-0000-000000000002',
        'grid':          '00000000-0000-0000-0000-000000000003',
      }

  - action: modify_create_dashboard_payload
    description: >
      In the `createDashboard` function, include `layout_id` in the payload when `data.layout` is provided.
    target:
      file: frontend/src/features/admin/api/adminApi.ts
    current_pattern: |
      const payload: Record<string, unknown> = { name: data.name }
      if (data.description) { payload.description = data.description }
      // NOTE: data.layout is NEVER added to the payload
    new_pattern: |
      const payload: Record<string, unknown> = { name: data.name }
      if (data.description) { payload.description = data.description }
      if (data.layout) { payload.layout_id = LAYOUT_NAME_TO_ID[data.layout] }

  - action: verify_backend_model
    description: >
      Verify that `DashboardCreate` in `dashboard.py` has `layout_id: UUID | None = None`.
      If the field exists and is properly typed, no backend model change is needed.
      If the field is missing, add it. Also verify that the dashboard service layer
      passes `layout_id` through to the repository when creating a dashboard record.
    target:
      file: src/mkobi/models/dashboard.py
    verification: |
      class DashboardCreate(BaseModel):
          name: str
          description: str | None = None
          config: DashboardConfig = DashboardConfig(graph_types=[GraphType.BAR])
          layout_id: UUID | None = None  # Must exist and be persisted

acceptance_criteria:
