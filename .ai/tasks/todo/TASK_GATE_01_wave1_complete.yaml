id: TASK_GATE_01_wave1_complete

title: GATE — Verify Docker Stack After PLAN_03 Wave 1 (Backend Hot Reload)

status: pending

priority: critical

depends_on:
  - TASK_001_03_01_fix_dev_reload
  - TASK_002_03_02_simplify_dev_env

phase: PLAN_03
wave: 1
type: gate

description: >
  Verification gate after completing PLAN_03 Wave 1 (Backend Hot Reload Fix).
  Both Wave 1 tasks modify docker-compose.override.yml. This gate ensures the
  full Docker stack starts cleanly, all containers reach healthy state, and the
  backend hot reload actually works before proceeding to Wave 2.

  This is a READ-ONLY verification task — no source code changes.

goals:
  - Confirm all Docker containers start and reach healthy state
  - Verify backend hot reload is functional
  - Verify database connectivity and migrations
  - Verify no container restart loops or crash loops
  - Establish baseline health before Wave 2 changes

files: []

acceptance_criteria:
  - All containers running and healthy
  - Backend hot reload works (file change triggers restart)
  - Database migrations ran successfully
  - No ERROR/CRITICAL logs in any container
  - No container restart loops

docker_health_checks:
  # === Container Status ===
  - name: All containers running
    command: "docker compose ps --format '{{.Name}} {{.Status}}'"
    expected: "db: running (healthy), migrate: exited (0), app: running"
  - name: No restarting containers
    command: "docker compose ps --format '{{.Name}} {{.Status}}' | grep -c 'restarting\\|unhealthy'"
    expected: "Count is 0"

  # === Database Layer ===
  - name: DB container healthy
    command: "docker compose exec db pg_isready -U postgres"
    expected: "Returns '/var/run/postgresql:5432 - accepting connections'"
  - name: Migrate service completed
    command: "docker compose ps migrate --format '{{.Status}}'"
    expected: "Contains 'Exit 0' (ran once, succeeded)"
  - name: Migrations applied to bidb
    command: "docker compose exec db psql -U postgres -d bidb -c \"SELECT version_num FROM alembic_version LIMIT 1;\""
    expected: "Returns an alembic revision hash"

  # === Application Layer ===
  - name: App health endpoint
    command: "curl -sf http://localhost:8000/health"
    expected: "HTTP 200 with JSON body"
  - name: App API functional
    command: "curl -sf http://localhost:8000/api/v1/health"
    expected: "HTTP 200 (or 404 if no such route, but no 500)"
  - name: App logs clean
    command: "docker compose logs app --tail 100"
    expected: "No ERROR or CRITICAL lines; contains 'Application startup complete' or 'Database initialization completed'"

  # === Hot Reload Verification ===
  - name: Hot reload triggers on file change
    command: "touch src/mkobi/main.py && sleep 5 && docker compose logs app --tail 30"
    expected: "Logs show reload activity (e.g., 'Reloading...', 'Stat reloaded', or 'Detected changes')"
  - name: App still healthy after reload
    command: "curl -sf http://localhost:8000/health"
    expected: "HTTP 200 — app survived the reload"

  # === Resource Stability ===
  - name: No memory/CPU issues
    command: "docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' app db"
    expected: "CPU < 50%, Memory usage reasonable (no OOM)"
  - name: Container uptime stable
    command: "docker compose ps --format '{{.Name}} {{.RunningFor}}'"
    expected: "app and db show continuous uptime (not restarting)"

tests_to_run:
  - "docker compose down -v && docker compose up -d"
  - "docker compose ps  # verify all running"
  - "curl -sf http://localhost:8000/health  # verify app"
  - "touch src/mkobi/main.py && sleep 5 && docker compose logs app --tail 30  # verify reload"
  - "docker compose logs --tail 50  # scan all logs for errors"

risk_level: low

rollout_notes: >
  READ-ONLY gate task. No code changes. If any check fails, fix the underlying
  Wave 1 task before proceeding to Wave 2. This gate must pass before starting
  TASK_003_03_03 (Wave 2).
