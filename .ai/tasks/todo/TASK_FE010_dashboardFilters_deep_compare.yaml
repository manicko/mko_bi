id: TASK_FE010_dashboardFilters_deep_compare

title: Fix FE-010 — Fix DashboardFilters state desync with deep comparison

status: pending

priority: medium

depends_on: []

description: |
  DashboardFilters uses object reference comparison in useEffect for syncing
  localFilters with parent values prop. This could miss external resets.
  Add deep comparison using JSON.stringify to detect actual value changes.

source_file: .ai/audit/99-validation/02-frontend-validated.md
source_section: FE-010: Fix DashboardFilters state desync

files:
  - path: frontend/src/features/dashboards/ui/DashboardFilters.tsx
    targets:
      - type: effect
        description: Sync effect on values prop
      - type: function
        name: DashboardFilters

changes:
  - action: replace_code
    description: |
      Replace the useEffect to use functional update with JSON.stringify
      comparison, preventing unnecessary re-renders when values are identical.

acceptance_criteria:
  - Deep comparison prevents unnecessary re-renders
  - External filter resets propagate correctly
  - Identical values don't trigger state updates
  - Build succeeds

risk_notes: |
  Low risk — filter values are plain primitives/arrays (no circular refs).
  Uses JSON.stringify as lightweight alternative to lodash isEqual.

tests_to_run:
  - command: cd frontend && npm run build
    reason: Verify build succeeds after fix
