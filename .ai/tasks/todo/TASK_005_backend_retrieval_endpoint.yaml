source_section: TASK_005_backend_retrieval_endpoint

description: >
  Add a new GET endpoint at /api/v1/admin/temp-passwords/{retrieval_token} that
  retrieves a one-time temporary password from Redis. The endpoint requires admin
  role, returns the password on success (HTTP 200), and returns 404 if the token
  is not found, expired, or already retrieved. The password is deleted from Redis
  upon retrieval (single-use).

goals:
  - Add new GET endpoint for temp password retrieval
  - Require admin role via dependencies
  - Return {"temp_password": "<value>"} on success (HTTP 200)
  - Return HTTP 404 if token not found/expired/already retrieved
  - Password is deleted from Redis upon retrieval (single-use via pipeline)

files:
  - path: src/mkobi/api/routes/admin.py
    targets:
      - type: function
        name: retrieve_temp_password_admin_endpoint
    semantic_anchors:
      insert_after:
        type: route_definition
        value: "reject_registration_request_admin_endpoint"
      insert_before:
        type: end_of_file
        value: ""

changes:
  - action: add_code
    description: >
      Add new GET endpoint after the existing registration request endpoints.
      The endpoint uses Depends(require_admin_role) for authorization and
      Depends(get_temp_password_store) for DI. It calls temp_password_store.retrieve()
      and returns the password or raises HTTP 404.

    code_hint: |
      @router.get(
          "/temp-passwords/{retrieval_token}",
          status_code=status.HTTP_200_OK,
          summary="Retrieve temporary password (admin)",
          description="Returns a one-time temporary password. Admin only. Password is deleted after retrieval.",
          dependencies=[Depends(require_admin_role)],
      )
      async def retrieve_temp_password_admin_endpoint(
          retrieval_token: str,
          temp_password_store: TempPasswordStore = Depends(get_temp_password_store),
      ) -> dict[str, str]:
          """Retrieve a temporary password by its retrieval token (one-time, admin only)."""
          logger.info("Admin: retrieving temp password: token=%s...", retrieval_token[:8])
          password = await temp_password_store.retrieve(retrieval_token)
          if password is None:
              raise HTTPException(
                  status_code=status.HTTP_404_NOT_FOUND,
                  detail="Temporary password not found or already retrieved",
              )
          return {"temp_password": password}

      # Ensure imports are present:
      # from mkobi.core.temp_password_store import TempPasswordStore
