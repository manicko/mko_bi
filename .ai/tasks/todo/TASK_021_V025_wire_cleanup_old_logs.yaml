id: TASK_021_V025_wire_cleanup_old_logs

title: Wire cleanup_old_logs() into startup lifecycle or remove dead code

status: pending

priority: medium

depends_on: []

description: >
  cleanup_old_logs() is defined in DatabaseStarter but never called from startup()
  or anywhere else. This is dead code and the log table grows unbounded. This task
  either wires it into the startup lifecycle or removes it entirely.

finding_ref: V-025
severity: MEDIUM

goals:
  - Wire cleanup_old_logs() into the startup lifecycle, OR
  - Remove the dead code entirely
  - Prevent unbounded log table growth

files:
  - path: src/mkobi/db/starter.py
    targets:
      - type: class
        name: DatabaseStarter
      - type: method
        name: cleanup_old_logs
      - type: method
        name: startup
    semantic_anchors:
      insert_into: startup() method to call cleanup_old_logs on a schedule

changes:
  - action: wire_or_remove
    description: >
      Either call cleanup_old_logs() from startup() on a scheduled basis,
      or remove the method entirely if not needed.
    code_hint: |
      # Option A: Wire into startup
      async def startup(self):
          # ... existing startup logic ...
          await self.cleanup_old_logs()
          # Schedule periodic cleanup
          asyncio.create_task(self._periodic_log_cleanup())

      # Option B: Remove entirely
      # Delete cleanup_old_logs method

acceptance_criteria:
  - cleanup_old_logs is either wired into startup or removed
  - No dead code remains
  - Log table growth is bounded (if wired) or explicitly accepted (if removed)

tests_to_run:
  - pytest tests/ -k "startup or log or cleanup" -v

risk_level: low

rollout_notes: >
  Safe. No dependencies. Prefer wiring it in to prevent unbounded log growth.
