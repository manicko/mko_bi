id: TASK_020_V009
title: Restrict CORS methods and headers in production
status: pending
priority: medium
depends_on: []
wave: 2

description: >
  CORS middleware allows all methods (allow_methods=["*"]) and all headers
  (allow_headers=["*"]). Restrict to specific methods and headers in production
  while keeping permissive defaults for development.

goals:
  - CORS methods restricted to GET, POST, PUT, DELETE, PATCH
  - CORS headers restricted to common headers (Content-Type, Authorization, etc.)
  - Environment-based configuration (permissive for dev, restricted for prod)
  - Frontend API calls continue to work

files:
  - path: src/mkobi/app.py
    targets:
      - type: function
        name: create_app
    semantic_anchors:
      insert_after:
        type: middleware_registration
        value: CORSMiddleware
    changes:
      - action: modify_code
        description: Replace allow_methods=["*"] with allow_methods=["GET", "POST", "PUT", "DELETE", "PATCH"]. Replace allow_headers=["*"] with allow_headers=["Content-Type", "Authorization", "Accept", "X-Requested-With"]. Make this configurable via environment variable for development override.

acceptance_criteria:
  - CORS methods restricted to specific list
  - CORS headers restricted to specific list
  - Frontend API calls work correctly
  - Development mode can override to permissive
  - Tests pass

tests_to_run:
  - tests/

risk_level: medium
risk_notes: Verify all frontend API calls use only allowed methods before deploying. Could break frontend if non-standard methods are used.

validated_finding: V-009
severity: MEDIUM
