id: TASK_034_V038_deprecate_storage_manager_classmethods

title: Deprecate compatibility classmethods in StorageManager that duplicate instance methods

status: pending

priority: low

depends_on: []

description: >
  Compatibility classmethods (save_aggregated_data, clear_graph_data_compat,
  clear_dashboard_data_compat) in StorageManager duplicate instance methods.
  Two ways to do the same thing. This task deprecates the classmethods and
  migrates callers to use instance methods.

finding_ref: V-038
severity: LOW

goals:
  - Add deprecation warnings to compatibility classmethods
  - Migrate all callers to use instance methods
  - Plan for removal of classmethods in future version

files:
  - path: src/mkobi/data/storage/manager.py
    targets:
      - type: class
        name: StorageManager
      - type: classmethod
        name: save_aggregated_data
      - type: classmethod
        name: clear_graph_data_compat
      - type: classmethod
        name: clear_dashboard_data_compat
    semantic_anchors:
      add: deprecation warning to each classmethod

changes:
  - action: deprecate_classmethods
    description: >
      Add warnings.warn() deprecation notices to compatibility classmethods.
      Update all callers to use instance methods instead.
    code_hint: |
      import warnings

      @classmethod
      def save_aggregated_data(cls, ...):
          warnings.warn(
              "save_aggregated_data classmethod is deprecated. "
              "Use instance method instead.",
              DeprecationWarning,
              stacklevel=2,
          )
          # ... existing logic

acceptance_criteria:
  - Deprecation warnings added to all 3 classmethods
  - All callers migrated to instance methods
  - No functional changes
  - Deprecation warnings visible in test output

tests_to_run:
  - pytest tests/ -k "storage or aggregate" -v -W all

risk_level: low

rollout_notes: >
  Safe. Gradual migration. No dependencies.
