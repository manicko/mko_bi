id: TASK_007_P05_add_app_level_error_boundary_and_exports

title: Add app-level ErrorBoundary to providers.tsx + export new components from barrel

status: pending

priority: high

depends_on:
  - TASK_003_P05_create_error_boundary_component
  - TASK_005_P05_add_error_boundary_to_routes

description: >
  (1) Wrap AppRoutes with ErrorBoundary in providers.tsx as the ultimate safety net.
  (2) Add ErrorPage and ErrorBoundary exports to shared/components/index.ts barrel file.

phase: PLAN_05 — Frontend Error Handling
wave: 4

finding_ref: BUG-25, BUG-29
severity: low

goals:
  - Wrap AppRoutes with ErrorBoundary in providers.tsx
  - Export ErrorPage and ErrorBoundary from shared/components/index.ts
  - All existing exports remain unchanged

files:
  - path: frontend/src/app/providers.tsx
    targets:
      - type: component
        name: App
    semantic_anchors:
      wrap:
        type: jsx_element
        value: "Wrap AppRoutes with ErrorBoundary"

  - path: frontend/src/shared/components/index.ts
    targets:
      - type: export
        name: barrel exports
    semantic_anchors:
      add:
        type: export_statement
        value: "Add ErrorPage and ErrorBoundary exports"

changes:
  - action: wrap_app_routes
    description: >
      Import ErrorBoundary and wrap AppRoutes in providers.tsx.
    code_hint: |
      import { ErrorBoundary } from '../shared/components/ErrorBoundary'
      // In App component:
      <ErrorBoundary>
        <AppRoutes />
      </ErrorBoundary>

  - action: add_barrel_exports
    description: >
      Add ErrorPage and ErrorBoundary to shared/components/index.ts.
    code_hint: |
      export { ErrorPage } from './ErrorPage'
      export { ErrorBoundary } from './ErrorBoundary'

acceptance_criteria:
  - ErrorBoundary wraps AppRoutes in providers.tsx
  - ErrorPage and ErrorBoundary are exported from shared/components/index.ts
  - All existing exports in index.ts remain unchanged
  - App renders without errors

tests_to_run:
  - cd frontend && npx tsc --noEmit

risk_level: low

rollout_notes: >
  Depends on TASK_003 (ErrorBoundary component) and TASK_005 (routes.tsx).
  This is the final integration task for the error handling phase.
  The app-level ErrorBoundary is the ultimate safety net — if the route-level
  boundary's fallback UI itself crashes, this top-level boundary catches it.
