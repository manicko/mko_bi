id: TASK_002_cleanup_noop_migrations
title: Remove no-op migrations from alembic history

status: pending
priority: medium

depends_on: []

description: >
  Two migration files are explicit no-ops and add confusion to migration history.
  e86f3c8f7324_schema_adjustments.py and 57f43a5c499d_change_json_to_jsonb_for_postgresql.py
  should be removed as they are not ancestors of any active migration head.

goals:
  - Remove no-op migration e86f3c8f7324_schema_adjustments.py
  - Remove no-op migration 57f43a5c499d_change_json_to_jsonb_for_postgresql.py
  - Verify alembic history output is clean

files:
  - path: alembic/versions/e86f3c8f7324_schema_adjustments.py
    targets:
      - type: file
    semantic_anchors:
      delete_file: true

  - path: alembic/versions/57f43a5c499d_change_json_to_jsonb_for_postgresql.py
    targets:
      - type: file
    semantic_anchors:
      delete_file: true

changes:
  - action: delete_file
    description: Remove e86f3c8f7324_schema_adjustments.py no-op migration

  - action: delete_file
    description: Remove 57f43a5c499d_change_json_to_jsonb_for_postgresql.py no-op migration

acceptance_criteria:
  - Migration files are deleted
  - alembic history command runs without errors
  - No migration chain breakage

tests_to_run:
  - alembic history --verbose

risk_level: low