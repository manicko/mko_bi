id: TASK_011_v006_loginform_auth_state

title: "V-006: Refactor LoginForm to use useAuth().login() for consistent auth state"

status: pending

priority: medium

depends_on:
  - TASK_010_verify_v004_data_filters_pass_through

description: >
  frontend/src/features/auth/ui/LoginForm.tsx calls setToken(response.access_token)
  and navigate('/dashboards') directly, bypassing the useAuth().login() method.
  The hook's internal user state is not updated after login. Components depending
  on useAuth().user have stale null until next re-render triggers getProfile().

goals:
  - Refactor LoginForm to call useAuth().login(credentials)
  - Hook handles token storage, profile fetch, and navigation
  - Remove direct setToken and navigate calls from LoginForm

files:
  - path: frontend/src/features/auth/ui/LoginForm.tsx
    targets:
      - type: component
        name: LoginForm
    semantic_anchors:
      insert_after:
        type: function_call
        value: "handleSubmit"
      context: "Replace direct setToken + navigate with useAuth().login()"

  - path: frontend/src/features/auth/model/useAuth.ts
    targets:
      - type: hook
        name: useAuth
    semantic_anchors:
      insert_after:
        type: method_definition
        value: "login"
      context: "Ensure login method handles token storage, profile fetch, and navigation"

changes:
  - action: modify_code
    description: >
      LoginForm: replace setToken(response.access_token); navigate('/dashboards')
      with const { login } = useAuth(); await login(credentials);
      Ensure useAuth.login() handles the full flow.
    anchor: "LoginForm handleSubmit callback and useAuth hook"

acceptance_criteria:
  - LoginForm calls useAuth().login() instead of direct token management
  - Header shows user data immediately after login
  - ProtectedRoute continues to work correctly
  - No TypeScript compilation errors

tests_to_run:
  - cd frontend && npm run build
  - npm run lint

risk_level: low (app currently works despite split state)

source_findings:
  - V-006
  - R1-F001

estimated_effort: small
