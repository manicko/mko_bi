        value: updateDashboard
    changes:
      - action: modify_return_type
        description: >
          Change return type from DashboardAdmin to DashboardDetail.
        code_hint: |
          export async function updateDashboard(
            dashboardId: string, data: UpdateDashboardRequest
          ): Promise<DashboardDetail> {
            const response = await axiosInstance.put<DashboardDetail>(`/dashboards/${dashboardId}`, data)
            return response.data
          }

