id: task_010
title: Replace module-level GraphRepository singleton with DI in graphs.py
status: pending
priority: low
depends_on: [task_003]
description: >
  Replace the module-level `_graph_repo = GraphRepository()` singleton in graphs.py with dependency injection using `Depends(get_graph_repository)` in the endpoint signatures that use it.
  This task depends on task_003 which removes a duplicate _graph_repo.update() call.
goals:
  - Eliminate module-level repository singleton that bypasses DI
  - Improve testability by allowing repository mocking
  - Align with the project's DI pattern used elsewhere
  - Maintain same functionality while using proper dependency injection
files:
  - path: src/mkobi/api/routes/graphs.py
    targets:
      - type: variable
      name: _graph_repo
    semantic_anchors:
      - type: variable
      name: _graph_repo
    changes:
      - action: delete
        old_text: "# Initialize repository\n_graph_repo = GraphRepository()"
      - action: add_code
        insert_before: "@router.post(\n    \"/\",\n    response_model=GraphRead,\n    status_code=status.HTTP_201_CREATED,\n    summary=\"Create a new graph\",\n    description=\"Creates a new graph. Requires admin role.\",\n    dependencies=[Depends(require_admin_role)],\n)"
        new_text: "from mkobi.api.deps import get_graph_repository\n"
      - action: replace
        old_text: "result = await _graph_repo.create(\n            db=db,\n            name=graph.name,\n            type=graph.type,\n            dashboard_id=graph.dashboard_id,\n            config=graph.config,\n            dimensions=graph.dimensions,\n            metrics=graph.metrics,\n        )"
        new_text: "graph_repo = get_graph_repository()\n        result = await graph_repo.create(\n            db=db,\n            name=graph.name,\n            type=graph.type,\n            dashboard_id=graph.dashboard_id,\n            config=graph.config,\n            dimensions=graph.dimensions,\n            metrics=graph.metrics,\n        )"
      - action: replace
        old_text: "graphs = await _graph_repo.get_all(db=db)"
        new_text: "graph_repo = get_graph_repository()\n        graphs = await graph_repo.get_all(db=db)"
      - action: replace
        old_text: "graph = await _graph_repo.get(id=graph_id, db=db)"
        new_text: "graph_repo = get_graph_repository()\n        graph = await graph_repo.get(id=graph_id, db=db)"
      - action: replace
        old_text: "result = await _graph_repo.update(\n            graph_id, db, **update_data\n        )"
        new_text: "graph_repo = get_graph_repository()\n        result = await graph_repo.update(\n            graph_id, db, **update_data\n        )"
      - action: replace
        old_text: "result = await _graph_repo.delete(graph_id, db)"
        new_text: "graph_repo = get_graph_repository()\n        result = await graph_repo.delete(graph_id, db)"
acceptance_criteria:
  - The module-level `_graph_repo = GraphRepository()` line is removed
  - The `get_graph_repository` function is imported from `mkobi.api.deps`
  - Endpoints that used `_graph_repo` now get the repository via `get_graph_repository()`
  - The functionality remains identical (same database operations)
  - Tests pass
tests_to_run:
  - tests/test_graphs.py
risk_level: low