id: TASK_014_add_security_headers

title: Add HSTS and CSP security headers to API responses (SEC-005)

status: pending

priority: high

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\audit\validated\final-report.md
source_section: SEC-005 — Missing HSTS and CSP security headers

description: >
  The application lacks HTTP Strict Transport Security (HSTS) and Content Security Policy
  (CSP) headers. These headers protect against protocol downgrade attacks, XSS, and other
  injection attacks. Add them to the SecurityHeadersMiddleware in app.py and/or nginx.conf.

goals:
  - Add Strict-Transport-Security header to all responses
  - Add Content-Security-Policy header to all responses
  - Configure headers in both FastAPI middleware and nginx

files:
  - path: src/mkobi/api/app.py
    targets:
      - type: class
        name: SecurityHeadersMiddleware
    semantic_anchors:
      insert_after:
        type: function_call
        value: call_next
    changes:
      - action: add_code
        description: Add HSTS and CSP headers to the middleware response
        code_hint: |
          response.headers["Strict-Transport-Security"] = "max-age=31536000; includeSubDomains"
          response.headers["Content-Security-Policy"] = "default-src 'self'"

  - path: docker/nginx.conf
    targets:
      - type: server_block
    changes:
      - action: add_code
        description: Add HSTS and CSP headers in nginx configuration
        code_hint: |
          add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
          add_header Content-Security-Policy "default-src 'self'" always;

acceptance_criteria:
  - All API responses include Strict-Transport-Security header
  - All API responses include Content-Security-Policy header
  - nginx configuration includes both headers
  - Security header tests pass

tests_to_run:
  - pytest tests/ -v -k "security" --tb=short
  - curl -I http://localhost:8000/health (verify headers present)

risk: low

notes: >
  HIGH — Security fix. Low risk, purely additive. CSP policy may need adjustment
  based on frontend requirements (e.g., allowing CDN sources).
