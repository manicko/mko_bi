id: TASK_FE004_lazy_load_uploadModal

title: Fix FE-004 — Convert UploadModal import to lazy() in DashboardView

status: pending

priority: medium

depends_on: []

description: |
  Replace static import of UploadModal in DashboardView.tsx with React.lazy()
  for code-splitting. The modal is conditionally rendered but eagerly loaded,
  increasing bundle size for users who never open the upload dialog.

source_file: .ai/audit/99-validation/02-frontend-validated.md
source_section: FE-004: Convert UploadModal import to lazy

files:
  - path: frontend/src/features/dashboards/ui/DashboardView.tsx
    targets:
      - type: import
        value: UploadModal
      - type: component
        name: UploadModal

changes:
  - action: replace_code
    description: |
      Replace static import with lazy(() => import(...)). Wrap UploadModal
      in <Suspense fallback={null}>. Add Suspense import if needed.

acceptance_criteria:
  - UploadModal imported via React.lazy()
  - UploadModal wrapped in Suspense boundary
  - Upload modal functionality preserved
  - Build succeeds

risk_notes: |
  Low risk — standard React lazy pattern. fallback={null} is appropriate
  because modal is hidden until explicitly opened.

tests_to_run:
  - command: cd frontend && npm run build
    reason: Verify build succeeds after lazy conversion
