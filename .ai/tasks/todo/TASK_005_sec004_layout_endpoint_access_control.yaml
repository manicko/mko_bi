---
id: TASK_005_sec004_layout_endpoint_access_control

title: "SEC-004: Add dashboard access verification to layout endpoints"

status: pending

priority: high

depends_on:
  - TASK_001_be001_rate_limiter_fix
  - TASK_002_fe006_grant_access_dashboard_id

type: implementation

description: >
  The global layout endpoints in `layouts.py` (GET /, GET /{layout_id}) lack dashboard-level
  access control. The layout model's relationship to dashboards is indirect (through dashboard
  creation), so the access check needs to follow the layout→dashboard association path.

  Fix: Fetch the layout by ID, resolve its associated dashboard(s), then call
  `check_dashboard_access()`. If the layout has no associated dashboard (orphaned), return 404
  to prevent enumeration.

source_reference: "C:\\py_dev\\mkobi\\.ai\\audit\\99-validation\\04-security-validated.md"
source_section: "SEC-004: Missing IDOR Protection on Layout Endpoints — HIGH (mandatory)"

affected_files:
  - path: "src/mkobi/api/routes/layouts.py"
    targets:
      - type: function
        name: get_layouts_endpoint
      - type: function
        name: get_layout_endpoint
    semantic_anchors:
      insert_after:
        type: parameter_list
        value: "layout_id: UUID"
      insert_before:
        type: return_statement
        value: "return layout_service"
    changes:
      - action: add_code
        description: "Add dashboard access check to get_layout_endpoint"
        code_hint: |
          layout_obj = await layout_service.get_by_id(layout_id)
          if not layout_obj:
              raise HTTPException(status_code=404, detail="Layout not found")
          # Resolve layout's dashboard association
          dashboard_id = await layout_service.get_dashboard_id_for_layout(layout_id, session)
          if dashboard_id:
              await check_dashboard_access(dashboard_id, current_user, session, required_level="read")

acceptance_criteria:
  - "User without dashboard access cannot GET /layouts/{layout_id} for layouts tied to that dashboard"
  - "User with dashboard read access can GET layouts from that dashboard"
  - "Admin users can still access all layouts"
  - "ruff + mypy pass"

