phase: combined
phase_name: Documentation Restructuring + Authorization
description: >
  Combined execution order for PLAN_01 (Documentation Restructuring, 22 tasks)
  and PLAN_02 (Authorization Phase, 11 tasks). PLAN_01 and PLAN_02 are independent
  phases that can execute in parallel. Within each phase, waves execute sequentially
  with parallel execution where safe.
total_tasks: 33
autonomous: true

plans:
  - id: PLAN_01
    name: Documentation Restructuring
    tasks: 22
    waves: 6
  - id: PLAN_02
    name: Authorization Phase
    tasks: 11
    waves: 3

