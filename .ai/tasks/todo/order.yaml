# ============================================================
shared_file_conflicts:
  - file: frontend/src/features/admin/ui/AdminPanel.tsx
    tasks:
      - TASK_010_FE_admin_state_preservation
    resolution: >
      Only one task modifies this file — no conflict.

  - file: frontend/src/features/admin/ui/UserManagement.tsx
    tasks:
      - TASK_007_FE_user_management_inline_edit
    resolution: >
      Only one task modifies this file — no conflict.

  - file: frontend/src/features/admin/ui/DashboardManagement.tsx
    tasks:
      - TASK_008_FE_dashboard_mgmt_confirm
    resolution: >
      Only one task modifies this file — no conflict.

  - file: frontend/src/features/admin/ui/RegistrationRequests.tsx
    tasks:
      - TASK_009_FE_registration_requests
    resolution: >
      Only one task modifies this file — no conflict.

  - file: frontend/src/app/routes.tsx
    tasks:
      - TASK_011_FE_upload_modal
    resolution: >
      Only one task modifies this file — no conflict.

  - file: frontend/src/features/dashboards/ui/DashboardView.tsx
    tasks:
      - TASK_011_FE_upload_modal
    resolution: >
      Only one task modifies this file — no conflict.

# ============================================================
# Dependency Graph Summary
# ============================================================
dependency_graph: >
  Wave 1 (parallel, 5 tasks):
    TASK_001_FE_zod_v4_migration (independent)
    TASK_002_FE_toast_config (independent) ──→ TASK_011_FE_upload_modal (Wave 3)
    TASK_003_FE_short_uuid (independent) ──→ TASK_006_FE_dashboard_list_table (Wave 2)
                                              ──→ TASK_007_FE_user_management_inline_edit (Wave 2)
                                              ──→ TASK_008_FE_dashboard_mgmt_confirm (Wave 2)
    TASK_004_FE_access_denied (independent)
    TASK_005_FE_confirm_dialog (independent) ──→ TASK_007_FE_user_management_inline_edit (Wave 2)
                                                ──→ TASK_008_FE_dashboard_mgmt_confirm (Wave 2)
                                                ──→ TASK_009_FE_registration_requests (Wave 2)

  Wave 2 (parallel, 4 tasks):
    TASK_006_FE_dashboard_list_table (depends on TASK_003_FE_short_uuid)
    TASK_007_FE_user_management_inline_edit (depends on TASK_005_FE_confirm_dialog, TASK_003_FE_short_uuid)
    TASK_008_FE_dashboard_mgmt_confirm (depends on TASK_005_FE_confirm_dialog, TASK_003_FE_short_uuid)
    TASK_009_FE_registration_requests (depends on TASK_005_FE_confirm_dialog)

  Wave 3 (parallel, 3 tasks):
    TASK_010_FE_admin_state_preservation (independent)
    TASK_011_FE_upload_modal (depends on TASK_002_FE_toast_config)
    TASK_012_FE_top_navigation (independent)

  No circular dependencies detected.
  Maximum parallel execution: 5 tasks in Wave 1.

# ============================================================
# Validation Notes
# ============================================================
validation_notes: >
  All 12 tasks are atomic, independently executable (within wave constraints),
  and use semantic anchors (not line numbers).
  All tasks reference existing symbols confirmed stable in the codebase.
  Wave 1 creates foundational components (shortUuid, ConfirmDialog) that Wave 2 depends on.
  Wave 3's upload_modal depends on Wave 1's toast_config.
  No shared file conflicts between waves — each task modifies a distinct set of files.
  TASK_011_FE_upload_modal is the highest-risk task (5 files modified, 1 deleted).
