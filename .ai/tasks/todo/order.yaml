phase: frontend_improvement
phase_name: PLAN_01 Frontend Improvements — 12 Tasks
description: >
  Frontend improvement tasks derived from 12 PLAN_01 plan files in .ai/plans/.
  Covers: Zod v4 migration, toast configuration, short UUID utility, AccessDenied component,
  ConfirmDialog component, DashboardList table conversion, UserManagement inline editing,
  DashboardManagement confirm dialog, RegistrationRequests upgrade, admin state preservation,
  upload modal conversion, and top navigation replacement.
total_tasks: 12
autonomous: true

# ============================================================
# Wave 1: Independent — Foundation Components + Config (parallel)
# ============================================================
wave_1:
  name: Foundation Components + Configuration
  description: >
    Create foundational utilities and components that other tasks depend on.
    All 5 tasks modify different files and can execute in parallel.
  parallel: true
  tasks:
    - id: TASK_001_FE_zod_v4_migration
      name: zod_v4_migration
      depends_on: []
      priority: high
      files:
        - frontend/src/shared/types/formSchemas.ts
      risk: low
      plan_source: PLAN_01_zod_v4_migration.md

    - id: TASK_002_FE_toast_config
      name: toast_config
      depends_on: []
      priority: high
      files:
        - frontend/src/app/providers.tsx
      risk: low
      plan_source: PLAN_01_toast_config.md

    - id: TASK_003_FE_short_uuid
      name: short_uuid
      depends_on: []
      priority: high
      files:
        - frontend/src/shared/utils/shortUuid.ts
      risk: low
      plan_source: PLAN_01_short_uuid.md

    - id: TASK_004_FE_access_denied
      name: access_denied
      depends_on: []
      priority: medium
      files:
        - frontend/src/shared/components/AccessDenied.tsx
      risk: low
      plan_source: PLAN_01_access_denied.md

    - id: TASK_005_FE_confirm_dialog
      name: confirm_dialog
      depends_on: []
      priority: high
      files:
        - frontend/src/shared/components/ConfirmDialog.tsx
      risk: low
      plan_source: PLAN_01_confirm_dialog.md

# ============================================================
# Wave 2: Dependent — Admin Panel Upgrades (parallel)
# ============================================================
wave_2:
  name: Admin Panel + Dashboard List Upgrades
  description: >
    Upgrade admin panel components and dashboard list using ConfirmDialog and shortUuid
    created in Wave 1. All 4 tasks modify different files and can execute in parallel.
  parallel: true
  tasks:
    - id: TASK_006_FE_dashboard_list_table
      name: dashboard_list_table
      depends_on:
        - TASK_003_FE_short_uuid
      priority: high
      files:
        - frontend/src/features/dashboards/ui/DashboardList.tsx
      risk: medium
      plan_source: PLAN_01_dashboard_list_table.md

    - id: TASK_007_FE_user_management_inline_edit
      name: user_management_inline_edit
      depends_on:
        - TASK_005_FE_confirm_dialog
        - TASK_003_FE_short_uuid
      priority: high
      files:
        - frontend/src/features/admin/ui/UserManagement.tsx
      risk: medium
      plan_source: PLAN_01_user_management_inline_edit.md

    - id: TASK_008_FE_dashboard_mgmt_confirm
      name: dashboard_mgmt_confirm
      depends_on:
        - TASK_005_FE_confirm_dialog
        - TASK_003_FE_short_uuid
      priority: high
      files:
        - frontend/src/features/admin/ui/DashboardManagement.tsx
      risk: medium
      plan_source: PLAN_01_dashboard_mgmt_confirm.md

    - id: TASK_009_FE_registration_requests
      name: registration_requests
      depends_on:
        - TASK_005_FE_confirm_dialog
      priority: high
      files:
        - frontend/src/features/admin/ui/RegistrationRequests.tsx
      risk: medium
      plan_source: PLAN_01_registration_requests.md

# ============================================================
# Wave 3: Dependent — Layout + Navigation + Upload Modal (parallel)
# ============================================================
wave_3:
  name: Layout, Navigation, and Upload Modal
  description: >
    Final wave: admin state preservation, upload modal conversion, and top navigation.
    UploadModal depends on toast_config (Wave 1). Admin state preservation and top navigation
    are independent. All 3 tasks modify different files and can execute in parallel.
  parallel: true
  tasks:
    - id: TASK_010_FE_admin_state_preservation
      name: admin_state_preservation
      depends_on: []
      priority: medium
      files:
        - frontend/src/features/admin/ui/AdminPanel.tsx
      risk: low
      plan_source: PLAN_01_admin_state_preservation.md

    - id: TASK_011_FE_upload_modal
      name: upload_modal
      depends_on:
        - TASK_002_FE_toast_config
      priority: high
      files:
        - frontend/src/features/upload/ui/UploadModal.tsx
        - frontend/src/features/dashboards/ui/DashboardView.tsx
        - frontend/src/app/routes.tsx
        - frontend/src/features/upload/index.ts
        - frontend/src/features/upload/ui/UploadPage.tsx
      risk: high
      plan_source: PLAN_01_upload_modal.md

    - id: TASK_012_FE_top_navigation
      name: top_navigation
      depends_on: []
      priority: high
      files:
        - frontend/src/shared/components/Layout/Header.tsx
        - frontend/src/shared/components/Layout/AppLayout.tsx
      risk: medium
      plan_source: PLAN_01_top_navigation.md

# ============================================================
