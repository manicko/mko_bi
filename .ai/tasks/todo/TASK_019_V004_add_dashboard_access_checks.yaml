id: TASK_019_V004
title: Add dashboard access checks on read endpoints
status: pending
priority: high
depends_on: []
wave: 2

description: >
  Multiple endpoints allow any authenticated user to access data for any dashboard
  without checking dashboard-level access. Add check_dashboard_access calls to:
  - GET /dashboards/{id}/filters
  - GET /dashboards/{id}/graphs
  - GET /dashboards/{id}/access (add admin role check)

goals:
  - All read endpoints check dashboard-level access
  - Any authenticated user cannot list filters/graphs/access for dashboards they don't have access to
  - Admin bypass still works (admins can access any dashboard)
  - Consistent access control pattern across all endpoints

files:
  - path: src/mkobi/api/routes/dashboards.py
    targets:
      - type: function
        name: get_dashboard_filters_endpoint
      - type: function
        name: get_dashboard_graphs_endpoint
      - type: function
        name: get_dashboard_access_endpoint
    semantic_anchors:
      insert_after:
        type: parameter_extraction
        value: dashboard_id
    changes:
      - action: add_code
        description: Add check_dashboard_access call after extracting dashboard_id. For filters and graphs endpoints, use require_viewer_role or check_dashboard_access. For access endpoint, add require_admin_role check. Return 403 if access denied, 404 if dashboard not found.

acceptance_criteria:
  - GET /dashboards/{id}/filters requires dashboard access
  - GET /dashboards/{id}/graphs requires dashboard access
  - GET /dashboards/{id}/access requires admin role
  - Admins can still access all dashboards
  - Non-admins without access get 403
  - Tests pass

tests_to_run:
  - tests/

risk_level: medium
risk_notes: Three endpoints need the same fix pattern. Execute sequentially to avoid conflicts on shared file.

validated_finding: V-004
severity: HIGH
