id: TASK_002_P04_fix_enter_key_form_submission

title: Fix Enter key form submission in RegisterForm

status: pending

priority: high

depends_on:
  - TASK_001_P04_add_loading_state_to_register_form

description: >
  Ensure the RegisterForm submits on Enter key press. The existing code already uses
  Box component="form" with handleSubmit(onSubmit) and Button type="submit", which
  should work. The most likely root cause is browser-native validation interference.
  Add noValidate to the form element as a safe fallback.

phase: PLAN_04 — Registration Request Fixes
wave: 1

finding_ref: BUG-18
severity: low

goals:
  - Ensure Enter key triggers form submission
  - Add noValidate to prevent browser validation interference
  - Verify form structure is correct

files:
  - path: frontend/src/features/auth/ui/RegisterForm.tsx
    targets:
      - type: component
        name: RegisterForm
    semantic_anchors:
      update:
        type: jsx_element
        value: "Form element — add noValidate attribute"

changes:
  - action: add_noValidate
    description: >
      Add noValidate to the form element to prevent browser validation interference.
    code_hint: |
      <Box component="form" onSubmit={handleSubmit(onSubmit)} noValidate sx={{ maxWidth: 400, mx: 'auto', mt: 4, p: 3 }}>

acceptance_criteria:
  - Pressing Enter in the email field triggers form submission
  - Form validation runs before submission (Zod schema validates email)
  - No JavaScript errors in console on Enter key press
  - Works in all modern browsers (Chrome, Firefox, Safari)

tests_to_run:
  - cd frontend && npx tsc --noEmit

risk_level: low

rollout_notes: >
  Depends on TASK_001 (same file, must be sequential).
  Minimal change — single attribute addition.
