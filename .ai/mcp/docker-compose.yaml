services:
  postgres-bidb-mcp:
    image: crystaldba/postgres-mcp
    container_name: postgres-bidb-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URI: postgresql://postgres:${DATABASE__PASSWORD}@host.docker.internal:5432/bidb
    command:
      - --access-mode=unrestricted
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres-bidb-test-mcp:
    image: crystaldba/postgres-mcp
    container_name: postgres-bidb-test-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URI: postgresql://postgres:${DATABASE__PASSWORD}@test-db:5432/bidb_test
    command:
      - --access-mode=unrestricted
    networks:
      - docker_test_network

networks:
  docker_test_network:
    external: true