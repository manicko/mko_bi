# =============================================================================
# Docker Compose for mkobi BI Dashboard System
# Production configuration with multi-stage Dockerfile support
# Usage:
#   Production:  docker compose up -d
#   Development: docker compose -f docker-compose.yml -f docker-compose.override.yml up -d
#   Test:        docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
# =============================================================================

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bidb
      POSTGRES_USER: postgres
      # Production requires explicit database password (no default)
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:?DATABASE__PASSWORD must be set for production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${DOCKER_TARGET:-prod}
      args:
        - UV_VERSION=latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: ${ENV:-production}
      DATABASE__HOST: db
      DATABASE__PORT: 5432
      DATABASE__USER: postgres
      # Production requires explicit database password (no default)
      DATABASE__PASSWORD: ${DATABASE__PASSWORD:?DATABASE__PASSWORD must be set for production}
      DATABASE__DBNAME: bidb
      DATABASE__TEST_DBNAME: bidb_test
      # SECURITY: JWT__SECRET_KEY MUST be set explicitly in production.
      # Do NOT use a default or weak value here. Docker will fail to start
      # this service if the variable is not defined in the environment.
      JWT__SECRET_KEY: ${JWT__SECRET_KEY:?JWT__SECRET_KEY must be set for production}
      JWT__ALGORITHM: HS256
      UPLOAD__TEMP_DIR: /app/data/tmp_uploads
      LOGGING__LOG_FILE: /app/data/logs/app.log
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173"]'
      LOGGING__LEVEL: ${LOG_LEVEL:-INFO}
      AUTO_MIGRATE: "false"
      RECREATE_TEST_DB: "false"
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
      # Mount alembic for runtime migrations (read-only)
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis for task queue (if using RQ workers)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
  app_data:
  redis_data:
