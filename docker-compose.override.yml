# =============================================================================
# Docker Compose Override for Development
# Usage: docker compose -f docker-compose.yml -f docker-compose.override.yml up -d
# =============================================================================

services:
  # Migration service - runs alembic migrations before app starts (same as production)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: ["alembic", "upgrade", "head"]
    environment:
      ENV: development
      DATABASE__HOST: db
      DATABASE__PORT: 5432
      DATABASE__USER: postgres
      DATABASE__PASSWORD: ${DATABASE__PASSWORD:-1234}
      DATABASE__DBNAME: bidb
      DATABASE__TEST_DBNAME: bidb_test
      JWT__SECRET_KEY: ${JWT__SECRET_KEY:-dev-secret-key-for-local-development}
      JWT__ALGORITHM: HS256
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      target: dev
    user: root
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ENV: development
      # Application role for runtime operations (limited privileges)
      DATABASE__USER: mkobi_app
      DATABASE__PASSWORD: ${MKOBI_APP_PASSWORD:-dev_password}
      # Admin credentials (valid email format required)
      ADMIN_USERNAME: admin@example.com
      ADMIN_PASSWORD: admin@example.com
      # Development can use a default JWT secret for local testing
      JWT__SECRET_KEY: ${JWT__SECRET_KEY:-dev-secret-key-for-local-development}
      LOGGING__LEVEL: DEBUG
      AUTO_MIGRATE: "false"
      RECREATE_TEST_DB: "false"
    volumes:
      # Mount source code for hot reload (writable for egg-info generation)
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      # Mount frontend build for SPA serving (run 'cd frontend && npm run build' locally)
      - ./frontend/dist:/app/frontend/dist
    command: ["uvicorn", "src.mkobi.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # Remove healthcheck in dev for faster startup
    healthcheck:
      disable: true

  db:
    environment:
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:-1234}
      MKOBI_APP_PASSWORD: ${MKOBI_APP_PASSWORD:-dev_password}
    # Expose port for local development tools
    ports:
      - "5432:5432"