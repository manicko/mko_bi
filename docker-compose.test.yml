# =============================================================================
# Docker Compose Configuration for Testing
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
#        docker compose -f docker-compose.yml -f docker-compose.test.yml exec app uv run pytest tests/ -v
# =============================================================================

services:
  app:
    build:
      target: test
    environment:
      ENV: test
      # Application role for runtime operations (limited privileges)
      DATABASE__USER: mkobi_app
      DATABASE__PASSWORD: ${MKOBI_APP_PASSWORD}
      DATABASE__ADMIN_USER: postgres
      DATABASE__ADMIN_PASSWORD: ${DATABASE__PASSWORD}
      DATABASE__DBNAME: bidb_test
      DATABASE__TEST_DBNAME: bidb_test
      LOGGING__LEVEL: WARNING
      AUTO_MIGRATE: "true"
      RECREATE_TEST_DB: "true"
    # Override command to run tests
    command: ["tail", "-f", "/dev/null"]
    # Remove healthcheck for test environment
    healthcheck:
      disable: true

  db:
    environment:
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD}
      MKOBI_APP_PASSWORD: ${MKOBI_APP_PASSWORD}
