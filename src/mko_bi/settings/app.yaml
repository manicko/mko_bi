database:
  host: localhost
  port: 5432
  dbname: bidb
  user: postgres
  # password should be set via environment variable DB_PASSWORD
  # this is just an example for local development
  password: "1234"  # CHANGE THIS IN PRODUCTION!


jwt:
  secret_key: "your-secret-key-change-in-production-use-env-variable"
  algorithm: HS256
  access_token_expire_minutes: 30

upload:
  temp_dir: "data/tmp_uploads"
  allowed_file_types:
    - ".csv.gz"
    - ".csv"
  max_file_size: 104857600  # 100MB in bytes
  lazy_threshold_mb: 10.0  # Use lazy evaluation for files larger than this

redis:
  host: localhost
  port: 6379
  db: 0
  # password: "your-redis-password"  # Uncomment and set if Redis requires auth

logging:
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  level: INFO

charts:
  default_colors:
    - "#1f77b4"
    - "#ff7f0e"
    - "#2ca02c"
    - "#d62728"
    - "#9467bd"
    - "#8c564b"
    - "#e377c2"
    - "#7f7f7f"
  yoy:
    current_year_style:
      line:
        dash: "solid"
        width: 3
    previous_year_style:
      line:
        dash: "dash"
        width: 2
  layout:
    template: "plotly_white"
    margin:
      l: 50
      r: 50
      t: 50
      b: 50

cors_origins:
  - "https://example.com"
  - "https://app.example.com"